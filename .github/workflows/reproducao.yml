name: Reproduzir o experimento
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproducao:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Instalar dependencias cientificas locais
        run: pip install -r codigo/requirements.txt
      - name: Reconstruir publicacao.csv e previsao.txt sem chamadas a LLM
        run: python -X utf8 codigo/reproduzir.py
      - name: Executar suite de testes e auditoria contratual
        run: python -X utf8 codigo/testes/test_sistema.py
