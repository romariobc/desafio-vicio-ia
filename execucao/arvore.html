m documento que deva produzir efeito perante a Previdência\\nSocial."}, "classificacao": {"id": "Q0037", "decisao": "revisar", "tema_central_id": "5062", "extras_ids": "5132;5081;5118", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0038", "texto": "No que diz respeito ao ofendido e às suas prerrogativas no processo penal brasileiro, é correto afirmar que poderá:", "comando": "Complete a afirmação sobre as prerrogativas do ofendido no processo penal brasileiro.", "alternativas": {"A": "interpor recurso de apelação, ainda que não habilitado como\\nassistente, quando o Ministério Público tiver recorrido de\\ntodo o conteúdo impugnável da sentença; \\n", "B": "o juiz determinar o segredo de justiça em relação a dados e\\ndepoimentos constantes dos autos a respeito do ofendido\\npara evitar sua exposição aos meios de comunicação; \\n", "C": "se habilitar como assistente de acusação, no curso da\\ninvestigação criminal, com a anuência prévia do Ministério\\nPúblico;", "D": "requerer ao juiz a prisão temporária do investigado caso este\\nameace a sua integridade física durante a investigação\\ncriminal;", "E": "requisitar a instauração de inquérito policial e a realização de\\ndiligências investigatórias que deverão ser realizadas pela\\nautoridade policial."}, "classificacao": {"id": "Q0038", "decisao": "publicar", "tema_central_id": "5583", "extras_ids": "5549", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0039", "texto": "Suponha que todos os revendedores de gás liquefeito de petróleo (GLP) ajustem artificialmente preço final de venda do produto em determinada localidade. A esse respeito, é correto afirmar que", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "o ajuste é comum e em nada influencia na concorrência entre as empresas.", "B": "há, em princípio, um ilícito penal a ser apurado que se subsumi ao crime contra o consumidor.", "C": "o fato descrito encarta-se como crime contra a ordem econômica.", "D": "a relação de consumo é afetada pela conduta descrita; portanto, há contravenção praticada contra a economia popular.", "E": "a investigação a respeito do caso ficará a cargo da Polícia Federal, em virtude de que a União possui o monopólio de distribuição do GLP no Brasil."}, "classificacao": {"id": "Q0039", "decisao": "fora", "tema_central_id": "", "extras_ids": "", "confianca": "0.0", "motivo": "Lacuna na taxonomia: Cartel e crimes contra ordem econômica com nó inativo"}}, {"id": "Q0040", "texto": "Assinale a alternativa que traz duas características do recurso de apelação contra sentença condenatória do Tribunal do Júri que, cumuladas, podem levar à atribuição de efeito suspensivo ao referido recurso.", "comando": "", "alternativas": {"A": "Crime cometido sem violência ou grave ameaça e primariedade do apelante.", "B": "Votação não unânime quanto a quesito essencial e excesso de prazo para formação da culpa.", "C": "Pleitear reforma de sentença superior a 20 anos e levantar questão substancial, que pode resultar em anulação da sentença.", "D": "Interposição por acusado primário e levantar questão substancial, que pode resultar em redução da pena para patamar inferior a 15 (quinze) anos de reclusão.", "E": "Não ter propósito meramente protelatório e levantar questão substancial, que pode resultar em absolvição."}, "classificacao": {"id": "Q0040", "decisao": "publicar", "tema_central_id": "5562", "extras_ids": "5515;5529", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0041", "texto": "Sobre as medidas de segurança é correto afirmar:", "comando": "", "alternativas": {"A": "A lógica manicomial se funda na segregação hospitalar da pessoa com transtorno mental que tenha praticado um injusto\\npenal para sua neutralização e tentativa declarada de cura.", "B": "O Código Penal adota o sistema do duplo binário, sem a possibilidade de aplicação simultânea de pena e medida de segurança, que só se aplicam sucessivamente.", "C": "Pelo regime adotado no Código Penal, a medida de segurança pode ser aplicada ao imputável, desde que presente a periculosidade.", "D": "É inaplicável o Estatuto da Pessoa com Deficiência (Lei n° 13.146/2015) aos inimputáveis por doença mental, pois seria\\numa aplicação indevida do positivismo criminológico considerá-los pessoas com deficiência.", "E": "Segundo a Lei n° 10.216/2001, a desinternação é sempre condicional, podendo ser restabelecida se dentro de um ano o\\nagente praticar fato indicativo de persistência de sua periculosidade."}, "classificacao": {"id": "Q0041", "decisao": "publicar", "tema_central_id": "5184", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0042", "texto": "Sobre o elemento subjetivo da conduta, dolo direto é aquele em que:", "comando": "", "alternativas": {"A": "o agente prevê o resultado como possível o provável e assume o risco de produzi-lo, agindo com indiferença em relação às consequências de sua conduta.", "B": "o agente tem a intenção de realizar a conduta e alcançar o resultado almejado, visualizando a produção do evento como um objetivo.", "C": "o agente, em virtude de sua falta de cuidado e sem prever o resultado que seria previsível, age, provocando, desta forma, um evento indesejado.", "D": "o agente, mesmo prevendo o resultado como possível ou provável, age acreditando que esse evento ocorrerá, ainda que sua conduta seja idônea para produzi-lo."}, "classificacao": {"id": "Q0042", "decisao": "publicar", "tema_central_id": "5222", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0043", "texto": "Sobre a fixação da pena, tem-se o seguinte:", "comando": "Complete o estudo sobre a fixação da pena.", "alternativas": {"A": "a existência de circunstância atenuante pode conduzir à redução da pena abaixo do mínimo legal.", "B": "pelo critério trifásico, adotado pelo Código Penal, o juiz, na segunda fase, deverá apreciar as causas de aumento e de diminuição da parte geral e especial.", "C": "o estabelecimento do valor de dias-multa independe da condição econômica do condenado.", "D": "em caso de reincidência, fixada a pena em patamar inferior a 4 (quatro) anos, o condenado poderá iniciar o cumprimento da pena em regime semiaberto, desde que as circunstâncias judiciais o recomendem."}, "classificacao": {"id": "Q0043", "decisao": "publicar", "tema_central_id": "5199", "extras_ids": "5203;5201;5206", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0044", "texto": "Paulo e Jean foram denunciados pela prática do crime de furto de joias, praticado contra Maria, tia sexagenária de Paulo. A subtração foi facilitada pelo fato de Paulo residir com a vítima. Quando da citação, Paulo não foi encontrado no novo endereço que havia fornecido na fase do inquérito, tendo sido o mandado entregue a outro morador, que se comprometeu a entregá-lo ao destinatário. Jean, que retornou para a França, seu país de origem, havia fornecido seu endereço completo ao delegado. A partir dessa situação hipotética, julgue o item a seguir. Se Jean, após a citação pessoal válida, não comparecer em juízo para defender-se no curso da ação penal, o juiz deverá decretar a sua revelia e nomear-lhe um defensor dativo, dando continuidade ao processo, mas não poderá considerar a existência de confissão ficta.", "comando": "", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0044", "decisao": "publicar", "tema_central_id": "5488", "extras_ids": "5583", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0045", "texto": "No crime de excesso de exação, o crime é qualificado se", "comando": "", "alternativas": {"A": "praticado por funcionário público.", "B": "cometido por meio vexatório ou gravoso, que a lei não autoriza.", "C": "resulta dano para a Administração Pública ou para o administrado.", "D": "o funcionário pratica ato de ofício, com infração de dever funcional, cedendo a pedido ou influência de outrem.", "E": "o funcionário desvia, em proveito próprio ou de outrem, o que recebeu indevidamente para recolher aos cofres públicos."}, "classificacao": {"id": "Q0045", "decisao": "publicar", "tema_central_id": "5091", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0046", "texto": "Acerca das nulidades processuais e dos vícios procedimentais, assinale a alternativa correta.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "As nulidades processuais penais sofrem influência da\\ninstrumentalidade do processo, não se declarando\\nqualquer tipo de nulidade se não verificado o prejuízo.", "B": "Segundo a jurisprudência do Superior Tribunal de\\nJustiça, a inversão da ordem das perguntas (art. 212,\\nCPP) não gera nulidade, não implicando afronta ao\\nprincípio do contraditório.", "C": "As nulidades são divididas conforme a gravidade dos\\nvícios, em relativas e absolutas, sendo a nulidade de ordem\\nabsoluta reconhecida ainda que não haja prejuízo.", "D": "A inépcia da acusação só pode ser apreciada na fase do\\nartigo 396, do Código de Processo Penal, não podendo\\ntal análise ser refeita na fase do artigo 397, do Código\\nde Processo Penal, após a resposta à acusação.", "E": "A coisa julgada sana todas as hipóteses de nulidades\\nprocessuais penais."}, "classificacao": {"id": "Q0046", "decisao": "publicar", "tema_central_id": "5509", "extras_ids": "5510;5511", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0047", "texto": "Durante um pacífico protesto realizado no interior do Município Alfa, Caio, destoando do público presente e agindo com dolo, lançou uma pedra em direção ao pequeno estabelecimento comercial de João, gerando, em razão dos bens móveis destruídos, prejuízo considerável para a vítima. Na sequência, Caio jogou diversos paralelepípedos contra a sede da municipalidade, deteriorando o bem público. Nesse cenário, considerando as disposições do Código Penal, é correto afirmar que Caio responderá, em concurso, pelos crimes de", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "\\ndano qualificado em detrimento de João e dano qualificado \\npor ter deteriorado bem público, hipóteses em que se procede\\nmediante ação penal pública incondicionada.", "B": "\\ndano qualificado em detrimento de João, hipótese em que\\nsomente se procede mediante representação do ofendido, e\\ndano qualificado por ter deteriorado bem público.", "C": "\\ndano simples em detrimento de João e dano simples por ter\\ndeteriorado bem público, hipóteses em que se procede\\nmediante ação penal pública incondicionada.", "D": "\\ndano qualificado em detrimento de João, hipótese em que\\nsomente se procede mediante queixa, e dano qualificado por\\nter deteriorado bem público.", "E": "\\ndano simples em detrimento de João, hipótese em que\\nsomente se procede mediante queixa, e dano qualificado por\\nter deteriorado bem público."}, "classificacao": {"id": "Q0047", "decisao": "publicar", "tema_central_id": "5164", "extras_ids": "5468", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0048", "texto": "“Predomina, segundo se conclui pelo conteúdo dos decretos presidenciais, a preocupação em se reduzir os prazos de encarceramento e o contingente carcerário e, além disso, proporcionar condições de reinserção social do condenado, evitando lesão aos direitos fundamentais pela deterioração das condições de encarceramento decorrente de superpopulação.” (Ferreira, Ana Lúcia Tavares. Indulto e sistema penal: limites, finalidades e propostas. São Paulo. LiberArs, 2017) Sobre indulto e comutação de pena, é correto afirmar que:", "comando": "Sobre indulto e comutação de pena, é correto afirmar que:", "alternativas": {"A": "cumpridos todos os requisitos do decreto presidencial, não\\nhá possibilidade de ser indeferida a concessão do indulto ou\\nda comutação de pena ao apenado, considerando a natureza\\ndeclaratória da sentença que concede esses benefícios;", "B": "nos decretos mais recentes, verificou-se a vedação à\\nconcessão da comutação de pena aos condenados por crime\\ncomum praticado em concurso com crime de natureza\\nhedionda; \\n", "C": "a concessão do indulto extingue os efeitos primários e\\nsecundários da condenação, não subsistindo a condenação\\nextinta para efeitos de reconhecimento de reincidência\\nfutura;", "D": "o cometimento de falta disciplinar de natureza grave fora do\\nperíodo previsto no decreto presidencial justifica o\\nindeferimento do indulto e da comutação de pena, por\\nausência de requisito subjetivo;", "E": "a prática de falta disciplinar de natureza grave interrompe a\\ncontagem do prazo para fins de indulto e da comutação de\\npena."}, "classificacao": {"id": "Q0048", "decisao": "publicar", "tema_central_id": "5193", "extras_ids": "4703", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0049", "texto": "Mévia e Tício foram namorados, por 5 anos. Mévia terminou a relação, por ter conhecido e se apaixonado por outra pessoa. Tício não se conformava com o término e, diagnosticado com depressão, todos os dias, durante meses, mandava mensagem para Mévia, dizendo que a vida sem ela perdera a graça. Mévia, sabendo da condição de saúde mental de Tício, manteve-se silente durante todo o tempo. Mas, um dia, irritada com as mensagens, que estavam causando instabilidade em seu atual relacionamento, Mévia envia a Tício a seguinte resposta: “se a vida perdeu a graça, de que vale viver? Seja homem ao menos uma vez! Coloque fim em seu sofrimento e pare de me infernizar! Eu até vou a seu enterro e faço uma homenagem póstuma!” Tício visualizou a mensagem, respondendo com “Ok”. Passados dois dias, Tício se joga da janela do prédio de sua casa. Por sorte, Tício cai em cima da carroceria de um caminhão, lotado de colchão, que passava na rua no exato momento da queda. Tício não sofreu qualquer lesão. Diante da situação hipotética, assinale a alternativa correta.", "comando": "", "alternativas": {"A": "Mévia não incorreu em qualquer crime, visto que o tipo penal de induzimento, instigação ou auxílio a suicídio e automutilação, para se configurar, exige que da conduta de instigar, induzir ou auxiliar advenha, no mínimo, lesão de natureza grave.", "B": "Mévia, em tese, incorreu no crime de induzimento, instigação ou auxílio a suicídio e automutilação, que se configura com a conduta de induzir, instigar ou auxiliar, independentemente do resultado.", "C": "Mévia, em tese, incorreu no crime de induzimento, instigação ou auxílio a suicídio e automutilação, na modalidade tentada, vez que a morte não se concretizou, por circunstância alheia a sua vontade.", "D": "Mévia não incorreu em qualquer crime, visto que o tipo penal de induzimento, instigação ou auxílio a suicídio e automutilação, para se configurar, exige que da conduta de instigar, induzir ou auxiliar advenha, no mínimo, lesão de natureza leve.", "E": "Mévia, em tese, incorreu no crime de induzimento, instigação ou auxílio a suicídio e automutilação, na figura qualificada, dada a relação afetiva, entre a vítima e o autor."}, "classificacao": {"id": "Q0049", "decisao": "publicar", "tema_central_id": "5152", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0050", "texto": "Sobre o instituto da delação premiada, previsto na Lei de Drogas (Lei no 11.343/2006), para os autores dos crimes nela descritos é correto afirmar que", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "pressupõe a colaboração do autor da delação na \\nidentificação de seus comparsas.", "B": "os requisitos legais para obtenção do benefício decorrente da delação premiada são alternativos.", "C": "exige voluntariedade e espontaneidade do autor da \\ndelação.", "D": "exige a recuperação total ou parcial do proveito do \\ncrime."}, "classificacao": {"id": "Q0050", "decisao": "publicar", "tema_central_id": "4708", "extras_ids": "5557", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0051", "texto": "O jogador Vinícius Júnior foi expulso, no dia 21/05/2023, em partida de futebol realizada contra o Valencia pelo campeonato espanhol, após reagir a ofensas racistas perpetradas por torcedores do time rival. Ao longo da partida, foi possível ouvir constantes gritos de “macaco!” advindos da torcida do Valencia e direcionados ao atacante brasileiro. A polícia de Madri recolheu impressões digitais e vestígios genéticos de várias pessoas envolvidas no ato. Afora isso, as autoridades locais rastrearam placas de veículos automotores que transitaram próximo ao estádio. Diante da investigação da polícia madrilenha, chegou-se à autoria em relação a determinados indivíduos. Considerando a narrativa fática, é correto afirmar que a lei penal brasileira:", "comando": "Considerando a narrativa fática, é correto afirmar que a lei penal brasileira:", "alternativas": {"A": "poderá ser aplicada às infrações penais que ocorrerem fora\\ndo território nacional, devendo ser observado o princípio da\\nterritorialidade mitigada;", "B": "poderá ser aplicada às infrações penais que ocorrerem fora\\ndo território nacional, devendo ser observado o princípio da\\nnacionalidade ativa, podendo-se afirmar que nesta hipótese a\\nextraterritorialidade é condicionada;", "C": "poderá ser aplicada às infrações penais que ocorrerem fora\\ndo território nacional, devendo ser observado o princípio da\\nrepresentação, podendo-se afirmar que, nessa hipótese, a\\nextraterritorialidade é incondicionada;", "D": "poderá ser aplicada às infrações penais que ocorrerem fora\\ndo território nacional, devendo ser observado o princípio da\\njustiça penal universal, bem como a hipótese legal decorrente\\ndo princípio da defesa que é verificada quando o delito é\\npraticado por estrangeiro contra brasileiro, podendo-se\\nafirmar que, em ambos os casos, teremos\\nextraterritorialidade incondicionada;", "E": "poderá ser aplicada às infrações penais que ocorrerem fora\\ndo território nacional, devendo ser observado o princípio da\\njustiça penal universal, bem como a hipótese legal decorrente\\ndo princípio da defesa que é verificada quando o delito é\\npraticado por estrangeiro contra brasileiro, podendo-se\\nafirmar que, em ambos os casos, teremos\\nextraterritorialidade condicionada."}, "classificacao": {"id": "Q0051", "decisao": "publicar", "tema_central_id": "5182", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0052", "texto": "Uma pessoa presa em regime fechado, definitivamente condenada, prestou 300 dias de trabalho prisional intra muros , bem como, simultaneamente, teve frequência escolar de 200 horas, concluindo atividade de ensino médio ao longo do cumprimento da pena. Cada 12 (doze) horas foram divididas em 3 (três) dias de estudo. Esse indivíduo I. tem direito à remição de pena, à razão de 1 (um) dia de pena a cada 3 (três) dias de trabalho. II. tem direito à remição de pena, à razão de 1 (um) dia de pena a cada 12 (doze) horas de frequência escolar. III. tem direito à remição de pena, com o acréscimo de 1/3 (um terço) de toda a remição conquistada durante o cumprimento da pena devido à conclusão do ensino médio. IV. em caso da prática de falta grave, obrigatoriamente, perderá 1/3 (um terço) da remição conquistada, recomeçando a contagem a partir da data da infração disciplinar.", "comando": "Está correto o que se afirma APENAS em", "alternativas": {"A": "II, III e IV.", "B": "I e III.", "C": "I e II.", "D": "III e IV.", "E": "I, II e IV."}, "classificacao": {"id": "Q0052", "decisao": "publicar", "tema_central_id": "4703", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0053", "texto": "Com relação aos juizados especiais criminais, às nulidades, aos recursos no processo penal e à execução penal, julgue o item a seguir. Diferentemente da suspensão condicional do processo, a homologação da transação penal no âmbito dos juizados especiais criminais faz coisa julgada material, de forma que o descumprimento das cláusulas do acordo não permite a continuidade da persecução penal.", "comando": "", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0053", "decisao": "revisar", "tema_central_id": "5539", "extras_ids": "5541;5542", "confianca": "0.916667", "motivo": "Revisar: referencia_inconclusiva; O contraste expresso entre suspensão do processo e transação sustenta o pai Procedimento Sumaríssimo. Discordância antiga sem tema substituto permanece inconclusiva e bloqueia publicação."}}, {"id": "Q0054", "texto": "A doutrina classifica os delitos em diversas categorias. Considerando algumas das classificações existentes, a alternativa que prevê delito de mera atividade, delito de lesão, delito plurissubjetivo e delito pluriofensivo, respectivamente, é:", "comando": "Considerando algumas das classificações existentes, assinale a alternativa que prevê delito de mera atividade, delito de lesão, delito plurissubjetivo e delito pluriofensivo, respectivamente.", "alternativas": {"A": "violação de domicílio, furto, rixa e roubo;", "B": "injúria, dano, associação criminosa e estelionato;", "C": "assédio sexual, incêndio, apropriação indébita e roubo;", "D": "desobediência, omissão de socorro, tráfico de pessoas e\\nperseguição;", "E": "ato obsceno, lesão corporal, constituição de milícia privada e\\nautoaborto."}, "classificacao": {"id": "Q0054", "decisao": "publicar", "tema_central_id": "5174", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0055", "texto": "No que tange à oitiva das testemunhas arroladas pela acusação em audiência de instrução e julgamento, na forma do Art. 212 do Código de Processo Penal, é correto afirmar que:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "a nulidade pela alteração da ordem de inquirição deve indicar\\no prejuízo gerado; \\n", "B": "é possível ao juiz formular perguntas de forma detalhada,\\napós as partes;", "C": "a ordem de inquirição pode ser alterada no caso de ausência\\nmomentânea de uma das partes;", "D": "havendo atuação comedida, o juiz pode iniciar a inquirição da\\ntestemunha;", "E": "o juiz pode intervir, a qualquer momento, diante de\\nilegalidade na condução do depoimento."}, "classificacao": {"id": "Q0055", "decisao": "publicar", "tema_central_id": "5550", "extras_ids": "5511", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0056", "texto": "No caso de pluralidade delitiva, deve-se adotar, na determinação da pena,", "comando": "Complete a frase sobre a determinação da pena no caso de pluralidade delitiva.", "alternativas": {"A": "o sistema de cúmulo jurídico, somando-se as penas aplicadas\\na cada um dos crimes.", "B": "o sistema da exasperação, quando se tratar de casos de\\nconcurso formal imperfeito.", "C": "o sistema da exasperação, quando se tratar de concurso\\nmaterial heterogêneo, para evitar que a pena ultrapasse o limite\\nlegal de cumprimento.", "D": "o sistema da exasperação, que considera tão somente o número\\nde crimes consumados para definição da pena.", "E": "o sistema do cúmulo material, quando se tratar de pena\\npecuniária, independentemente das demais sanções aplicadas,\\nressalvado o crime continuado."}, "classificacao": {"id": "Q0056", "decisao": "publicar", "tema_central_id": "5066", "extras_ids": "5067;5068;5069;5070", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0057", "texto": "Por iter criminis compreende-se o conjunto de", "comando": "Complete a definição de iter criminis.", "alternativas": {"A": "atos de execução do delito.", "B": "atos preparatórios antecedentes ao delito.", "C": "atos de consumação do delito.", "D": "fases pelas quais passa o delito.", "E": "atos de cogitação."}, "classificacao": {"id": "Q0057", "decisao": "publicar", "tema_central_id": "5176", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0058", "texto": "Sobre a relação entre sistema penal e pobreza é correto afirmar que", "comando": "", "alternativas": {"A": "a vertente criminológica do conflito identifica a pobreza\\ncomo principal causa da criminalidade e defende\\nmaior investimento social para reduzir as taxas\\nde crimes.", "B": "tal qual o processo de criminalização, a vitimização\\ntambém é um processo seletivo que tem como alvo\\npreferencial os mais pobres.", "C": "por se tratar de uma questão de saúde, a internação\\ndas pessoas com transtorno mental pelas medidas\\nde segurança não se dá de maneira seletiva como\\nno processo de criminalização.", "D": "o surgimento da prisão como forma de punição por\\nexcelência nos séculos XVIII e XIX teve como fulcro\\na substituição de penas cruéis, mas somente nas\\núltimas duas décadas passou a ser um mecanismo\\nde controle social da pobreza.", "E": "o efetivo respeito ao garantismo penal é capaz de\\nreverter o caráter seletivo do sistema penal brasileiro\\ne sua consequente gestão autoritária da miséria."}, "classificacao": {"id": "Q0058", "decisao": "publicar", "tema_central_id": "4378", "extras_ids": "4390;4375", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0059", "texto": "Sobre a relação entre o preso e a sociedade, segundo Alessandro Baratta, é CORRETO afirmar:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "A reinserção do preso na sociedade, após o cumprimento da pena, é assegurada\\na partir do momento em que, no cárcere, o preso absorve um conjunto de\\nvalores e modelos de comportamento desejados socialmente.", "B": "É necessário primeiro modificar os excluídos, para que eles possam voltar ao\\nconvívio social na sociedade que está apta a acolhê-los.", "C": "O cárcere não reflete as características negativas da sociedade, em razão do\\nisolamento a que são submetidos os presos.", "D": "São relações sociais baseadas no egoísmo e na violência ilegal, no interior\\ndas quais os indivíduos socialmente mais débeis são constrangidos a papéis\\nde submissão e de exploração."}, "classificacao": {"id": "Q0059", "decisao": "publicar", "tema_central_id": "4368", "extras_ids": "4370", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0060", "texto": "A respeito dos crimes praticados em detrimento da administração pública, assinale a alternativa correta.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "São crimes próprios de funcionários públicos o de\\nconcussão, o de peculato e o de tráfico de influência.", "B": "O crime de facilitação de contrabando ou descaminho pode ser praticado por particular, individualmente ou em concurso de agentes com o funcionário\\npúblico.", "C": "O crime de advocacia administrativa, para restar caracterizado, exige a qualidade de advogado do sujeito ativo.", "D": "No crime de corrupção ativa, incidirá causa de aumento da pena ao sujeito ativo, na hipótese de o funcionário omitir ou retardar ato de ofício.", "E": "O funcionário público que, por recebimento de vantagem ilícita, de qualquer natureza, deixa de responsabilizar subordinado que praticou ato ilícito comete\\ncrime de condescendência criminosa."}, "classificacao": {"id": "Q0060", "decisao": "publicar", "tema_central_id": "5087", "extras_ids": "5091;5089;5093;5096;5097", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0061", "texto": "Sobre a falta grave no processo de execução criminal, é correto afirmar:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "a falta grave abrange o descumprimento em regime aberto das condições impostas.", "B": "a falta grave não abrange o condenado a pena restritiva de direito que descumpre,\\ninjustificadamente, a restrição imposta.", "C": "a decisão judicial que reconhece a falta grave faz com que seja obrigatório o exame\\ncriminológico em eventual pedido de progressão de regime.", "D": "a decisão judicial que reconhece a falta grave implica na perda de, no mínimo, de\\n1/3 dos dias remidos.", "E": "a decisão judicial que reconhece a falta grave interrompe a contagem do período\\npara fins de comutação e indulto."}, "classificacao": {"id": "Q0061", "decisao": "publicar", "tema_central_id": "4703", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0062", "texto": "Camargo, terrorista, tenta explodir agência do Banco do Brasil, na França. Considerando o princípio da extraterritorialidade incondicionada, previsto no Código Penal brasileiro, é correto afirmar que:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Camargo só pode ser processado criminalmente na França.", "B": "O Estado brasileiro não tem interesse em delitos ocorridos fora do Brasil.", "C": "Caso Camargo tenha sido condenado e encarcerado na França, não poderá ser preso no Brasil.", "D": "O fato deve ser julgado no local onde ocorreu o crime: na França.", "E": "Mesmo Camargo tendo sido julgado na França, poderá ser julgado no Brasil."}, "classificacao": {"id": "Q0062", "decisao": "publicar", "tema_central_id": "5182", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0063", "texto": "No contexto da violência doméstica e familiar contra a mulher, avalie se as afirmativas a seguir são verdadeiras (V) ou falsas (F). ( ) As medidas protetivas de urgência, previstas na Lei nº 11.340/2006, poderão ser aplicadas cumulativamente, diferentemente das medidas cautelares alternativas dispostas no Código de Processo Penal, as quais não podem ser aplicadas de forma cumulada, tendo em vista o princípio ne bis in idem . ( ) Independentemente de autorização judicial, o delegado de polícia, quando o município não for sede de comarca, poderá tomar medidas para o imediato afastamento do agressor do local de convivência com a ofendida. ( ) As medidas protetivas de urgência serão concedidas em juízo de cognição sumária a partir do depoimento da ofendida perante a autoridade policial ou a partir da apresentação de suas alegações escritas. ( ) Segundo a Lei nº 11.340/06, as medidas protetivas de urgência poderão ser concedidas de imediato, independentemente de audiência das partes e de manifestação do Ministério Público. Todavia, o órgão do Parquet deverá ser comunicado prontamente sobre a medida. As afirmativas são, respectivamente,", "comando": "Assinale se as afirmativas são verdadeiras (V) ou falsas (F).", "alternativas": {"A": "F – V – V – F.", "B": "V – F – V – F.", "C": "F – V – V – V.", "D": "V – F – F – V.", "E": "F – V – F – F."}, "classificacao": {"id": "Q0063", "decisao": "publicar", "tema_central_id": "4704", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0064", "texto": "Francisco contratou empregada doméstica, porém, durante a relação de emprego, por três meses, realizou o desconto da contribuição previdenciária sem, contudo, fazer o devido repasse aos cofres públicos. Após a finalização do procedimento administrativo, apurou-se que a dívida de Francisco com a previdência somava R$ 1.000.", "comando": "Acerca dessa situação hipotética, assinale a opção correta.", "alternativas": {"A": "Na situação em apreço, conforme dispositivo do Código\\nPenal, a conduta narrada configura o crime de estelionato\\nprevidenciário.", "B": "Mesmo que condenado por sentença definitiva, caso\\nFrancisco realize o pagamento integral da dívida fiscal,\\ndeverá ser declarada a extinção da punibilidade.", "C": "Para a situação narrada, a prescrição começa a correr a partir\\ndo dia subsequente ao último mês em que Francisco deixou\\nde recolher a contribuição previdenciária, uma vez que se\\ntrata de crime permanente e que sua consumação se posterga\\naté que cesse a permanência.", "D": "Se preenchidos os requisitos de ordem subjetiva, será possível\\na incidência do princípio da insignificância para o caso em\\nanálise, haja vista o pequeno valor do crédito tributário."}, "classificacao": {"id": "Q0064", "decisao": "publicar", "tema_central_id": "5165", "extras_ids": "4695;5172", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0065", "texto": "O crime de extorsão mediante sequestro (CP, art. 159)", "comando": "Complete a explicação sobre o crime de extorsão mediante sequestro previsto no artigo 159 do Código Penal.", "alternativas": {"A": "é qualificado se do fato resulta lesão corporal grave\\nou morte.", "B": "é qualificado se cometido contra vítima menor de\\n18 (dezoito) anos ou maior de 50 (cinquenta) anos.", "C": "não admite a modalidade tentada.", "D": "consuma-se quando o agente solicita vantagem\\ncomo preço do resgate, por se tratar de crime contra\\no patrimônio.", "E": "consuma-se quando o agente obtém vantagem\\ncomo preço do resgate, por se tratar de crime contra\\no patrimônio."}, "classificacao": {"id": "Q0065", "decisao": "publicar", "tema_central_id": "5161", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0066", "texto": "O positivismo criminológico", "comando": "Explique o que é o positivismo criminológico.", "alternativas": {"A": "constitui uma continuidade da Escola Clássica, aprofundando suas ideias a partir do mesmo paradigma metodológico.", "B": "rejeita o viés etiológico ao buscar o desenvolvimento de um plano individualizador da pena.", "C": "sofreu um abandono teórico que teve como decorrência a ausência de reflexos em práticas atuais e no direito contemporâneo.", "D": "revela, em seus estudos, a primazia do livre-arbítrio na compreensão do fenômeno criminoso.", "E": "primou pela aplicação do método científico no qual a observação direta e a experiência assumem papel decisivo."}, "classificacao": {"id": "Q0066", "decisao": "publicar", "tema_central_id": "4373", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0067", "texto": "Os fi ns da Administração Pública resumem-se em um único objetivo: o bem comum da coletividade administrativa. Toda atividade deve ser orientada para este objetivo; sendo que todo ato administrativo que não for praticado no interesse da coletividade será ilícito e imoral. Assim, temos no Código Penal o título XI - Dos crimes contra a Administração Pública. Analise a conduta abaixo, caracterizando-a com um dos tipos de crime contra a Administração Pública. Sebastião, policial militar, exige dinheiro de Caio, usuário de maconha, para que este não seja preso. Caio, com medo da função de policial exercida pelo funcionário público militar, dá R$ 4.000,00 (quatro mil reais) a Sebastião, conforme exigido por ele. Com base nessa informação e na legislação penal especial, é correto afi rmar que:", "comando": "Analise a conduta e caracterize-a com um dos tipos de crime contra a Administração Pública.", "alternativas": {"A": "Sebastião comete o crime de corrupção ativa.", "B": "Sebastião comete o crime de prevaricação.", "C": "Sebastião comete o crime de excesso de exação.", "D": "Sebastião comete o crime de concussão.", "E": "Sebastião comete o crime de patrocínio infiel."}, "classificacao": {"id": "Q0067", "decisao": "publicar", "tema_central_id": "5091", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0068", "texto": "Marque a alternativa correta do ponto de vista legal.", "comando": "", "alternativas": {"A": "No crime de estupro, aumenta-se a pena de metade se resultar a gravidez da vítima.", "B": "Luiz, delegado de polícia civil, lotado em uma determinada delegacia de polícia, deixou, por\\nindulgência, de responsabilizar o inspetor Amâncio após tomar conhecimento de que este\\nteria praticado uma determinada infração. Nesse contexto, pode-se afirmar que o delegado\\npraticou, em tese, o crime de condescendência criminosa.", "C": "No crime de incêndio, aumenta-se a pena em dois terços se o delito for praticado em galeria\\nde mineração.", "D": "Aquele que dolosamente retém documento de identidade de terceira pessoa responde pelo\\ndelito de supressão de documento.", "E": "No crime de Falsa Identidade, o agente não apresenta nenhum documento de identidade para\\nse identificar."}, "classificacao": {"id": "Q0068", "decisao": "revisar", "tema_central_id": "5062", "extras_ids": "5103;5096;5126;5118;5119", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0069", "texto": "Em termos de interpretação da lei penal, quando se encontram na legislação expressões como “qualquer outro meio”, “qualquer outra vantagem”, “outro recurso” ou “qualquer outro meio fraudulento”, por exemplo, tais preceitos serão supridos por", "comando": "", "alternativas": {"A": "analogia.", "B": "interpretação progressiva.", "C": "interpretação autêntica.", "D": "interpretação analógica.", "E": "interpretação declarativa."}, "classificacao": {"id": "Q0069", "decisao": "publicar", "tema_central_id": "5173", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0070", "texto": "Carlos Alberto foi preso preventivamente em 1º de fevereiro de 2024, pela suposta prática do crime de tráfico de drogas (Art. 33, caput, da Lei nº 11.343/2006). A prisão preventiva perdurou por um ano, até que sobreveio sentença penal condenatória transitada em julgado em 1º de fevereiro de 2025, que o condenou à pena de seis anos de reclusão, em regime inicial fechado. Após o cumprimento de um ano da execução definitiva da pena, em 1º de fevereiro de 2026, a defesa de Carlos Alberto formulou pedido de comutação de pena com base em Decreto Presidencial vigente, que exigia o cumprimento mínimo de um terço da pena para a concessão do benefício. Para alcançar a fração de dois anos exigida, a defesa pleiteou o cômputo do período de prisão preventiva, correspondente a um ano, no cálculo do requisito objetivo temporal. À luz da jurisprudência do Superior Tribunal de Justiça (STJ) consolidada em sede de recurso repetitivo, assinale a afirmativa correta.", "comando": "", "alternativas": {"A": "O pleito da defesa merece acolhimento, pois o período de prisão provisória configura tempo de privação de liberdade efetivamente já posto à disposição do Estado, devendo ser contabilizado na análise dos requisitos para a concessão da comutação previstos nos respectivos decretos, conforme o Art. 42 do Código Penal (CP).", "B": "O pleito da defesa deve ser rejeitado, uma vez que a prisão preventiva possui natureza exclusivamente cautelar e processual, não se confundindo com a execução da pena, de modo que o respectivo período serve apenas para desconto da reprimenda total a ser cumprida (detração, Art. 42 do CP), não podendo ser contabilizado para fins de preenchimento do requisito objetivo temporal exigido nos decretos de indulto e comutação.", "C": "O pleito da defesa é admissível, desde que a custódia cautelar tenha sido expressamente mantida na sentença penal condenatória, assegurando-se a continuidade ininterrupta entre o período de prisão provisória e o início do cumprimento da pena definitiva, pois somente nessa hipótese haveria identidade funcional entre a privação cautelar de liberdade e a execução penal propriamente dita, legitimando a aplicação analógica do Art. 42 do CP.", "D": "O pleito da defesa deve ser rejeitado, pois o Art. 42 do CP disciplina exclusivamente a detração penal para fins de cômputo no cumprimento da pena definitiva, não havendo previsão legal expressa que autorize a sua extensão ao cálculo dos requisitos objetivos dos decretos de indulto e comutação. A analogia pretendida pela defesa configuraria interpretação contra legem, vedada em matéria de execução penal.", "E": "O pleito da defesa deve ser rejeitado, visto que admitir o cômputo da prisão provisória para efeito de preenchimento do requisito objetivo do indulto e da comutação representaria equiparação indevida entre a custódia cautelar e o cumprimento efetivo de pena, em afronta ao princípio da presunção de inocência, já que, enquanto preso provisório, o réu ainda não ostenta a condição jurídica de condenado em execução de pena. Realização"}, "classificacao": {"id": "Q0070", "decisao": "publicar", "tema_central_id": "5193", "extras_ids": "5201;4703", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0071", "texto": "Nos crimes contra a Flora, previstos na Lei n. 9.605/98, a pena é majorada no patamar de um sexto a um terço se: do fato resulta a diminuição de águas naturais, a erosão do solo ou a modificação do regime climático; e o crime é cometido: no período de queda das sementes; no período de formação de vegetações; contra espécies raras ou ameaçadas de extinção, ainda que a ameaça ocorra somente no local da infração; em época de seca ou inundação; e durante a noite, em domingo ou feriado.", "comando": "Assinale a alternativa correta.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0071", "decisao": "publicar", "tema_central_id": "4688", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0072", "texto": "Para formar seu juízo de convicção a respeito de fato submetido a julgamento, o juiz.", "comando": "Complete a frase sobre como o juiz forma seu juízo de convicção a respeito de fato submetido a julgamento.", "alternativas": {"A": "poderá considerar elementos colhidos na investigação policial, desde que não contrariados pelas partes.", "B": "poderá considerar elementos colhidos na investigação policial, desde que em consonância com provas produzidas sob o contraditório.", "C": "poderá considerar elementos colhidos na investigação policial desde que não contrariados por provas judiciais", "D": "não poderá considerar elementos colhidos na investigação policial, porque não produzidos sob o contraditório.", "E": "não poderá considerar exclusivamente elementos constantes da investigação policial, exceto se colhidos em presença de defensor do investigado."}, "classificacao": {"id": "Q0072", "decisao": "publicar", "tema_central_id": "5592", "extras_ids": "5595", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0073", "texto": "Quanto aos crimes praticados contra a Administração Pública é CORRETO afirmar:", "comando": "", "alternativas": {"A": "O funcionário que, nos crimes de peculato, reparar o dano até a publicação da sentença condenatória, fará jus à extinção da punibilidade.", "B": "Constitui crime de corrupção ativa prometer vantagem indevida a funcionário público, para determiná-lo omitir ato de ofício.", "C": "Nos crimes de favorecimento pessoal e real, caso o sujeito ativo seja ascendente ou descendente do criminoso, fica isento de pena.", "D": "O agente que pede dinheiro a pretexto de influir em ato a ser praticado pelo representante do Ministério Público incorre em crime de tráfico de influência.", "E": "Comete crime contra as finanças públicas gestor que ordenar, autorizar ou executar ato que acarrete aumento de despesa total com pessoal nos doze meses anteriores ao final do mandato ou da legislatura.\\n"}, "classificacao": {"id": "Q0073", "decisao": "publicar", "tema_central_id": "5087", "extras_ids": "5089;5093;5101;5084;5147", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0074", "texto": "Considere a seguinte situação hipotética. Antônio foi condenado pela prática do delito X pelo juízo da 5.ª vara criminal de Maceió, sendo certo que a condenação foi mantida pelo Tribunal de Justiça do Estado de Alagoas. Transitado em julgado o decisum e iniciado o cumprimento da pena privativa de liberdade, foi publicada pelo Congresso Nacional lei ordinária reduzindo pela metade a pena cominada ao delito X. Nessa situação, compete ao juízo da 5.ª vara criminal da capital alagoana a aplicação da lei penal mais benigna.", "comando": "Assinale a alternativa correta.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0074", "decisao": "publicar", "tema_central_id": "5181", "extras_ids": "4703", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0075", "texto": "Quanto à comunicabilidade da extinção da punibilidade, é INCORRETO afirmar:", "comando": "", "alternativas": {"A": "A extinção da punibilidade de crime que é circunstância agravante de outro não se estende a este.", "B": "Nos crimes conexos, a extinção da punibilidade de um deles não impede, quanto aos outros, a agravação da pena resultante da conexão.", "C": "A extinção da punibilidade de crime que é pressuposto de outro não se estende a este.", "D": "A extinção da punibilidade de crime que é elemento constitutivo de outro não se estende a este.", "E": "Nos crimes conexos, a extinção da punibilidade de um deles impede, quanto aos outros, a agravação da pena resultante da conexão."}, "classificacao": {"id": "Q0075", "decisao": "publicar", "tema_central_id": "5191", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0076", "texto": "A Criminologia é definida tradicionalmente como a ciência que estuda de forma empírica o delito, o delinquente, a vítima e os mecanismos de controle social. Os autores que fundaram a Criminologia (Positivista) são:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Cesare Lombroso, Enrico Ferri e Raffaele Garofalo.", "B": "Franz Von Liszt, Edmund Mezger e Marquês de Beccaria.", "C": "Marquês de Beccaria, Cesare Lombroso e Michel Foucault.", "D": "Cesare Lombroso, Enrico Ferri e Michel Foucault.", "E": "Enrico Ferri, Michel Foucault e Nina Rodrigues."}, "classificacao": {"id": "Q0076", "decisao": "publicar", "tema_central_id": "4373", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0077", "texto": "Considere os artigos abaixo. Em seguida, marque a alternativa CORRETA: Artigo 1º da Lei 2.889/1956: “Quem, com a intenção de destruir, no todo ou em parte, grupo nacional, étnico, racial ou religioso, como tal”: a) matar membros do grupo; Será punido: Com as penas do art. 121, § 2º, do Código Penal, no caso da letra “a”; Artigo 309 do Código Eleitoral: “Votar ou tentar votar mais de uma vez, ou em lugar de outrem”: Pena - reclusão de até três anos.", "comando": "Marque a alternativa CORRETA.", "alternativas": {"A": "Norma penal em branco heterogênea homovitelina é aquela em que o complemento do preceito primário da norma advém da mesma fonte formal de produção.", "B": "Norma penal em branco heterogênea heterovitelina é aquela em que o complemento do preceito primário da norma advém de diversa fonte formal de produção .", "C": "Assim dispunha o artigo 214 do Código Penal Brasileiro: “Constranger alguém, mediante violência ou grave ameaça a praticar ou a permitir que com ele se pratique ato libidinoso diverso da conjunção carnal”. Considerando que tal dispositivo foi inteiramente revogado pela Lei 12.015/2009 é correto afirmar que, nesse caso, específico operou-se Abolitio Criminis .", "D": "O art. 1º da Lei 2.889/1956 é exemplo de norma penal em branco ao avesso ou invertida. O artigo 309 do Código Eleitoral é, por sua vez, exemplo de crime de atentado ou de empreendimento.", "E": "Compete ao Supremo Tribunal Federal a concessão de exequatur às cartas rogatórias."}, "classificacao": {"id": "Q0077", "decisao": "revisar", "tema_central_id": "5171", "extras_ids": "5174;5194", "confianca": "0.5", "motivo": "Revisar: mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0078", "texto": "EM oossstomnioconcunsos come Marcelo possui registro válido de um revólver de calibre 32 e o mantém em sua residência, e também possui uma pistola de calibre .380, com número de série raspada, que recebera de André, seu amigo foragido da pol a, que faleceu pouco tempo depois. Marcelo vendeu, por imil reis, a pistola a Hugo, que saiu da residência de Marcelo com a pistola escondida embaixo do banco da frente de seu veículo, em direção a sua residência, onde pretendia guardar a arma para sua defesa pessoal. No trajeto, Hugo, que conduzia o veiculo sem habilitação ou permissão para dirigi fi itercepiado por uma barreira policial e, assustado, acelerou o veiculo e fugiu do local. Apés perseguição policial, Hugo colidiu o cárro contra um poste de iluminação pública, foi preso em dagrante e conduzido até a delegacia de polícia. Revistado o veículo conduzido por Hugo, foi encontrada a pistola. A autoridade policial lavrou auto de apresentação e apreensão, fizendo constar que, na ama de fogo, havia seis projéteis, tendo um sido deflagrado. Hugo confessou ter adquirido a pistola de Marcelo. Os policiais estiveram na residência de Marcelo. Não o encontraram, mas presenciaram Daniel, de quinze anos de idade, filho de Marcelo, manuseando o revólver, municiado com dois projéteis Daniel disse aos policiais que encontrara a arma de fogo dentro da gaveta do banheiro. Logo em seguida, Elaine, companheira de Marcelo, chegou à residência e os policiais verificaram que ela isava um colar com um projétil de arma de fogo calibre AS pendurado ao pescoço. Com base na situação hipotética acima apresentada, na Lei n. o 10.826/2003 e no que dispõe o Código de Trânsito Brasileiro, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": {"A": "Elaine deverá responder pelo crime de porte ilegal de munição de arma de fogo.", "B": "Hugo deverá responder pelo crime de posse irregular de arma de fogo de uso permitido.", "C": "Hugo deverá responder pelo crime de porte ilegal de arma de fogo de uso permitido, pelo crime de dirigir veículo automotor, em via pública, sem a devida habilitação ou permissão para dirigir.", "D": "Marcelo deverá responder pelo crime de comércio ilegal de arma de fogo.", "E": "Marcelo deverá responder pelo crime de omissão de cautela de arma de fogo."}, "classificacao": {"id": "Q0078", "decisao": "publicar", "tema_central_id": "4697", "extras_ids": "4691", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0079", "texto": "Em relação aos sistemas processuais penais e aos seus princípios reitores, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": {"A": "A efetividade da repressão criminal do sistema acusatório\\ncabe especialmente ao órgão julgador, responsável pela\\naplicação da pena no caso concreto.", "B": "No sistema acusatório, o legislador admite que a\\nimparcialidade judicial esteja comprometida com um objetivo\\nconsiderado mais importante.", "C": "O modelo ideal de sistema acusatório é previsto em\\ninstrumento normativo internacional, a partir de critérios\\nuniformes definidos pela doutrina processual.", "D": "A crítica ao sistema inquisitivo está relacionada à sua falta de\\nrigor quanto à certeza de repressão dos fatos contrários à\\nordem social.", "E": "A decisão sobre o sistema que deverá ser implantado em\\ndeterminado país pressupõe uma definição prévia, por parte\\ndo legislador, de alguns critérios de política criminal, entre os\\nquais está o grau de eficiência da repressão."}, "classificacao": {"id": "Q0079", "decisao": "publicar", "tema_central_id": "5581", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0080", "texto": "Com relação às teorias da criminologia e à prevenção da infração penal no estado democrático de direito, julgue o item subsequente acerca dos modelos de reação ao delito. O cumprimento dos deveres legais por parte do apenado recluso constitui instrumento de reação ao delito analisado pelo modelo restaurador: o real impacto do castigo aplicado ao indivíduo no caso concreto é capaz de aferir os diagnósticos e de proporcionar adequadas soluções para prevenir a reincidência.", "comando": "Julgue o item subsequente acerca dos modelos de reação ao delito.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0080", "decisao": "publicar", "tema_central_id": "4370", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0081", "texto": "Acerca das Escolas da Criminologia, assinale (V) para a afirmativa verdadeira e (F) para a falsa. ( ) A Escola Clássica da Criminologia tem, como objeto principal de estudo, o crime como um ente jurídico. ( ) A Escola da Criminologia Positivista tinha como principais adeptos Cesare Beccaria, Enrico Ferri e Raffaele Garofalo. ( ) A Escola da Criminologia Crítica recebe influência da Teoria do Labelling Approach . As afirmativas são, respectivamente,", "comando": "Assinale (V) para a afirmativa verdadeira e (F) para a falsa.", "alternativas": {"A": "V – V – V.", "B": "V – V – F.", "C": "F – V – V.", "D": "V – F – V.", "E": "F – F – V."}, "classificacao": {"id": "Q0081", "decisao": "publicar", "tema_central_id": "4373", "extras_ids": "4388", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0082", "texto": "João e Cléber, policiais militares do estado de Santa Catarina, receberam denúncia anônima no sentido de que Tício estaria agredindo a sua companheira. Em assim sendo, os agentes públicos compareceram ao local dos fatos e constataram, in loco, a violência perpetrada contra a mulher. Nesse contexto, durante a contenção de Tício, este se opôs à execução do ato afirmando que mataria João caso não fosse solto. Passados trinta minutos, o indivíduo foi acalmado pelos policiais e encaminhado à Delegacia de Polícia.", "comando": "Nesse cenário, considerando as disposições do Código Penal, Tício responderá pelo crime de:", "alternativas": {"A": "excesso de exação, além da responsabilização pela infração\\npenal perpetrada contra a sua companheira;", "B": "desobediência, além da responsabilização pela infração penal\\nperpetrada contra a sua companheira;", "C": "tergiversação, além da responsabilização pela infração penal\\nperpetrada contra a sua companheira;", "D": "resistência, além da responsabilização pela infração penal\\nperpetrada contra a sua companheira;", "E": "concussão, além da responsabilização pela infração penal\\nperpetrada contra a sua companheira."}, "classificacao": {"id": "Q0082", "decisao": "publicar", "tema_central_id": "5100", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0083", "texto": "Osvaldo, desejando matar, disparou seu revólver contra Arnaldo, que, em razão do susto, desmaiou. Osvaldo, acreditando piamente que Arnaldo estava morto, colocou-o em uma cova rasa que já havia cavado, enterrando-o, vindo a vítima a efetivamente morrer, em face da asfixia. Assim, Osvaldo praticou:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "homicídio qualificado pela asfixia e homicídio culposo, bemcomo ocultação de cadáver.", "B": "homicídio qualificado pela asfixia e ocultação de cadáver.", "C": "homicídio simples e ocultação de cadáver.", "D": "homicídio culposo.", "E": "homicídio simples."}, "classificacao": {"id": "Q0083", "decisao": "publicar", "tema_central_id": "5222", "extras_ids": "5224;5150", "confianca": "0.916667", "motivo": "A sequência de atos ilustra dolo geral; alinhar ao nó de dolo e culpa como em Q0153, mantendo erro de tipo como conteúdo secundário."}}, {"id": "Q0084", "texto": "Sobre a assistência à mulher em situação de violência doméstica e familiar prevista na Lei Maria da Penha, analise as assertivas abaixo e assinale a alternativa correta. I. Será assegurado pelo juiz a manutenção do vínculo trabalhista por até seis meses da mulher em situação de violência doméstica e familiar quando for necessário o afastamento do local de trabalho. II. A mulher em situação de violência doméstica e familiar tem prioridade para matricular seus dependentes em instituição de educação básica mais próxima de seu domicílio mediante a apresentação dos documentos comprobatórios do registro da ocorrência policial ou do processo de violência doméstica e familiar em curso. III. É de responsabilidade exclusiva das vítimas em situação de violência doméstica e familiar ressarcir ao Sistema Único de Saúde (SUS), de acordo com a tabela SUS, os custos relativos aos serviços de saúde prestados.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Todas as assertivas estão corretas.", "B": "Todas as assertivas estão incorretas.", "C": "Apenas a assertiva I está correta.", "D": "Apenas a assertiva III está correta.", "E": "Apenas as assertivas I e II estão corretas."}, "classificacao": {"id": "Q0084", "decisao": "publicar", "tema_central_id": "4704", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0085", "texto": "No crime de concussão, a circunstância de ser um dos agentes funcionário público", "comando": "Complete a frase ou explique a importância dessa circunstância no crime de concussão.", "alternativas": {"A": "não é elementar, não se comunicando, portanto, ao concorrente particular.", "B": "é elementar, comunicando-se ao concorrente particular, ainda que este desconheça a condição daquele.", "C": "é elementar, mas não se comunica ao concorrente particular.", "D": "é elementar, comunicando-se ao concorrente particular, se este conhecia a condição daquele.", "E": "não é elementar, comunicando-se, em qualquer situação, ao concorrente particular."}, "classificacao": {"id": "Q0085", "decisao": "publicar", "tema_central_id": "5076", "extras_ids": "5091", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0086", "texto": "Um Auditor-Fiscal do Trabalho deixou de autuar uma empresa que havia cometido infração às normas de segurança no trabalho porque o dirigente dessa empresa prometeu-lhe uma semana de estadia num hotel de luxo, com direito a acompanhante e todas as despesas inclusas. Ocorre que, após o encerramento dos trabalhos de fiscalização e lavratura do termo de regularidade da empresa, o dirigente da mesma negou-se a cumprir a promessa.", "comando": "Nessa hipótese, o Auditor:", "alternativas": {"A": "cometeu o crime de enriquecimento ilícito.", "B": "cometeu o crime de corrupção passiva.", "C": "cometeu o crime de concussão.", "D": "cometeu o crime de facilitação de descaminho.", "E": "não cometeu nenhum desses crimes porque não chegou a receber a vantagem prometida."}, "classificacao": {"id": "Q0086", "decisao": "publicar", "tema_central_id": "5092", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0087", "texto": "De acordo com a jurisprudência do Superior Tribunal de Justiça, a prisão domiciliar na execução penal", "comando": "Complete a frase ou responda sobre a prisão domiciliar na execução penal conforme a jurisprudência do Superior Tribunal de Justiça.", "alternativas": {"A": "possui rol taxativo previsto no art. 117 da Lei de Execução Penal.", "B": "é cabível apenas para sentenciado que cumpre pena no regime aberto.", "C": "depende de exame criminológico favorável para condenados reincidentes.", "D": "deve utilizar o marco etário de 60 anos em razão do disposto no Estatuto do Idoso.", "E": "é cabível excepcionalmente em regime fechado para mãe cujo cuidado do filho seja imprescindível."}, "classificacao": {"id": "Q0087", "decisao": "publicar", "tema_central_id": "4703", "extras_ids": "5521", "confianca": "0.964286", "motivo": "O comando delimita execução penal definitiva; preferir a LEP ao nó de prisão domiciliar cautelar do Processo Penal."}}, {"id": "Q0088", "texto": "Enquanto a criminologia pode ser identificada como a ciência que se dedica ao estudo do crime, do criminoso e dos fatores da criminalidade, a vitimologia tem por objeto o estudo da vítima e de suas peculiaridades, sendo considerada por alguns autores como ciência autônoma.", "comando": "Explique a diferença entre criminologia e vitimologia.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0088", "decisao": "publicar", "tema_central_id": "4389", "extras_ids": "4381", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0089", "texto": "De acordo com o Glossário Jurídico do Supremo Tribunal Federal, “o princípio da insignificância tem o sentido de excluir ou de afastar a própria tipicidade penal, ou seja, não considera o ato praticado como um crime, por isso, sua aplicação resulta na absolvição do réu e não apenas na diminuição e substituição da pena ou não sua não aplicação”. Sobre o tema princípio da insignificância, assinale a resposta correta.", "comando": "Assinale a resposta correta sobre o princípio da insignificância.", "alternativas": {"A": "Buscando sua origem, de acordo com certa vertente doutrinária, no Direito Romano, o princípio da insignificância vem sendo objeto de recorrentes decisões do STF, nas quais são estabelecidos dois parâmetros para sua determinação: reduzidíssimo grau de reprovabi l idade do compor tamento e inexpressividade da lesão jurídica provocada.", "B": "O princípio da insignificância, decorrência do caráter fragmentário do Direito Penal, tem base em uma orientação utilitarista, tem origem controversa, encontrando, na atual jurisprudência do STF, os seguintes requisitos de configuração: a mínima ofensividade da conduta do agente; nenhuma periculosidade social da ação; o reduzidíssimo grau de reprovabilidade do comportamento; e a inexpressividade da lesão jurídica provocada.", "C": "Sua atual elaboração deita raízes na doutrina de Claus Roxin e, no Direito Penal brasileiro, consoante jurisprudência atual do STF, se limita à avaliação da inexpressividade da lesão jurídica provocada, ou seja, observa-se se a ofensa ao bem jurídico tutelado é relevante ou banal.", "D": "Surgindo como uma consequência lógica do princípio da individualização das penas, a insignificância penal não aceita a periculosidade social da ação como parâmetro, de acordo com o posicionamento atual do STF, em razão da elevada abstração desse conceito, mas apresenta como requisi tos: a mínima ofensividade da conduta do agente; o reduzidíssimo grau de reprovabilidade do comportamento; e a inexpressividade da lesão jurídica provocada.", "E": "Inserida no princípio da intervenção mínima, embora já mencionada anteriormente por Welzel como uma faceta do princípio da adequação social, a insignificância determina a inexistência do crime quando a conduta praticada apresentar a simultânea presença dos seguintes requisitos, exigidos pela atual jurisprudência do STF: a mínima ofensividade da conduta do agente; nenhuma periculosidade social da ação; o reduzidíssimo grau de reprovabilidade do comportamento; a inexpressividade da lesão jurídica provocada; e a inexistência de um especial fim de agir."}, "classificacao": {"id": "Q0089", "decisao": "publicar", "tema_central_id": "5172", "extras_ids": "5227", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0090", "texto": "Assinale a alternativa CORRETA.", "comando": "", "alternativas": {"A": "Em havendo reunião de processos perante o juízo comum ou o tribunal do júri, decorrentes da aplicação das regras de conexão e continência, não serão observados os institutos da transação penal e da composição dos danos civis, em relação aos crimes de menor potencial ofensivo.", "B": "Em razão de a Lei n° 9.099/95 admitir a aplicação subsidiária das disposições do Código de Processo Penal, o juiz determinará a suspensão do processo e do curso do prazo prescricional sempre que, nos crimes submetidos ao procedimento traçado por aquela lei, o acusado, citado por edital, não comparecer e nem constituir advogado.", "C": "No direito processual penal brasileiro, a réplica à resposta à acusação não se constitui em uma regra prevista expressamente para todas as modalidades de procedimentos existentes, podendo ser encontrada no procedimento aplicável aos processos de competência do Tribunal do Júri e no procedimento para os processos perante o Superior Tribunal de Justiça e o Supremo Tribunal Federal.", "D": "De acordo com o Código de Processo Penal, nos processos submetidos ao rito comum ordinário, a denúncia ou queixa serão rejeitadas quando forem manifestamente ineptas, quando faltar pressuposto processual ou condição da ação para o exercício da ação penal, quando faltar justa causa para o oferecimento da ação penal e quando o fato narrado evidentemente não constitui crime.", "E": "Tendo o funcionário público cometido o crime de racismo no exercício de sua função, e estando a denúncia ou queixa em devida ordem, o juiz mandará autuá-la e ordenará a notificação do acusado, para responder por escrito, dentro do prazo de quinze dias."}, "classificacao": {"id": "Q0090", "decisao": "revisar", "tema_central_id": "5465", "extras_ids": "4701;5526;5531", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0091", "texto": "Em cada item que se segue, é apresentada uma situação hipotética seguida de uma assertiva a ser julgada com base na legislação de regência e na jurisprudência dos tribunais superiores a respeito de aplicação de pena, cominação de penas, regime de penas, medidas de segurança e livramento condicional. Flávio, maior e capaz, condenado a pena de doze anos pela prática de homicídio doloso qualificado, iniciou o cumprimento da pena em regime fechado. Durante a execução da pena, ele apresentou comportamento excelente e colaborativo, por isso, após o período mínimo para a progressão de regime, seu advogado requereu ao juiz a passagem de Flávio para o regime aberto. Nessa situação, o pedido não poderá ser atendido: a progressão do regime prisional de Flávio deverá ser para o regime semiaberto.", "comando": "Julgue a assertiva apresentada na situação hipotética.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0091", "decisao": "publicar", "tema_central_id": "5201", "extras_ids": "4703", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0092", "texto": "A incompetência do juízo anula _________, devendo o processo, quando for declarada a nulidade, ser remetido ao juiz competente; a nulidade por ilegitimidade do representante da parte poderá ser _________, mediante ratificação dos atos processuais. Nos termos dos artigos 567 e 568 do CPP, assinale a alternativa que completa, correta e respectivamente, as lacunas do texto.", "comando": "", "alternativas": {"A": "todos os atos praticados ... sanada até a denúncia", "B": "todos os atos praticados ... a todo tempo sanada", "C": "todos os atos praticados ... sanada somente até o trânsito em julgado", "D": "o curso do prazo prescricional ... sanada somente até o trânsito em julgado", "E": "somente os atos decisórios ... a todo tempo sanada"}, "classificacao": {"id": "Q0092", "decisao": "publicar", "tema_central_id": "5511", "extras_ids": "5493", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0093", "texto": "JOÃO e JOSÉ estão na praia e resolveram entrar no mar. Em determinado momento eles começam a se afogar. Havia naquele local um salva-vidas que, ao avistar apenas JOÃO, notou que ele era seu desafeto e se recusou a salvá-lo; próximo a eles havia também um surfista, este avistou apenas JOSÉ pedindo socorro, mas, por ser seu inimigo, não atendeu aos pedidos dele, resolvendo sair do local. As duas pessoas acabam se afogando e morrendo.", "comando": "Em relação ao caso, qual das alternativas abaixo está CORRETA?", "alternativas": {"A": "O salva-vidas responde por homicídio\\ndoloso por omissão.", "B": "O salva-vidas responde por omissão de\\nsocorro.", "C": "O surfista responde por homicídio doloso\\npor omissão.", "D": "A conduta do surfista é atípica.", "E": "O surfista responde por homicídio culposo."}, "classificacao": {"id": "Q0093", "decisao": "publicar", "tema_central_id": "5223", "extras_ids": "5142;5150", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0094", "texto": "Recentemente, o Superior Tribunal de Justiça decidiu que: “A utilização de roupas sociais pelo réu durante seu julgamento pelo Tribunal do Júri é um direito e não traria qualquer insegurança ou perigo, tendo em vista a existência de ostensivo policiamento nos Fóruns do Estado”. A utilização de roupas do presídio por um acusado no Tribunal do Júri está associada a qual tema da Criminologia?", "comando": "A utilização de roupas do presídio por um acusado no Tribunal do Júri está associada a qual tema da Criminologia?", "alternativas": {"A": "Escola Clássica da Criminologia e princípios do iluminismo.", "B": "Escola Positiva de Criminologia e anomia.", "C": "Neoliberalismo e política da lei e ordem.", "D": "Vitimologia e marxismo.", "E": "Labelling approach ou etiquetamento social e Criminologia crítica."}, "classificacao": {"id": "Q0094", "decisao": "publicar", "tema_central_id": "4387", "extras_ids": "4378", "confianca": "0.964286", "motivo": "Etiquetamento social é abordagem sociológica; generalização do critério corrigido em Q0024 e Q0031."}}, {"id": "Q0095", "texto": "Júpiter está arrumando a ligação elétrica de sua casa, com ajuda de Jano, seu amigo, que lhe segura a escada. Deixando de observar um dever objetivo de cuidado, Júpiter faz uma ligação equivocada e recebe uma alta descarga de energia, sofrendo inutilização permanente de membro. No mesmo incidente, Jano sofre uma lesão corporal leve. Em outro cenário, Saturno, pai dedicado e amoroso, está dando banho em seu filho, Nemestrino. Imprudentemente, Saturno deixa Nemestrino cair no chão, o que causa a morte imediata do bebê.", "comando": "No que concerne à lesão corporal sofrida por Jano e ao homicídio praticado por Saturno, o perdão judicial, ao menos em tese:", "alternativas": {"A": "aplica-se ao primeiro caso e depende de concordância da mãe de Nemestrino para aplicação ao segundo.", "B": "aplica-se ao segundo caso, mas não ao primeiro.", "C": "não se aplica a nenhum dos casos.", "D": "aplica-se a ambos os casos.", "E": "aplica-se ao primeiro caso, mas não ao segundo."}, "classificacao": {"id": "Q0095", "decisao": "publicar", "tema_central_id": "5197", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0096", "texto": "Ocorre a derrogação da competência territorial:", "comando": "Complete a frase sobre a derrogação da competência territorial.", "alternativas": {"A": "nos casos de conexão.", "B": "nos casos de continência.", "C": "na hipótese de prevenção.", "D": "quando o crime é praticado fora do território nacional, em embarcações e aeronaves.", "E": "na hipótese de desaforamento."}, "classificacao": {"id": "Q0096", "decisao": "publicar", "tema_central_id": "5486", "extras_ids": "5528", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0097", "texto": "Inquérito policial revelou que um grupo de 16 pessoas, além de outras não identificadas, dedicava-se ao comércio ilícito de drogas e praticava extorsões contra comerciantes visando ao recolhimento de uma “taxa de segurança”. A investigação, que durou nove meses, contou com as medidas cautelares de interceptação telefônica e quebra do sigilo telemático, nas quais ficou claro que o grupo contava com uma liderança definida e que os demais integrantes se dedicavam à negociação para a aquisição das drogas e produtos químicos usados na mistura e preparo delas, ao abastecimento das “bocas de fumo” e ao recolhimento do dinheiro proveniente do comércio ilícito e das extorsões praticadas contra comerciantes. A investigação mostrou também que, com o dinheiro oriundo da atividade criminosa, o líder do grupo adquiriu cavalos e os mantinha em um haras registrado em seu nome. Ao longo da investigação, não houve apreensão de material entorpecente. O Ministério Público ofereceu denúncia contra os 16 investigados identificados e imputou os crimes de tráfico de drogas, associação para o tráfico de drogas, extorsão e organização criminosa. Imputou também ao líder do grupo o crime de lavagem de dinheiro (Art. 1º da Lei nº 9.613/1998). Ao longo da instrução probatória, os fatos foram confirmados e o Ministério Público requereu a condenação na forma da denúncia. As defesas manifestaram-se e o processo foi à conclusão para sentença. À luz da jurisprudência do Superior Tribunal de Justiça, o magistrado deve considerar que:", "comando": "À luz da jurisprudência do Superior Tribunal de Justiça, o magistrado deve considerar que:", "alternativas": {"A": "a sentença deve acolher integralmente a pretensão\\ncondenatória do Ministério Público;", "B": "a ausência de apreensão de material entorpecente é\\nobstáculo à condenação pelos crimes de tráfico de drogas e\\nde associação para o tráfico de drogas;", "C": "a sentença pode condenar os réus pela prática do crime de\\ntráfico de drogas, a despeito da ausência de apreensão de\\nmaterial entorpecente, desde que outros elementos dos\\nautos revelem a prática de uma das condutas previstas no\\ntipo penal;", "D": "é cabível a condenação do líder do grupo criminoso pelo\\ncrime de lavagem de dinheiro, porque, na hipótese, a\\ndestinação dada ao produto do crime configura ocultação ou\\ndissimulação da natureza, origem, localização, disposição,\\nmovimentação ou propriedade de bens, direitos ou valores\\nprovenientes, direta ou indiretamente, de crime;", "E": "a condenação, em concurso material, pelos crimes de\\nassociação para o tráfico de drogas e organização criminosa\\nnão representa bis in idem, desde que demonstrado que o\\ngrupo criminoso, estruturalmente ordenado e caracterizado\\npela divisão de tarefas, dedicava-se à prática de outros\\ncrimes, além do tráfico de drogas."}, "classificacao": {"id": "Q0097", "decisao": "revisar", "tema_central_id": "4683", "extras_ids": "4708;4705;4702", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0098", "texto": "A doutrina denomina “confissão qualificada” aquela em que o acusado", "comando": "Complete a definição de \"confissão qualificada\" conforme a doutrina.", "alternativas": {"A": "admite a prática criminosa, mas alega, em sua defesa, alguma causa que o beneficia, como uma excludente de ilicitude.", "B": "não só confessa os fatos cometidos por si, mas também aponta os demais coautores ou partícipes da\\nempreitada criminosa.", "C": "fica em silêncio; contudo, tal modalidade não fora\\nrecepcionada pela Constituição de 1988, que garante\\nnenhum prejuízo ao acusado nesses casos.", "D": "colabora ativamente com a apuração do crime, inclusive interrompendo ou impedindo que os fatos se\\nconsumem.", "E": "se retrata da negativa dos fatos ocorrida perante a\\nautoridade policial e admite-os espontaneamente\\nperante o magistrado."}, "classificacao": {"id": "Q0098", "decisao": "publicar", "tema_central_id": "5548", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0099", "texto": "Filomena, camelô Irregular, é flagrada por dois agentes da fiscalização municipal, ocasião em que estes anunciam que irão lavrar um auto de infração e apreender sua mercadoria, levando-a ao depósito público, de onde poderá vir a ser retirada posteriormente, mediante pagamentos devidos, tudo conforme o previsto na legislação. Inconformada com o fato, Filomena passa a agredir fisicamente os fiscais, no intuito de impedir que levem sua mercadoria, porém
