o por mera presença de extras."}}, {"id": "Q0348", "texto": "João foi acusado de corrupção ativa em transação internacional porque deu, em outro país, vantagem indevida a funcionário público estrangeiro para a prática de ato de ofício relacionado a transação comercial internacional.", "comando": "Sobre a hipótese, assinale a afirmativa incorreta.", "alternativas": {"A": "João praticou crime de corrupção ativa em transação internacional, porque o delito, ao contrário do que ocorre na corrupção prevista no Art. 333 do CP, abrange a conduta de dar ou pagar a vantagem indevida, não se limitando ao mero oferecimento ou à mera promessa do benefício.", "B": "A caracterização da corrupção ativa internacional não prescinde da descrição de um ato de ofício, porque tal elemento está previsto expressamente no tipo penal que descreve o crime específico.", "C": "É possível a aplicação da lei penal nacional ao caso, mesmo que o crime tenha sido praticado fora do território nacional, desde que cumpridos os requisitos do Art. 7º, §2º, do CP.", "D": "A pena será aumentada da terça parte se João ocupa cargo em comissão ou de função de direção ou assessoramento de órgão da administração direta, sociedade de economia mista, empresa pública ou fundação instituída pelo poder público do país estrangeiro.", "E": "A prescrição da pretensão punitiva começa a correr na data da entrega da vantagem, ainda que seja constatada a oferta ou a promessa do mesmo benefício em momento anterior."}, "classificacao": {"id": "Q0348", "decisao": "publicar", "tema_central_id": "5093", "extras_ids": "5182;5187", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0349", "texto": "Em cada item a seguir, é apresentada uma situação hipotética, seguida de uma assertiva a ser julgada com base na legislação de regência e na jurisprudência dos tribunais superiores a respeito de execução penal, lei penal no tempo, concurso de crimes, crime impossível e arrependimento posterior. Cristiano, maior e capaz, roubou, mediante emprego de arma de fogo, a bicicleta de um adolescente, tendo-o ameaçado gravemente. Perseguido, Cristiano foi preso, confessou o crime e voluntariamente restituiu a coisa roubada. Nessa situação, a restituição do bem não assegura a Cristiano a redução de um a dois terços da pena, pois o crime foi cometido com grave ameaça à pessoa.", "comando": "Julgue a assertiva apresentada com base na legislação e jurisprudência mencionadas.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0349", "decisao": "publicar", "tema_central_id": "5178", "extras_ids": "5160", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0350", "texto": "Assinale a opção correta acerca dos crimes de lavagem ou ocultação de bens, direitos e valores.", "comando": "", "alternativas": {"A": "Em razão do fenômeno da consunção, não é possível a\\nautolavagem, isto é, a imputação simultânea, ao mesmo réu,\\nda infração antecedente e do crime de lavagem.", "B": "Por constituir crime unissubsistente, a tentativa é impunível.", "C": "Em caso de colaboração espontânea do agente com as\\nautoridades, mediante esclarecimentos relevantes para a\\napuração da materialidade ou da autoria/participação no\\ncrime nos termos da lei, a pena poderá ser reduzida de um a\\ndois terços e ser cumprida em regime aberto ou semiaberto,\\nfacultadas ainda ao órgão julgador a concessão do perdão\\njudicial ou a substituição da pena, a qualquer tempo, por pena\\nrestritiva de direitos.", "D": "Desde a entrada em vigor da Lei n.º 9.613/1998, a legislação\\npenal brasileira pode ser classificada como legislação de\\nterceira geração, ao considerar que qualquer infração penal\\npode figurar como delito antecedente da lavagem de capitais."}, "classificacao": {"id": "Q0350", "decisao": "publicar", "tema_central_id": "4702", "extras_ids": "5557", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0351", "texto": "Falsificar cartão de crédito é", "comando": "Complete a frase sobre a falsificação de cartão de crédito.", "alternativas": {"A": "conduta atípica.", "B": "falsificação de documento público.", "C": "falsidade ideológica.", "D": "falsa identidade.", "E": "falsificação de documento particular."}, "classificacao": {"id": "Q0351", "decisao": "publicar", "tema_central_id": "5118", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0352", "texto": "De acordo com a legislação vigente acerca de recursos em geral no processo penal, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": {"A": "Decisão proferida em sede de recurso interposto por um dos\\nréus em concurso de agentes que reconheça a atipicidade do\\nfato a eles atribuído aproveitará ao outro réu por força do\\nefeito extensivo.", "B": "É viável que, no curso da tramitação, o Ministério Público\\ndesista de recurso que tenha interposto, desde que o assistente\\nde acusação também desista do ato processual.", "C": "É viável a interposição de recurso por um réu que pleiteie a\\ncondenação de outro que tenha sido absolvido.", "D": "O recurso deverá ser feito por meio de petição escrita caso o\\nréu não saiba assinar o nome, não sendo viável que o recurso\\nseja apresentado por termo nos autos.", "E": "O princípio da fungibilidade deverá ser aplicado a todos os\\nrecursos que forem apresentados de forma indevida."}, "classificacao": {"id": "Q0352", "decisao": "publicar", "tema_central_id": "5512", "extras_ids": "5515;5513;5514", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0353", "texto": "Se, no curso da ação penal, o magistrado notar que a prescrição está prestes a ocorrer, poderá:", "comando": "Complete as possibilidades do magistrado ao notar que a prescrição está prestes a ocorrer no curso da ação penal.", "alternativas": {"A": "Sentenciar, independentemente da\\napresentação dos memoriais defensivos;", "B": "Concentrar a oitiva das testemunhas de\\nacusação e defesa em um único ato;", "C": "Determinar à defesa que apresente\\ndeclarações escritas, no lugar de ouvir as\\ntestemunhas arroladas;", "D": "Declarar, desde logo, a extinção da\\npunibilidade, pela prescrição em\\nperspectiva."}, "classificacao": {"id": "Q0353", "decisao": "revisar", "tema_central_id": "5535", "extras_ids": "5582;5188", "confianca": "0.5", "motivo": "Revisar: abaixo do corte; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0354", "texto": "Assinale a alternativa INCORRETA.", "comando": "", "alternativas": {"A": "Para a teoria da conditio sine qua non , se a vítima morre quando poderia ter sido salva, caso levada,\\nlogo após o fato, a atendimento médico, responde o agente da ação com animus necandi por homicídio\\nconsumado. Mas, se levada a socorro em hospital, morresse por efeito de substância tóxica ministrada\\npor engano pela enfermeira, o agente responderia por tentativa de homicídio e não por homicídio\\nconsumado.", "B": "Para a teoria da imputação objetiva, o ato de imputar significa atribuir a alguém a realização de uma\\nconduta criadora de um risco relevante e juridicamente proibido e a produção de um resultado jurídico.\\nPressupõe um perigo criado pelo agente e não coberto por um risco permitido dentro do alcance do\\ntipo. O risco permitido conduz à atipicidade, e o risco proibido, quando relevante, à tipicidade. A\\nimputação objetiva constitui elemento normativo implícito do tipo penal.", "C": "Os princípios da adequação social e da insignificância, sugeridos pela doutrina, servem de instrumentos\\nde interpretação restritiva do tipo penal, que afetam a tipicidade formal do fato.", "D": "Para a teoria do domínio do fato, autor é quem executa a ação típica, por conduta própria ou pela\\nutilização de outro como instrumento de realização; também quem, mesmo não executando o fato\\ntípico em sentido estrito, participa da resolução criminosa, realizando parte necessária da execução do\\nplano global. A teoria, partindo do conceito restritivo de autor, segue um critério objetivo-subjetivo.", "E": "Para a teoria finalista, ação é a conduta do homem, comissiva ou omissiva, dirigida a uma finalidade e\\ndesenvolvida sob o domínio da vontade do agente, razão pela qual não reputa criminosa a ação\\nocorrida em estado de inconsciência, como no caso de quem, durante o sono, sonhando estar em\\nlegítima defesa, esbofeteia e causa lesão corporal na pessoa que dorme ao seu lado. Para esta mesma\\nteoria, a culpabilidade não é psicológica, nem psicológico-normativa."}, "classificacao": {"id": "Q0354", "decisao": "revisar", "tema_central_id": "5218", "extras_ids": "5226;5227;5072;5221", "confianca": "0.5", "motivo": "Revisar: mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0355", "texto": "À luz da recente decisão do Supremo Tribunal Federal com repercussão geral a respeito do Art. 28 da Lei nº 11.343/2006, é correto afirmar que:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "são atípicas as condutas de adquirir, guardar, ter em\\ndepósito, transportar ou trazer consigo, para consumo\\npessoal, 1g da substância entorpecente cocaína, distribuído\\nem duas cápsulas plásticas;", "B": "a transação penal firmada, em dezembro de 2023, pela\\nprática do crime de trazer consigo maconha, para consumo\\npessoal, configura obstáculo ao oferecimento de acordo de\\nnão persecução penal, caso praticado o crime de furto\\nsimples, em janeiro de 2025;", "C": "pratica crime de abuso de autoridade o delegado de polícia\\nque lavrar auto de prisão em flagrante contra o cidadão\\nsurpreendido com um tablete de 10g de maconha\\nacondicionados em um sacolé, uma balança de precisão e\\num caderno com anotações relativas a datas, valores e\\nnomes;", "D": "as condutas de adquirir, guardar, ter em depósito,\\ntransportar ou trazer consigo até 40g de maconha ou seis\\nplantas fêmeas, para consumo próprio, são indiferentes para\\no ordenamento jurídico;", "E": "não se admite a imposição de prestação de serviços à\\ncomunidade em virtude da prática das condutas de adquirir,\\nguardar, ter em depósito, transportar ou trazer consigo até\\n40g de maconha ou seis plantas fêmeas, para consumo\\npróprio."}, "classificacao": {"id": "Q0355", "decisao": "publicar", "tema_central_id": "4708", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0356", "texto": "O concurso de crimes é o instituto que se verifica quando o agente, mediante uma ou várias condutas, pratica duas ou mais infrações penais. Com base nesse assunto, informe se é verdadeiro (V) ou falso (F) o que se afirma a seguir e assinale a alternativa com a sequência correta. ( ) O concurso material, também chamado de real, é aquele em que o agente, mediante uma única conduta, pratica dois ou mais crimes, idênticos ou não. ( ) No concurso material, há pluralidade de condutas e pluralidade de resultados. ( ) No que diz respeito ao concurso formal impróprio ou imperfeito, tal como no concurso material, serão somadas as penas de todos os crimes praticados pelo agente. ( ) De acordo com o Código Penal brasileiro, no concurso de crimes, as penas de multa são aplicadas distinta e integralmente para cada crime.", "comando": "", "alternativas": {"A": "V – F – V – F.", "B": "F – V – F – V.", "C": "V – V – F – V.", "D": "F – V – V – V", "E": "F – F – V – F."}, "classificacao": {"id": "Q0356", "decisao": "publicar", "tema_central_id": "5066", "extras_ids": "5067;5068;5070", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0357", "texto": "Configura o crime de boicotagem violenta", "comando": "Defina o que configura o crime de boicotagem violenta.", "alternativas": {"A": "constranger alguém, mediante violência ou grave ameaça, a não fornecer a outrem ou não adquirir de outrem matéria-prima ou produto industrial ou agrícola.", "B": "participar de suspensão ou abandono coletivo de trabalho, praticando violência contra pessoa ou contra coisa.", "C": "constranger alguém, mediante violência ou grave ameaça, a abrir ou fechar o seu estabelecimento, ou a participar de parede ou paralisação de atividade econômica.", "D": "participar de suspensão ou abandono coletivo de trabalho, provocando a interrupção de obra pública ou serviço de interesse coletivo.", "E": "danificar estabelecimento industrial, comercial ou agrícola com o intuito de impedir ou embaraçar o curso normal do trabalho."}, "classificacao": {"id": "Q0357", "decisao": "publicar", "tema_central_id": "5135", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0358", "texto": "Julgue o próximo item, considerando a Lei de Acesso à Informação, o Marco Civil da Internet e os demais instrumentos normativos que regulam a publicidade e a segurança de redes de comunicação no Brasil. É tipificada como crime, de acordo com a Lei de delitos informáticos, a invasão de dispositivo informático alheio mediante violação de mecanismo de segurança, previstos agravantes para casos de obtenção de dados sigilosos e divulgação ou comercialização desses dados.", "comando": "", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0358", "decisao": "publicar", "tema_central_id": "5133", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0359", "texto": "Aos crimes cometidos contra idosos, cuja pena máxima privativa de liberdade não ultrapasse quatro anos, aplica-se o procedimento previsto na Lei nº 9.099/1995, e, subsidiariamente, no que couber, as disposições do Código Penal e do Código de Processo Penal. O STF, contudo, vedou, nesses casos, a possibilidade de que fossem aplicadas quaisquer das medidas despenalizadoras previstas na Lei nº 9.099/1995.", "comando": "Sobre o caso acima, assinale a afirmativa correta.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0359", "decisao": "publicar", "tema_central_id": "4696", "extras_ids": "4701", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}]}</script><script>
const d=JSON.parse(document.getElementById('dados').textContent), temas=new Map(d.temas.map(t=>[t.tema_id,t]));let no='';
function desc(id,other){while(other){if(id===other)return true;other=temas.get(other)?.parent_id||''}return false}
function e(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
function quantidade(id){return d.questoes.filter(q=>desc(id,q.classificacao.tema_central_id)).length}
function tree(t){const det=e('details'),sum=e('summary',t.tema_id+' · '+t.titulo+' ('+quantidade(t.tema_id)+')');det.append(sum);const btn=e('button','Ver questões deste ramo');btn.onclick=()=>{no=t.tema_id;render()};det.append(btn);for(const f of d.temas.filter(f=>f.parent_id===t.tema_id))det.append(tree(f));return det}
for(const t of d.temas.filter(t=>!t.parent_id))document.getElementById('arvore').append(tree(t));
const counts={};for(const q of d.questoes)counts[q.classificacao.decisao]=(counts[q.classificacao.decisao]||0)+1;
document.getElementById('numeros').textContent=d.questoes.length+' questões · '+d.temas.length+' temas ativos · '+Object.entries(counts).map(([k,v])=>v+' '+k).join(' · ');
function render(){const search=document.getElementById('busca').value.toLocaleLowerCase('pt-BR'),status=document.getElementById('status').value;
const items=d.questoes.filter(q=>{const c=q.classificacao,t=temas.get(c.tema_central_id);return (!no||(no==='fora'?!c.tema_central_id:desc(no,c.tema_central_id)))&&(!status||c.decisao===status)&&JSON.stringify([q.id,q.texto,q.comando,q.alternativas,t?.caminho,c.motivo]).toLocaleLowerCase('pt-BR').includes(search)});
document.getElementById('titulo').textContent=(no==='fora'?'Fora da árvore':temas.get(no)?.caminho||'Todas as questões')+' · '+items.length;
const lista=document.getElementById('lista');lista.replaceChildren();for(const q of items){const c=q.classificacao,el=e('section',undefined,'item');el.append(e('strong',q.id+' '),e('span',c.decisao,'badge '+c.decisao),e('p',temas.get(c.tema_central_id)?.caminho||'Sem tema aplicável'),e('small','Confiança estimada: '+c.confianca+' · extras: '+(c.extras_ids||'nenhum')),e('p',q.texto));if(q.comando)el.append(e('p','Comando: '+q.comando));const alt=e('details');alt.append(e('summary','Alternativas e motivo'));for(const [k,v] of Object.entries(q.alternativas))alt.append(e('p',k+': '+v));alt.append(e('p','Motivo: '+c.motivo));el.append(alt);lista.append(el)}}
document.getElementById('todas').onclick=()=>{no='';render()};document.getElementById('fora').onclick=()=>{no='fora';render()};document.getElementById('busca').oninput=render;document.getElementById('status').onchange=render;render();
</script></html>
