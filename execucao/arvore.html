tivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0223", "texto": "O ingresso de chip de aparelho celular em estabelecimento prisional configura", "comando": "", "alternativas": {"A": "desobediência.", "B": "favorecimento real.", "C": "introdução de aparelho de comunicação, sem autorização\\nlegal, em estabelecimento prisional.", "D": "favorecimento pessoal.", "E": "conduta atípica."}, "classificacao": {"id": "Q0223", "decisao": "publicar", "tema_central_id": "5086", "extras_ids": "4703", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0224", "texto": "Em ação penal na qual se imputa ao réu a prática do crime de roubo, na modalidade tentada, constam de sua Folha de Antecedentes Criminais as seguintes anotações, devidamente esclarecidas por certidões cartorárias: 1. condenação transitada em julgado, por crime de ameaça, à pena de multa, cumprida 3 anos e 8 meses antes da prática do crime objeto do processo 2. condenação transitada em julgado, por contravenção penal de exercício ilegal de profissão ou atividade, à pena de prestação pecuniária, cumprida 2 anos e 9 meses antes da prática do crime objeto do processo.", "comando": "À vista das citadas anotações, é correto afirmar que:", "alternativas": {"A": "ambas as anotações geram reincidência, sendo possível a\\nconcessão de suspensão condicional da pena privativa de\\nliberdade aplicada, caso esta não supere os 2 anos e sejam\\nfavoráveis ao réu as circunstâncias judiciais;", "B": "ambas as anotações geram reincidência, não sendo possível a\\nconcessão de suspensão condicional da pena privativa de\\nliberdade aplicada, mesmo que esta não supere os 2 anos e\\nsejam favoráveis ao réu as circunstâncias judiciais;", "C": "somente a anotação número 1 gera reincidência, sendo\\npossível a concessão de suspensão condicional da pena\\nprivativa de liberdade aplicada, caso esta não supere os\\n2 anos e sejam favoráveis ao réu as circunstâncias judiciais;", "D": "somente a anotação número 1 gera reincidência, não sendo\\npossível a concessão de suspensão condicional da pena\\nprivativa de liberdade aplicada, mesmo que esta não supere\\nos 2 anos e sejam favoráveis ao réu as circunstâncias judiciais;", "E": "nenhuma das anotações gera reincidência, sendo possível a\\nconcessão de suspensão condicional da pena privativa de\\nliberdade aplicada, caso esta não supere os 2 anos e sejam\\nfavoráveis ao réu as circunstâncias judiciais."}, "classificacao": {"id": "Q0224", "decisao": "publicar", "tema_central_id": "5203", "extras_ids": "5207", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0225", "texto": "A partir das disposições legais e da jurisprudência dos tribunais superiores acerca de temas relacionados à execução penal, julgue o item a seguir. Pedro foi denunciado pela prática de latrocínio e, embora tenha alegado em seu interrogatório que estava a negócios em outra cidade no dia e na hora do fato descrito na denúncia, ele foi condenado. A defesa interpôs recurso de apelação ao tribunal de justiça, com fundamento na insuficiência probatória, porém a corte estadual manteve na íntegra a condenação. O STJ, sem fazer qualquer incursão no mérito, não conheceu do recurso especial defensivo, com fundamento no enunciado da sua Súmula n.º 7. Após o trânsito em julgado da condenação, a defesa produziu, em juízo, prova nova que comprovava cabalmente o álibi de Pedro. Nessa situação, é do STJ a competência para processamento e julgamento da ação de revisão criminal com vistas à absolvição de Pedro, pois, de acordo com a Constituição Federal de 1988, cabem àquela corte as revisões criminais de seus próprios julgados.", "comando": "Julgue o item a seguir.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0225", "decisao": "publicar", "tema_central_id": "5478", "extras_ids": "5485", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0226", "texto": "A lei nº 13.964/19, popularmente conhecida como Pacote Anticrime, introduziu no Código de Processo Penal disciplina acerca do procedimento da cadeia de custódia. De acordo com o que dispõe o código, assinale a alternativa INCORRETA.", "comando": "Assinale a alternativa INCORRETA.", "alternativas": {"A": "A etapa de reconhecimento consiste no ato\\nde distinguir um elemento como de\\npotencial interesse para a produção da\\nprova pericial.", "B": "O armazenamento é o procedimento\\nreferente à guarda, em condições\\nadequadas, do material a ser processado,\\nguardado para realização de contraperícia,\\ndescartado ou transportado, com vinculação\\nao número do laudo correspondente.", "C": "O recebimento é ato formal de transferência\\nda posse do vestígio, que deve ser documentado com, no mínimo, informações\\nreferentes ao número de procedimento e\\nunidade de polícia judiciária relacionada,\\nlocal de origem, nome de quem transportou\\no vestígio, código de rastreamento,\\nnatureza do exame, tipo do vestígio,\\nprotocolo, assinatura e identificação de\\nquem o recebeu.", "D": "A coleta dos vestígios deverá ser realizada\\nexclusivamente por perito oficial, que dará o\\nencaminhamento necessário para a central\\nde custódia, salvo quando for necessária a\\nrealização de exames complementares.", "E": "O transporte consiste no ato de transferir o\\nvestígio de um local para o outro, utilizando\\nas condições adequadas (embalagens,\\nveículos, temperatura, entre outras), de\\nmodo a garantir a manutenção de suas\\ncaracterísticas originais, bem como o\\ncontrole de sua posse."}, "classificacao": {"id": "Q0226", "decisao": "publicar", "tema_central_id": "5544", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0227", "texto": "Analise as seguintes situações hipotéticas, e assinale a alternativa correta.", "comando": "", "alternativas": {"A": "Viriato amordaça Gezilda, para que ela não grite por socorro. Em seguida, pratica conjunção carnal\\ncom ela, sem perceber que a vítima está se engasgando devido à mordaça utilizada por ele. Gezilda,\\nque é maior de idade e capaz, morre sufocada. Viriato deverá responder por estupro e homicídio\\nculposo, em concurso material.", "B": "Zezão aborda a vítima Vitinha, maior de idade e capaz, em via pública, arrasta-a para um terreno\\nabandonado. Ao perceber que será estuprada, Vitinha entra em luta corporal com Zezão e acaba\\nsendo morta, porque Zezão efetuou um disparo, empregando uma arma de fogo que levava\\nconsigo. Em seguida, Zezão realiza atos sexuais com Vitinha. Nessa hipótese, Zezão responderá\\ntão somente pelos crimes de estupro e homicídio qualificado, em concurso material.", "C": "Beraldo aborda a vítima Zequinha, 11 anos de idade, em via pública, levando-o para um edifício\\nem construção, oferecendo a ele dinheiro e doces, para que fizesse sexo oral em Beraldo. Após o\\nato, com medo de ser identificado, Beraldo mata Zequinha com uma pedrada na cabeça. Beraldo\\ndeverá responder pelo crime de estupro de vulnerável, qualificado pela morte de Zequinha.", "D": "Tiburcio, imputável, tio de Adalgisa, 09 anos de idade, em uma ocasião em que foi visitar a irmã,\\nmãe da menor, aproveitou-se de um momento em que esteve sozinho com Adalgisa, tirou a roupa\\nda menina, pedindo que fizesse poses sensuais, fotografando-a em tal condição. No mesmo dia,\\nporém, mais tarde, oferecendo a ela doces, fez com que praticasse sexo oral nele. Tibúrcio\\nresponderá pela prática de estupro de vulnerável, em concurso material com o crime previsto no\\nartigo 240 do Estatuto da Criança e do Adolescente, ambos os delitos em suas formas majoradas\\npela condição de ser tio da menor.", "E": "Tyrapele, cirurgião plástico, anestesiou a paciente Suzi, 25 anos e, em seguida, praticou ato\\nlibidinoso diverso da conjunção carnal com ela, aproveitando-se de que Suzi estava inconsciente e\\nsem condições de oferecer resistência. Nesse caso, praticou o crime denominado violação sexual\\nmediante fraude."}, "classificacao": {"id": "Q0227", "decisao": "publicar", "tema_central_id": "5103", "extras_ids": "4709;5104", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0228", "texto": "Se o defensor de um condenado preso entender que ele faz jus ao livramento condicional, deverá:", "comando": "Indique o procedimento que o defensor deve seguir nesse caso.", "alternativas": {"A": "Solicitar ao Tribunal, mediante a\\nimpetração de habeas corpus;", "B": "Solicitar ao Tribunal, mediante a\\npropositura de Revisão Criminal;", "C": "Solicitar ao Juiz da Execução, mediante\\nAgravo em Execução;", "D": "Solicitar ao Juiz da Execução, mediante\\npetição."}, "classificacao": {"id": "Q0228", "decisao": "publicar", "tema_central_id": "5208", "extras_ids": "4703", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0229", "texto": "Assinale a opção incorreta acerca da prisão no processo penal.", "comando": "", "alternativas": {"A": "A recaptura do réu evadido não depende de prévia ordem judicial e poderá ser efetuada por qualquer pessoa.", "B": "Havendo consentimento do morador, o mandado de prisão poderá ser cumprido em domicílio durante a noite.", "C": "Entre as hipóteses legais de decretação da prisão preventiva estão a garantia da ordem pública, a conveniência da instrução criminal e o clamor público.", "D": "Em geral, a prisão especial somente poderá ser concedida durante o processo ou inquérito policial, cessando o benefício após o trânsito em julgado.", "E": "A prisão temporária não pode ser decretada de ofício pelo juiz, que terá o prazo de 24 horas, a partir do recebimento do requerimento das partes, para decidir fundamentadamente."}, "classificacao": {"id": "Q0229", "decisao": "publicar", "tema_central_id": "5584", "extras_ids": "5519;5520;5586", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0230", "texto": "Assinale a opção correta em relação às causas de exclusão de culpabilidade, ao concurso de pessoas, às finalidades das penas e às medidas de segurança.", "comando": "", "alternativas": {"A": "Em relação à embriaguez não acidental, o CP adotou a teoria da actio libera in causa, devendo ser considerado o momento da prática delituosa e não o da ingestão da substância, para aferir a culpabilidade do agente.", "B": "No erro de proibição indireto, o agente tem perfeita noção da realidade, mas avalia de forma equivocada os limites da norma autorizadora. Tal erro, se escusável, isenta-o de pena; se inescusável, concede-lhe o direito a redução da pena de um sexto a um terço.", "C": "No ordenamento jurídico brasileiro, a natureza jurídica do concurso de pessoas é justificada pela adoção da teoria monista, na qual inexistem desvios subjetivos de conduta.", "D": "Segundo a teoria finalista, a pena tem a dupla função de punir o criminoso e prevenir a prática do crime pela reeducação e pela intimidação coletiva.", "E": "A medida de segurança possui finalidade preventiva e visa ao tratamento dos inimputáveis que demonstrarem, pela prática delitiva, potencialidade para novas ações danosas, razão pela qual não se aplicam os princípios da irretroatividade da lei penal mais grave e da anterioridade a essa espécie de sanção penal."}, "classificacao": {"id": "Q0230", "decisao": "revisar", "tema_central_id": "5062", "extras_ids": "5211;5071;5200;5184", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0231", "texto": "Aquele que pratica conduta descrita no tipo penal do delito de tráfico de drogas, mas em erro sobre elemento constitutivo do tipo, ou seja, em hipótese de erro de tipo essencial poderá", "comando": "", "alternativas": {"A": "alegar atipicidade da conduta.", "B": "responder pela modalidade culposa do delito.", "C": "ser isento de pena.", "D": "ter a pena diminuída com base em causa especial de diminuição de pena.", "E": "alegar excludente de ilicitude da conduta."}, "classificacao": {"id": "Q0231", "decisao": "publicar", "tema_central_id": "5224", "extras_ids": "4708", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0232", "texto": "Sobre os crimes contra a Administração da Justiça, previstos no Código Penal, assinale a alternativa correta.", "comando": "", "alternativas": {"A": "Dar causa a ação de improbidade administrativa, imputando a alguém ato improbo de que sabe inocente, valendo-se de nome suposto, em tese, caracteriza o crime de denunciação caluniosa.", "B": "O crime de exercício arbitrário das próprias razões, previsto no artigo 345, do CP, somente se procede mediante queixa.", "C": "Oferecer dinheiro a testemunha para fazer afirmação falsa em depoimento, em tese, caracteriza o crime de coação no curso do processo, previsto no artigo 344, do CP.", "D": "O crime de exploração de prestígio (art. 357, do CP) é próprio, podendo ser praticado apenas pelos sujeitos previstos no tipo penal.", "E": "O crime de favorecimento pessoal caracteriza-se pelo auxílio prestado a autor de crime, a fim de que ele escape da ação das autoridades públicas, desde que o crime praticado seja punido com reclusão."}, "classificacao": {"id": "Q0232", "decisao": "publicar", "tema_central_id": "5079", "extras_ids": "5080;5082;5081;5084;5086", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0233", "texto": "Sobre a desistência voluntária e o arrependimento eficaz, assinale a alternativa correta:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "o agente que, voluntariamente, impede que o resultado do crime se produza não responde pelos seus atos, porque incide na hipótese de desistência voluntária;", "B": "o agente que, voluntariamente, desiste de prosseguir na execução do crime, não responde pelos atos praticados, desde que tais atos não configurem, isoladamente, crime ou contravenção penal, sendo o caso de desistência voluntária;", "C": "o agente que, voluntariamente, repare o dano ou restitua a coisa ao proprietário, até o recebimento da denúncia, não responde pelos seus atos, estando configurada a hipótese de arrependimento eficaz;", "D": "considera-se arrependimento eficaz quando o agente, iniciada a execução do crime, por ineficácia absoluta do meio, não consegue consumá-lo, não respondendo pelos atos praticados;", "E": "é caso de desistência voluntária quando o agente, por absoluta impropriedade do objeto, impede que o resultado se produza, só responde pelos atos já praticados."}, "classificacao": {"id": "Q0233", "decisao": "publicar", "tema_central_id": "5178", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0234", "texto": "A interdisciplinaridade é intrínseca à natureza da criminologia. Dessa forma, a ciência que se afasta do estudo da criminologia é a", "comando": "Complete a frase sobre a ciência que se afasta do estudo da criminologia.", "alternativas": {"A": "biologia.", "B": "hermenêutica dogmática.", "C": "psicologia.", "D": "estatística.", "E": "sociologia."}, "classificacao": {"id": "Q0234", "decisao": "publicar", "tema_central_id": "4382", "extras_ids": "4381", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0235", "texto": "Caberá recurso, no sentido estrito, da decisão que concluir pela competência do juízo. Neste caso, o recurso, que poderá ser interposto no prazo de 5 (cinco) dias, não terá efeito suspensivo.", "comando": "Neste caso, o recurso, que poderá ser interposto no prazo de 5 (cinco) dias, não terá efeito suspensivo.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0235", "decisao": "publicar", "tema_central_id": "5561", "extras_ids": "5515", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0236", "texto": "Analise as assertivas abaixo. I. A apresentação pelo acusado da prática de furto, no curso do processo, de prévio contrato de compra e venda que o identifique como o comprador da res furtiva, impõe ao magistrado a suspensão do processo criminal e o encaminhamento das partes ao juízo cível, por tratar-se de questão prejudicial de natureza heterogênea. II. Nos termos da lei processual penal, a restituição de bens apreendidos constitui ato privativo do juiz criminal competente, não podendo ser concedida pela autoridade policial, em razão da existência de efeitos extrapenais da sentença condenatia. III. Segundo o entendimento pacífico do Supremo Tribunal Federal, não podem subsistir condenações penais fundadas unicamente em prova produzida na fase do inquérito policial, sob pena de grave afronta às garantias constitucionais do contraditório e da ampla defesa. IV. O acusado, embora preso, tem o direito de comparecer, de assistir e de presenciar, sob pena de nulidade absoluta, os atos processuais, notadamente aqueles que se produzem na fase de instrução do processo penal.", "comando": "Está correto APENAS o que se afirma em:", "alternativas": {"A": "I; III e IV.", "B": "I e II.", "C": "III e IV.", "D": "II e III.", "E": "I; II e IV."}, "classificacao": {"id": "Q0236", "decisao": "revisar", "tema_central_id": "5465", "extras_ids": "5491;5495;5592;5582", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0237", "texto": "Qual a diferença entre desistência voluntária e arrependimento eficaz?", "comando": "Responda qual é a diferença entre desistência voluntária e arrependimento eficaz.", "alternativas": {"A": "Na desistência voluntária o que ocorre é a desistência no prosseguimento dos atos executórios do crime, feita de modo voluntário, respondendo o agente somente pelo que praticou. No arrependimento eficaz a desistência ocorre entre o término dos atos executórios e a consumação. O agente, neste caso, já fez tudo o que podia para atingir o resultado, mas resolve interferir para evitar a sua concretização.", "B": "Entre a desistência voluntária e o arrependimento eficaz, em verdade, não há nenhuma diferença, porquanto em ambas as situações o que se busca é impedir o resultado.", "C": "A diferença entre a desistência voluntária e o arrependimento eficaz está em que, na primeira, o agente é impedido de consumar o delito, já no arrependimento eficaz a consumação não ocorre porque o próprio agente a impede.", "D": "A diferença entre a desistência voluntária e o arrependimento eficaz reside no fato de que, na desistência voluntária, o agente não chega a iniciar a execução do delito. Já no arrependimento eficaz a execução iniciada é interrompida, impedindo-se a consumação do delito.", "E": "A diferença entre a desistência voluntária e o arrependimento eficaz está em que, na primeira, a execução do delito é interrompida por circunstâncias alheias ao domínio do agente. Já no arrependimento eficaz o delito não se consuma em razão da impropriedade dos meios de execução."}, "classificacao": {"id": "Q0237", "decisao": "publicar", "tema_central_id": "5178", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0238", "texto": "Será exigido o reforço da fiança quando for inovada a classificação do delito, nos termos do Código de Processo Penal.", "comando": "Indique quando será exigido o reforço da fiança conforme o Código de Processo Penal.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0238", "decisao": "publicar", "tema_central_id": "5523", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0239", "texto": "Analise a opção CORRETA.", "comando": "", "alternativas": {"A": "São circunstâncias que sempre atenuam a pena, ser o agente menor de 21 (vinte e um) anos ou maior de 70 (setenta) anos, na data do fato.", "B": "A pena poderá ser ainda atenuada em razão de circunstância relevante, anterior ou posterior ao crime, desde que prevista expressamente em lei.", "C": "Quando, por acidente ou erro no uso dos meios de execução, o agente, ao invés de atingir a pessoa que pretendia ofender, atinge pessoa diversa, responde como se tivesse praticado o crime contra aquela. No caso de ser também atingida a pessoa que o agente pretendia ofender, aplica-se a regra do concurso material, descrita no artigo 69 do Estatuto Repressivo.", "D": "No que se refere a suspensão condicional da pena, artigo 77, e parágrafos, do Código Penal, pode-se dizer que o legislador criou dois tipos de suspensão, quais sejam, a simples, consistente na aplicação das condições de prestação de serviços à comunidade ou limitação de final de semana (artigo 78, § 1º, CP); e a especial, consistente na aplicação das condições de proibição de frequentar determinados lugares; proibição de ausentar-se da comarca na qual reside, sem autorização do Juiz; comparecimento pessoal e obrigatório a Juízo, mensalmente, para informar e justificar suas atividades (artigo 78, § 2º, CP)."}, "classificacao": {"id": "Q0239", "decisao": "revisar", "tema_central_id": "5199", "extras_ids": "5203;5207;5224", "confianca": "0.5", "motivo": "Revisar: mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0240", "texto": "Pedro, que estava indiciado por crime de roubo, teve sua prisão decretada pelo juiz da comarca de Miracema-RJ em 08 de agosto de 2011, uma segunda-feira, sendo preso provisoriamente no mesmo dia, enquanto ainda estava sendo investigado. Terminado o inquérito, o delegado, no último dia do prazo determinado em lei, fez logo cedo a remessa a juízo. O juiz, no mesmo dia em que recebeu os autos, tendo-se em conta que era um dia útil, deu vista pessoal ao promotor. Considerando-se o prazo legal que o promotor tem para oferecer a denúncia e que esse prazo venceria em um dia útil, o trâmite do inquérito, o prazo utilizado pelo delegado, o recebimento e a vista do inquérito pelo promotor e a denúncia contra Pedro, somando-se todos esses atos e prazos, desde a prisão, teria que ser oferecida em:", "comando": "Considerando o prazo legal para o promotor oferecer a denúncia, calcule o prazo total desde a prisão até a oferta da denúncia contra Pedro.", "alternativas": {"A": "15\\tdias;", "B": "10\\tdias;", "C": "12\\tdias;", "D": "14\\tdias;\\t", "E": "07 dias"}, "classificacao": {"id": "Q0240", "decisao": "publicar", "tema_central_id": "5473", "extras_ids": "5500;5488", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0241", "texto": "Analise os itens abaixo sobre a teoria do erro. I. O erro de tipo essencial incide sobre elementar do tipo quando a falsa percepção de realidade faz com que o agente desconheça a natureza criminosa do fato. II. O erro sobre objeto é irrelevante para o Direito Penal, já que o agente, mesmo quando realiza a conduta que recai sobre coisa alheia, responderá criminalmente pelo crime cometido nos limites do tipo penal. III. O aberratio ictus é modalidade de erro acidental que não exclui a tipicidade, sopesando ao agente uma responsabilização em âmbito penal. IV. O aberratio criminis é o desvio na execução do delito e recai sobre o objeto jurídico do crime, sendo que sua verificação não exclui a tipicidade.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Apenas I e III estão corretos", "B": "Apenas II e IV estão corretos", "C": "Apenas II e III estão incorretos", "D": "Apenas III e IV estão incorretos", "E": "I, II, III e IV estão corretos"}, "classificacao": {"id": "Q0241", "decisao": "publicar", "tema_central_id": "5224", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0242", "texto": "Sobre os recursos em processo penal, assinale a alternativa CORRETA:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "O recurso extraordinário e o recurso\\nespecial serão processados e julgados no\\nSupremo Tribunal Federal e no Superior\\nTribunal de Justiça na forma estabelecida\\npor leis especiais e pela lei processual\\ncivil, que revogaram os regimentos\\ninternos das Cortes Superiores no tocante\\na ambos os recursos.", "B": "Quando o acusado não tiver condições de\\nnomear defensor, ser-lhe-á nomeado\\ndefensor público ou dativo, sendo que, em\\nqualquer hipótese, haverá prazo em dobro\\npara recorrer.", "C": "Em nome dos princípios da\\nunirrecorribilidade e da preclusão lógica,\\nquando houver a interposição de dois\\nrecursos pela mesma parte contra a mesma\\ndecisão, será conhecido o recurso\\napresentado em segundo lugar.", "D": "O recurso ordinário constitucional é\\ninterposto no tribunal recorrido, mas o\\nexame de sua admissibilidade ocorrerá\\nsomente no tribunal que irá julgá-lo.", "E": "Caberá reexame necessário quando da\\ndecisão de deferimento de reabilitação\\ncriminal, da denegação e da concessão de\\nhabeas corpus e da sentença que arquiva\\ninquérito policial ou absolutória por\\ncrimes contra a economia popular ou\\nsaúde pública."}, "classificacao": {"id": "Q0242", "decisao": "publicar", "tema_central_id": "5512", "extras_ids": "5513;5514;5570;5571", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0243", "texto": "Antônio, durante a madrugada, subtrai, com o emprego de chave falsa, o automóvel de Pedro. Depois de oferecida a denúncia pela prática de crime de furto qualificado, mas antes do seu recebimento, por ato voluntário de Antônio, o automóvel furtado é devolvido à vítima. Nesse caso, pode-se afirmar a ocorrência de", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "arrependimento posterior.", "B": "desistência voluntária.", "C": "arrependimento eficaz.", "D": "circunstância atenuante.", "E": "causa de extinção da punibilidade."}, "classificacao": {"id": "Q0243", "decisao": "publicar", "tema_central_id": "5178", "extras_ids": "5159", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0244", "texto": "O agente que exigir vantagem indevida, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, responderá pelo crime de:", "comando": "", "alternativas": {"A": "peculato.", "B": "concussão.", "C": "corrupção passiva.", "D": "corrupção ativa."}, "classificacao": {"id": "Q0244", "decisao": "publicar", "tema_central_id": "5091", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0245", "texto": "Assinale a opção correta a respeito da prescrição.", "comando": "", "alternativas": {"A": "O empresário que, com a finalidade de obter vantagem indevida, praticar ato fraudulento do qual resulte prejuízo aos credores terá sua conduta tipificada como crime na Lei de Falências. Nesse caso, a prescrição do crime começará a correr do dia da homologação do plano de recuperação extrajudicial.", "B": "A decretação da falência do devedor suspende a prescrição cuja contagem tenha-se iniciado com a concessão da recuperação judicial.", "C": "As penas aplicáveis aos usuários de substâncias entorpecentes prescrevem em quatro anos, contados do início da execução da sanção penal.", "D": "Depois de transitada em julgado a sentença penal condenatória, reinicia-se a contagem do prazo prescricional, que continua correndo durante o tempo em que o condenado estiver preso por outro motivo.", "E": "Na hipótese de um condenado fugir faltando seis meses para o cumprimento da pena, a contagem da prescrição da pretensão executória recomeçará a partir da data da fuga. Nesse caso, a prescrição ocorrerá no lapso temporal correspondente à pena integralmente aplicada."}, "classificacao": {"id": "Q0245", "decisao": "publicar", "tema_central_id": "5185", "extras_ids": "5187;5189;5190", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0246", "texto": "No procedimento do júri, presentes indícios da autoria e prova da materialidade, se ao término da instrução do sumário de culpa ficar provado tecnicamente que o acusado é semi-imputável, o juiz deverá:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "pronunciá-lo.", "B": "absolvê-lo sumariamente.", "C": "impronunciá-lo.", "D": "remeter os autos para o juízo comum para a prolação da sentença.", "E": "declarar nulo o processo e remeter os autos para o juízo comum."}, "classificacao": {"id": "Q0246", "decisao": "publicar", "tema_central_id": "5527", "extras_ids": "5213", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0247", "texto": "Com a Lei Anticrime surge o instituto do Acordo de Não Persecução Penal (ANPP), cujo cumprimento integral traduz-se em uma causa de extinção da punibilidade. Todavia, o marco legal do ANPP veda a aplicação do acordo nos crimes de violência doméstica e nos crimes de racismo, o que encontra respaldo, incontroverso, na doutrina e na jurisprudência. É preciso lembrar, também, que não deve ser oferecido o acordo se no momento da lavratura do auto de prisão em flagrante o preso não confessar circunstanciadamente. Ademais, a referida lei, no que tange ao acordo de não persecução penal, não pode ser aplicado a fatos ocorridos antes de sua vigência.", "comando": "", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0247", "decisao": "publicar", "tema_central_id": "5502", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0248", "texto": "Considere os seguintes tipos penais praticados contra a Administração Pública: Tipos penais 1. Desobediência 2. Resistência 3. Corrupção passiva 4. Corrupção ativa 5. Concussão Ação a. Solicitar ou receber, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida, ou aceitar promessa de tal vantagem. b. Exigir, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida. c. Opor-se à execução de ato legal, mediante violência ou ameaça a funcionário competente para executá-lo ou a quem lhe esteja prestando auxílio. d. Desobedecer a ordem legal de funcionário público. e. Oferecer ou prometer vantagem indevida a funcionário público, para determiná-lo a praticar, omitir ou retardar ato de ofício. A correta correlação entre o tipo penal e a sua ação é:", "comando": "", "alternativas": {"A": "1-d - 2-a - 3-b - 4-e - 5-c.", "B": "1-a - 2-c - 3-d - 4-e - 5-b.", "C": "1-d - 2-c - 3-a - 4-e - 5-b.", "D": "1-d - 2-b - 3-a - 4-e - 5-c.", "E": "1e - 2-c - 3-a - 4-d - 5-b."}, "classificacao": {"id": "Q0248", "decisao": "publicar", "tema_central_id": "5087", "extras_ids": "5100;5092;5093;5091", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0249", "texto": "O Estatuto Processual Penal prevê que o juiz não poderá exercer jurisdição no processo em que: a) tiver funcionado seu cônjuge ou parente, consanguíneo ou afim, em linha reta ou colateral até o terceiro grau, inclusive, como defensor ou advogado, órgão do Ministério Público, autoridade policial, auxiliar da justiça ou perito; b) ele próprio houver desempenhado qualquer dessas funções ou servido como testemunha; c) tiver funcionado como juiz de outra instância, pronunciando-se, de fato ou de direito, sobre a questão; d) ele próprio ou seu cônjuge ou parente, consanguíneo ou afim em linha reta ou colateral até o terceiro grau, inclusive, for parte ou diretamente interessado no feito. Nos juízos coletivos, não poderão servir no mesmo processo os juízes que forem entre si parentes, consanguíneos ou afins, em linha reta ou colateral até o terceiro grau, inclusive.", "comando": "Processo Penal", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0249", "decisao": "publicar", "tema_central_id": "5492", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0250", "texto": "Sobre a determinação do regime inicial de cumprimento de pena, é correto afirmar que", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "em virtude do princípio da individualização da pena, a primeira fase de aplicação da pena não pode influenciar na\\ndeterminação do regime.", "B": "a pena de detenção deve ser cumprida em regime aberto ou semiaberto, salvo caso de reincidência.", "C": "segundo a jurisprudência dominante do STJ, a reincidência impede o cumprimento de pena em regime semiaberto,\\nindependentemente da quantidade de pena e das circunstâncias judiciais.", "D": "em caso de condenação por crime de extorsão mediante sequestro consumado, é possível a aplicação do regime\\nsemiaberto.", "E": "por ser cometido com violência ou grave ameaça contra a pessoa, a condenação por roubo consumado impede a\\naplicação do regime aberto."}, "classificacao": {"id": "Q0250", "decisao": "publicar", "tema_central_id": "5201", "extras_ids": "5576", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0251", "texto": "Considere as assertivas abaixo sobre extinção da puni bilidade. I - É taxativo o rol das causas de extinção de punibilidade previsto no art. 107 do Código Penal. II - A anistia e o indulto se referem a fatos e pessoas determinados, respectivamente. III - A perda do direito de punir do Estado pelo não exercício em determinado lapso de tempo é causa de extinção da punibilidade.", "comando": "Quais são corretas?", "alternativas": {"A": "Apenas I", "B": "Apenas II", "C": "Apenas III", "D": "Apenas II e III", "E": "I, II e III"}, "classificacao": {"id": "Q0251", "decisao": "publicar", "tema_central_id": "5191", "extras_ids": "5193;5185", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0252", "texto": "João, maior de setenta anos de idade ao tempo do fato, foi condenado pelo crime de estelionato à pena privativa de liberdade de quatro anos e três meses de reclusão em regime inicial semiaberto e, ainda, ao pagamento de cinquenta dias-multa, fixado o valor de um vinte avos do salário mínimo vigente. Nessa situação hipotética, conforme o CPP,", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "caso o presidente da República conceda a João graça parcial,\\no benefício não poderá ser recusado.", "B": "o juiz poderá, a requerimento do réu, demonstradas as\\ncircunstâncias que o justifiquem, permitir que o pagamento da\\npena de multa se faça em parcelas mensais.", "C": "João terá direito ao livramento condicional, preenchidos os\\nrequisitos, e somente este ou o seu advogado poderá requerê-lo\\nao juízo da execução penal, tendo em vista a natureza\\npersonalíssima da pena.", "D": "o requisito temporal do livramento condicional será reduzido\\npela metade, em razão de João contar com mais de setenta anos\\nde idade na data do fato."}, "classificacao": {"id": "Q0252", "decisao": "publicar", "tema_central_id": "5199", "extras_ids": "5206;5208;5193", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0253", "texto": "No que concerne às Escolas Penais, é correto afirmar que a", "comando": "Complete a frase com a afirmação correta sobre as Escolas Penais.", "alternativas": {"A": "“Positiva” entende que o crime deriva de circunstâncias\\nbiológicas ou sociais, tendo sido defendida por\\nFeuerbach.", "B": "“Clássica” funda-se no livre-arbítrio e tem em Carrara\\num de seus maiores expoentes.", "C": "“Lombrosiana” acredita que o homem é racional e\\nnasce livre, sendo o crime fruto de uma escolha\\nerrada, concepção hipotetizada por Lombroso e\\ntambém por Ferri.", "D": "“Clássica” entende que a pena é medida profilática,\\nde cura, pensamento difundido por Carmignani.", "E": "“Positiva” nasce em contraposição às ideias de\\nLombroso, defende o naturalismo-racional e tem em\\nGarofalo um de seus doutrinadores."}, "classificacao": {"id": "Q0253", "decisao": "publicar", "tema_central_id": "4373", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0254", "texto": "Joana, vítima de violência doméstica e familiar perpetrada pelo seu ex-companheiro, compareceu à Delegacia especializada de Atendimento à Mulher do Município de Recife/PE, manifestando o desejo de obter medidas protetivas de urgência. Nesse cenário, considerando as disposições da Lei nº 11.340/2016, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa. ( ) As medidas protetivas de urgência serão concedidas independentemente da tipificação penal da violência, do ajuizamento de ação penal ou cível, da existência de inquérito policial ou do registro de boletim de ocorrência. ( ) As medidas protetivas de urgência vigorarão pelo prazo máximo de cento e oitenta dias, admitindo-se sucessivas prorrogações, por decisão judicial, enquanto persistir risco à integridade física, psicológica, sexual, patrimonial ou moral da ofendida ou de seus dependentes. ( ) As medidas protetivas de urgência poderão ser concedidas de imediato, independentemente de audiência das partes e de manifestação do Ministério Público, devendo este ser prontamente comunicado.", "comando": "As afirmativas são, respectivamente,", "alternativas": {"A": "V – V – V.", "B": "F – V – F.", "C": "V – F – V.", "D": "F – F – V.", "E": "F – F – F."}, "classificacao": {"id": "Q0254", "decisao": "publicar", "tema_central_id": "4704", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0255", "texto": "No que diz respeito à imputabilidade penal, assinale a alternativa incorreta .", "comando": "Assinale a alternativa incorreta.", "alternativas": {"A": "A paixão e a emoção não excluem a imputabilidade\\npenal", "B": "A pena pode ser reduzida de um a dois terços, se o\\nagente, por embriaguez, proveniente de caso fortuito\\nou força maior, não possuía, ao tempo da ação ou da\\nomissão, a plena capacidade de entender o caráter\\nilícito do fato ou de determinar-se de acordo com\\nesse entendimento", "C": "É isento de pena o agente que, em virtude de\\nperturbação de saúde mental ou por\\ndesenvolvimento mental incompleto ou retardado\\nnão era inteiramente capaz de entender o caráter\\nilícito do fato ou de determinar-se de acordo com\\nesse entendimento", "D": "A embriaguez, voluntária ou culposa, pelo álcool ou\\nsubstância de efeitos análogos, não exclui a\\nimputabilidade penal", "E": "Os menores de 18 (dezoito) anos são penalmente\\ninimputáveis, ficando sujeitos às normas\\nestabelecidas na legislação especial"}, "classificacao": {"id": "Q0255", "decisao": "publicar", "tema_central_id": "5213", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0256", "texto": "Tanto a conduta do agente que age imprudentemente, por desconhecimento invencível de algum elemento do tipo quanto a conduta do agente que age acreditando estar autorizado a fazê-lo ensejam como consequência a exclusão do dolo e, por conseguinte, a do próprio crime.", "comando": "Explique a consequência da conduta do agente que age imprudentemente por desconhecimento invencível ou acreditando estar autorizado a agir.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0256", "decisao": "publicar", "tema_central_id": "5224", "extras_ids": "5214", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0257", "texto": "O princípio da legalidade é pedra fundamental do Direito Penal brasileiro, marcando, por isso, a própria abertura do Código em seu dispositivo prefacial. Registra, também, sua presença no elevado artigo 5º, da Constituição Federal, especificamente em seu inciso XXXIX. Nessa linha, o grande jurista Luis Jiménez Asúa afirma com precisão: “Ernest Beling, que expôs a teoria da tipicidade pela primeira vez, deu a ela, desde seu primeiro livro, um valor decisivo na construção técnica do crime, e recentemente estudou o significado do princípio nulla poena sine lege para a determinação dos conceitos fundamentais dos delitos. Ora, visto que não há crime sem um tipo legal claramente formulado, é possível, no sentir de Beling, levar o princípio nullum crimen sine lege adiante, dizendo: 'não há crime sem tipicidade' (kein Verbrechen ohne Tatbestand).” (La Ley e el Delito: princípios de derecho penal. 13ª edição, Buenos Aires: Abeledo-Perrot Editorial Sudamericano, 1984, p. 97-98, tradução livre). Atento às advertências lançadas no trecho, analise as afirmativas abaixo. I. O Direito Penal expressa suas previsões punitivas no tipo penal ou tipo legal incriminador, que é o modelo de conduta prevista na lei penal, que pode ser classificado como crime, contravenção ou ato de improbidade administrativa. II. O autor do crime é a pessoa humana, também designado como sujeito ativo de crime. Excepcionalmente, nos termos da lei e da Constituição, é possível atribuir responsabilidade penal à pessoa jurídica. III. É possível existir um fato que seja ilícito, mas que não seja correspondentemente típico, isto é, que não se subsuma a um tipo penal incriminador e ainda assim seja ilícito. Estão corretas as afirmativas:", "comando": "", "alternativas": {"A": "I, II e III", "B": "I e II apenas", "C": "I e III apenas", "D": "II e III apenas"}, "classificacao": {"id": "Q0257", "decisao": "publicar", "tema_central_id": "5218", "extras_ids": "5219;5227;5172", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0258", "texto": "O exame de corpo de delito", "comando": "Explique o que é o exame de corpo de delito.", "alternativas": {"A": "deve ser realizado por perito oficial ou pelo próprio juiz.", "B": "deve ser realizado quando se mostrar ausente vestígio do crime, assegurado o direito de apresentação de quesitos pelas partes.", "C": "será feito de maneira indireta no caso de competência do Tribunal do Júri.", "D": "poderá ser substituído pela acareação ou pelo reconhecimento em crimes contra a fé pública.", "E": "será realizado com prioridade em caso de violência doméstica e familiar contra a mulher."}, "classificacao": {"id": "Q0258", "decisao": "publicar", "tema_central_id": "5545", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0259", "texto": "O crime de dano (CP, art. 163), norma menos grave, funciona como elemento do crime de furto qualificado pelo rompimento de obstáculo à subtração da coisa (CP, art. 155, § 4.º, inciso I). Nesta hipótese, o crime de dano é excluído pela norma mais grave, em função do princípio da", "comando": "Complete a frase com o princípio aplicável.", "alternativas": {"A": "especialidade.", "B": "consunção.", "C": "subsidiariedade tácita ou implícita.", "D": "subsidiariedade expressa ou explícita."}, "classificacao": {"id": "Q0259", "decisao": "publicar", "tema_central_id": "5183", "extras_ids": "5159;5164", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0260", "texto": "Analise as assertivas abaixo e indique a alternativa: I. Das construções doutrinárias de Günther Jakobs acerca do “Direito Penal do Inimigo”, extrai-se que aquele que por princípio se conduz de modo desviado, não oferece garantia de um comportamento pessoal, por isso não pode ser tratado como cidadão, mas deve ser combatido como inimigo; II. Uma classificação atual de justiça – levada em consideração na criação de novos métodos de resolução de conflitos -, que surge como alternativa para que o crime não seja punido de maneira retributiva, mas que o dano causado seja reparado ou minimizado, é a Justiça Restaurativa; III. O Direito pátrio acolhe muitas das reinvindicações das minorias mediante edição de normas jurídicas que visam a manter a convivência harmônica do coletivo; IV. A afirmativa de João Baptista Herkenhoff (in Movimentos Sociais, Porto Alegre: Livraria do Advogado, 2004, p.25) de que “Os movimentos sociais não se submetem aos padrões do Direito estabelecido. Sobretudo em sociedades, como a brasileira, onde milhões de pessoas estão à margem de qualquer direito, num estado de permanente negação da Cidadania, os movimentos sociais estão sempre a ´criar direitos´ à face de uma realidade sociopolítica surda aos apelos de direito e dignidade humana”, reflete o confronto dos movimentos sociais com a ordem social cristalizada.", "comando": "Analise as assertivas abaixo e indique a alternativa.", "alternativas": {"A": "Apenas as assertivas II, III e IV são corretas;", "B": "Somente as assertivas II e IV são corretas;", "C": "Apenas as assertivas II e III são corretas;", "D": "Somente a assertiva III é correta;", "E": "Todas as assertivas são corretas."}, "classificacao": {"id": "Q0260", "decisao": "revisar", "tema_central_id": "4374", "extras_ids": "4376;4370", "confianca": "0.5", "motivo": "Revisar: abaixo do corte; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0261", "texto": "Honorato adquiriu regularmente um programa de computador para uso pessoal. Contudo, desejando realizar uma cópia de segurança, reproduziu o conteúdo em mídia digital, guardando-a consigo. Considerando que Honorato não possuía expressa autorização do autor do programa para o ato, é correto afirmar que sua conduta:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "não constitui crime.", "B": "constitui crime previsto no Código Penal.", "C": "constitui crime previsto no art. 12 da Lei n°9.609, cujo processamento se dará mediante ação\\npública incondicionada.\\n", "D": "constitui crime previsto no art. 12 da Lei n°9.609, cujo processamento se dará mediante ação\\npública condicionada à representação do\\nofendido.", "E": "constitui crime previsto no art. 12 da Lei n°9.609, cujo processamento se dará mediante ação\\nprivada.\\n"}, "classificacao": {"id": "Q0261", "decisao": "revisar", "tema_central_id": "5136", "extras_ids": "", "confianca": "0.964286", "motivo": "Revisar: lei_especial_sem_no; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0262", "texto": "Sobre a superveniência de doença mental ao apenado na fase de execução de pena , é correto afirmar:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Sobrevinda doença mental ao réu depois da sentença condenatória, haja vista exceção expressa\\nno CPP, pode ser decretada pelo juízo da causa, ao constatar a enfermidade do apenado em oitiva,\\na sua remoção provisória para hospital de custódia e tratamento psiquiátrico, sem prejuízo de revisão\\nda decisão judicial em sede de recurso, pendente de exame.", "B": "Pela Lei de Execução Penal, atestada em perícia médica o leve grau da enfermidade do apenado,\\nmesmo não tendo sido feita a conversão da pena em medida de segurança, poderá ser determinado\\npelo juízo o tratamento ambulatorial na própria unidade penitenciária, em vez de ser decretada a\\ninternação em hospital de custódia.", "C": "Em qualquer circunstância, a remoção do apenado para hospital de custódia e tratamento\\npsiquiátrico poderá ser determinada provisoriamente pelo diretor do estabelecimento penal,\\ncomunicando-se imediatamente ao juiz, que em face da perícia médica, ratificará ou revogará a\\nmedida, na forma de regras do CPP não revogadas pela reforma legislativa.", "D": "Suspensa a execução da pena em virtude de superveniência de doença mental do apenado,\\naplicada a medida de segurança, prevalecem as normas desta até o fim da execução, mesmo que\\nantes do término do tempo de pena ocorra a cura da enfermidade, atestada em perícia.", "E": "O juiz da execução poderá, com base em perícia médica, determinar o internamento em hospital\\nde custódia e tratamento psiquiátrico ou, a conversão da pena em medida de segurança, acaso\\nsobrevinda a doença mental ao apenado durante a execução."}, "classificacao": {"id": "Q0262", "decisao": "publicar", "tema_central_id": "4703", "extras_ids": "5184", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0263", "texto": "O juiz dar-se-á por suspeito e, se não o fizer, poderá ser recusado por qualquer das partes: I. Se ele próprio ou seu cônjuge ou parente, consanguíneo ou afim, em linha reta ou colateral até o terceiro grau, inclusive, for parte ou diretamente interessado no feito. II. Se ele, seu cônjuge, ascendente ou descendente, estiver respondendo a processo por fato análogo, sobre cujo caráter criminoso haja controvérsia. III. Se ele, seu cônjuge, ou parente, consanguíneo, ou afim, até o terceiro grau, inclusive, sustentar demanda ou responder a processo que tenha de ser julgado por qualquer das partes. IV. Ele próprio houver desempenhado qualquer dessas funções (defensor ou advogado, órgão do Ministério Público, autoridade policial, auxiliar da justiça ou perito) ou servido como testemunha.", "comando": "Avalie as assertivas acima e marque a alternativa CORRETA.", "alternativas": {"A": "Apenas as assertivas I e IV estão corretas.", "B": "Apenas as assertivas I, II e III estão corretas.", "C": "Apenas as assertivas II e III estão corretas.", "D": "Todas as assertivas estão corretas."}, "classificacao": {"id": "Q0263", "decisao": "publicar", "tema_central_id": "5492", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0264", "texto": "Nos crimes contra a dignidade sexual, tratando-se da vítima menor de 14 anos, ou enferma ou deficiente mental sem o necessário discernimento para o ato, a situação em que o proxeneta e o cliente que pratica a conjunção carnal enquadram-se no delito de estupro de vulnerável; enquanto o proprietário, o gerente ou o responsável pelo local responderão, tão somente, pelo crime de favorecimento à prostituição, na modalidade de conduta equiparada. Já, quando a vítima explorada sexualmente for menor de 18 e maior de 14 anos, o cliente que pratica a conjunção carnal responderá pelo crime de favorecimento à prostituição.", "comando": "Assinale a alternativa correta.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0264", "decisao": "publicar", "tema_central_id": "5102", "extras_ids": "5103;5109", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0265", "texto": "Na hipótese de concurso de crimes, a extinção da punibilidade pela prescrição incidirá sobre a pena cominada por cada crime, isoladamente.", "comando": "Explique como a prescrição incide sobre a pena em caso de concurso de crimes.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0265", "decisao": "publicar", "tema_central_id": "5186", "extras_ids": "5066", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0266", "texto": "Em operação conjunta de garantia da Lei e da Ordem, de iniciativa do Presidente da República, com militares do Exército e membro da Polícia Militar estadual, ocorre a morte de um civil. Existem indícios da prática de um crime doloso contra a vida, sendo que há suspeita da participação de um soldado do Exército Brasileiro e um soldado da Polícia Militar estadual neste fato. Nesse caso, é correto afirmar que a competência para o eventual julgamento é", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "da Justiça Militar da União, para o Militar do Exército, e do Tribunal do Júri, para o Policial Militar estadual. \\n", "B": "da Justiça Militar da União, para o Militar do Exército, e da Justiça Militar dos Estados, para o Policial Militar estadual. \\n", "C": "do Tribunal do Júri, para ambos. \\n", "D": "da Justiça Federal, para o Militar do Exército, e do Tribunal do Júri, para o Policial Militar estadual. \\n", "E": "da Justiça Militar da União, para ambos, em razão da conexão. \\n"}, "classificacao": {"id": "Q0266", "decisao": "publicar", "tema_central_id": "5482", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0267", "texto": "Matheus, caminhoneiro, foi capturado em flagrante enquanto transportava, na fronteira entre a República Federativa do Brasil e a Colômbia, cem quilos de cocaína. Em assim sendo, o indivíduo foi encaminhado à presença do delegado de polícia federal, que constatou que, na unidade policial, inexistia perito oficial para firmar o laudo de constatação da natureza e quantidade da droga. Dessa forma, o laudo pericial foi lavrado por uma pessoa idônea. Nesse cenário, considerando as disposições da Lei n o 11.343/2006, é correto afirmar que:", "comando": "", "alternativas": {"A": "recebida cópia do auto de prisão em flagrante, o juiz, no prazo de dez dias, certificará a regularidade formal do laudo de constatação e determinará a destruição das drogas apreendidas, guardando-se amostra necessária à realização do laudo definitivo;", "B": "com a ratificação da prisão em flagrante de Matheus, o delegado de polícia fará, imediatamente, comunicação ao juiz competente, ao Ministério Público e à Defensoria Pública, remetendo-lhes cópia do auto lavrado;", "C": "o local da destruição das drogas será vistoriado antes e depois de efetivada a medida, sendo lavrado auto circunstanciado pela autoridade sanitária, certificando-se neste a destruição total do material;", "D": "a constatação da natureza e quantidade da droga se deu de forma irregular, pois não é possível suprir a ausência de perito oficial, substituindo-o por pessoa idônea, por ausência de previsão legal;", "E": "a destruição das drogas será executada pelo delegado de polícia competente, na presença do Ministério Público, da autoridade sanitária e do juiz que ordenar a adoção da medida."}, "classificacao": {"id": "Q0267", "decisao": "publicar", "tema_central_id": "4708", "extras_ids": "5546;5518", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0268", "texto": "Assinale a alternativa correta:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "São requisitos do tipo, no crime de falsidade ideológica: 1) alteração da verdade sobre fato juridicamente relevante; 2) imitação da verdade; 3) potencialidade do dano; 4) dolo.", "B": "O uso de documento falso não é crime formal e sua caracterização depende da ocorrência de um resultado naturalístico específico e determinado.", "C": "A persecução do crime de \"abuso de autoridade\" somente se procede mediante queixa do ofendido.", "D": "Não é punível a calúnia contra os mortos.", "E": "A exceção da verdade, nos crimes contra a honra, é cabível, indistintamente, tanto na calúnia, quanto na injúria e na difamação."}, "classificacao": {"id": "Q0268", "decisao": "revisar", "tema_central_id": "5062", "extras_ids": "5118;4684;5122;5123;5124", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0269", "texto": "Assinale a alternativa que NÃO SE AJUSTA à doutrina do garantismo penal, em sua concepção clássica:", "comando": "Assinale a alternativa que NÃO SE AJUSTA à doutrina do garantismo penal, em sua concepção clássica", "alternativas": {"A": "A interpretação da lei nunca é uma atividade exclusivamente recognitiva, mas é sempre fruto de uma escolha prática a respeito de hipóteses interpretativas alternativas.", "B": "O problema do garantismo penal é elaborar técnicas no plano teórico, torná-las vinculantes no plano normativo e assegurar sua efetividade no plano prático.", "C": "Na aplicação da lei penal, o julgador, preocupado com a legitimação da atividade jurisdicional e com a adesão social a seus atos, deve orientar suas decisões em conformidade com o consenso geral da população.", "D": "O direito penal é necessário como técnica institucional de minimização da reação violenta ao desvio socialmente não tolerado e como garantia do acusado contra os arbítrios, os excessos e os erros conexos a formas não jurídicas de controle social.", "E": "As garantias penais não servem tanto para legitimar ou validar, senão mais para deslegitimar o abuso da potestade punitiva."}, "classificacao": {"id": "Q0269", "decisao": "publicar", "tema_central_id": "4375", "extras_ids": "5172", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0270", "texto": "João conduzia o seu veículo automotor, ocasião em que foi parado por uma blitz da Polícia Militar. Após analisar a documentação do condutor, o policial Caio exigiu, para si, R$ 2.000,00 para liberar o automóvel. Nesse cenário, considerando as disposições do Código Penal, Caio responderá pelo crime de:", "comando": "", "alternativas": {"A": "excesso de exação;", "B": "corrupção passiva;", "C": "corrupção ativa;", "D": "concussão;", "E": "peculato."}, "classificacao": {"id": "Q0270", "decisao": "publicar", "tema_central_id": "5091", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0271", "texto": "Não prevalece de forma absoluta, no processo penal, o princípio tantum devolutum quantum appellatum , razão pela qual, de forma dominante na jurisprudência, o tribunal não fica impedido de reformar a decisão em decorrência da análise plena do julgado, mesmo constatado recurso exclusivo da acusação, desde que verificado e fundamentado equívoco nela apontado, e que beneficie o réu, o que é feito por força do artigo 617 do CPP, a contrario sensu , que permite concluir ser vedada somente a reformatio in pejus e não a reformatio in mellius . A exceção a essa regra, por decisão de entendimento consolidado pela Corte Suprema, diz respeito", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "às apelações contra as decisões definitivas, se interpostas por acusação e defesa, sobre a mesma\\nquestão.", "B": "às apelações contra as decisões do Júri.", "C": "aos recursos interpostos pela acusação e pelos\\nquais se questiona a classificação jurídica do fato reconhecido como crime.", "D": "aos recursos interpostos de forma parcial pela defesa, conforme autoriza o artigo 593 do Código de\\nProcesso Penal."}, "classificacao": {"id": "Q0271", "decisao": "publicar", "tema_central_id": "5515", "extras_ids": "5562", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0272", "texto": "No que concerne à prática de falta grave no curso da execução penal, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": {"A": "Nos termos da orientação do STJ, no caso de fuga, o marco\\ninicial da prescrição para a apuração da falta grave é o dia da\\nrecaptura, por se tratar de infração permanente.", "B": "Nos termos da Lei de Execução Penal, as faltas disciplinares\\ngraves não se aplicam ao preso provisório.", "C": "Conforme orientação do STJ, é exemplificativo o rol de faltas\\ngraves previsto no art. 50 da Lei de Execução Penal.", "D": "Segundo o STJ, a posse de droga para uso próprio não\\nconstitui falta grave.", "E": "Segundo o STJ, a utilização de tornozeleira eletrônica sem\\nbateria não configura falta grave."}, "classificacao": {"id": "Q0272", "decisao": "publicar", "tema_central_id": "4703", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0273", "texto": "É punido na modalidade culposa o crime de", "comando": "Complete a frase com o crime punido na modalidade culposa.", "alternativas": {"A": "peculato.", "B": "falsidade ideológica.", "C": "condescendência criminosa.", "D": "violação de sigilo funcional.", "E": "supressão de tributos mediante omissão de informação."}, "classificacao": {"id": "Q0273", "decisao": "revisar", "tema_central_id": "5087", "extras_ids": "5089;5096;5118;4695", "confianca": "0.5", "motivo": "Revisar: mosaico; Alternativas incluem falsidade e crimes tributários além de crimes funcionais; não sustentar foco único pela provável resposta correta."}}, {"id": "Q0274", "texto": "Tendo como referência a jurisprudência sumulada dos tribunais superiores, julgue o item a seguir, acerca de crimes, penas, imputabilidade penal, aplicação da lei penal e institutos. Na hipótese de tentativa de subtração patrimonial e morte consumada, o agente responderá pelo crime de latrocínio consumado.", "comando": "", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0274", "decisao": "publicar", "tema_central_id": "5160", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0275", "texto": "O Ministério Público ofereceu denúncia em face de Tício, pela suposta prática de infração penal de menor potencial ofensivo. Nesse cenário, considerando as disposições da Lei nº 9.099/1995, caso Tício não seja encontrado para ser citado, o juiz:", "comando": "Complete a frase conforme a Lei nº 9.099/1995.", "alternativas": {"A": "suspenderá o processo até que o acusado seja localizado, em\\nrazão da incompatibilidade da citação por edital com o\\nprocedimento do Juizado Especial Criminal;", "B": "extinguirá o processo sem resolução do mérito, em razão da\\nincompatibilidade da citação por edital com o procedimento\\ndo Juizado Especial Criminal;", "C": "determinará que o Ministério Público diligencie novos\\nendereços, antes de determinar a citação por edital;", "D": "encaminhará as peças existentes ao juízo comum para\\nadoção do procedimento previsto em lei;", "E": "determinará a citação por hora certa."}, "classificacao": {"id": "Q0275", "decisao": "publicar", "tema_central_id": "5540", "extras_ids": "4701;5488", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0276", "texto": "Sobre as provas no processo penal, é correto:", "comando": "", "alternativas": {"A": "O interrogatório do réu é ato único, não podendo ser renovado pelo magistrado de ofício ou a pedido das partes.", "B": "A confissão informal realizada perante os agentes da lei é suficiente a ensejar o desfecho condenatório.", "C": "A acareação é admitida entre acusado e vítima, mas é vedada entre corréus, diante da não obrigação destes em dizer a\\nverdade.", "D": "O juiz negará a realização do exame de corpo de delito requerida pela parte quando não for necessária ao esclarecimento\\nda verdade.", "E": "A busca pessoal não dependerá de mandado quando a medida for determinada no curso de busca e apreensão domiciliar."}, "classificacao": {"id": "Q0276", "decisao": "publicar", "tema_central_id": "5543", "extras_ids": "5547;5548;5552;5545;5554", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0277", "texto": "NÃO configura crime contra idoso:", "comando": "", "alternativas": {"A": "Induzir pessoa idosa, mesmo que com discernimento, a outorgar procuração para fins de administração de bens.", "B": "Desdenhar ou menosprezar pessoa idosa.", "C": "Deixar de prestar assistência ao idoso em situação de iminente perigo.", "D": "Abandonar idoso em hospital.", "E": "Reter cartão magnético de conta bancária relativa a benefícios."}, "classificacao": {"id": "Q0277", "decisao": "publicar", "tema_central_id": "4696", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0278", "texto": "Com base na legislação penal extravagante, julgue o item seguinte. Nos crimes em que a pena mínima cominada for igual ou inferior a dois anos, o Ministério Público, ao oferecer a denúncia, poderá propor a suspensão do processo por até quatro anos, se o acusado não for condenado por outro crime e estiverem presentes os demais requisitos da suspensão condicional da pena.", "comando": "", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0278", "decisao": "publicar", "tema_central_id": "5542", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0279", "texto": "Um indivíduo de dezenove anos de idade, livre, consciente e capaz, dirigiu-se a uma joalheria com a intenção de praticar furto. Na loja, passou-se por cliente e pediu a uma vendedora para ver algumas peças. Enquanto via as joias, aproveitando-se de um descuido da vendedora, o indivíduo colocou um colar de ouro em seu bolso e, em seguida, saiu da loja, sem nada ter comprado. Trinta minutos depois, ele retornou à loja e devolveu a joia, incentivado por sua mãe. Apesar disso, o gerente, representando a joalheria, decidiu registrar boletim de ocorrência sobre o fato em uma delegacia de polícia, e o homem foi indiciado por furto simples. Após o término do inquérito policial, o Ministério Público denunciou o acusado por furto simples. A denúncia foi recebida pelo juízo competente quatro anos e seis meses depois da prática do delito, com a determinação da citação do acusado. Nesse caso, é possível o reconhecimento de", "comando": "", "alternativas": {"A": "arrependimento eficaz.", "B": "desistência voluntária.", "C": "prescrição da pretensão punitiva.", "D": "tentativa de furto.", "E": "crime oco."}, "classificacao": {"id": "Q0279", "decisao": "publicar", "tema_central_id": "5188", "extras_ids": "5178;5159", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0280", "texto": "Em data de 20 de dezembro de 2016, Astolfo pratica, em tese, crime contra a honra de Lucíolo, afirmando que este, na condição de funcionário público, subtraiu valores do departamento de obras públicas do município de Giramundo. Considere a data de hoje (28.05.2017) e que Lucíolo teve ciência da suposta ofensa em 29 de dezembro de 2016. Aponte a alternativa incorreta :", "comando": "Aponte a alternativa incorreta.", "alternativas": {"A": "Cabe oferecimento de representação de Lucíolo ao Ministério Público.", "B": "Cabe oferecimento de queixa em juízo por Lucíolo, representado por advogado, atribuindo-se a\\neste poderes especiais.", "C": "Deflagrada a ação penal, é sempre cabível a proposição de incidente de exceção da verdade por\\nAstolfo, com o intuito de provar a subtração atribuída a Lucíolo, isso na fase da defesa escrita.", "D": "Sem Lucíolo manifestar de forma clara que pretende responsabilizar criminalmente Astolfo, o\\ndelegado não poderá deflagrar a investigação da suposta infração contra a honra.", "E": "Oferecida a queixa em juízo, poderá o Ministério Público aditá-la."}, "classificacao": {"id": "Q0280", "decisao": "publicar", "tema_central_id": "5122", "extras_ids": "5472;5471;5474", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0281", "texto": "Dadas as assertivas abaixo, assinalar a alternativa correta. I. Pode o juiz autorizar escutas telefônicas em caso de delitos apenados com detenção ou reclusão, nos crimes em que a lei taxativamente as admita. II. A quebra do sigilo bancário ou fiscal não exclui a proteção constitucional ao segredo, então a cargo dos operadores do processo, sob pena de responsabilização administrativa e criminal. III. Admite-se o sigilo dos autos frente ao investigado e seu advogado, mesmo ante ordem de prisão ou de apreensão de bens, no interesse predominante das investigações. IV. O Ministério Público pode determinar a devassa de correspondências, quando relacionadas ao crime investigado.", "comando": "Assinalar a alternativa correta.", "alternativas": {"A": "Está correta apenas a assertiva I.", "B": "Está correta apenas a assertiva II.", "C": "Estão corretas apenas as assertivas III e IV.", "D": "Estão incorretas todas as assertivas."}, "classificacao": {"id": "Q0281", "decisao": "publicar", "tema_central_id": "5594", "extras_ids": "5555;5499", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0282", "texto": "Assinale a alternativa correta :", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Nos termos do § 1º do art. 19 da Lei n.º 11.340/06, as medidas protetivas de urgência poderão ser concedidas de imediato, observada a prévia manifestação do representante do Ministério Público.", "B": "O ato de comercializar emblemas que utilizem a cruz suástica ou gamada, ainda que sem a finalidade de divulgação do nazismo, constitui o crime previsto no art. 20, § 1º, da Lei n.º 7.716/89.", "C": "Ceder, gratuitamente, arma de fogo, acessório ou munição, de uso permitido, sem autorização e em desacordo com determinação legal ou regulamentar, não tipifica a conduta penal de que trata o art. 14 do Estatuto do Desarmamento.", "D": "O art. 28 da Lei n.º 10.826/03 veda, em qualquer hipótese, ao menor de 25 anos, a aquisição de arma de fogo.", "E": "Constatada a prática de violência doméstica e familiar contra a mulher, segundo as disposições expressas na Lei n.º 11.340/06, o juiz poderá aplicar, de imediato, ao agressor, em conjunto ou separadamente, entre as medidas protetivas de urgência, a de restrição ou suspensão de visitas aos dependentes menores, nesta hipótese ouvida a equipe de atendimento multidisciplinar ou serviço similar."}, "classificacao": {"id": "Q0282", "decisao": "revisar", "tema_central_id": "4683", "extras_ids": "4704;4690;4697", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0283", "texto": "Antonio acabou de sofrer hipoteca, determinada por juiz criminal, de imóvel que recebeu de seu pai. Nesse caso,", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "se houver sentença condenatória transitada em julgado, o próprio juiz criminal determinará a avaliação e a venda do bem em leilão público.", "B": "os embargos são o recurso cabível contra a decretação da hipoteca.", "C": "a medida é cabível, ainda que Antonio seja terceiro, não investigado.", "D": "o imóvel, de origem lícita, não poderia ter sido hipotecado.", "E": "Antonio poderia ter oferecido caução em dinheiro para que o juiz deixasse de mandar proceder à inscrição da hipoteca legal."}, "classificacao": {"id": "Q0283", "decisao": "publicar", "tema_central_id": "5496", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0284", "texto": "No dia 2 de fevereiro de 2022, por volta das 21h, Bernardo, sargento da Marinha, ao se aproximar com seu veículo automotor da porta da garagem de entrada de seu condomínio localizado no bairro do Mutondo, em São Gonçalo, avistou um homem se aproximando rapidamente e mexendo no interior de uma mochila. Bernardo, acreditando ser um assalto, saca sua arma de fogo e, de dentro do próprio carro, efetua disparo, atingindo o alvo pretendido. No entanto, Bernardo acabou disparando e atingindo seu vizinho, Thiago, que retornava do trabalho. Bernardo, percebendo que ele estava imobilizado no chão, em razão de ter sido alvejado, imediatamente o conduz para o hospital mais próximo. No entanto, inobstante a prestação imediata de socorro, Thiago falece. Nesse caminho, funcionários do hospital acionam a Polícia Militar, que prende Bernardo em flagrante, conduzindo-o para a Delegacia de Polícia para as formalidades legais. Em razão dos fatos narrados, após audiência de custódia, o flagrante é convertido em preventiva, e o Ministério Público apresenta exordial acusatória perante o juízo do Tribunal do Júri, classificando o fato no delito de homicídio. Na fase instrutória da judicium accusationis foram apresentadas as filmagens das câmeras de segurança do condomínio que gravaram as imagens dos fatos, indicando o exato momento em que Thiago efetivamente se aproxima do condomínio manuseando sua mochila e o instante em que é atingido pelo disparo que partiu do interior do veículo automotor de Bernardo. Em seu interrogatório, Bernardo alegou que, ao observar a aproximação de um homem manuseando algo dentro de uma mochila, pelo adiantar da hora, atirou antes mesmo de sair do carro, pois acreditou que seria vítima de latrocínio, temendo, inclusive, por sua própria vida. Finda a primeira fase do júri, após manifestação do Ministério Público pela pronúncia nos moldes da denúncia, os autos vão para a defesa técnica se manifestar. Considerando a narrativa fática e a legislação penal vigente, é correto sustentar na defesa de Bernardo, em sede de alegações finais, que ele agiu em legítima defesa:", "comando": "Considerando a narrativa fática e a legislação penal vigente, é correto sustentar na defesa de Bernardo, em sede de alegações finais, que ele agiu em legítima defesa.", "alternativas": {"A": "real, devendo ser, dessa forma, excluída em seu favor a\\nilicitude, motivo pelo qual a defesa de Bernardo deverá pedir\\nsua absolvição sumária com arrimo no Art. 415, inciso III, do\\nCódigo de Processo Penal;", "B": "putativa, devendo ser, dessa forma, observada a teoria\\nlimitada da culpabilidade, consoante dispõe a exposição de\\nmotivos da Parte Geral do Código Penal (item 17). No caso\\nexposto, temos um erro que recaiu sobre a existência da\\ncausa de justificação, o que conduz a observância do\\ndenominado erro de proibição indireto inevitável, restando\\nafastada a culpabilidade, motivo pelo qual a defesa de\\nBernardo deverá pedir sua absolvição sumária;", "C": "putativa, devendo ser, dessa forma, observada a teoria\\nextremada da culpabilidade, consoante dispõe a exposição de\\nmotivos da Parte Geral do Código Penal (item 17). No caso\\nexposto, temos um erro que recaiu sobre a existência da\\ncausa de justificação, o que conduz à observância do\\ndenominado erro de proibição direto inescusável, restando\\nafastada a culpabilidade, motivo pelo qual a defesa de\\nBernardo deverá pedir sua absolvição sumária;", "D": "putativa, devendo ser, dessa forma, observada a teoria\\nlimitada da culpabilidade, consoante dispõe a exposição de\\nmotivos da Parte Geral do Código Penal (item 17). No caso\\nexposto, temos um erro que recaiu sobre pressuposto fático,\\no que conduz à observância do denominado erro de tipo\\neclético escusável, restando afastada a tipicidade, motivo\\npelo qual a defesa de Bernardo deverá pedir sua absolvição\\nsumária;", "E": "putativa, devendo ser, dessa forma, observada a teoria\\nlimitada da culpabilidade, consoante dispõe a exposição de\\nmotivos da Parte Geral do Código Penal (item 17). No caso\\nexposto, temos um erro que recaiu sobre os limites da causa\\nde justificação, o que conduz à observância do denominado\\nerro de proibição indireto invencível, restando afastada a\\nculpabilidade, motivo pelo qual a defesa de Bernardo deverá\\npedir sua absolvição sumária."}, "classificacao": {"id": "Q0284", "decisao": "publicar", "tema_central_id": "5224", "extras_ids": "5231;5214;5527", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0285", "texto": "Constitui uma das características do direito penal do inimigo", "comando": "Complete a frase com a característica correta do direito penal do inimigo.", "alternativas": {"A": "a legislação diferenciada.", "B": "a punição a partir de atos executórios.", "C": "a não utilização de medidas de segurança.", "D": "a observância das garantias processuais penais.", "E": "o abrandamento das penas na antecipação da tutela penal."}, "classificacao": {"id": "Q0285", "decisao": "publicar", "tema_central_id": "4376", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0286", "texto": "No cálculo da pena:", "comando": "No cálculo da pena:", "alternativas": {"A": "A redução pela menoridade do acusado deve incidir após o acréscimo pelo crime continuado.", "B": "O aumento pelo concurso formal deve preceder a diminuição pela confissão espontânea.", "C": "O acréscimo pela má antecedência do acusado deve incidir antes da redução pel
