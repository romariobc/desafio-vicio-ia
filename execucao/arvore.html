a tentativa.", "D": "O aumento pela reincidência deve ser posterior à redução pela participação de menor importância."}, "classificacao": {"id": "Q0286", "decisao": "publicar", "tema_central_id": "5199", "extras_ids": "5202;5203;5204", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0287", "texto": "Segundo o Código Penal, é excludente de ilicitude", "comando": "Complete a frase com exemplos de excludentes de ilicitude segundo o Código Penal.", "alternativas": {"A": "erro de proibição", "B": "estado de necessidade", "C": "doença mental", "D": "embriaguez acidental", "E": "menoridade penal"}, "classificacao": {"id": "Q0287", "decisao": "publicar", "tema_central_id": "5229", "extras_ids": "5230", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0288", "texto": "I. Não há o crime de estupro, nos termos do Código Penal, na relação sexual consensual praticada com maior de 14 e menor de 18 anos. II. É pública, condicionada a representação, a ação penal por crime de sonegação fiscal. III. O baixo grau de instrução ou escolaridade do agente é causa atenuante de pena nos crimes praticados contra o meio ambiente. IV. No caso de concurso formal impróprio, como a conduta deriva de desígnios autônomos, a pena é aplicada pelo sistema da exasperação. V. Nomear, admitir ou designar servidor contra expressa disposição de lei é crime de responsabilidade de prefeitos e vereadores.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Todas as proposições estão corretas.", "B": "Somente as proposições II, III e IV estão corretas.", "C": "Somente as proposições I e III estão corretas.", "D": "Somente a proposição II, IV e V estão corretas.", "E": "Somente as proposições I, III e V estão corretas."}, "classificacao": {"id": "Q0288", "decisao": "revisar", "tema_central_id": "5062", "extras_ids": "5103;4695;4688;5068;5087", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0289", "texto": "“A Lei nº 11.340/2006 aporta em nosso ordenamento jurídico em resposta às graves violações de direitos sofridas pelas mulheres em situação de violência doméstica, às flagrantes desigualdades de gênero e à proteção ineficaz e incompleta dos instrumentos legais existentes anteriormente à edição deste diploma normativo. Neste enorme espaço de vácuo legislativo, a introdução da lei em questão significou verdadeira revolução em matéria de defesa dos direitos das mulheres, quebrando os paradigmas antes existentes, inserindo novos institutos e instaurando um modelo protetivo inteiramente inédito no ordenamento jurídico brasileiro” (STJ, REsp nº 2.070.863/MG, relator: Ministro Joel Ilan Paciornik, relator para acórdão: Ministro Rogerio Schietti Cruz, Terceira Seção, julgado em 13.11.2024, DJEN de 25.03.2025). De acordo com os aspectos processuais penais da violência doméstica e familiar contra a mulher, assinale a alternativa correta.", "comando": "", "alternativas": {"A": "O STJ, por meio da Terceira Seção, fixou a tese quanto ao Tema Repetitivo nº 1.186, de que: 1. a condição de gênero feminino é insuficiente para atrair a aplicabilidade da Lei Maria da Penha em casos de violência doméstica e familiar, prevalecendo sobre a questão etária. 2. a Lei Maria da Penha prevalece quando suas disposições conflitarem com as de estatutos específicos, como o da Criança e do Adolescente.", "B": "Nos casos de violência contra a mulher praticados no âmbito doméstico e familiar, é possível a fixação de valor mínimo indenizatório a título de dano moral, independentemente de pedido expresso da acusação ou da parte ofendida e de instrução probatória, segundo tese firmada quando do Tema Repetitivo nº 983, pelo STJ.", "C": "Nos termos da Lei nº 11.340/2006, o nome da ofendida ficará sob sigilo nos processos em que se apuram crimes praticados no contexto de violência doméstica e familiar contra a mulher, abrangendo o sigilo do nome do autor do fato e os demais dados do processo.", "D": "A concessão das medidas protetivas de urgência, de acordo com a Lei nº 11.340/2006, depende da tipificação penal da violência.", "E": "O STJ definiu as seguintes teses quanto ao Tema Repetitivo nº 1.249: I – as medidas protetivas de urgência (MPUs) têm natureza jurídica de tutela inibitória e sua vigência não se subordina à existência (atual ou vindoura) de boletim de ocorrência, inquérito policial, processo cível ou criminal; II – a duração das MPU vincula-se à persistência da situação de risco à mulher, razão pela qual devem ser fixadas por prazo temporalmente indeterminado; III – eventual reconhecimento de causa de extinção de punibilidade, arquivamento do inquérito policial ou absolvição do acusado não origina, necessariamente, a extinção da medida protetiva de urgência, máxime pela possibilidade de persistência da situação de risco ensejadora da concessão da medida; IV – não se submetem a prazo obrigatório de revisão periódica, mas devem ser reavaliadas pelo magistrado, de ofício ou a pedido do interessado, quando constatado concretamente o esvaziamento da situação de risco. A revogação deve sempre ser precedida de contraditório, com as oitivas da vítima e do suposto agressor. Em caso de extinção da medida, a ofendida deve ser comunicada, nos termos do art. 21 da Lei nº 11.340/2006."}, "classificacao": {"id": "Q0289", "decisao": "publicar", "tema_central_id": "4704", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0290", "texto": "No que diz respeito ao preceituado na Lei nº 9.099/1995, a qual disciplina os Juizados especiais criminais, assinale a alternativa incorreta .", "comando": "Assinale a alternativa incorreta.", "alternativas": {"A": "A ação penal relativa ao crime de lesão corporal\\ndolosa, em todas as suas modalidades, será\\npública incondicionada, já o crime de lesão\\nculposa, terá como correspondente a ação penal\\npública condicionada à representação da vítima\\nou de seu representante legal", "B": "Na fase preliminar, a autoridade policial que\\ntomar conhecimento da ocorrência deverá lavrar\\ntermo circunstanciado e o encaminhar\\nimediatamente ao Juizado, com o autor do fato\\ne a vítima, providenciando as requisições dos\\nexames periciais necessários", "C": "A citação será pessoal e far-se-á no próprio\\nJuizado, sempre que possível, ou por mandado", "D": "Os atos processuais serão públicos e poderão\\nrealizar-se em horário noturno, conforme\\ndispuserem as normas de organização judiciária", "E": "Todas as provas serão produzidas na audiência\\nde instrução e julgamento, podendo o Juiz limitar\\nou excluir as que considerar excessivas,\\nimpertinentes ou protelatórias"}, "classificacao": {"id": "Q0290", "decisao": "publicar", "tema_central_id": "4701", "extras_ids": "5488;5535", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0291", "texto": "Quando se tratar de crimes relativos ao tráfico de drogas, o prazo para a conclusão do inquérito policial é de 30 dias, se o indiciado estiver preso e de 90 dias, se estiver solto, podendo ser duplicados, mediante pedido justificado da autoridade de polícia judiciária.", "comando": "Explique os prazos para a conclusão do inquérito policial em crimes relativos ao tráfico de drogas.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0291", "decisao": "publicar", "tema_central_id": "4708", "extras_ids": "5500", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0292", "texto": "Considerando a atual conjuntura da política criminal brasileira, é correto afirmar que", "comando": "", "alternativas": {"A": "a eficiência do trabalho policial pode ser verificado pelo baixo índice de letalidade e o alto índice de prisões efetuadas.", "B": "o processo de encarceramento em massa no Brasil alavancou-se no período de vigência da Constituição Federal de 1988,\\napesar desta ter como seus fundamentos a cidadania e a dignidade da pessoa humana.", "C": "a construção de presídios tem sido uma política eficaz de redução do encarceramento em massa.", "D": "o crescimento da população prisional é isonômico no aspecto de gênero.", "E": "a proteção de direitos humanos tem sido o principal resultado da política criminal brasileira, uma vez que o aumento da\\npopulação prisional demonstra que os bens jurídicos estão sendo cada vez mais protegidos por meio do direito penal."}, "classificacao": {"id": "Q0292", "decisao": "publicar", "tema_central_id": "4374", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0293", "texto": "Lucas e Serafim, primários, foram acusados, em conjunto, de praticarem um furto mediante fraude ocorrido em setembro de 2015. Recebida a denúncia em 2016, a sentença foi prolatada em 2018, absolvendo Lucas e condenando Serafim. Interposto recurso por Serafim e pelo Ministério Público, o tribunal deu provimento à apelação do Ministério Público para condenar Lucas, igualmente, conforme acórdão publicado em 2021, tendo havido certidão de trânsito em julgado no mesmo ano. Ambos restaram condenados a uma pena de 2 anos de reclusão, substituída por restritiva de direitos de prestação de serviços à comunidade e prestação pecuniária, além de multa cumulativa. Lucas iniciou o cumprimento da pena restritiva e, após cumprido pouco mais da metade das penas, interrompeu o cumprimento em 2022, sendo apurado saldo para conversão em 11 meses de reclusão. Serafim participou da audiência em 2023, tendo sido encaminhado à instituição para o cumprimento das penas; porém, não se apresentou ao local onde deveria prestar os serviços à comunidade e não pagou a prestação pecuniária ou a multa. Sobre os fatos, é correto afirmar que:", "comando": "", "alternativas": {"A": "a pena de multa cumulativamente aplicada aos condenados encontra-se prescrita;", "B": "a pena de Lucas foi atingida pela prescrição da pretensão executória em 2025;", "C": "a pena de Serafim foi atingida pela prescrição da pretensão executória em 2025;", "D": "ambos se beneficiam da prescrição da pretensão punitiva pela pena concretamente aplicada;", "E": "nenhum dos dois condenados se beneficia de qualquer prescrição."}, "classificacao": {"id": "Q0293", "decisao": "publicar", "tema_central_id": "5185", "extras_ids": "5188;5189", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0294", "texto": "A respeito da culpabilidade, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": {"A": "Para haver exclusão ou diminuição da culpabilidade, a perda ou redução da capacidade de entendimento do caráter ilícito do fato causada pelo uso de entorpecente não deve decorrer necessariamente de caso fortuito ou força maior, visto que a dependência química, por si só, afasta ou reduz a responsabilização penal.", "B": "Segundo a jurisprudência do STJ, no delito de omissão de recolhimento de contribuição previdenciária, a impossibilidade de repasse das contribuições previdenciárias em decorrência de crise financeira da empresa não constitui, nem sequer em tese, causa supralegal de exclusão da culpabilidade (inexigibilidade de conduta diversa)", "C": "Conforme a teoria normativa pura, a culpabilidade não se exaure na relação de desconformidade substancial entre ação e ordenamento jurídico, mas fundamenta a reprovação pessoal contra o autor, no sentido de este não ter omitido a ação antijurídica quando ainda podia.", "D": "De acordo com a teoria limitada da culpabilidade, não se faz distinção entre erro de tipo (o que recai sobre a situação de fato) e erro de proibição (o que recai sobre os limites autorizadores da norma), sendo todas essas situações consideradas erro de proibição.", "E": "Nas correntes preventivas da culpabilidade, a teoria da motivação normativa tem como característica básica fundar a culpabilidade na liberdade de autodeterminação, excluída a capacidade de motivação normativa do sujeito."}, "classificacao": {"id": "Q0294", "decisao": "publicar", "tema_central_id": "5211", "extras_ids": "5212;5213;5214;5217", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0295", "texto": "Quanto à fluência dos prazos no processo penal, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": {"A": "Para a defensoria pública, os prazos contam-se da data do\\nrecebimento dos autos, com vista naquele órgão, e não da\\naposição no processo do ciente de seu membro.", "B": "O prazo para a interposição de apelação pelo assistente de\\nacusação, habilitado ou não, será de quinze dias a contar do\\ntérmino do prazo do MP.", "C": "Tanto para o MP quanto para a defensoria pública, os prazos\\ncontam-se em dobro.", "D": "Notadamente nos prazos de comunicação, a regra é a fluência\\ndo prazo a partir da juntada do mandado.", "E": "Para efeitos de contagem de prazo, considera-se intimado\\no representante do MP por meio de publicação na imprensa\\noficial ou por via de mandado judicial."}, "classificacao": {"id": "Q0295", "decisao": "publicar", "tema_central_id": "5489", "extras_ids": "5583;5514", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0296", "texto": "Diversamente do que ocorre em relação ao processo civil, no processo penal não se admite que, em caso de morte da vítima, os familiares assumam o lugar dela, no pólo ativo da ação penal privada, para efeito de apresentação de queixa.", "comando": "Assinale a alternativa correta.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0296", "decisao": "publicar", "tema_central_id": "5472", "extras_ids": "5474", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0297", "texto": "O Direito Penal Econômico, em sentido estrito, é o conjunto de normas jurídico-penais que protegem a ordem socioeconômica. Esse ramo do Direito Penal visa à proteção da atividade econômica presente e desenvolvida na economia. Os crimes contra a ordem tributária e contra o sistema financeiro se amoldam nessa perspectiva. Sobre eles é correto afirmar o seguinte:", "comando": "Sobre eles é correto afirmar o seguinte:", "alternativas": {"A": "De acordo com a Lei 8137/90, o dia-multa será fixado pelo juiz em valor não inferior a 10 (dez)\\nnem superior a 300 (trezentos) Bônus do Tesouro Nacional.", "B": "não se aplica o princípio da insignificância aos crimes contra a ordem tributária, pois o bem\\njurídico protegido é a higidez do Sistema Tributário Nacional.", "C": "o crime contra a ordem tributária relacionado à conduta de falsificar ou alterar nota fiscal, fatura,\\nduplicata, nota de venda, ou qualquer outro documento relativo à operação tributável, é classificado\\ncomo crime formal, não exigindo a materialização do resultado para a sua consumação.", "D": "induzir ou manter em erro sócio, investidor ou repartição pública competente, relativamente a\\noperação ou situação financeira, sonegando-lhe informação ou prestando-a falsamente é crime com\\npena de reclusão de 2 (dois) a 6 (seis) anos ou multa.", "E": "extingue-se a punibilidade dos crimes definidos na Lei 8137/90 quando o agente promover o\\npagamento do tributo, inclusive acessórios, antes do recebimento da denúncia."}, "classificacao": {"id": "Q0297", "decisao": "revisar", "tema_central_id": "4683", "extras_ids": "4695;4689", "confianca": "0.5", "motivo": "Revisar: generico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0298", "texto": "Os crimes contra as relações de consumo previstos na Lei n. 8.137/90 são punidos, apenas, na modalidade dolosa.", "comando": "Analise a afirmativa sobre os crimes contra as relações de consumo previstos na Lei n. 8.137/90.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0298", "decisao": "revisar", "tema_central_id": "4683", "extras_ids": "4694", "confianca": "0.5", "motivo": "Revisar: generico, lei_especial_sem_no; O nó 4694 diz especificamente CDC, mas a questão cobra Lei 8137. Sugestão na disciplina para curadoria sem declarar equivalência legal nem publicar."}}, {"id": "Q0299", "texto": "Assinale a alternativa correta.", "comando": "", "alternativas": {"A": "A criminologia crítica defende a análise individualizada da periculosidade do agente como direito inerente ao princípio do respeito à dignidade humana.", "B": "A Escola positivista pregava a análise puramente objetiva do fato, deixando em segundo plano as características pessoais de seu autor.", "C": "A teoria retributiva dos fins da pena foi desenvolvida a partir dos estudos de Lombroso e Garofalo, em meados do século XVIII.", "D": "A teoria do labelling approach dispõe-se a estudar, dentre outros aspectos do sistema punitivo, os mecanismos de reação social ao delito e a influência destes na reprodução da criminalidade.", "E": "A teoria finalista da ação é fruto da concepção positivista de livre-arbítrio, que entende o homem como ser determinado pelas circunstâncias sociais."}, "classificacao": {"id": "Q0299", "decisao": "publicar", "tema_central_id": "4373", "extras_ids": "4388;4384", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0300", "texto": "Àquele que oculta uma arma de fogo utilizada por terceiro para a prática anterior de um roubo, consignando-se não haver qualquer vínculo de parentesco entre ambos, pode-se atribuir o crime de ______. Assinale a alternativa que preencha corretamente a lacuna.", "comando": "", "alternativas": {"A": "favorecimento pessoal", "B": "favorecimento real", "C": "coautoria do crime de roubo", "D": "participação do crime de roubo"}, "classificacao": {"id": "Q0300", "decisao": "publicar", "tema_central_id": "5084", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0301", "texto": "NÃO admite perdão judicial:", "comando": "Complete a frase indicando os casos em que não se admite perdão judicial.", "alternativas": {"A": "a lesão corporal culposa causada na direção de veículo automotor.", "B": "a utilização de meio de transporte sem recursos para efetuar o pagamento.", "C": "a guarda doméstica de pássaro silvestre cuja espécie não é considerada ameaçada de extinção.", "D": "a retorsão imediata à difamação, que consista em outra difamação."}, "classificacao": {"id": "Q0301", "decisao": "publicar", "tema_central_id": "5197", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0302", "texto": "César é açougueiro e está trabalhando regulamente no freezer do açougue, quando uma pessoa, fugindo da Polícia, se esconde atrás de algumas peças de carne, sem que César tenha percebido. Ao terminar seu turno, cansado, César acaba jogando uma enorme faca em direção a um armário, momento em que a faca acaba por acertar fatalmente o fugitivo. Sobre a conduta de César, trata-se de caso de exclusão", "comando": "", "alternativas": {"A": "do dolo por erro de tipo.", "B": "da imputabilidade.", "C": "da culpabilidade por inexigibilidade de conduta diversa.", "D": "do dolo por erro de proibição.", "E": "de ilicitude."}, "classificacao": {"id": "Q0302", "decisao": "publicar", "tema_central_id": "5224", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0303", "texto": "Com relação à aplicação da lei penal, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": {"A": "As frações de dia são computadas como um dia integral de pena nas penas privativas de liberdade e nas restritivas de direitos.", "B": "O direito penal, quanto ao tempo do crime, considera praticado o crime no momento do seu resultado.", "C": "A sentença estrangeira, quando a aplicação da lei brasileira produz as mesmas consequências, poderá ser homologada no Brasil para todos os efeitos, exceto para obrigar o condenado à reparação do dano.", "D": "Ficam sujeitos à lei brasileira os crimes contra o patrimônio ou a fé pública do DF, de estado, de município, de empresa pública, sociedade de economia mista, autarquia ou fundação instituída pelo poder público, embora cometidos no estrangeiro, sendo o agente punido segundo a lei brasileira, ainda que absolvido no estrangeiro.", "E": "Não é aplicável a lei brasileira aos crimes praticados a bordo de aeronaves ou embarcações estrangeiras de propriedade privada, ainda que achando-se aquelas em pouso no território nacional ou em vôo no espaço aéreo correspondente, e estas em porto ou mar territorial do Brasil."}, "classificacao": {"id": "Q0303", "decisao": "publicar", "tema_central_id": "5180", "extras_ids": "5182;5181;5201", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0304", "texto": "Em matéria de competência dos Juizados Especiais Criminais, de acordo com a Jurisprudência do Supremo Tribunal Federal,", "comando": "", "alternativas": {"A": "é absoluta a competência dos Juizados Especiais Criminais, razão pela qual não se admite o deslocamento da competência, por regras de conexão ou continência, para o Juízo Comum ou Tribunal do Júri, no concurso de infrações penais de menor potencial ofensivo e comum.", "B": "não se admite a proposta de transação penal se ficar comprovado ter sido o agente beneficiado anteriormente, no prazo de oito anos, pela aplicação de pena restritiva ou multa.", "C": "na ação penal de iniciativa do ofendido no Jecrim não poderá ser oferecida queixa oral, em qualquer hipótese.", "D": "os institutos despenalizadores previstos na Lei nº 9.099/1995 constituem garantia individual do acusado e têm de ser assegurados, quando cabíveis, independente do juízo no qual tramitam os processos.", "E": "o não oferecimento da representação pelo ofendido na audiência preliminar implica decadência do direito."}, "classificacao": {"id": "Q0304", "decisao": "publicar", "tema_central_id": "5540", "extras_ids": "4701;5541", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0305", "texto": "A ação penal pública é de iniciativa exclusiva do Ministério Público e tem por objetivo dar concretude ao jus puniendi estatal. Acerca dessa modalidade de ação penal, assinale a alternativa correta.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "O prazo para oferecimento da denúncia é de 5 (cinco)\\ndias, caso o acusado esteja preso, e de 20 (vinte) dias\\nse estiver em liberdade", "B": "O Ministério Público poderá dispor da ação penal,\\npodendo dela desistir sempre que achar adequado à\\ndefesa da coletividade, independentemente do eventual\\ncrime praticado pelo acusado", "C": "Quando do oferecimento da denúncia é imprescindível\\na qualificação do acusado", "D": "O direito de representação somente poderá ser exercido\\npessoalmente, vedada a sua realização por meio de\\nprocurador", "E": "Caberá ao Ministro da Justiça apresentar requisição\\npara o prosseguimento de ação penal pública nos casos\\nprevistos em lei em que se verifica o cometimento de\\ncrimes em face do Presidente da República. A requisição\\né ato administrativo irrevogável e não há prazo legal\\npara a sua apresentação"}, "classificacao": {"id": "Q0305", "decisao": "publicar", "tema_central_id": "5466", "extras_ids": "5473;5471;5469", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0306", "texto": "Sobre o crime de associação criminosa é correto afirmar que", "comando": "", "alternativas": {"A": "demanda a associação de 4 ou mais pessoas estruturalmente ordenada e caracterizada pela divisão de tarefas com o\\nobjetivo de praticar crimes.", "B": "exige a demonstração do elemento subjetivo especial consistente no ajuste prévio entre os membros com a finalidade\\nespecífica de cometer crimes indeterminados.", "C": "tem caráter hediondo, a despeito de ter pena menor do que a associação para o tráfico, que não é equiparado ao\\nhediondo.", "D": "exige para sua configuração o concurso de agentes e a prática de infrações penais cujas penas máximas sejam superiores\\na 4 (quatro) anos.", "E": "admite a colaboração premiada com redução de até 1/3 da pena, desde que ao menos um agente com cargo político seja\\ndelatado."}, "classificacao": {"id": "Q0306", "decisao": "publicar", "tema_central_id": "5146", "extras_ids": "4705", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0307", "texto": "Determinado policial militar efetuou a prisão em flagrante de Luciano e o conduziu à delegacia de polícia. Lá, com o objetivo de fazer Luciano confessar a prática dos atos que ensejaram sua prisão, o policial responsável por seu interrogatório cobriu sua cabeça com um saco plástico e amarrou-o no seu pescoço, asfixiando-o. Como Luciano não confessou, o policial deixou-o trancado na sala de interrogatório durante várias horas, pendurado de cabeça para baixo, no escuro, período em que lhe dizia que, se ele não confessasse, seria morto. O delegado de polícia, ciente do que ocorria na sala de interrogatório, manteve-se inerte. Em depoimento posterior, Luciano afirmou que a conduta do policial lhe provocara intenso sofrimento físico e mental. Considerando a situação hipotética acima e o disposto na Lei Federal n.º 9.455/1997, julgue o item subsequente. O delegado não pode ser considerado coautor ou partícipe da conduta do policial, pois o crime de tortura somente pode ser praticado de forma comissiva.", "comando": "Julgue o item subsequente.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0307", "decisao": "publicar", "tema_central_id": "4707", "extras_ids": "5223", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0308", "texto": "Inquérito policial arquivado pelo Ministério Público por ausência de elementos suficientes de informação importa", "comando": "", "alternativas": {"A": "coisa julgada material.", "B": "ilegitimidade ad causam.", "C": "ilegitimidade ad processum.", "D": "ausência de justa causa processual em sentido estrito.", "E": "prescrição da pretensão punitiva estatal."}, "classificacao": {"id": "Q0308", "decisao": "publicar", "tema_central_id": "5501", "extras_ids": "5467", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0309", "texto": "Segundo o Artigo 61 da Lei nº 9.605/98 a pena para quem disseminar doença ou praga ou espécies que possam causar dano à agricultura, à pecuária, à fauna, à flora ou aos ecossistemas é de:", "comando": "Complete a frase com a pena prevista no Artigo 61 da Lei nº 9.605/98.", "alternativas": {"A": "reclusão, de um a cinco anos.", "B": "prestação de serviços à comunidade com interdição temporária de direitos e multa.", "C": "reclusão, de um a quatro anos, e multa.", "D": "reclusão, de seis meses a dois anos, e multa.", "E": "detenção, de três meses a um ano, e multa."}, "classificacao": {"id": "Q0309", "decisao": "publicar", "tema_central_id": "4688", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0310", "texto": "Sobre a aplicação da Lei Processual Penal, é correto afirmar que:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "no Brasil, adota-se integralmente o princípio da irretroatividade da lei processual penal, que impede que as inovações na norma processual penal sejam aplicadas de imediato para fatos praticados antes de sua entrada em vigor.", "B": "ela admitirá interpretação extensiva e o suplemento de princípios gerais do direito, mas não a aplicação analógica.", "C": "o processo penal reger-se-á, em todo o território brasileiro, pelo Código de Processo Penal, não havendo qualquer ressalva prevista neste diploma.", "D": "as normas previstas no Código de Processo Penal de natureza híbrida, ou seja, com conteúdo de direito processual e de direito material, devem respeitar o princípio que veda a aplicação retroativa da lei penal, quando seu conteúdo for prejudicial ao réu.", "E": "ela admitirá interpretação extensiva e aplicação analógica, mas não o suplemento dos princípios gerais do direito"}, "classificacao": {"id": "Q0310", "decisao": "publicar", "tema_central_id": "5505", "extras_ids": "5507;5508;5506", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0311", "texto": "Considere que um oficial de justiça não tenha localizado o réu, para realizar a citação pessoal na ação penal, no endereço que constava dos autos. Nesse caso,", "comando": "", "alternativas": {"A": "o oficial de justiça deverá proceder à citação por hora certa, a ser cumprida, no máximo, em três dias.", "B": "o juiz decretará a revelia do réu e dará seguimento à ação penal.", "C": "será feita a citação por edital e, caso o réu não compareça, a ação penal ficará suspensa.", "D": "será citada a Defensoria Pública para realizar a defesa técnica do réu.", "E": "a falta de citação pessoal interromperá o prazo prescricional até a localização do réu."}, "classificacao": {"id": "Q0311", "decisao": "publicar", "tema_central_id": "5488", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0312", "texto": "Para Liszt, o fundamento da pena é orientado às finalidades de: a) ressocialização dos delinquentes suscetíveis de socialização; b) intimidação dos que não têm necessidade de socialização; c) neutralização dos não suscetíveis de socialização.", "comando": "Explique as finalidades da pena segundo Liszt.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0312", "decisao": "publicar", "tema_central_id": "4384", "extras_ids": "5200", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0313", "texto": "A condenação tem como efeito genérico tornar certa a obrigação de reparar o dano. Esse efeito é automático, não precisa ser expressamente pronunciado pelo juiz na sentença condenatória e destina-se a formar título executivo judicial para a propositura de ação civil ex delicto.", "comando": "Explique o efeito genérico da condenação no que se refere à obrigação de reparar o dano.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0313", "decisao": "publicar", "tema_central_id": "5209", "extras_ids": "5577;5475", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0314", "texto": "O habeas corpus é", "comando": "Complete a frase sobre o habeas corpus.", "alternativas": {"A": "ação de natureza constitucional destinada a coibir qual- quer ilegalidade ou abuso de poder contra a liberdade de locomoção.", "B": "recurso previsto na Constituição Federal para evitar atentado na liberdade de ir e vir ou no direito líquido e certo.", "C": "remédio constitucional, de caráter liberatório, destinado a coibir qualquer coação ilegal na sua liberdade de ir e vir ou evitar a consumação de uma ilegalidade, por ato de autoridade ou de particular.", "D": "medida de caráter liberatório que tem por finalidade obter reforma de decisão judicial, com apreciação de novas provas."}, "classificacao": {"id": "Q0314", "decisao": "publicar", "tema_central_id": "5477", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0315", "texto": "Paulo, nascido em 15/8/1996, foi denunciado em 24/5/2020, pela prática do crime de roubo majorado tentado, que teria sido praticado em 7/4/2016. Recebida a denúncia em 30/5/2020, Paulo foi condenado a uma pena de 2 anos e 9 meses pela prática delitiva em 20/10/2021, tendo a condenação transitado em julgado em 1/12/2021. Nessa situação, a prescrição, segundo a jurisprudência atual do STF,", "comando": "Considerando os dados apresentados, analise a prescrição aplicável ao caso de Paulo.", "alternativas": {"A": "já teria ocorrido antes do oferecimento da denúncia.", "B": "ocorrerá em 2 anos após o trânsito em julgado da condenação, quer para a defesa quer para a acusação.", "C": "ocorrerá em 4 anos após o trânsito em julgado da condenação, tanto para a defesa quanto para a acusação.", "D": "ocorrerá em 6 anos após o trânsito em julgado da condenação para a defesa e para a acusação.", "E": "ocorrerá em 8 anos após o trânsito em julgado da condenação, tanto para a defesa quanto para a acusação."}, "classificacao": {"id": "Q0315", "decisao": "publicar", "tema_central_id": "5185", "extras_ids": "5188;5189;5187", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0316", "texto": "Considere a seguinte situação: A, que acabara de ter um filho, que morre logo a seguir, sob a influência do estado puerperal, vai ao berçário e, por erro, já que acreditava tratar-se de seu próprio filho que não sabia estar morto, mata criança diversa. Dispõe o artigo 20, § 3º, do Código Penal, que, em tal caso, não se consideram as condições ou qualidades da vítima, senão as da pessoa contra quem o agente queria praticar o crime. A questão é, então, no ordenamento pátrio, resolvida:", "comando": "Explique como o ordenamento jurídico brasileiro resolve essa situação segundo o artigo 20, § 3º, do Código Penal.", "alternativas": {"A": "Pela aplicação da teoria da equivalência.", "B": "Pela aplicação da teoria da concreção.", "C": "Pela aplicação da teoria da concretização.", "D": "Como crime impossível."}, "classificacao": {"id": "Q0316", "decisao": "publicar", "tema_central_id": "5224", "extras_ids": "5153", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0317", "texto": "O direito de representação deve ser exercido no prazo de seis meses contados a partir da data do fato, uma vez que o ofensor foi identificado nessa ocasião, sob pena de decadência.", "comando": "Explique o prazo para o exercício do direito de representação no contexto apresentado.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0317", "decisao": "publicar", "tema_central_id": "5198", "extras_ids": "5471", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0318", "texto": "Com intenção de matar Mário, Lúcio adquiriu, de forma clandestina, uma arma de fogo e munições. Após monitorar a rotina da vítima, Lúcio aguardou Mário sair do trabalho e, enquanto ele caminhava em direção ao seu veículo, Lúcio sacou a arma e disparou uma única vez, atingindo-o. Mesmo possuindo ainda quatro projéteis intactos na arma, Lúcio sentiu repentino remorso, guardou a arma e ligou para o serviço de emergência. Mário foi socorrido, mas, apesar de todo o esforço médico empregado, veio a falecer dias depois no hospital em decorrência exclusiva dos ferimentos causados pelos disparos. Diante de tal situação hipotética, assinale a afirmativa correta.", "comando": "", "alternativas": {"A": "O caso narrado configura desistência voluntária, uma vez que Lúcio interrompeu voluntariamente a execução do homicídio quando ainda dispunha de meios para prosseguir, devendo, portanto, responder apenas pelo delito de lesão corporal.", "B": "O caso narrado configura arrependimento eficaz, pois Lúcio exauriu os meios de execução que seriam suficientes para atingir o resultado almejado, contudo, agiu positivamente para evitá-lo, devendo, portanto, responder apenas pela tentativa de homicídio.", "C": "A intervenção de Lúcio ao chamar o socorro não exclui a tipicidade, uma vez que o resultado morte efetivamente ocorreu por consequência direta de sua conduta, devendo ele responder por homicídio consumado, sem prejuízo da aplicação de atenuante genérica.", "D": "O caso narrado configura arrependimento posterior, pois Lúcio buscou minimizar as consequências do crime praticado logo após a sua consumação ao chamar o socorro médico, o que enseja a redução da pena do homicídio de um a dois terços.", "E": "O caso narrado configura crime impossível por ineficácia relativa do meio empregado, pois a intervenção médica quase evitou o resultado, demonstrando que a conduta do agente não era inequivocamente apta a garantir a consumação inicialmente pretendida."}, "classificacao": {"id": "Q0318", "decisao": "publicar", "tema_central_id": "5178", "extras_ids": "5177;5150;5203", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0319", "texto": "A co-autoria é impossível nos crimes: I. Culposos; II. Unissubsistentes; III. Habitual ou de mera conduta.", "comando": "Complete a frase indicando em quais crimes a co-autoria é impossível.", "alternativas": {"A": "Comissivos.", "B": "Omissivos.", "C": "Próprios.", "D": "De mão própria.", "E": "Culposos"}, "classificacao": {"id": "Q0319", "decisao": "revisar", "tema_central_id": "5073", "extras_ids": "5072", "confianca": "0.916667", "motivo": "Revisar: texto_inconsistente; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0320", "texto": "O Direito Processual Penal, doutrinariamente, elenca as espécies de testemunhas. Dentre elas há a chamada testemunha fedatária.", "comando": "Marque abaixo a sentença CORRETA acerca da referida espécie", "alternativas": {"A": "é a testemunha que depõe sobre algum fato que ouviu dizer.", "B": "é a testemunha que depõe sobre a regularidade de algum ato praticado no inquérito ou no processo.", "C": "é a pessoa que foi indicada por outra testemunha, não sendo computada no número máximo de testemunhas.", "D": "trata-se dos casos em que a Lei de Drogas e a Lei do crime organizado autorizam os agentes de polícia a se infiltrarem para obterem informações acerca desses crimes."}, "classificacao": {"id": "Q0320", "decisao": "publicar", "tema_central_id": "5550", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0321", "texto": "Assinale a alternativa CORRETA:", "comando": "", "alternativas": {"A": "Na chamada autoria colateral, não há vínculo subjetivo entre os autores.", "B": "Os únicos requisitos do concurso de pessoas são:\\npluralidade de participantes; pluralidade de condutas; relevância causal de cada conduta; e identidade\\nde infração penal.", "C": "O crime de aborto com o consentimento da gestante\\nnão configura exceção à teoria monista unitária do\\nconcurso de pessoas.", "D": "O delito de associação para o tráfico de drogas possui natureza hedionda."}, "classificacao": {"id": "Q0321", "decisao": "publicar", "tema_central_id": "5071", "extras_ids": "5073;4708", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0322", "texto": "Delegado Mário foi denunciado pelo delito de abuso de autoridade, tendo em vista a prática de conduta que se enquadra na seguinte descrição típica: “deixar injustificadamente de comunicar prisão em flagrante à autoridade judiciária no prazo legal.” O Magistrado competente para a análise da inicial acusatória entendeu por bem rejeitá-la. Inconformado, o Ministério Público resolve recorrer de tal decisão.", "comando": "Nessa hipótese, o recurso cabível será", "alternativas": {"A": "Apelação, no prazo de 5 dias.", "B": "Apelação, no prazo de 10 dias.", "C": "Recurso em Sentido Estrito, no prazo de 20 dias.", "D": "Recurso em Sentido Estrito, no prazo de 2 dias.", "E": "Recurso em Sentido Estrito, no prazo de 5 dias."}, "classificacao": {"id": "Q0322", "decisao": "publicar", "tema_central_id": "5561", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0323", "texto": "Acerca de provas, instrumentos legais de obtenção de prova e procedimento probatório, assinale a opção correta", "comando": "Assinale a opção correta", "alternativas": {"A": "No sistema processual brasileiro, admite-se prova emprestada, desde que produzida em face das mesmas partes e submetida ao duplo contraditório, ou seja, a observância deste no processo originário será renovada no processo para o qual tiver sido transladada. Por essa razão, não se admitem, no processo penal, os elementos informativos produzidos em inquérito civil, por constituir procedimento não contraditório, assim como não são admitidas as transcrições das interceptações telefônicas autorizadas em ação penal diversa.", "B": "O interrogatório é considerado hodierna e majoritariamente como meio de defesa. Caso o réu encontre-se preso, cumprirá ao magistrado realizar o ato processual em sala própria, no estabelecimento em que estiver recolhido o réu, assegurando a publicidade interna do ato, ou então ordenar a requisição do preso para participar da audiência de instrução e julgamento, ainda que este tenha manifestado desejo de ser dispensado do ato, ratificado pela defesa, em razão do direito de presença ser indisponível.", "C": "O sistema processual penal brasileiro assegura ao investigado ou ao réu o direito de não produzir provas contra si mesmo, em qualquer fase da persecução penal, e, desse modo, o investigado ou o réu não poderão ser compelidos a se submeter a procedimentos invasivos, como, por exemplo, o reconhecimento pessoal ou a reconstituição simulada dos fatos.", "D": "O sistema processual penal brasileiro autoriza a produção antecipada de provas, desde que observados o binômio da urgência e relevância, a adequação ao momento da persecução penal, a legitimação do órgão acusatório e a proporcionalidade da medida. Tem-se como exemplo autorizador a informação acerca do risco de morte de testemunhas ameaçadas por associação criminosa, com possibilidade de perecimento dos depoimentos relevantes", "E": "Na obtenção da colaboração premiada, a lei de regência limita o acesso dos defensores aos autos, especialmente no que se refere às diligências em andamento, e impõe o dever de o investigado delator firmar compromisso de dizer a verdade do que souber e do que lhe for perguntado, sendo o depoimento mantido em sigilo até o recebimento da denúncia"}, "classificacao": {"id": "Q0323", "decisao": "publicar", "tema_central_id": "5590", "extras_ids": "5593;5547;5557;5550;5595", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0324", "texto": "É certo afirmar: I. A pena de prisão simples deve ser cumprida, sem rigor penitenciário, em estabelecimento especial ou seção especial de prisão comum, em regime semiaberto ou aberto. II. As penas acessórias previstas no Código Penal são a perda da função pública eletiva ou de nomeação, as interdições de direitos e a publicidade da sentença. III. No caso da semi-imputabilidade, a periculosidade é presumida a partir da verificação, por meio da realização de exame pericial, do estado de doença ou perturbação mental, bem como de desenvolvimento mental incompleto ou retardado do indivíduo no instante da prática do fato delituoso. Nesse caso, o juiz pode aplicar medida de segurança, devendo fundamentar a sua decisão demonstrando a existência da periculosidade. IV. O trabalho do preso será remunerado, não podendo ser inferior a três quartos do salário mínimo, estando sujeito ao regime da Consolidação das Leis do Trabalho.", "comando": "Analisando as proposições, pode-se afirmar:", "alternativas": {"A": "Todas as proposições estão corretas.", "B": "Somente as proposições II e III estão corretas.", "C": "Somente as proposições I e III estão corretas.", "D": "Somente as proposições I e IV estão corretas."}, "classificacao": {"id": "Q0324", "decisao": "revisar", "tema_central_id": "5199", "extras_ids": "5201;5209;5184;4703", "confianca": "0.5", "motivo": "Revisar: mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0325", "texto": "Considerando as afirmativas abaixo, é CORRETO afirmar que:", "comando": "", "alternativas": {"A": "A extinção da punibilidade, nos casos de\\ntransação penal em crimes ambientais de\\nmenor potencial ofensivo, dependerá de\\nlaudo de constatação de reparação do dano\\nambiental, enquanto que a realização da\\nsuspensão condicional do processo para\\nos crimes ambientais dependerá da prévia\\ncomposição do dano ambiental.", "B": "A superveniência de sentença\\ncondenatória não esvai a alegação de\\ninépcia da denúncia, pois, como o réu\\ndefende-se do fato nela descrito, sempre\\nestará prejudicado o exercício do\\ncontraditório e da ampla defesa.", "C": "A litispendência, pressuposto processual\\nque deve ser analisado para fins de\\nrecebimento da denúncia, configura-se\\nquando duas ou mais ações penais forem\\ndirigidas contra o mesmo acusado, com a\\nimputação da prática de condutas e\\nqualificações jurídicas idênticas.", "D": "A justa causa é exigência legal para o\\nrecebimento da denúncia, instauração e\\nprocessamento da ação penal,\\nconsubstanciando-se pela somatória de\\ntrês componentes essenciais, quais sejam,\\na tipicidade, a punibilidade e a viabilidade\\nquanto à autoria.", "E": "Nas ações penais públicas condicionadas\\nà representação da ofendida de que trata a\\nLei nº 11.340/2006 (Lei Maria da Penha),\\nsó será admitida a renúncia à\\nrepresentação perante o juiz, em audiência\\nespecialmente designada com tal\\nfinalidade, antes do oferecimento da\\ndenúncia e ouvido o Ministério Público."}, "classificacao": {"id": "Q0325", "decisao": "revisar", "tema_central_id": "5467", "extras_ids": "5494;5473;4704;4688", "confianca": "0.5", "motivo": "Revisar: mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0326", "texto": "Constitui crime previsto na lei de drogas", "comando": "Complete a frase ou responda sobre o crime previsto na lei de drogas.", "alternativas": {"A": "fornecer, desde que onerosamente, maquinário, aparelho, instrumento ou qualquer outro objeto destinado à fabricação, preparação, produção ou transformação de drogas, sem autorização ou em desacordo com determinação legal ou regulamentar.", "B": "oferecer droga, desde que em caráter habitual e ainda que sem objetivo de lucro, a pessoa de seu relacionamento, para juntos consumirem.", "C": "prescrever ou ministrar, culposamente, drogas, sem que delas necessite o paciente, ou fazê-lo em doses excessivas ou em desacordo com determinação legal ou regulamentar.", "D": "conduzir embarcação ou aeronave após o consumo de drogas, ainda que sem exposição a dano potencial a incolumidade de outrem.", "E": "consentir que outrem se utilize de local de que tem a propriedade para o tráfico ilícito de drogas, desde que o faça onerosamente."}, "classificacao": {"id": "Q0326", "decisao": "publicar", "tema_central_id": "4708", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0327", "texto": "Em uma ação penal por crime ocorrido em 04/03/2023, o réu, ao ser interrogado, confessa espontaneamente, perante o juiz, a prática do delito que lhe é imputado. Na folha de antecedentes criminais do acusado, constam as seguintes anotações, devidamente esclarecidas por certidões cartorárias: I. condenação transitada em julgado em 08/06/2016 por crime anterior, praticado em 06/02/2014, com pena de reclusão extinta em 15/03/2022, diante do término do livramento condicional, cujo período de prova se iniciara em 14/08/2017; II. condenação transitada em julgado em 02/09/2022 por contravenção penal anterior, praticada em 07/01/2022, com pena de prisão simples cumprida em 03/03/2023; e III. ação penal em curso, por crime posterior, praticado em 05/03/2024. À luz das informações apresentadas, conclusos os autos ao juiz para sentença, no dia de hoje, na segunda fase da dosimetria da pena, a pena deverá ser", "comando": "À luz das informações apresentadas, conclusos os autos ao juiz para sentença, no dia de hoje, na segunda fase da dosimetria da pena, a pena deverá ser aplicada considerando os antecedentes criminais mencionados.", "alternativas": {"A": "atenuada, incidindo a atenuante da confissão espontânea, sendo o réu primário.", "B": "atenuada, preponderando a atenuante da confissão espontânea sobre a agravante da reincidência.", "C": "mantida, compensando-se integralmente a atenuante da confissão espontânea com a agravante da reincidência.", "D": "agravada, compensando-se proporcionalmente a agravante da reincidência com a atenuante da confissão espontânea.", "E": "agravada, preponderando a agravante da reincidência, sem qualquer compensação em relação à atenuante da confissão espontânea."}, "classificacao": {"id": "Q0327", "decisao": "publicar", "tema_central_id": "5203", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0328", "texto": "Acerca do conceito e das funções da criminologia, julgue o item seguinte. Na inter-relação entre o direito penal, a política criminal e a criminologia, compete a esta facilitar a recepção das investigações empíricas e a sua transformação em preceitos normativos, incumbindo-se de converter a experiência criminológica em proposições jurídicas, gerais e obrigatórias.", "comando": "Julgue o item seguinte.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0328", "decisao": "publicar", "tema_central_id": "4382", "extras_ids": "4374", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0329", "texto": "Em determinado estado brasileiro, uma investigação revelou um esquema criminoso que envolvia a competição futebolística estadual: Cavalcante, empresário no ramo do futebol, dono do time Tapauense, conseguia cooptar árbitros e jogadores de clubes de outros municípios para criar situações em momentos críticos durante as partidas, com o objetivo de manipular resultados. A promessa era de que, após os jogos, o empresário faria investimentos para ajudar os envolvidos a migrar para o mercado de futebol no Sudeste do país. Quanto à comissão de arbitragem, constatou-se que seu presidente simulava os sorteios com um assistente e, assim, conseguia indicar árbitros que se alinhavam ao esquema. Aos árbitros honestos eram destinados os mais distantes jogos e as piores condições de trabalho. Para os jogadores, a vantagem prometida ou a transferência em dinheiro nunca eram realizadas, ao passo que aos árbitros era pago o dinheiro mediante a sua contratação falsa como professores de treino de uma escolinha particular de futebol, que sequer existia. Everton respondia pela escolinha e era professor aposentado da secretaria de educação e desporto do estado. A investigação avançou devido à colaboração do jogador de futebol Kiko Jr., que havia participado do esquema por indicação de Alves, um dos árbitros. Segundo o próprio jogador, Alves combinara com ele a marcação de um pênalti resultante de falta provocada pelo zagueiro Kiko Jr. em determinado momento da partida contra o Tapauense, o que foi feito. No entanto, como não fora atendido nas promessas feitas dentro do esquema, Kiko Jr. se revoltou e, então, procurou a polícia, revelando os fatos até então desconhecidos.", "comando": "Ainda considerando a situação hipotética 1A12-I, assinale a opção correta relativamente à conduta de Kiko Jr.", "alternativas": {"A": "O MP poderá deixar de oferecer denúncia a Kiko Jr., desde\\nque o jogador tenha contribuído efetivamente para a\\nidentificação dos envolvidos da organização criminosa. \\n", "B": "A conduta de Kiko Jr. é atípica.", "C": "Kiko Jr. foi vítima do crime de estelionato.", "D": "No âmbito da investigação, o testemunho de Kiko Jr. tem\\nnatureza de meio de prova e pode servir-lhe de atenuante por\\nconfissão espontânea. \\n", "E": "A colaboração de Kiko Jr. não o exime da pena pelo crime\\npraticado, porém sua pena pode ser reduzida em até 2/3. \\n"}, "classificacao": {"id": "Q0329", "decisao": "publicar", "tema_central_id": "5557", "extras_ids": "4705", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0330", "texto": "Acerca das modificações introduzidas pelo chamado “pacote anticrime” ao Código de Processo Penal, assinale a alternativa correta.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Se a vítima, ou seu representante legal, não\\nconcordar com o arquivamento do inquérito\\npolicial, poderá, no prazo de trinta dias do\\nrecebimento da comunicação, submeter a\\nmatéria à revisão da instância competente\\ndo órgão ministerial, conforme dispuser a\\nrespectiva lei orgânica.", "B": "O processo penal terá estrutura inquisitória,\\nvedadas a iniciativa do juiz na fase\\ninstrutória judicial e a substituição da\\natuação probatória do órgão de acusação.", "C": "Em todos os casos em que policiais civis ou\\nmilitares forem investigados, deverão ser\\ncitados da instauração do procedimento\\ninvestigatório, podendo constituir defensor\\nno prazo de até quarenta e oito horas a\\ncontar do recebimento da citação.", "D": "Ordenado o arquivamento do inquérito\\npolicial ou de quaisquer elementos\\ninformativos da mesma natureza, o órgão do\\nMinistério Público deverá impor sigilo ao\\nprocedimento.", "E": "O inquérito policial terá estrutura acusatória,\\nvedadas a iniciativa do juiz na fase de\\ninvestigação e a substituição da atuação\\nprobatória do órgão de acusação."}, "classificacao": {"id": "Q0330", "decisao": "publicar", "tema_central_id": "5498", "extras_ids": "5501;5581", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0331", "texto": "Assinale a alternativa incorreta.", "comando": "", "alternativas": {"A": "O Habeas Corpus não poderá ser interposto quando houver ameaça de violência ou coação à liberdade de locomoção, por abuso de poder ou ilegalidade.", "B": "O Promotor de Justiça poderá impetrar ordem de Habeas Corpus.", "C": "O Magistrado jamais poderá impetrar ordem de Habeas Corpus em favor de terceiro, mas poderá conceder de ofício a ordem no processo que preside.", "D": "Não caberá intervenção do Assistente do Ministério Público no processo de Habeas Corpus.", "E": "Não se pode conhecer de impetração de Habeas Corpus apócrifa."}, "classificacao": {"id": "Q0331", "decisao": "publicar", "tema_central_id": "5477", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0332", "texto": "Acolhendo a proposta do Ministério Público aceita pelo autor da infração, o Juiz aplicará a pena restritiva de direitos ou de multa, que não importará em reincidência, sendo registrada apenas para impedir novamente o mesmo benefício no prazo de cinco anos. Assim sendo, enquadra-se nesse caso, a pessoa que,", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "tendo aceito a proposta de transação penal, pela\\nprática de lesão corporal, com o cumprimento de\\n72 horas de prestação de serviços à comunidade\\nem dezembro ano de 2012, não terá sob qualquer\\nhipótese, direito a nova transação penal antes de\\ndezembro de 2017.", "B": "tendo aceito a proposta de transação penal, pela\\nprática de constrangimento ilegal, com o\\npagamento de multa em dezembro de 2012, e\\nhistórico de prática de lesão corporal em setembro\\nde 2017, terá direito a nova transação penal.", "C": "tendo aceito a proposta de transação penal, pela\\nprática de desacato, e não cumprido o acordo da\\nproposta, poderá em audiência conciliatória, ter\\nfeita nova proposta de transação penal.", "D": "tendo cumprida a proposta de transação penal\\npela prática do crime de ameaça, praticado em\\n2014, poderá, ter proposta nova transação penal\\nem crime praticado em 2017.", "E": "tendo praticado o crime de homicídio em agosto\\nde 2012 seguindo de prática de crime de lesão\\ncorporal leve após saída em livramento\\ncondicional, terá proposta de transação penal em\\nrelação ao segundo crime."}, "classificacao": {"id": "Q0332", "decisao": "publicar", "tema_central_id": "5541", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0333", "texto": "Assinale a alternativa CORRETA.", "comando": "", "alternativas": {"A": "A pessoa pode ser, ao mesmo tempo, sujeito ativo e passivo de um delito em face de sua própria conduta.", "B": "O agente responderá tão-somente por tentativa de crime se ocorrer a desistência voluntária ou o arrependimento eficaz.", "C": "O condenado não reincidente, cuja pena não exceda a doze anos, poderá, desde o princípio, cumpri-la em regime semiaberto.", "D": "O positivismo criminológico utiliza método empírico-intuitivo experimental, contrapondo-se à análise filosófico-metafísica da escola clássica.", "E": "Na contagem dos prazos, leva-se em consideração o dia do final, excluindo-se o do começo."}, "classificacao": {"id": "Q0333", "decisao": "revisar", "tema_central_id": "5062", "extras_ids": "5219;5178;5201;4373", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0334", "texto": "Assinale a alternativa que NÃO engloba um objeto de estudo criminológico.", "comando": "", "alternativas": {"A": "O crime.", "B": "A vítima.", "C": "O “dever-ser”.", "D": "O controle social do comportamento delitivo.", "E": "A personalidade do delinquente."}, "classificacao": {"id": "Q0334", "decisao": "publicar", "tema_central_id": "4381", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0335", "texto": "A respeito das leis penais em branco e da teoria geral do delito, assinale a opção correta.", "comando": "", "alternativas": {"A": "A concepção welzeliana de ação implicou a inclusão do dolo — sem a consciência de ilicitude — e da culpa nos tipos de injustos. Além disso, conforme essa concepção, ao desvalor da ação corresponderia um desvalor do resultado, consistente na lesão ou perigo de lesão ao bem jurídico tutelado.", "B": "Em se tratando de crimes omissivos próprios ou puros, não há uma causalidade fática, mas jurídica, uma vez que o omitente, devendo e podendo, não impede o resultado. Nesse caso, apesar de se tratar de crime material, o agente responde não por ter causado o resultado, mas por não ter evitado sua ocorrência.", "C": "Com relação ao dolo, o legislador penal brasileiro adotou a teoria da representação, conforme a qual, para a existência do dolo, é suficiente a representação subjetiva ou a previsão do resultado como certo ou provável.", "D": "Configura lei penal em branco em sentido estrito o artigo do Código Penal, que estabelece como criminosa a conduta de casar-se mesmo conhecendo existir impedimento que acarrete a nulidade absoluta do casamento.", "E": "Crimes pluriofensivos são aqueles dotados de iter criminis fracionável, de forma que sua execução se desdobra em vários atos."}, "classificacao": {"id": "Q0335", "decisao": "revisar", "tema_central_id": "5218", "extras_ids": "5221;5222;5223;5171;5174", "confianca": "0.5", "motivo": "Revisar: mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0336", "texto": "Em 05 de junho de 2022, Mariana entrou em um restaurante estilo “self-service” e apoiou sua bolsa em uma cadeira. Enquanto conversava distraidamente com seu marido, José, Mariana esqueceu sua bolsa aberta. Diogo, outro cliente que estava no estabelecimento, terminou o almoço, levantou-se de onde estava sentado e foi em direção ao caixa para efetuar o pagamento da conta. Nesse momento, Diogo percebeu a bolsa de Mariana aberta e, sorrateiramente, pegou o aparelho celular dela. Logo em seguida, Mariana e José deram falta do aparelho e iniciaram a procura no local, tendo José visto Diogo na fila do caixa com o celular de Mariana. Imediatamente, José interpelou Diogo e restou comprovado que se tratava realmente do celular de Mariana. De acordo com jurisprudência consolidada dos Tribunais Superiores, em relação à conduta de Diogo, pode-se afirmar que", "comando": "", "alternativas": {"A": "praticou o crime de roubo consumado, previsto no art. 157, caput, do CP.", "B": "praticou o crime de furto, na sua forma tentada, previsto no art. 155, caput, c/c art. 14, II, ambos do CP.", "C": "praticou o crime de roubo, na sua forma tentada, previsto no art. 157, caput c/c art. 14, II, ambos do CP.", "D": "praticou o crime de furto consumado, previsto no art. 155, caput, do CP.", "E": "praticou o crime de apropriação indébita, previsto no art. 168, caput, do CP."}, "classificacao": {"id": "Q0336", "decisao": "publicar", "tema_central_id": "5159", "extras_ids": "5177", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0337", "texto": "A Lei nº 13.869/2019 dispõe sobre os crimes de abuso de autoridade. Sobre o assunto, analise as afirmativas abaixo e dê valores Verdadeiro (V) ou Falso (F). ( ) As condutas descritas na Lei nº 13.869/2019 constituem crime de abuso de autoridade quando praticadas pelo agente com a finalidade específica de prejudicar outrem ou beneficiar a si mesmo ou a terceiro, ou, ainda, por mero capricho ou satisfação pessoal. ( ) A divergência na interpretação de lei ou na avaliação de fatos e provas não configura abuso de autoridade. ( ) Os crimes previstos na Lei nº 13.869/2019 podem ser de ação penal pública incondicionada ou ação penal pública condicionada à representação, a depender do tipo penal.", "comando": "Assinale a alternativa que apresenta a sequência correta de cima para baixo.", "alternativas": {"A": "V - V - V", "B": "V - F - V", "C": "F - F - V", "D": "V - V - F"}, "classificacao": {"id": "Q0337", "decisao": "publicar", "tema_central_id": "4684", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0338", "texto": "Com relação às regras de provas do Código de Processo Penal, é correto afirmar que:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "A circunstância conhecida e provada que, tendo relação com o fato, autorize,\\npor indução, concluir-se a existência de outra ou outras circunstâncias, no\\nâmbito do processo penal, não possui valor legal, uma vez que decorre do\\nprincípio da não culpabilidade a proibição de presunção.", "B": "São características da confissão no processo penal a retratabilidade, a\\nindivisibilidade e a relatividade do valor.", "C": "As pessoas proibidas de depor em razão da profissão poderão fazê-lo se,\\ndesobrigadas pela parte interessada, quiserem dar o seu testemunho, neste\\ncaso, porém, não deverão prestar compromisso.", "D": "Somente quanto ao estado das pessoas serão observadas as restrições à prova\\nestabelecidas na lei civil.", "E": "Na falta de perito oficial, o exame de corpo delito deverá ser realizado por um\\nprofissional idôneo, nomeado pelo juiz, que tenha habilitação técnica\\nrelacionada com a natureza do exame."}, "classificacao": {"id": "Q0338", "decisao": "publicar", "tema_central_id": "5590", "extras_ids": "5548;5550;5546;5592", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0339", "texto": "Assinale a alternativa correta.", "comando": "", "alternativas": {"A": "Qualquer das partes poderá, no prazo de 5 (cinco) dias, pedir ao juiz que declare a sentença sempre que nela houver obscuridade, contradição, ambiguidade ou omissão.", "B": "Ainda que preclusa a decisão de pronúncia, havendo circunstância superveniente que altere a classificação do crime, caberá ao próprio juiz de primeiro grau fazê-la, respeitado o contraditório", "C": "Nos crimes de ação pública, conforme previsão legal, não poderá o juiz reconhecer circunstâncias agravantes que não tenham sido alegadas pelo Ministério Público.", "D": "A violação da regra da correlação entre acusação e sentença é causa de nulidade relativa."}, "classificacao": {"id": "Q0339", "decisao": "revisar", "tema_central_id": "5572", "extras_ids": "5565;5527;5578;5203", "confianca": "0.5", "motivo": "Revisar: mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0340", "texto": "Assinale a alternativa correta sobre o concurso de pessoas.", "comando": "", "alternativas": {"A": "Admite-se a participação por omissão em crime comissivo,\\nquando o omitente devia e podia agir para\\nevitar o resultado, mas não se admite em crimes\\nomissivos, por induzimento ou instigação.", "B": "Para que se admita a concorrência de culpas no crime\\nculposo, é necessário que cada agente atue com\\nconsciência de que está colaborando com a conduta\\nculposa de outrem.", "C": "A pena será agravada em relação ao agente que instiga\\nou determina a cometer o crime alguém sujeito à\\nsua autoridade ou não punível em virtude de condição ou qualidade pessoal.", "D": "Se a participação for de menor importância, a pena\\npode ser diminuída de um sexto a dois terços.", "E": "As condições e circunstâncias pessoais do agente\\nnão se comunicam ao coautor ou partícipe ainda que\\ncircunstâncias elementares ao crime."}, "classificacao": {"id": "Q0340", "decisao": "publicar", "tema_central_id": "5071", "extras_ids": "5074;5076;5203", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0341", "texto": "Quanto aos crimes contra o patrimônio, possível assegurar que", "comando": "Complete a frase sobre os crimes contra o patrimônio.", "alternativas": {"A": "é pública condicionada a ação penal no caso de dano cometido por motivo egoístico ou com prejuízo considerável para a vítima.", "B": "é causa de aumento da pena no roubo o fato de a vítima estar em serviço de transporte de valores, independentemente de o agente conhecer a circunstância.", "C": "é admissível no furto praticado em concurso de pessoas o acréscimo de um terço até metade sobre a pena prevista para a forma simples do delito, por aplicação analógica do disposto para o roubo majorado pela mesma circunstância.", "D": "o crime de duplicata simulada é de natureza formal, não exigindo a ocorrência de resultado naturalístico.", "E": "cabível o perdão judicial na receptação dolosa simples, se primário o agente e de pequeno valor a coisa."}, "classificacao": {"id": "Q0341", "decisao": "publicar", "tema_central_id": "5157", "extras_ids": "5164;5160;5159;5166;5169", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0342", "texto": "Com relação ao exame de corpo de delito e às perícias em geral, analise as seguintes assertivas, nos termos do Código de Processo Penal: I. Na falta de perito oficial, o exame poderá ser realizado por duas pessoas idôneas, portadoras de diploma de curso superior, mas não necessariamente na área técnica específica da natureza do exame. II. O Ministério Público, o assistente de acusação, o ofendido, o querelante e o acusado poderão formular quesitos, mas somente o Ministério Público e o acusado poderão indicar assistente técnico. III. A autópsia será feita sempre após seis horas do óbito, não prevendo a lei qualquer exceção. IV. A exumação será realizada em dia e hora previamente agendados, e somente após autorização judicial. V. As partes poderão requerer a oitiva dos peritos para esclarecerem a prova ou para responderem a quesitos, desde que o mandado de intimação e os quesitos ou questões a serem esclarecidas sejam encaminhados com antecedência mínima de 10 dias, podendo apresentar as respostas em laudo complementar.", "comando": "É correto o que se afirma APENAS em", "alternativas": {"A": "II e IV.", "B": "I, IV e V.", "C": "I, II, III e IV.", "D": "I e V.", "E": "II, III e V."}, "classificacao": {"id": "Q0342", "decisao": "publicar", "tema_central_id": "5546", "extras_ids": "5545", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0343", "texto": "Patrícia responde a processo por crime de ação penal privada por ter supostamente praticado injúria contra Maria. Ocorre que as duas eram amigas desde a infância e Patrícia sempre teve temperamento mais “esquentado”. Durante o processo, Maria resolveu esquecer a ofensa e decidiu perdoar Patrícia, mediante termo nos autos. Contudo, Patrícia que não aceitou o perdão. Nesse caso,", "comando": "", "alternativas": {"A": "o perdão é ato unilateral. Como Patrícia não aceitou, a ação penal não poderá ser obstada em hipótese alguma.", "B": "existe a possibilidade de Maria mitigar o caráter bilateral do perdão, deixando de dar andamento ao processo por mais de 30 dias.", "C": "Maria poderá renunciar ao direito de representação.", "D": "poderá ocorrer a perempção com a concordância da querelada.", "E": "o perdão é ato bilateral. Como Patrícia não aceitou, a ação penal não poderá ser obstada, nem mesmo por perempção."}, "classificacao": {"id": "Q0343", "decisao": "publicar", "tema_central_id": "5196", "extras_ids": "5195;5472", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0344", "texto": "Quanto à Lei nº 9.605/1998, que dispõe sobre as sanções penais e administrativas derivadas de condutas e atividades lesivas ao meio ambiente, é correto afirmar:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Os animais apreendidos serão entregues a jardins zoológi cos , fundações ou ent idades assemelhadas, independentemente de ficarem sob a responsabilidade de técnicos habilitados.", "B": "Tratando-se de produtos perecíveis ou madeiras, estes irão a hasta pública, sendo o resultado depositado emfavor do meio ambiente.", "C": "Os produtos e subprodutos da fauna perecíveis serão preservados como prova do crime.", "D": "Os instrumentos utilizados na prática da infração serão vendidos , garantida a sua descaracterização por meio da reciclagem.", "E": "Nas infrações penais previstas nessa lei, a ação penal é pública condicionada à representação."}, "classificacao": {"id": "Q0344", "decisao": "publicar", "tema_central_id": "4688", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0345", "texto": "Antônio, professor respeitado na escola, ofereceu carona à sua aluna Lívia, adolescente de 13 anos, que aceitou a oferta. Ainda no estacionamento da escola, Antônio acariciou os seios da aluna, beijou-a na boca e, enquanto se despia, foi surpreendido pela diretora da escola, que bateu na janela do carro interrompendo a ação, e em seguida, chamou a Polícia. A respeito da adequação típica da conduta e da incidência da agravante prevista no Art. 61, inciso II, alínea f, do Código Penal (Art. 61. São circunstâncias que sempre agravam a pena, quando não constituem ou qualificam o crime: II - ter o agente cometido o crime: f) com abuso de autoridade ou prevalecendo-se de relações domésticas, de coabitação ou de hospitalidade, ou com violência contra a mulher na forma da lei específica ) e da causa de aumento, prevista no Art. 226, inciso II do Código Penal (Art. 226. A pena é aumentada: II - de metade, se o agente é ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro, tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tiver autoridade sobre ela ), à luz do entendimento do Superior Tribunal de Justiça, assinale a afirmativa correta.", "comando": "", "alternativas": {"A": "Antônio praticou o crime de importunação sexual e não é admissível a incidência concomitante da agravante e da causa de aumento mencionadas.", "B": "Antônio praticou o crime de estupro de vulnerável tentado e não é admissível a incidência concomitante da agravante e da causa de aumento mencionadas.", "C": "Antônio praticou o crime de estupro de vulnerável consumado e é admissível a incidência concomitante da agravante e da causa de aumento mencionadas.", "D": "Antônio praticou o crime de estupro de vulnerável consumado e não é admissível a incidência concomitante da agravante e da causa de aumento mencionadas.", "E": "Antônio praticou o crime de importunação sexual e é admissível a incidência concomitante da agravante e da causa de aumento mencionadas."}, "classificacao": {"id": "Q0345", "decisao": "publicar", "tema_central_id": "5103", "extras_ids": "5203;5204", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0346", "texto": "Sobre o assistente da acusação no processo penal, após analisar as proposições abaixo destacadas, assinale a alternativa CORRETA : I - Em razão dos princípios da oralidade e concentração dos atos instrutórios, os quais regem o sistema acusatório, o Código de Processo Penal estabelece que do despacho que admitir, ou não, o assistente da acusação, não caberá recurso, não havendo necessidade que conste dos autos o pedido e a decisão sobre a admissibilidade do assistente. II - Após sucessivas e tópicas reformas legislativas, o Código de Processo Penal passou a estabelecer que o assistente da acusação tem legitimidade para requerer a decretação de prisão preventiva. III - No procedimento do júri, o assistente da acusação, apesar de poder participar dos debates orais em plenário, não tem legitimidade para requerer o desaforamento do julgamento, resguardando-se, assim, a legitimidade principal do Ministério Público quanto à ação penal pública. IV - No processo penal atinente aos crimes previstos no Código de Defesa do Consumidor, bem como a outros crimes e contravenções que envolvam relações de consumo, poderão intervir, como assistentes do Ministério Público, as entidades e órgãos da administração pública, direta ou indireta, ainda que sem personalidade jurídica, especificamente destinados à defesa dos interesses e direitos protegidos por aquele Código. V - Nos crimes de ação penal pública, o assistente de acusação poderá intervir em todos os termos da persecução penal, desde o início do procedimento administrativo pré-processual policial até o trânsito em julgado da sentença penal.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Somente as alternativas II e III estão corretas.", "B": "As alternativas I e V estão corretas.", "C": "Somente a alternativa V está correta.", "D": "Somente a alternativa III está correta.", "E": "Somente as alternativas II e IV estão corretas."}, "classificacao": {"id": "Q0346", "decisao": "publicar", "tema_central_id": "5583", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0347", "texto": "No tocante à parte geral do Código Penal, assinale a afirmativa correta.", "comando": "Assinale a afirmativa correta.", "alternativas": {"A": "Ricardo conduzia uma ambulância em alta velocidade. Ao ultrapassar o sinal vermelho, colidiu com o carro em que estava Mariana, que veio a falecer em virtude dos ferimentos suportados. Todavia, ele o fez para levar Felipe, criança de 5 anos, que corria risco de vida, ao hospital para ser socorrido após tentativa de homicídio. Neste contexto, restará configurado estrito cumprimento de um dever legal.", "B": "A frustração, embora solvente, da execução da pena de multa e não reparação do dano, sem motivo justificado, configuram causas de revogação obrigatória da suspensão condicional da pena.", "C": "Considerando a disciplina sobre o estado de necessidade, inexiste qualquer causa de diminuição de pena quando o sacrifício do direito próprio ou alheio ameaçado fosse razoável exigir, nos termos do Art. 78 do Código Penal.", "D": "Bruno, em 30/01/2023, subtraiu durante o período noturno, mediante escalada, computadores e televisões de uma loja na cidade de Sorocaba. Não satisfeito, em 09/03/2023, ele retornou à loja mencionada e, valendo-se das mesmas condições de tempo, lugar e maneira de execução, subtraiu mais televisões, computadores, tablets e relógios. Considerando a posição do Supremo Tribunal Federal, não é possível o reconhecimento da continuidade delitiva.", "E": "A pena, unificada nos termos do Art. 75 do Código Penal, é a utilizada para identificação do prazo para livramento condicional, nos termos da Corte Suprema."}, "classificacao": {"id": "Q0347", "decisao": "revisar", "tema_central_id": "5062", "extras_ids": "5230;5232;5207;5069;5208", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automátic
