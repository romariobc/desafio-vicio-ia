o da cidade conhecida pelo intenso tráfico de drogas, policiais militares abordaram um indivíduo que se encontrava sozinho na rua. Após busca pessoal, na qual nada de suspeito foi encontrado, os policiais conduziram o indivíduo até a residência dele e, sem autorização judicial ou do morador do domicílio, entraram no local e realizaram busca domiciliar. Encontraram no local uma pequena quantidade de maconha. Deram, então, voz de prisão em flagrante delito ao indivíduo, única pessoa que se encontrava no local. A autoridade policial a quem foi apresentado o detido pelos policiais militares ratificou a voz de prisão em flagrante, promovendo a autuação da prisão em flagrante pela suposta prática do delito previsto no art. 33 da Lei de Drogas. Foram realizadas as devidas comunicações da prisão e cumpridas todas as formalidades legais e constitucionais. No interrogatório policial, o detido permaneceu em silêncio. Foram ouvidas como testemunhas no auto de prisão em flagrante dois policiais militares que compunham a guarnição que efetuou a detenção em flagrante juntamente com o terceiro que funcionou como condutor. Tanto o condutor quanto as testemunhas do auto de prisão em flagrante delito relataram que após a apreensão da droga no domicílio a pessoa detida teria confessado que tal substância se destinava ao comércio ilícito. O preso não registrava qualquer antecedente criminal, tendo endereço certo e trabalho honesto. Na audiência de custódia, a defesa técnica deverá requerer, como principal tese,", "comando": "Na audiência de custódia, a defesa técnica deverá requerer, como principal tese,", "alternativas": {"A": "o relaxamento da prisão em flagrante diante\\nda ilegalidade da busca domiciliar e da voz de\\nprisão em flagrante delito.", "B": "a concessão de liberdade provisória mediante\\narbitramento de fiança, eis que satisfeitos os\\nrequisitos legais.", "C": "a conversão da prisão em flagrante em medida\\ncautelar diversa da prisão, diante da adequação\\ne suficiência.", "D": "a conversão da prisão em flagrante em prisão\\ndomiciliar, posto que preenchidos os requisitos\\nlegais."}, "classificacao": {"id": "Q0161", "decisao": "publicar", "tema_central_id": "5588", "extras_ids": "5594;5554;5589", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0162", "texto": "A moderna criminologia se dedica, também, ao estudo do controle social do delito, tendo este objeto representado um giro metodológico de grande importância.", "comando": "Assinale a alternativa correta:", "alternativas": {"A": "a família, a escola, a opinião pública, por exemplo, são instituições encarregadas de exercer o\\ncontrole social primário.", "B": "a polícia, o Judiciário, a administração penitenciária, por exemplo, são instituições\\nencarregadas de exercer o controle social informal.", "C": "a polícia, o Judiciário, a administração penitenciária, por exemplo, são instituições\\nencarregadas de exercer o controle social formal.", "D": "a família, a escola, a opinião pública, por exemplo, são instituições encarregadas de exercer o\\ncontrole social terciário.", "E": "a família, a escola, a opinião pública, por exemplo, são instituições encarregadas de exercer o\\ncontrole social secundário."}, "classificacao": {"id": "Q0162", "decisao": "publicar", "tema_central_id": "4381", "extras_ids": "4368", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0163", "texto": "O Diretor de determinado presídio é informado, por bilhete anônimo, de que um preso estaria trocando informações por correspondência com membros do seu bando, a fim de viabilizar a entrada de substância entorpecente no estabelecimento prisional, visando ao tráfico de drogas. Diante disso, o Diretor intercepta uma carta fechada e destinada ao detento, e, após abri-la, lê o seu conteúdo, descobrindo quando e como se daria o ingresso da droga. No caso em tela, pode-se afirmar que o Diretor:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "aparentemente praticou crimes previstos tanto no Código Penal, quanto na Lei nº 4.898/1965, devendo responder por esta última de acordo com o princípio da especialidade.", "B": "praticou crime previsto na Lei nº 4.898/1965.", "C": "praticou crimes previstos tanto no Código Penal, quanto na Lei nº 4.898/1965, devendo responder por ambos, em concurso formal.", "D": "praticou crime previsto noCódigo Penal.", "E": "não praticou crime."}, "classificacao": {"id": "Q0163", "decisao": "publicar", "tema_central_id": "5133", "extras_ids": "4684;4703", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0164", "texto": "Conforme o que a LEP prevê relativamente ao preso e ao egresso, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": {"A": "A concessão de alojamento e alimentação ao egresso pelo\\nprazo de dois meses poderá ser prorrogada uma vez, desde\\nque seja comprovado o empenho dele na obtenção de\\nemprego.", "B": "A assistência à saúde do preso e do internado de caráter\\npreventivo e curativo compreenderá atendimento médico,\\npsicológico e odontológico.", "C": "O estudo será obrigatório, integrando-se ao sistema escolar\\nmunicipal, mas mantido pela administração penitenciária.", "D": "Consideram-se egressos o liberado definitivo e o liberado\\ncondicional, desde sua saída até a sua reabilitação.", "E": "A assistência material é dever da administração, sendo\\nvedada a comercialização de produtos dentro do\\nestabelecimento prisional."}, "classificacao": {"id": "Q0164", "decisao": "publicar", "tema_central_id": "4703", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0165", "texto": "A Lei n° 12.850, de 2 de agosto de 2013, dentre outras disposições, definiu organização criminosa e dispôs sobre a investigação criminal, os meios de obtenção da prova, infrações penais correlatas e o procedimento criminal. A seu respeito, é correto afirmar que", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "tanto aquele que promove organização criminosa quanto o que, de qualquer forma,\\nembaraça a investigação de infração penal que envolva organização criminosa serão\\napenados com pena de reclusão, de 3 (três) a 8 (oito) anos, e multa, sem prejuízo das penas\\ncorrespondentes às demais infrações penais praticadas.", "B": "por expressa disposição legal, não existirá organização criminosa típica voltada a obter\\nvantagem, de qualquer natureza, mediante a prática de contravenções penais.", "C": "se houver participação de criança ou adolescente na organização ou na associação\\ncriminosa, a pena será aumentada de 1/6 (um sexto) a 2/3 (dois terços).", "D": "quando a medida se fizer necessária à investigação ou instrução processual, se houver indícios\\nsuficientes de que o funcionário público integra organização criminosa, poderá o juiz\\ndeterminar seu afastamento cautelar do cargo, emprego ou função, sem remuneração.", "E": "ao tratar da colaboração premiada, em seu artigo 4°, a lei restringe expressamente a\\nconcessão do perdão judicial à hipótese da localização de eventual vítima com a sua\\nintegridade física preservada."}, "classificacao": {"id": "Q0165", "decisao": "publicar", "tema_central_id": "4705", "extras_ids": "5557", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0166", "texto": "O Defensor Público, na data de 15 de junho de 2010, ao atender os apenados da Casa do Albergado de um Município do interior do Estado do Rio Grande do Sul, deparouse com a situação de um preso que está recolhido no regime aberto e conta com 73 anos de idade, em bom estado de saúde física, mas apresentando quadro de senilidade leve. Após analisar os dados constantes da Guia de Recolhimento atualizada do reeducando, o Defensor Público apurou que o preso está condenado por crime de latrocínio (art. 157, § 3o , parte final, do Código Penal), praticado há mais de dez anos, enquadrando-se como reincidente, pois já havia sido condenado por outro latrocínio, anteriormente. Verificou, também, que computada a remição de pena deferida, o reeducando já teria cumprido mais de dois terços do apenamento total imposto. Considerando os referidos dados, a Defensoria Pública do Estado poderia postular ao Juízo da Execução Criminal", "comando": "Considerando os dados apresentados, qual pedido a Defensoria Pública do Estado poderia formular ao Juízo da Execução Criminal?", "alternativas": {"A": "o livramento condicional.", "B": "a progressão de regime.", "C": "a comutação de pena, com fundamento nas disposições do Decreto no 7.046, de 22 de dezembro de 2009.", "D": "o indulto de natal, com fundamento nas disposições do Decreto no 7.046, de 22 de dezembro de 2009.", "E": "a prisão domiciliar."}, "classificacao": {"id": "Q0166", "decisao": "publicar", "tema_central_id": "4703", "extras_ids": "5521;5208;5193", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0167", "texto": "Acerca de desaforamento é incorreto afirmar:", "comando": "", "alternativas": {"A": "Pode ser decretado se o interesse da ordem pública o reclamar, ou acaso houver dúvida sobre a imparcialidade do júri ou, ainda, existir risco para a segurança pessoal do acusado;", "B": "O querelante e o assistente do Ministério Público também são legitimados para intentarem a medida;", "C": "Entre comarcas da mesma região, as mais próximas, desde que não subsistentes os mesmos motivos da comarca de origem, terão preferência para julgar o caso desaforado;", "D": "Por se tratar de transferência de foro do julgamento popular, é cabível somente após a publicação da decisão de pronúncia;", "E": "O desaforamento comporta representação do magistrado competente e, quando proposto pelas partes, a lei processual prescreve que juiz presidente deve ser ouvido."}, "classificacao": {"id": "Q0167", "decisao": "publicar", "tema_central_id": "5528", "extras_ids": "5486", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0168", "texto": "Mévio, técnico de futebol do X Sport Clube, recebeu de Tício, presidente do Y Sport Clube, a quantia de 10.000,00 (dez mil reais), para deixar de convocar o jogador Zeca, considerado o craque do time X, para o jogo realizado entre os dois times, com o objetivo de aumentar a chance de vitória do time Y. Mévio efetivamente deixou de convocar o jogador Zeca, entretanto, ainda assim, o time X logrou-se vencedor.", "comando": "Diante da situação hipotética, assinale a alternativa correta.", "alternativas": {"A": "Mévio e Tício praticaram crimes contra a incerteza\\ndo resultado esportivo, previstos, respectivamente,\\nnos artigos 198 e 199, da Lei no \\n 14.597/2023.", "B": "Mévio e Tício praticaram o crime de corrupção privada no esporte (art. 165, da Lei no \\n 14.597/2023).", "C": "Mévio e Tício não praticaram qualquer crime, pois os\\ncrimes de corrupção privada no esporte e contra a\\nincerteza do resultado esportivo são materiais e exigem que o resultado almejado se realize.", "D": "Mévio praticou o crime contra a incerteza do resultado esportivo (art. 198, da Lei no \\n 14.597/2023), e Tício\\npraticou o crime de corrupção privada no esporte\\n(art. 165, da Lei no \\n 14.597/2023).", "E": "Mévio praticou o crime de corrupção privada no\\nesporte (art. 165, da Lei no \\n 14.597/2023), e Tício praticou o crime contra a incerteza do resultado esportivo (art. 199, da Lei no \\n 14.597/2023)."}, "classificacao": {"id": "Q0168", "decisao": "revisar", "tema_central_id": "4683", "extras_ids": "", "confianca": "0.5", "motivo": "Revisar: generico, referencia_inconclusiva; Revisor rejeitou fora sem corrigir o tema. Encaminhar com sugestão da disciplina de legislação especial; jamais publicar nem presumir rótulo validado."}}, {"id": "Q0169", "texto": "A respeito das causas de impedimento e suspeição do juiz, de acordo com o Código de Processo Penal, assinale a alternativa correta.", "comando": "", "alternativas": {"A": "Nos juízos coletivos, não poderão servir no mesmo processo os juízes que forem entre si parentes, consanguíneos ou afins, em linha reta ou colateral, até o quarto grau.", "B": "O juiz será suspeito, podendo ser recusado por qualquer das partes, se já tiver funcionado como juiz de outra instância, pronunciando-se de fato ou de direito sobre a questão.", "C": "Ainda que dissolvido o casamento, sem descendentes, que ensejava impedimento ou suspeição, não funcionará como juiz o sogro, o padrasto, o cunhado, o genro ou enteado de quem for parte no processo.", "D": "O juiz será impedido se for credor ou devedor de qualquer das partes.", "E": "A suspeição poderá ser reconhecida ou declarada ainda que a parte injurie, de propósito, o juiz."}, "classificacao": {"id": "Q0169", "decisao": "publicar", "tema_central_id": "5492", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0170", "texto": "Em 2024, Guilherme, Américo, Lucas, Rogério e Vladimir praticaram um crime. De acordo com as informações de antecedentes criminais fornecidas a seguir, assinale a opção que indica qual deles é tecnicamente primário (não reincidente).", "comando": "", "alternativas": {"A": "Guilherme, enquanto policial militar, foi definitivamente condenado por corrupção passiva prevista no Código Penal Militar e terminou de cumprir a pena no ano de 2023.", "B": "Américo, na condição de ocupante de cargo político, praticou crime de peculato, tendo sido definitivamente condenado em 2023, sendo que ainda não terminou de cumprir as penas restritivas de direito que lhe foram impostas.", "C": "Lucas foi definitivamente condenado em 2015, tendo sua pena sido extinta em 2020, pela concessão de indulto pleno. Em 2022, Lucas obteve sua reabilitação.", "D": "Rogério foi definitivamente condenado em 2023, mas, após o trânsito em julgado de sua condenação, o Juiz reconheceu a ocorrência da prescrição da pretensão punitiva, na modalidade retroativa.", "E": "Vladimir foi definitivamente condenado na Espanha, por tráfico de drogas, a uma pena de 6 anos de reclusão, fato ocorrido em 2017 e transitado em julgado em 2018; porém, ainda não cumpriu a pena porque logrou se evadir para o Brasil."}, "classificacao": {"id": "Q0170", "decisao": "publicar", "tema_central_id": "5203", "extras_ids": "5188;5210", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0171", "texto": "Sobre as alterações trazidas pela Lei nº 13.964/2019 (Pacote Anticrime), é correto afirmar que:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "seguindo o anseio legislativo de maior recrudescimento\\npenal, o limite de cumprimento das penas privativas de\\nliberdade poderá alcançar o patamar de quarenta anos,\\nindependentemente do momento da prática do delito;", "B": "ainda que surtam efeitos na execução da pena e, portanto,\\nno sistema carcerário, o crime de roubo circunstanciado pelo\\nemprego de arma de fogo (Art. 157, §2º-A, I, do Código Penal)\\npassou a ser considerado hediondo;", "C": "o juiz não poderá receber a denúncia apenas com\\nfundamento nas informações das declarações do réu que\\nrealizou a colaboração premiada, mas poderá decretar\\nmedidas cautelares reais;", "D": "a exclusão dos perfis genéticos dos bancos de dados ocorrerá\\napós dez anos do término do cumprimento da pena dos\\ncrimes graves contra a pessoa;", "E": "o cumprimento e/ou rescisão do acordo de não persecução\\npenal é/são causa(s) interruptiva(s) da prescrição."}, "classificacao": {"id": "Q0171", "decisao": "revisar", "tema_central_id": "5062", "extras_ids": "4693;5557;4699;5502", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0172", "texto": "Assinale a alternativa incorreta.", "comando": "", "alternativas": {"A": "O juízo de prelibação, na ação penal contra Promotor de Justiça do Distrito Federal, é feito por órgão jurisdicional colegiado.", "B": "O aditamento à denúncia, para imputar infração penal conexa cuja prova surgiu no decorrer da instrução criminal exige a renovação da citação e do interrogatório do acusado, em relação a esse fato novo.", "C": "A decisão que extingue a punibilidade, em face da prescrição da pretensão punitiva, faz coisa julgada material, mesmo na excepcional hipótese de ser descoberta qualificadora que, se admitida, possa elevar a pena abstrata do crime e, conseqüentemente, alterar o prazo prescricional.", "D": "Para o recebimento da denúncia contra deputado distrital exige-se autorização da maioria dos membros da Câmara Legislativa, por iniciativa de partido político com representação naquela Casa", "E": "A procedência, no tribunal, da exceção da verdade oposta pelo querelado interfere na ação penal privada, por crime de calúnia, em curso no juízo singular da causa."}, "classificacao": {"id": "Q0172", "decisao": "revisar", "tema_central_id": "5465", "extras_ids": "5484;5579;5188;5473", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0173", "texto": "Com relação à regressão de regime prisional e às faltas disciplinares, assinale a opção correta com base no disposto na LEP e no entendimento dos tribunais superiores.", "comando": "Assinale a opção correta com base no disposto na LEP e no entendimento dos tribunais superiores.", "alternativas": {"A": "A falta disciplinar de natureza grave cometida pelo executando acarreta o reinício do cômputo do interstício necessário ao preenchimento do requisito objetivo para a concessão do benefício da progressão de regime bem como a perda total do tempo remido.", "B": "Segundo os princípios da estrita legalidade e da anterioridade, consideram-se faltas disciplinares, classificadas em leves, médias, graves e gravíssimas, apenas as que sejam previstas expressamente na LEP e que sejam anteriores à prática do fato.", "C": "Admite-se a regressão de regime prisional, com a transferência para qualquer dos regimes mais rigorosos, quando o condenado frustrar os fins da execução ou não pagar a multa cumulativamente imposta.", "D": "Considera-se falta média a inobservância, pelo condenado à pena privativa de liberdade, do dever de obediência ao servidor e do respeito a qualquer pessoa com quem se relacione no ambiente prisional, bem como do dever de cumprir as ordens recebidas.", "E": "A autoridade administrativa é detentora do poder disciplinar exercido sobre o preso na execução das penas restritivas de direitos, podendo, em caso de falta grave do sentenciado, suspender-lhe automaticamente o direito às saídas temporárias e decidir pela regressão de regime, ouvido previamente o condenado."}, "classificacao": {"id": "Q0173", "decisao": "publicar", "tema_central_id": "4703", "extras_ids": "5201", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0174", "texto": "Sobre os crimes cibernéticos ou informáticos, é CORRETO afirmar:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "A simples disponibilização de imagens ou vídeos com conteúdo pornográfico, envolvendo criança ou adolescente, na Internet, não é suficiente para\\na caracterização do tipo penal do art. 241-A do ECA, sendo imprescindível\\no efetivo acesso de pelo menos um usuário.", "B": "Agente que se aproveita da ausência momentânea de colega de trabalho\\npara, no computador alheio, ligado sem nenhum tipo de dispositivo de segurança, acessar fotos íntimas, copiando-as para si, pratica o crime de invasão de dispositivo informático do art. 154-A do Código Penal.", "C": "É fraude eletrônica, figura qualificada do crime de estelionato, a utilização\\nde informações fornecidas pela vítima induzida a erro presencialmente, se\\no agente obtém a vantagem, em prejuízo da vítima, passando-se por ela em\\numa compra em ambiente virtual.", "D": "Em razão da necessária segurança coletiva e proteção de dados, os crimes\\nde invasão de dispositivos informáticos, definidos no art. 154-A do Código\\nPenal, são de ação penal pública incondicionada."}, "classificacao": {"id": "Q0174", "decisao": "revisar", "tema_central_id": "5133", "extras_ids": "4709;5166", "confianca": "0.5", "motivo": "Revisar: mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0175", "texto": "João, agente público federal competente, deu ordem de parada a um veículo automotor que transitava em excesso de velocidade no interior do estado do Pará. Realizado o exame de alcoolemia (teste do bafômetro), constatou-se que o condutor havia ingerido grande quantidade de álcool, dando azo à caracterização de crime previsto no Código de Trânsito Brasileiro. Dessa forma, João solicitou ao condutor dez mil reais para liberá-lo, proposta aceita imediatamente e operacionalizada por meio de transferência bancária. Nesse cenário, considerando as disposições do Código Penal, João responderá pelo(s) crime(s) de:", "comando": "", "alternativas": {"A": "corrupção passiva e corrupção ativa, em concurso;", "B": "concussão e corrupção passiva, em concurso;", "C": "corrupção passiva;", "D": "corrupção ativa;", "E": "concussão."}, "classificacao": {"id": "Q0175", "decisao": "publicar", "tema_central_id": "5092", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0176", "texto": "Sobre o crime de falso testemunho, é CORRETO afirmar que:", "comando": "", "alternativas": {"A": "o crime de falso testemunho é delito de mão própria, pois somente pode ser executado pela própria testemunha;", "B": "comete crime de falso testemunho o irmão do reclamante, mesmo não estando compromissado pelo Juiz;", "C": "mesmo não se observando a existência de potencial dano à administração da Justiça, comete crime de falso testemunho a testemunha que faltar com a verdade em seu depoimento;", "D": "o dolo do crime não exige que a testemunha tenha consciência de estar cometendo uma falsidade;", "E": "não cabe retratação de falso testemunho na Justiça do Trabalho;"}, "classificacao": {"id": "Q0176", "decisao": "publicar", "tema_central_id": "5081", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0177", "texto": "Assinale a afirmativa incorreta.", "comando": "", "alternativas": {"A": "O silêncio do réu não importará em confissão nem poderá ser valorado pelo juiz em prejuízo da defesa para efeito de condenação, mas poderá ser valorado na fixação da penabase no aspecto da personalidade do criminoso.", "B": "O réu tem o direito de entrevistar-se reservadamente com seu advogado antes de seu interrogatório judicial.", "C": "O réu tem o direito de permanecer calado, negar a verdade ou mentir durante seu interrogatório judicial.", "D": "Além de permanecer calado, o réu tem o direito de recusar-se a fornecer material para exame grafotécnico.", "E": "Se o réu não for previamente advertido de seu direito de permanecer em silêncio, tudo que disser em seu interrogatório poderá ser anulado posteriormente."}, "classificacao": {"id": "Q0177", "decisao": "publicar", "tema_central_id": "5547", "extras_ids": "5582", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0178", "texto": "A Resolução CNJ nº 467/2022 regulamentou o inciso XI do artigo 6º da Lei nº 10.826/2003 e prevê que o porte de arma de fogo de servidores dos quadros pessoais do Poder Judiciário é:", "comando": "", "alternativas": {"A": "defeso aos servidores do Poder Judiciário, enquadrados como agentes e inspetores da especialidade Polícia Judicial, ainda que efetivamente estejam no exercício do poder de polícia, em todo o território nacional, sendo permitido somente no Estado em que está lotado para o exercício de suas funções.", "B": "autorizado aos servidores do Poder Judiciário, enquadrados como agentes e inspetores da especialidade Polícia Judicial, independentemente de estarem no exercício do poder de polícia, somente no Estado em que estejam lotados.", "C": "defeso aos servidores do Poder Judiciário, enquadrados como agentes e inspetores da especialidade Polícia Judicial, ainda que efetivamente estejam no exercício do poder de polícia, em todo o território nacional.", "D": "autorizado aos servidores do Poder Judiciário, enquadrados como agentes e inspetores da especialidade Polícia Judicial, e que efetivamente estejam no exercício do poder de polícia, em todo o território nacional.", "E": "autorizado aos servidores do Poder Judiciário, enquadrados como agentes e inspetores da especialidade Polícia Judicial, e que efetivamente estejam no exercício do poder de polícia, somente no Estado em que estejam lotado para os exercícios de suas funções."}, "classificacao": {"id": "Q0178", "decisao": "publicar", "tema_central_id": "4697", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0179", "texto": "Ações como controle dos meios de comunicação e ordenação urbana, orientadas a determinados grupos ou subgrupos sociais, estão inseridas no âmbito da chamada prevenção secundária do delito.", "comando": "Explique o que caracteriza a prevenção secundária do delito.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0179", "decisao": "publicar", "tema_central_id": "4369", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0180", "texto": "João é investigado pela prática de um crime de peculato. Durante a fase de inquérito policial, o Delegado de Polícia, sem autorização judicial, determina a entrada de agentes na residência de João durante a noite, sob o argumento de que o crime em questão causa grave dano ao erário e que a apreensão de documentos seria essencial para evitar a ocultação de provas. Os agentes apreendem diversos computadores que continham evidências do crime. Diante de tal situação hipotética, assinale a afirmativa correta.", "comando": "", "alternativas": {"A": "A prova é plenamente válida, uma vez que o princípio da busca da verdade real se sobrepõe à inviolabilidade do domicílio em crimes cometidos contra a Administração Pública.", "B": "A prova é legítima se for demonstrado que a diligência foi pautada pelo princípio da eficiência, visando à celeridade processual e à proteção do patrimônio público.", "C": "Pelo princípio da não culpabilidade, João não poderia ter seus bens apreendidos antes de uma sentença penal condenatória transitada em julgado.", "D": "Em virtude do princípio do contraditório, o Delegado de Polícia é obrigado a intimar a defesa de João para acompanhar a diligência de busca e apreensão na residência, sob pena de nulidade absoluta.", "E": "As provas obtidas são ilícitas, pois, embora a entrada em domicílio possa ocorrer sem mandado em caso de flagrante delito, a busca para apreensão de provas exige ordem judicial e deve respeitar o período diurno, salvo consentimento do morador."}, "classificacao": {"id": "Q0180", "decisao": "publicar", "tema_central_id": "5594", "extras_ids": "5554", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0181", "texto": "Identifique o que constitui crime contra a ordem tributária e assinale a alternativa correta . I Adquirir, distribuir e revender derivados de petróleo, gás natural e suas frações recuperáveis, álcool etílico, hidratado carburante e demais combustíveis líquidos carburantes, em desacordo com as normas estabelecidas na forma da lei . II Usar gás liquefeito de petróleo em motores de qualquer espécie, saunas, caldeiras e aquecimento de piscinas, ou para fins automotivos, em desacordo com as normas estabelecidas na forma da lei . III Negar ou deixar de fornecer, quando obrigatório, nota fiscal ou documento equivalente, relativa a venda de mercadoria ou prestação de serviço, efetivamente realizada, ou fornecê-la em desacordo com a legislação . IV Sem autorização legal, produzir, adquirir, transportar, industrializar, ter consigo, consumir ou comercializar produtos ou matéria-prima pertencentes à União .", "comando": "Identifique o que constitui crime contra a ordem tributária e assinale a alternativa correta.", "alternativas": {"A": "Apenas II e III estão corretas.", "B": "Apenas a afirmação III está correta.", "C": "Apenas II e IV estão corretas.", "D": "Apenas I, II e IV estão corretas.", "E": "Todas as afirmações estão corretas."}, "classificacao": {"id": "Q0181", "decisao": "publicar", "tema_central_id": "4695", "extras_ids": "4689", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0182", "texto": "Analise os itens e assinale a quantidade de itens errados . I - A instigação da gestante para permitir que terceiro lhe provoque aborto, em se consumando o crime, enseja para o instigador a participação no crime de aborto consensual, descrito no artigo 126 do CP. II - O crime de perigo de contágio de moléstia venérea tipificado no artigo 130 do CP exige o perigo concreto para a sua consumação. III - O rixoso que sofre a lesão corporal de natureza grave, causa de aumento de pena no crime em questão, não responde por esta circunstância. IV - Descoberto o autor da morte ocorrida durante uma rixa, imputa-se a este o crime de acordo com o elemento volitivo que informou a sua conduta, excluindo-se os demais rixosos que passam a responder pela forma simples do crime de rixa prevista no artigo 137 do CP. V - É incorreto afirmar que um indivíduo que chega à sala do seu chefe, numa conversa a dois, e assevera que este está subtraindo verba da empresa onde trabalham, comete, caso seja falsa a afirmação e tendo ciência desta falsidade, o crime de calúnia.", "comando": "Assinale a quantidade de itens errados.", "alternativas": {"A": "Um.", "B": "Dois.", "C": "Três.", "D": "Quatro.", "E": "Cinco."}, "classificacao": {"id": "Q0182", "decisao": "revisar", "tema_central_id": "5062", "extras_ids": "5154;5139;5122", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0183", "texto": "Julgue o item abaixo. Considere a seguinte situação hipotética. Pedro foi denunciado pelo Ministério Público pela prática de crime de dispensa de licitação fora das hipóteses previstas em lei. Citado por edital, não compareceu na data designada para seu interrogatório nem nomeou advogado, motivo pelo qual o processo e o curso prescricional foram suspensos pelo dobro do prazo da prescrição, calculada esta com base na pena máxima cominada para o crime. Posteriormente, o juiz determinou a retomada do prazo prescricional e, após o decurso do prazo da prescrição, novamente calculada com base na pena máxima cominada para o crime, extinguiu a punibilidade do acusado. Nessa situação, agirá corretamente o promotor ao impugnar a sentença por meio de recurso em sentido estrito, o que poderá fazer no prazo de cinco dias.", "comando": "Julgue o item abaixo.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0183", "decisao": "publicar", "tema_central_id": "5561", "extras_ids": "5187;5488", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0184", "texto": "Julgue o item seguinte com base na Lei n.º 11.343/2006. A autoridade de polícia judiciária deve comunicar ao juiz competente a prisão em flagrante no prazo improrrogável de cinco dias, remetendo-lhe cópia do auto lavrado, do qual será dada vista ao MP em até vinte e quatro horas.", "comando": "Julgue o item seguinte com base na Lei n.º 11.343/2006.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0184", "decisao": "publicar", "tema_central_id": "4708", "extras_ids": "5518", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0185", "texto": "Durante revista regular no interior de um presídio, um revólver foi encontrado na posse de Antônio, que cumpria pena no regime semiaberto, o que constitui falta grave. A partir dessa situação hipotética, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": {"A": "Antônio estará sujeito a regressão do regime de cumprimento\\nda pena, desde que condenado pelo juízo competente pela\\nposse da arma.", "B": "Em se tratando de situação de flagrância, o diretor do presídio\\npoderá, desde já, efetuar a inclusão do detento em regime\\ndisciplinar diferenciado.", "C": "O prazo para a autoridade aplicar a pena correspondente à falta\\ngrave cometida é de dois anos; findo esse prazo, estará\\npreclusa qualquer possibilidade de regressão.", "D": "Caso o juízo da execução decida pela regressão do regime,\\nem razão da conduta de Antônio, caberá recurso em sentido\\nestrito no prazo de quinze dias.", "E": "O juízo de execução poderá determinar regressão do regime,\\nbaseado em procedimento instaurado pelo diretor do presídio,\\nsendo garantidos o contraditório e a ampla defesa."}, "classificacao": {"id": "Q0185", "decisao": "publicar", "tema_central_id": "4703", "extras_ids": "5566", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0186", "texto": "No que concerne à fixação da pena-base, é certo que o julgador deve, ao individualizar a pena, examinar com acuidade os elementos que dizem respeito ao fato delituoso e aspectos inerentes ao agente, obedecidos e sopesados todos os critérios legais para aplicar, de forma justa e fundamentada, a reprimenda que seja, proporcionalmente, necessária e suficiente para a reprovação do crime, sobrepujando as elementares comuns do próprio tipo legal. No Art. 59 do Código Penal, o legislador elencou oito circunstâncias judiciais para individualização da pena na primeira fase da dosimetria. Ao considerar desfavoráveis as circunstâncias judiciais, deve o julgador declinar, motivadamente, as suas razões, que devem corresponder objetivamente às características próprias do vetor desabonado. Nesse particular, as condenações definitivas, por fato anterior ao delito, transitadas em julgado no curso da ação penal, somente podem ser valoradas, na primeira fase da dosimetria, a título de:", "comando": "Complete a frase sobre a valoração das condenações definitivas na primeira fase da dosimetria.", "alternativas": {"A": "culpabilidade;", "B": "antecedentes;", "C": "conduta social;", "D": "personalidade do agente;", "E": "circunstâncias."}, "classificacao": {"id": "Q0186", "decisao": "publicar", "tema_central_id": "5202", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0187", "texto": "Dionísio é presidente da Comissão de Licitações do município de Carunchos e, mensalmente, dirige seu carro até um shopping center onde recebe uma mochila contendo dinheiro pago por um empresário interessado em obter privilégios em certames públicos locais. Dionísio usa tais recursos para adquirir imóveis e os transfere, mediante doação, para sua esposa e filhos menores. Dionísio foi filmado, preso e condenado por decisão transitada em julgado pela prática do crime de corrupção. Sobre a situação hipotética narrada, assinale a afirmativa correta.", "comando": "", "alternativas": {"A": "A partir do trânsito em julgado da condenação, Dionísio perde automaticamente a capacidade para o exercício do poder familiar em relação aos filhos menores para os quais transferiu imóveis adquiridos com os recursos ilicitamente recebidos.", "B": "O veículo utilizado por Dionísio para recolher mensalmente os pagamentos enquadra-se no conceito legal de instrumento do crime e, por essa razão, está sujeito à perda ou ao confisco.", "C": "A eventual progressão do regime de cumprimento da pena aplicada a Dionísio está condicionada à reparação do dano causado ou à devolução do produto do ilícito praticado.", "D": "Os bens correspondentes à diferença entre o valor total do patrimônio de Dionísio e aquele que é compatível com sua renda lícita não podem ser considerados produtos do crime para fins de decretação da perda.", "E": "A perda do cargo público ocupado por Dionísio deverá ser decretada como efeito da condenação criminal somente se a pena privativa de liberdade aplicada for superior a quatro anos."}, "classificacao": {"id": "Q0187", "decisao": "publicar", "tema_central_id": "5209", "extras_ids": "5201", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0188", "texto": "Segundo sua classificação doutrinária dominante, o chamado ofendículo pode mais precisamente caracterizar situação de exclusão de", "comando": "Complete a frase sobre a caracterização do ofendículo segundo a doutrina dominante.", "alternativas": {"A": "antijuridicidade.", "B": "tipicidade.", "C": "periculosidade.", "D": "culpabilidade.", "E": "punibilidade."}, "classificacao": {"id": "Q0188", "decisao": "publicar", "tema_central_id": "5228", "extras_ids": "5231;5232", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0189", "texto": "Acerca do direito processual penal, julgue o item subseqüente. A desistência da ação penal privada pode ocorrer a qualquer momento, somente surgindo óbice intransponível quando já existente decisão condenatória transitada em julgado.", "comando": "Julgue o item subsequente sobre direito processual penal.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0189", "decisao": "publicar", "tema_central_id": "5472", "extras_ids": "5196", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0190", "texto": "Considerando a temática dos Juizados Especiais Criminais, assinale a alternativa correta.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "A competência do Juizado será determinada pelo lugar em que foi praticada a infração penal.", "B": "Consideram-se infrações penais de menor potencial ofensivo as contravenções penais e os crimes a que a lei comine pena mínima não superior a 2 (dois) anos, cumulada ou não com multa.", "C": "Nos crimes em que a pena mínima cominada for igual ou inferior a um ano, o Ministério Público, ao oferecer a denúncia, poderá propor a suspensão do processo, por um a quatro anos, desde que o acusado não esteja sendo processado ou não tenha sido condenado por outro crime, presentes os demais requisitos que autorizariam a suspensão condicional da pena (art. 77 do Código Penal).", "D": "A composição civil, estabelecida nos arts. 74 e 75 da Lei, é uma causa de extinção da punibilidade nos crimes de menor potencial ofensivo, quando a ação for pública incondicionada.", "E": "A proposta de Transação Penal (art. 76) deve ser feita pelo Juiz na presença do Ministério Público."}, "classificacao": {"id": "Q0190", "decisao": "publicar", "tema_central_id": "4701", "extras_ids": "5540;5542;5541", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0191", "texto": "Considere as seguintes afirmações a respeito dos recursos no Código de Processo Penal: I. Recurso de caráter subsidiário, cabível de decisão que denegar recurso. II. Recurso pelo qual se procede ao reexame da decisão do juiz, nas matérias especificadas em lei, permitindo-se-lhe novo pronunciamento antes do julgamento pela instância superior.", "comando": "Estas afirmações referem-se, respectivamente, a", "alternativas": {"A": "agravo e reclamação.", "B": "reclamação e correição parcial.", "C": "recurso em sentido estrito e apelação.", "D": "carta testemunhável e recurso em sentido estrito.", "E": "embargos e correição parcial."}, "classificacao": {"id": "Q0191", "decisao": "publicar", "tema_central_id": "5560", "extras_ids": "5567;5561", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0192", "texto": "Marque a opção INCORRETA.", "comando": "", "alternativas": {"A": "Trata-se do crime de concussão a conduta do funcionário público de solicitar para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida;", "B": "O condenado por crime contra a administração pública terá a progressão de regime do cumprimento da pena condicionada à reparação do dano que causou, ou à devolução do produto do ilícito praticado, com os acréscimos legais;", "C": "No peculato culposo a reparação do dano posterior à sentença irrecorrível reduz de metade a pena imposta;", "D": "No crime de falsa perícia o fato deixa de ser punível se, antes da sentença no processo em que ocorreu o ilícito, o perito se retrata."}, "classificacao": {"id": "Q0192", "decisao": "revisar", "tema_central_id": "5087", "extras_ids": "5091;5092;5089;5081;5201", "confianca": "0.5", "motivo": "Revisar: mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0193", "texto": "Sobre o tema da colaboração premiada, assinale a alternativa incorreta :", "comando": "Assinale a alternativa incorreta sobre o tema da colaboração premiada.", "alternativas": {"A": "O acordo de colaboração premiada poderá ser precedido de instrução, quando houver necessidade de\\nidentificação ou complementação de seu objeto, dos fatos narrados, sua definição jurídica, relevância,\\nutilidade e interesse público.", "B": "Na hipótese de não ser celebrado o acordo por iniciativa do celebrante, esse não poderá se valer de\\nnenhuma das informações ou provas apresentadas pelo colaborador, de boa-fé, para qualquer outra\\nfinalidade.", "C": "Considerando a relevância da colaboração prestada, o Ministério Público ou a autoridade policial\\npoderão, a qualquer tempo, requerer ou representar ao juiz pela concessão de perdão judicial ao\\ncolaborador, ainda que esse benefício não tenha sido previsto na proposta inicial.", "D": "O juiz poderá, a requerimento das partes, conceder o perdão judicial, reduzir em até 2/3 (dois terços) a\\npena privativa de liberdade ou substituí-la por restritiva de direitos daquele que tenha colaborado efetiva e\\nvoluntariamente com a investigação e com o processo criminal, se dessa colaboração vier a identificação\\ndos demais coautores e partícipes da organização criminosa e das infrações penais por eles praticadas.", "E": "O prazo para oferecimento de denúncia ou o processo, relativos ao colaborador, poderá ser suspenso\\npor até 6 (seis) meses, prorrogáveis por igual período, até que sejam cumpridas as medidas de colaboração,\\nsuspendendo-se o respectivo prazo prescricional."}, "classificacao": {"id": "Q0193", "decisao": "publicar", "tema_central_id": "5557", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0194", "texto": "Tício, funcionário público, convida Mévio, que trabalha em empresa privada, para ajudá-lo a subtrair um computador, pertencente à repartição, que se encontra na sala de trabalho de Tício, para seu uso diário, e que se acha sob sua guarda. Ciente da condição de funcionário público de Tício, Mévio ajuda-o a transportar esse bem até sua casa. Nessa situação hipotética, é correto afirmar-se que", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Tício e Mévio respondem por peculato.", "B": "Tício responde por peculato e Mévio responde por furto.", "C": "Tício e Mévio respondem por furto.", "D": "Tício responde por peculato e a conduta de Mévio é atípica."}, "classificacao": {"id": "Q0194", "decisao": "publicar", "tema_central_id": "5089", "extras_ids": "5076", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0195", "texto": "Em relação ao conceito de crime, de criminoso e de pena nas diversas correntes do pensamento criminológico e ao desenvolvimento científico de seus modelos teóricos, é correto afirmar:", "comando": "É correto afirmar em relação ao conceito de crime, de criminoso e de pena nas diversas correntes do pensamento criminológico e ao desenvolvimento científico de seus modelos teóricos.", "alternativas": {"A": "A criminologia científica nasceu no ambiente do\\nséculo XVIII, recebendo contribuições da Escola\\nPositivista, mas ganhando contornos mais precisos\\ncom a Escola Clássica.", "B": "A criminologia crítica compreende que a finalidade da\\nsociedade é atingida quando há um perfeito funcionamento\\ndas suas instituições, de forma que os indivíduos\\ncompartilhem as regras sociais dominantes.", "C": "As teorias desenvolvidas nas escolas positivistas a\\npartir do método dedutivo buscaram maximizar as garantias\\nindividuais na persecução penal e fora dela.", "D": "No pensamento criminológico das escolas clássicas,\\nidentifica-se uma grande preocupação com os conceitos\\nde crime e pena como entidades jurídicas e\\nabstratas de modo a estabelecer a razão e limitar o\\npoder de punir do Estado.", "E": "Os modelos teóricos de integração que compõem a\\ncriminologia tradicional partem da premissa de que\\ntoda a sociedade está, a cada momento, sujeita\\na processos de mudança, exibindo dissensão e conflito,\\nhaja vista que todo elemento em uma sociedade\\ncontribui, de certa forma, para sua desintegração e\\nmudança. Sendo assim, a sociedade é baseada na\\ncoerção de alguns de seus membros por outros."}, "classificacao": {"id": "Q0195", "decisao": "publicar", "tema_central_id": "4373", "extras_ids": "4388", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0196", "texto": "Constitui um dos objetivos metodológicos da teoria do Labelling Approach (Teoria do Etiquetamento Social) o estudo detalhado da atuação do controle social na configuração da criminalidade.", "comando": "Assinale a alternativa correta:", "alternativas": {"A": "Para o labelling approach , o controle social penal possui um caráter seletivo e discriminatório\\ngerando a criminalidade.", "B": "O labelling approach é uma teoria da criminalidade que se aproxima do paradigma etiológico\\nconvencional para explicar a distribuição seletiva do fenômeno criminal.", "C": "Para o labelling approach , um sistemático e progressivo endurecimento do controle social\\npenal viabilizaria o alcance de uma prevenção eficaz do crime.", "D": "O labelling approach , como explicação interacionista do fato delitivo, destaca o problema\\nhermenêutico da interpretação da norma penal.", "E": "O labelling approach surge nos EUA nos anos 80, admitindo a normalidade do fenômeno\\ndelitivo e do delinquente."}, "classificacao": {"id": "Q0196", "decisao": "publicar", "tema_central_id": "4387", "extras_ids": "4378", "confianca": "0.964286", "motivo": "Labelling approach é teoria sociológica; controle seletivo é conteúdo secundário de criminalização."}}, {"id": "Q0197", "texto": "É apresentada uma situação hipotética, seguida de uma assertiva a ser julgada em relação ao inquérito policial e suas peculiaridades, às atribuições da Polícia Federal e ao sistema probatório no processo penal brasileiro. Uma quadrilha efetuou ilegalmente diversas transações bancárias na modalidade de saques e transferências eletrônicas em contas de inúmeros clientes de determinada agência do Banco do Brasil. A instituição financeira ressarciu todos os clientes lesados e arcou integralmente com os prejuízos resultantes das fraudes perpetradas pelo grupo. Nessa situação hipotética, cabe à Polícia Federal a instauração do inquérito policial, porquanto a ela compete, com exclusividade, a apuração de crimes praticados contra bens e serviços da União.", "comando": "Julgue a assertiva apresentada em relação ao inquérito policial, às atribuições da Polícia Federal e ao sistema probatório no processo penal brasileiro.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0197", "decisao": "publicar", "tema_central_id": "5500", "extras_ids": "5482", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0198", "texto": "A moderna teoria do domínio do fato de Claus Roxin procura solucionar alguns problemas de autoria e, expressamente, já foi adotada em nossos tribunais. Além das previsões legais sobre autoria mediata, existe a possibilidade de autoria no âmbito de uma organização. Para que esta seja configurada devem estar presentes alguns requisitos, EXCETO", "comando": "Assinale o requisito que não é necessário para configurar a autoria no âmbito de uma organização.", "alternativas": {"A": "poder efetivo de mando.", "B": "fungibilidade do autor imediato.", "C": "desvinculação do aparato organizado do ordenamento jurídico.", "D": "o prévio acerto entre o comandante e os demais comandados.", "E": "disponibilidade consideravelmente elevada por parte do executor."}, "classificacao": {"id": "Q0198", "decisao": "publicar", "tema_central_id": "5073", "extras_ids": "5072", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0199", "texto": "Assinale a alternativa correta, entre as seguintes assertivas relacionadas à teoria do crime:", "comando": "Assinale a alternativa correta entre as assertivas relacionadas à teoria do crime.", "alternativas": {"A": "São hipóteses de ausência de conduta: coação física irresistível, atos reflexos, omissão de ação.", "B": "O conceito de bem jurídico é indispensável à compreensão e interpretação dos tipos penais, servindo, igualmente, como critério sistematizador da legislação penal.", "C": "Os elementos subjetivos do injusto, tais como as tendências internas transcendentes, podem fazer- se presentes nos tipos penais dolosos e culposos.", "D": "Em sede de estado de necessidade, a teoria diferenciadora acolhida no Código Penal brasileiro admite a exculpação do homicídio, quando postas em confronto as vidas de duas distintas pessoas em situação de perigo.", "E": "Nos tipos penais de conteúdo misto alternativo não há fungibilidade entre as condutas, aplicando-se a regra do concurso material no caso de realização de mais de uma dessas condutas."}, "classificacao": {"id": "Q0199", "decisao": "revisar", "tema_central_id": "5218", "extras_ids": "5221;5227;5230;5067", "confianca": "0.5", "motivo": "Revisar: mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0200", "texto": "No que diz respeito às organizações criminosas, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": {"A": "O líder de organização criminosa condenado pelo crime de integrar tal organização deverá iniciar o cumprimento da pena necessariamente em estabelecimento penal de segurança máxima.", "B": "A definição legal de organização criminosa promovida pela\\nLei n.º 12.850/2013 internaliza na legislação nacional a\\ndefinição de grupo criminoso organizado constante da\\nConvenção de Palermo.", "C": "O concurso de funcionário público é qualificadora do crime\\nde integrar organização criminosa.", "D": "Havendo indício de participação de funcionário público na\\norganização criminosa, é cabível a determinação judicial de\\nafastamento cautelar do cargo, do emprego ou da função, sem\\nremuneração, quando necessária à investigação ou instrução\\nprocessual.", "E": "Para que seja possível nova acusação pelo crime de integrar\\norganização criminosa contra os mesmos agentes por novo\\ncrime de mesma espécie, sem configurar bis in idem, deve ser\\nconsiderada cessada a permanência da conduta com o\\nrecebimento da denúncia."}, "classificacao": {"id": "Q0200", "decisao": "publicar", "tema_central_id": "4705", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0201", "texto": "José, com trinta anos de idade, manteve, entre 2013 e 2015, relacionamento amoroso com uma menor que atualmente tem treze anos de idade. Nesse período, constantemente, José, praticava com ela conjunção carnal e outros atos libidinosos diversos. A mãe da menor descobriu o caso e denunciou José à polícia. A menor, em seu depoimento, afirmou que sempre consentiu com o namoro e com os atos sexuais praticados e que, da mesma forma, já havia namorado outros rapazes antes de José. Acerca dessa situação hipotética, assinale a opção correta à luz da jurisprudência dominante, atualmente, no STF e no STJ.", "comando": "Acerca dessa situação hipotética, assinale a opção correta à luz da jurisprudência dominante, atualmente, no STF e no STJ.", "alternativas": {"A": "A prévia existência de relacionamento amoroso e duradouro\\nentre a menor e José extingue a punibilidade do agente por\\ncrime de estupro de vulnerável.", "B": "José praticou crime de estupro de vulnerável e atentado\\nviolento ao pudor em continuidade delitiva.", "C": "José praticou crime de estupro de vulnerável, ainda que a\\nadolescente tenha consentido em manter com ele relações\\nsexuais.", "D": "A ausência de representação formulada pela menor ou por sua\\nmãe impede que José seja processado pelos fatos ocorridos.", "E": "A anterior experiência sexual da vítima afasta sua\\nvulnerabilidade, de forma que José deve responder apenas por\\ncorrupção de menor."}, "classificacao": {"id": "Q0201", "decisao": "publicar", "tema_central_id": "5103", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0202", "texto": "Tício e Mévio são amigos, desde a infância. Enquanto Tício tem facilidade para se relacionar, Mévio é tímido, nunca tendo se relacionado. No aniversário de Mévio, Tício decide contratar uma profissional do sexo. Contudo, ele pede para a moça não contar nada ao amigo e, simula um encontro fortuito, dos dois, em um bar. O plano de Tício dá certo. Mévio e a moça contratada passam a noite juntos, no quarto de um flat, onde ela disse residir. Pela manhã, contudo, Mévio é acordado, por policiais, em uma operação de combate à exploração sexual de criança e adolescente, sendo acusado de manter relação sexual com menor de 18 anos, em situação de prostituição (art. 218, B, parágrafo 2º, inciso I, do CP), já que a moça conta com apenas 17 anos de idade.", "comando": "Diante da situação hipotética e considerando que Tício também não sabia da menoridade da pessoa contratada,", "alternativas": {"A": "A conduta de Mévio é atípica, vez que o ato de manter relação sexual com pessoa em situação de prostituição, adulta ou menor, não é punível.", "B": "A conduta de Mévio é atípica, vez que o ato de manter relação sexual com pessoa em situação de prostituição somente é punível, se a vítima for menor de\\n14 anos.", "C": "A conduta de Mévio é atípica, vez que ele desconhecia a condição de prostituição e, sobretudo, menoridade da vítima.", "D": "A conduta de Mévio, embora típica, em razão do desconhecimento da condição de prostituição e menoridade, é punida a título de culpa.", "E": "A conduta de Mévio é atípica, vez desconhecer a\\ncondição de prostituição e menoridade da vítima,\\nmas Tício, que a contratou, incorreu no crime do artigo 218-B, caput, do CP."}, "classificacao": {"id": "Q0202", "decisao": "publicar", "tema_central_id": "5224", "extras_ids": "5109", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0203", "texto": "Julgue o item a seguir com base na Lei n.º 9.613/1998, que dispõe sobre lavagem de dinheiro. Havendo indícios suficientes de infração penal, é admissível a indisponibilidade de bens, direitos e valores registrados em nome de interpostas pessoas, físicas ou jurídicas, cuja existência indicar que o acusado por crime de lavagem de dinheiro é o seu verdadeiro titular.", "comando": "", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0203", "decisao": "publicar", "tema_central_id": "4702", "extras_ids": "5496", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0204", "texto": "Em relação à lei processual penal no tempo, vigora o princípio do efeito imediato, segundo o qual tempus regit actum. De acordo com tal princípio, as normas processuais penais têm aplicação imediata, mas consideram-se válidos os atos processuais realizados sob a égide da lei anterior.", "comando": "Explique o princípio do efeito imediato na lei processual penal.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0204", "decisao": "publicar", "tema_central_id": "5507", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0205", "texto": "Assinale a alternativa correta.", "comando": "", "alternativas": {"A": "Dar-se-á carta testemunhável da decisão que denegar o recurso.", "B": "O Ministério Público pode desistir de recurso que haja interposto desde que se trate de crime de menor potencial ofensivo.", "C": "Réu que teve declarada extinta a punibilidade por prescrição pode recorrer pedindo decisão de mérito da acusação.", "D": "A apelação da sentença absolutória impede que o réu seja posto imediatamente em liberdade."}, "classificacao": {"id": "Q0205", "decisao": "publicar", "tema_central_id": "5512", "extras_ids": "5567;5513;5514;5515", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0206", "texto": "No tocante ao assistente de acusação, é correto afirmar que", "comando": "Complete a afirmativa sobre o assistente de acusação.", "alternativas": {"A": "o ofendido poderá intervir como assistente em qualquer ação penal.", "B": "a admissão do assistente fica condicionada à manifestação do Ministério Público.", "C": "da decisão que admitir o assistente de acusação caberá recurso em sentido estrito.", "D": "ao assistente é proibido arrazoar os recursos interpostos pelo Ministério Público.", "E": "o assistente será admitido até o início da instrução do processo."}, "classificacao": {"id": "Q0206", "decisao": "publicar", "tema_central_id": "5583", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0207", "texto": "Caso um preso, em cumprimento de pena privativa de liberdade, tenha sido flagrado, em 10/10/2020, portando consigo um aparelho telefônico apto à comunicação com o ambiente externo,", "comando": "", "alternativas": {"A": "a autoridade administrativa prisional poderá decretar, de\\nofício, a inclusão cautelar do faltoso em regime disciplinar\\ndiferenciado no interesse da disciplina.", "B": "a autoridade administrativa prisional poderá decretar o\\nisolamento cautelar do preso pelo prazo máximo de dez dias,\\nnão sendo computado tal prazo no período de cumprimento\\nda respectiva sanção disciplinar.", "C": "o prazo prescricional para a apuração da falta disciplinar é de\\ntrês anos.", "D": "ele estará sujeito à perda da totalidade do tempo remido visto\\nter cometido falta grave.", "E": "é cabível a regressão cautelar do regime prisional, após a\\noitiva obrigatória do faltoso."}, "classificacao": {"id": "Q0207", "decisao": "publicar", "tema_central_id": "4703", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0208", "texto": "Lucas foi denunciado por infringir o art. 121, § 2.º, inciso II (homicídio qualificado por motivo fútil), do CP, por ter disparado arma de fogo contra Mauro, levando-o a óbito. Na denúncia, consta que Lucas e seu irmão Carlos estavam em um bar na comarca de Pacajus, onde, em dado momento, Carlos discutiu com Mauro. A discussão acabou resultando em luta corporal. O dono do bar afirmou que a discussão se deu porque Carlos se recusou a pagar uma bebida para Mauro; Lucas acudiu o irmão e Mauro, estando sozinho, foi embora, mas retornou, minutos depois, com uma faca do tipo peixeira na mão. O dono do bar afirmou que chegou a trancar a porta, tentando evitar a tragédia, mas a vítima conseguiu arrombá-la, entrou no bar e partiu para cima de Carlos com a peixeira em riste. O depoente viu que Lucas sacou um revólver e atirou duas vezes, atingindo Mauro na altura do tórax. Vendo-o caído, Lucas fugiu do local e escondeu-se em uma mata, onde foi encontrado doze horas depois, ainda com a arma do crime. A vítima foi socorrida no hospital municipal e, no dia seguinte, foi transferida para o Hospital Geral de Fortaleza, onde, devido à gravidade dos ferimentos, faleceu depois de ser submetida a cirurgia. Considerando a situação hipotética acima descrita, julgue os itens subseqüentes.", "comando": "Lucas foi o autor de homicídio e Carlos figurou como partícipe do crime", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0208", "decisao": "publicar", "tema_central_id": "5072", "extras_ids": "5074;5231", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0209", "texto": "Acerca das provas, das sentenças e dos princípios do direito processual penal, julgue o item a seguir. Em razão do princípio constitucional da presunção de inocência, é vedado à autoridade policial mencionar anotações referentes à instauração de inquérito nos atestados de antecedentes que lhe forem solicitados.", "comando": "Julgue o item a seguir.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0209", "decisao": "publicar", "tema_central_id": "5499", "extras_ids": "5582", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0210", "texto": "O Estatuto do Desarmamento, Lei nº 10.826/2003, no seu capítulo IV, define crimes relacionados a armas de fogo e munições. Considerando casos concretos de réus denunciados por esses delitos e conforme entendimento das Cortes Superiores, é correto afirmar que:", "comando": "", "alternativas": {"A": "em hipóteses de apreensão de armas de fogo e/ou munições\\nde uso permitido e restrito, num mesmo contexto fático, há\\ncrime único, aplicado o princípio da consunção, e não\\nconcurso de crimes, uma vez que se trata de condutas que\\ntutelam o mesmo bem jurídico;", "B": "deve ser reconhecida a atipicidade material da conduta em\\nsituações específicas de ínfima quantidade de munição\\napreendida na posse do agente, de uso permitido ou restrito,\\naliada à ausência de artefato capaz de disparar o projétil;", "C": "aplica-se o princípio da insignificância e se reconhece a\\natipicidade material do crime de posse de ínfima quantidade\\nde munição de uso permitido, ainda que a moldura fática do\\ncaso revele a apreensão de arma de fogo e drogas com o\\nagente;", "D": "apreendido armamento que passou a ser considerado de uso\\npermitido após a entrada em vigor de decreto, a norma penal\\nposterior deve incidir de forma imediata a fato anterior,\\ndesde que não decidido por sentença transitada em julgado,\\nporque favorece o agente, em harmonia com o princípio da\\nretroatividade da lei penal mais benéfica;", "E": "o legislador, ao elaborar a lei que alterou a Lei de Crimes\\nHediondos, quis conferir tratamento mais gravoso ao crime\\nde posse ou porte de arma de fogo, acessório ou munição,\\nnão importando se de uso proibido/restrito ou de uso\\npermitido, de modo que a natureza hedionda se reconhece\\ntambém aos crimes de posse ou porte de arma de fogo de\\nuso permitido com numeração raspada, suprimida ou\\nadulterada."}, "classificacao": {"id": "Q0210", "decisao": "publicar", "tema_central_id": "4697", "extras_ids": "5172;5181", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0211", "texto": "As audiências realizadas nos Fóruns representam parte relevante da vida forense. O contato humano e a ritualística do Direito e da Justiça formam um ambiente único, no qual a abstração e a aridez dos conceitos jurídicos conflitam com as vidas humanas, com os problemas sociais e com os efeitos práticos suportados pelas pessoas de carne e osso. Diante do exposto, assinale a alternativa incorreta.", "comando": "", "alternativas": {"A": "Os espectadores das audiências ou das sessões poderão manifestar aprovação ou desaprovação sobre as decisões judiciais, expressão da garantia constitucional de liberdade de opinião e de expressão", "B": "A polícia das audiências compete aos respectivos juízes, que poderão determinar o que for conveniente à manutenção da ordem e, para isso, poderão requisitar a força pública, que ficará exclusivamente à sua disposição", "C": "A exceção é o segredo. As audiências, as sessões e os atos processuais serão, em regra, públicos e realizados com assistência dos funcionários da Justiça", "D": "O Juiz fará retirar da sala aqueles que desobedecerem seus legais comandos"}, "classificacao": {"id": "Q0211", "decisao": "publicar", "tema_central_id": "5582", "extras_ids": "5535", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0212", "texto": "Julgue o item subsequente, em relação à prova, ao instituto da interceptação telefônica e à citação por hora certa. Em processo penal, a citação por hora certa do réu que se oculte para não ser citado segue os procedimentos previstos no Código de Processo Civil, de modo que, caso o réu não compareça em juízo nem constitua advogado, ficam suspensos o processo e o curso do prazo prescricional, podendo o juiz, se for o caso, determinar a produção antecipada de provas consideradas urgentes.", "comando": "", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0212", "decisao": "publicar", "tema_central_id": "5488", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0213", "texto": "Nos crimes previstos na Lei de Drogas (Lei nº 11.343/2006), oferecida a denúncia, o(a) juiz(a) ordenará a:", "comando": "", "alternativas": {"A": "citação do acusado para oferecer resposta à acusação, por escrito, no prazo de 10 (dez) dias.", "B": "notificação do acusado para oferecer defesa prévia, por escrito, no prazo de 15 (quinze) dias.", "C": "notificação do acusado para oferecer defesa prévia, por escrito, no prazo de 10 (dez) dias.", "D": "citação do acusado para oferecer resposta à acusação, por escrito, no prazo de 15 (quinze) dias."}, "classificacao": {"id": "Q0213", "decisao": "publicar", "tema_central_id": "4708", "extras_ids": "5533", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0214", "texto": "Patrick foi denunciado e condenado, em primeira instância, perante a 1ª Vara Criminal de Florianópolis, pela prática de crime de corrupção passiva. Após a condenação, dentro do prazo legal, apresentou o recurso cabível, que se encontra pendente de julgamento. Nesse período, foi novamente denunciado pela prática do crime de corrupção passiva, dessa vez perante a 2ª Vara Criminal de Florianópolis, sendo verificado pelo teor da denúncia que os fatos imputados são os mesmos daquela ação da 1ª Vara Criminal. A defesa técnica de Patrick, poderá apresentar, ao responder a segunda ação penal, a exceção de:", "comando": "", "alternativas": {"A": "incompetência do juízo, que deverá ser processada nos autos principais;", "B": "coisa julgada, que deverá ser processada em autos apartados;", "C": "coisa julgada, que suspenderá o andamento da ação penal;", "D": "litispendência, que deverá ser processada em autos apartados;", "E": "suspeição, que precederá a qualquer outra eventualmente oposta."}, "classificacao": {"id": "Q0214", "decisao": "publicar", "tema_central_id": "5494", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0215", "texto": "Leia o caso a seguir. Um homem é réu primário e é condenado por crime cometido com violência à pessoa, fixando o juiz a pena-base no mínimo legal, que é de 6 (seis) anos de reclusão. Elaborado pelo(a) autor(a). O regime inicial de cumprimento da pena será o", "comando": "", "alternativas": {"A": "semiaberto, proibida a fixação de regime inicial mais gravoso com base apenas na gravidade do delito.", "B": "fechado, proibida a fixação de regime inicial mais gravoso com base apenas na gravidade do delito.", "C": "semiaberto, permitida a fixação de regime inicial mais gravoso com base apenas na gravidade do delito.", "D": "fechado, permitida a fixação de regime inicial mais gravoso com base apenas na gravidade do delito."}, "classificacao": {"id": "Q0215", "decisao": "publicar", "tema_central_id": "5201", "extras_ids": "5576", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0216", "texto": "Considerando o sistema de juizados especiais criminais, previsto na Lei n.° 9.099/1995, e a jurisprudência do STJ e STF sobre a matéria,", "comando": "assinale a opção correta.", "alternativas": {"A": "Tratando-se de crime de ação penal privada ou pública\\ncondicionada à representação, a realização de composição\\ncivil dos danos entre autor e vítima gera a extinção da\\npunibilidade.", "B": "Admite-se transação penal para os crimes dolosos com pena\\nmáxima inferior ou igual a 2 anos e para os delitos culposos,\\nindependentemente da sanção aplicada.", "C": "A sentença que homologa a transação penal faz coisa julgada\\nmaterial, e o descumprimento do acordo deve ser resolvido\\npor meio de execução na esfera cível.", "D": "O procedimento de apuração de infrações de menor potencial\\nofensivo não admite a realização de exames periciais, haja\\nvista a necessidade de brevidade na conclusão do processo.", "E": "A despeito da omissão legislativa, é permitida a realização de\\ntransação penal para os crimes de ação penal privada, por se\\ntratar de direito subjetivo do autor do fato."}, "classificacao": {"id": "Q0216", "decisao": "publicar", "tema_central_id": "4701", "extras_ids": "5541", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0217", "texto": "Para Michel Foucault, em Vigiar e punir , as razões de ser essenciais da reforma penal no século XVIII, também denominada Reforma Humanista do Direito penal, são constituir uma nova economia e uma nova tecnologia do poder de:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "recuperar.", "B": "ressocializar.", "C": "humanizar.", "D": "punir.", "E": "descriminalizar."}, "classificacao": {"id": "Q0217", "decisao": "publicar", "tema_central_id": "4372", "extras_ids": "4384", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0218", "texto": "João da Silva vai à agência bancária obter o levantamento de conta de FGTS de terceiro, usando documento falso. Desconfiado da veracidade do documento, o gerente da agência pede a João que retorne em algumas horas, quando o dinheiro já estará disponível em sua conta. João retorna no horário combinado e, no momento em que efetua o saque, é preso por policiais militares acionados pelo gerente da agência após proceder à checagem da autenticidade do referido documento e confirmar sua falsidade.", "comando": "Considerando essa narrativa, assinale a afirmativa correta.", "alternativas": {"A": "A prisão em flagrante é ilegal, pois se trata de flagrante provocado.", "B": "A prisão em flagrante é legal, pois se trata de ação controlada.", "C": "A prisão em flagrante é legal, pois se trata de flagrante diferido.", "D": "A prisão em flagrante é legal, pois se trata de flagrante preparado.", "E": "A prisão em flagrante é legal, pois se trata de flagrante esperado."}, "classificacao": {"id": "Q0218", "decisao": "publicar", "tema_central_id": "5518", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0219", "texto": "Considerando essa situação hipotética, julgue o item subsequente. Na situação descrita, está presente a hipótese de participação necessária imprópria.", "comando": "Julgue o item subsequente.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0219", "decisao": "revisar", "tema_central_id": "5074", "extras_ids": "", "confianca": "0.5", "motivo": "Revisar: texto_incompleto; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0220", "texto": "De acordo com precedente firmado pelo STF em sede de controle concentrado de constitucionalidade, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": {"A": "Em caso de discordância do arquivamento do inquérito\\npolicial, somente a vítima ou seu representante legal pode\\nsubmeter, a qualquer tempo, a matéria à revisão da instância\\ncompetente do órgão ministerial.", "B": "Em caso de discordância do arquivamento do inquérito\\npolicial, somente a vítima ou seu representante legal pode\\nsubmeter a matéria à revisão da instância competente do\\nórgão ministerial, no prazo de trinta dias, contados do\\nrecebimento da comunicação.", "C": "Em caso de discordância do arquivamento do inquérito\\npolicial, além da vítima e de seu representante legal, a\\nautoridade judicial competente também poderá submeter a\\nmatéria à revisão da instância competente do órgão\\nministerial, caso verifique patente ilegalidade ou teratologia\\nno ato do arquivamento.", "D": "O STF julgou inconstitucional o dispositivo que autorizava,\\nem caso de discordância do arquivamento do inquérito\\npolicial, a submissão da matéria à revisão da instância\\ncompetente do órgão ministerial, por entender que a decisão\\nde arquivamento do inquérito policial é insuscetível de\\nrevisão.", "E": "Em caso de discordância do arquivamento do inquérito\\npolicial, somente podem submeter a matéria à revisão da\\ninstância competente do órgão ministerial a vítima ou seu\\nrepresentante legal e o membro do órgão ministerial que\\nhouver se manifestado contra o arquivamento do inquérito\\npolicial."}, "classificacao": {"id": "Q0220", "decisao": "publicar", "tema_central_id": "5501", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0221", "texto": "A respeito das penas e das medidas de segurança, assinale a opção correta.", "comando": "", "alternativas": {"A": "A atenuante da confissão espontânea é preponderante em relação à reincidência, impossibilitando a compensação plena entre uma e outra na segunda fase da dosimetria.", "B": "São espécies de penas privativas de liberdade a reclusão, a detenção, a prisão simples e a prisão especial.", "C": "São espécies de penas restritivas de direitos a prestação de serviços à comunidade, a interdição temporária de direitos e a obrigação de reparar o dano causado pelo crime.", "D": "São princípios constitucionais aplicáveis à pena a personalidade ou responsabilidade pessoal, a legalidade, a inderrogabilidade, a proporcionalidade, a individualização e a humanização.", "E": "A duração da medida de segurança é por tempo indeterminado, e o condenado só será liberado depois que perícia médica atestar a cessação de sua periculosidade."}, "classificacao": {"id": "Q0221", "decisao": "revisar", "tema_central_id": "5199", "extras_ids": "5203;5201;5205;5184", "confianca": "0.5", "motivo": "Revisar: mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0222", "texto": "Assinale a alternativa correta.", "comando": "", "alternativas": {"A": "O denominado direito penal do inimigo, que tem como expoente Günther Jakobs,\\npode ser entendido como um direito penal de segunda velocidade, restringindo\\ngarantias penais e processuais.", "B": "A terceira velocidade do direito penal, ligada à ideia de aplicação de penas\\nalternativas, encontra amparo no ordenamento penal brasileiro na Lei n.\\n9.099/1995.", "C": "A quarta velocidade do direito penal refere-se ao neopunitivismo, abrangendo\\naquelas pessoas que violaram tratados e convenções internacionais de direitos\\nhumanos, ostentando a condição de Chefes de Estado, devendo sofrer a incidência\\nde normas internacionais.", "D": "A teoria da primeira velocidade do direito penal, fundada no respeito às garantias\\nindividuais, tinha a ideia de um direito penal de mínima intervenção e sanções não\\nprivativas de liberdade.", "E": "A ideia de velocidades do direito penal foi concebida e sistematizada pelo professor\\nManuel Cancio Meliá."}, "classificacao": {"id": "Q0222", "decisao": "publicar", "tema_central_id": "4375", "extras_ids": "4376", "confianca": "0.964286", "mo
