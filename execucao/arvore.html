eles reagem, usando força corporal nos limites necessários para conter Filomena. Como resultado, Filomena e os fiscais ficam levemente feridos, sendo a mercadoria devidamente apreendida. Diante do caso narrado, é correto afirmar que:", "comando": "Diante do caso narrado, é correto afirmar que:", "alternativas": {"A": "Filomena praticou o delito de resistência, ao passo que os fiscais cometeram o delito de lesão corporal leve;", "B": "Filomena praticou o delito de resistência, na modalidade tentada, ao passo que os fiscais não cometeram crime algum, pois agiram amparados em excludente de ilicitude;", "C": "Filomena praticou o delito de resistência qualificada, ao passo que os fiscais não cometeram crime algum, pois agiram amparados em excludente de ilicitude;", "D": "Filomena praticou os delitos de resistência e lesões corporais leves, ao passo que os fiscais não cometeram crime algum, pois agiram amparados em excludente de ilicitude;", "E": "Filomena praticou os delitos de resistências, na modalidade tentada, e lesões corporais leves, ao passo que os fiscais cometeram os crimes de lesão corporal leve e abuso de autoridade."}, "classificacao": {"id": "Q0099", "decisao": "publicar", "tema_central_id": "5100", "extras_ids": "5232;5077", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0100", "texto": "Augusto levou sua filha, Ana, de treze anos de idade, a uma boate cuja entrada era permitida apenas para pessoas maiores de dezoito anos de idade, para que a menina se encontrasse com amigas que comemoravam o aniversário de uma delas. O segurança da boate não pediu documento de identificação à menina, que aparentava ser maior de idade. Após consumir algumas doses de tequila, Ana começou a flertar com Otávio, de vinte e oito anos de idade, e disse ao rapaz que tinha dezesseis anos de idade. Após breve conversa, Otávio convidou a adolescente a ir com ele a um motel. Lisonjeada, porém indecisa, Ana perguntou a opinião de suas amigas, que foram unânimes em incentivá-la a aceitar o convite, pois conheciam muito bem Otávio. Na manhã seguinte, após ter relações sexuais consentidas com Otávio, com quem perdera a virgindade, Ana retornou, sozinha, para casa. Desconfiado do que a filha poderia ter feito na noite anterior, Augusto começou a interrogá-la, e ela, por medo, afirmou ter sido obrigada a manter relações sexuais com Otávio. Ato contínuo, Augusto levou a filha até a delegacia de polícia, onde registrou ocorrência policial contra Otávio.", "comando": "Com base nos fatos narrados na situação hipotética acima apresentada, assinale a opção correta.", "alternativas": {"A": "O crime de estupro de vulnerável impõe, em caráter absoluto, um dever geral de abstenção da conduta de manter conjunção carnal ou qualquer ato libidinoso com pessoa menor de quatorze anos de idade, podendo, entretanto, ser reconhecido o erro de tipo da parte de Otávio, o que engendraria a atipicidade de sua conduta.", "B": "Caso Otávio seja absolvido da acusação, ficará configurado o crime de denunciação caluniosa cometido por Augusto.", "C": "As amigas de Ana figuram como partícipes do crime do qual Otávio é acusado, pois incentivaram a vítima, menor de idade, a ir ao motel com pessoa maior de idade.", "D": "Em razão de ter levado a filha a local exclusivo para pessoas maiores de dezoito anos de idade e de nada ter feito para impedir o fato, pode ser imputado a Augusto o crime de estupro de vulnerável praticado por omissão imprópria, visto que, na qualidade de pai e, portanto, de agente garantidor, deveria impedir a ocorrência do resultado.", "E": "Otávio praticou o crime de corrupção sexual de menores, dado o consentimento das relações sexuais, figurando o segurança da boate como partícipe do referido delito, na medida em que sua negligência no trabalho foi determinante para a ocorrência do resultado."}, "classificacao": {"id": "Q0100", "decisao": "publicar", "tema_central_id": "5103", "extras_ids": "5224;5223", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0101", "texto": "De acordo com a Lei Maria da Penha, a ação de divórcio ou dissolução de união estável de mulher vítima de violência doméstica e familiar", "comando": "Complete a frase ou responda sobre a ação de divórcio ou dissolução de união estável segundo a Lei Maria da Penha.", "alternativas": {"A": "deverá ser ajuizada perante o Juizado de Violência Doméstica e Familiar, uma vez que não pode haver opção da ofendida\\npor se tratar de competência em razão da pessoa.", "B": "poderá ser ajuizada perante o Juizado de Violência Doméstica e Familiar contra a Mulher, excluindo-se a pretensão relacionada à partilha de bens.", "C": "poderá ser ajuizada perante a Vara de Família, somente nos casos em que não houver Juizado de Violência Doméstica e\\nFamiliar contra a Mulher instalado na Comarca de residência da mulher.", "D": "poderá ser ajuizada perante o Juizado de Violência Doméstica e Familiar contra a Mulher, inclusive em relação à pretensão relacionada à partilha de bens.", "E": "deverá ser ajuizada perante a Vara de Família, uma vez que o Juizado de Violência Doméstica e Familiar contra a Mulher\\nestá restrito às medidas protetivas de urgência."}, "classificacao": {"id": "Q0101", "decisao": "publicar", "tema_central_id": "4704", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0102", "texto": "Sobre a sentença e os seus efeitos, é correto afirmar:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "A sentença condenatória, como gera o efeito de tornar certa a reparação do dano, deve, provisoriamente, fixar o valor do prejuízo causado pelo crime, para futura execução civil.", "B": "A sentença que absolve por insuficiência de prova faz coisa julgada no cível, impedindo a propositura de ação civil para reparação do dano causado pelo crime.", "C": "A sentença que absolve e aplica medida de segurança é denominada de \"sentença absolutória imprópria\".", "D": "Um dos efeitos da condenação é a perda em favor da unidade federativa perante a qual o processo teve andamento do produto do crime.", "E": "A perda de função pública, como efeito da condenação, pode ser aplicada em qualquer crime cuja pena privativa de liberdade seja superior a dois anos."}, "classificacao": {"id": "Q0102", "decisao": "publicar", "tema_central_id": "5572", "extras_ids": "5574;5577;5184", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0103", "texto": "A respeito da revisão criminal, julgue os próximos itens. A revisão criminal, que é um dos aspectos diferenciadores do mero direito à defesa e do direito à ampla defesa, este caracterizador do direito processual penal, tem por finalidade o reexame do processo já alcançado pela coisa julgada, de forma a possibilitar ao condenado a absolvição, a melhora de sua situação jurídica ou a anulação do processo.", "comando": "Julgue os próximos itens sobre a revisão criminal.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0103", "decisao": "publicar", "tema_central_id": "5478", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0104", "texto": "No que se refere à legislação processual e à jurisprudência pátrias, julgue o item subsequente. O fato de o inquérito policial ser instaurado por promotor de justiça não impede que o delegado dê prosseguimento ao procedimento e seja eventualmente apontado como autoridade coatora na hipótese de impetração de habeas corpus .", "comando": "", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0104", "decisao": "publicar", "tema_central_id": "5500", "extras_ids": "5477", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0105", "texto": "Um homem branco, de 29 anos de idade, e um homem negro, de 21 anos de idade, foram presos por terem pichado, juntos, um prédio. Na posse deles, foram encontradas as tintas usadas no ato, além de um cigarro de maconha. O indivíduo branco assinou termo circunstanciado e foi liberado, enquanto o outro homem foi mantido preso. Considerando essa situação hipotética e as perspectivas da criminologia, julgue o item a seguir. A criminologia cultural analisa a pichação como ato de contracultura e de representação social de populações periféricas, resgatando e atualizando os estudos sobre o paradigma do etiquetamento social.", "comando": "Julgue o item a seguir.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0105", "decisao": "publicar", "tema_central_id": "4387", "extras_ids": "", "confianca": "0.964286", "motivo": "Criminologia cultural e paradigma do etiquetamento são teorias de nível sociológico; evitar o irmão genérico."}}, {"id": "Q0106", "texto": "Que delito praticam os estudantes de Direito com o chamado “pendura”, nas comemorações da instalação dos cursos jurídicos no País?", "comando": "Responda qual é o delito praticado pelos estudantes de Direito com o chamado “pendura” nas comemorações da instalação dos cursos jurídicos no País.", "alternativas": {"A": "Nenhum crime foi praticado, por se tratar de fato atípico.", "B": "Crime de dano qualificado, por motivo egoístico.", "C": "Delito de fraude, consistente em tomar refeições em restaurante, sem dispor de recursos para pagar as despesas.", "D": "Estelionato privilegiado, devido ao pequeno valor do prejuízo causado à vítima."}, "classificacao": {"id": "Q0106", "decisao": "publicar", "tema_central_id": "5157", "extras_ids": "5166", "confianca": "0.916667", "motivo": "Tomar refeição sem recursos é outra fraude patrimonial; o nó pai preserva o ramo sem equiparar automaticamente ao estelionato estrito."}}, {"id": "Q0107", "texto": "À luz das disposições legais de direito penal e da jurisprudência correlata, julgue o próximo item.", "comando": "A conduta do agente que, para não se incriminar, atribui a si a identidade de outrem, perante o delegado, é típica e configura o crime de falsa identidade.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0107", "decisao": "publicar", "tema_central_id": "5119", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0108", "texto": "Durante a realização de audiência de instrução e julgamento, em que se apurava a prática, por Caio, do crime de roubo simples, a defesa técnica do acusado requereu o reconhecimento da prescrição da pretensão punitiva estatal, em observância aos prazos prescricionais estipulados em lei. Contudo, o Juízo indeferiu o pedido e, finda a instrução, determinou que as partes apresentassem memoriais. Irresignada, a Defensora Pública Maria pretende recorrer do provimento jurisdicional prolatado. Nesse cenário, considerando as disposições do Código de Processo Penal, Maria, na qualidade de Defensora Pública, deverá interpor um(a)", "comando": "Indique qual recurso Maria deverá interpor.", "alternativas": {"A": "recurso em sentido estrito, fazendo jus ao efeito suspensivo\\npor força de lei.", "B": "recurso inominado, fazendo jus ao efeito suspensivo por força\\nde lei.", "C": "recurso em sentido estrito, sem efeito suspensivo por força de\\nlei.", "D": "recurso inominado, sem efeito suspensivo por força de lei.", "E": "apelação, sem efeito suspensivo por força de lei."}, "classificacao": {"id": "Q0108", "decisao": "publicar", "tema_central_id": "5561", "extras_ids": "5515", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0109", "texto": "Aquele que oferece droga, eventualmente e sem objetivo de lucro, a pessoa de seu relacionamento, para juntos a consumirem, está sujeito à pena de", "comando": "Complete a frase com a pena aplicável.", "alternativas": {"A": "medida educativa de comparecimento a programa e curso educativo e prestação de serviços à comunidade, apenas.", "B": "advertência sobre os efeitos das drogas e prestação de serviços à comunidade, apenas.", "C": "reclusão, de 5 (cinco) a 15 (quinze) anos, e pagamento de 500 (quinhentos) a 1.500 (mil e quinhentos) diasmulta.", "D": "detenção, de 6 (seis) meses a 1 (um) ano, e pagamento de 700 (setecentos) a 1.500 (mil e quinhentos) dias-multa, sem prejuízo das sanções previstas no artigo 28 da Lei n.º 11.343/06."}, "classificacao": {"id": "Q0109", "decisao": "publicar", "tema_central_id": "4708", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0110", "texto": "Sobre a competência em matéria processual penal é correto afirmar que:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "compete ao juizo da infãncia e da juventude, em razão do principio da proteção integral, o processamento e julgamento de réu, maior de 18 (dezoito) anos, que pratique crime de estupro de vulnerável (art. 217-A, do Código Penal).", "B": "no crime de peculato-desvio, compete ao foro do local para o qual foram destinados os recursos desviados, e não ao foro do local onde efetivamente ocorreu o desvio de recursos públicos, o processamento e julgamento da respectiva ação penal.", "C": "tanto pelo Supremo Tribunal Federal, como também pelo Superior Tribunal de Justiça, constitui jurisprudência sumulada que o foro competente para o processo e o julgamento dos crimes de estelionato, sob a modalidade da emissão dolosa de cheque sem provisão de fundos, é o do local onde o agente aufere a vantagem indevida.", "D": "nos processos por crime contra a honra, em que for querelante pessoa detentora de foro especial por prerrogativa de função, quando oposta e admitida a exceção da verdade, será esta última julgada pelo julzo especial, que teria competencia para julgar a suposta vítima do crime contra honra (querelante)."}, "classificacao": {"id": "Q0110", "decisao": "publicar", "tema_central_id": "5480", "extras_ids": "5483;5484;5482", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0111", "texto": "Sobre a escola positivista da criminologia, é correto afirmar:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "A escola positivista ainda não chega a considerar a concepção da pena como meio de defesa social, que é própria de\\nescolas mais modernas da criminologia.", "B": "Sua recepção no Brasil recebeu contornos racistas, notadamente no trabalho antropológico de Nina Rodrigues.", "C": "É uma escola criminológica ultrapassada e que já influenciou a legislação penal brasileira, mas que após a Constituição\\nFederal de 1988 não conta mais com institutos penais influenciados por esta corrente.", "D": "Por ter enveredado pela sociologia criminal, Enrico Ferri não é considerado um autor da escola positivista, que possui viés\\nmédico e antropológico.", "E": "O método positivista negava a importância da pesquisa empírica, que possivelmente a levaria a resultados diversos\\ndaqueles encontrados pelos seus autores."}, "classificacao": {"id": "Q0111", "decisao": "publicar", "tema_central_id": "4373", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0112", "texto": "As penas do crime de promover, constituir, financiar ou integrar organização criminosa, do art. 2° da Lei n° 12.850/13, são aumentadas de 1/6 a 2/3, nos termos do parágrafo 4°, se", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "houver impedimento ou, de qualquer forma, embaraçar-se a investigação de infração penal cometida no\\nseio da organização criminosa.", "B": "na atuação da organização criminosa houver emprego\\nde arma de fogo.", "C": "houver concurso de funcionário público, valendo-se\\na organização criminosa dessa condição para a prática de infração penal.", "D": "o acusado exercer o comando, individual ou coletivo,\\nda organização criminosa, ainda que não pratique\\npessoalmente atos de execução.", "E": "das ações diretas ou indiretas da organização criminosa resultar morte."}, "classificacao": {"id": "Q0112", "decisao": "publicar", "tema_central_id": "4705", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0113", "texto": "José, Auditor Fiscal da Receita do Estado Beta, aceitou propina para deixar de constituir, mediante lançamento, determinado crédito tributário. Diante de tal fato, José está respondendo a processo administrativo disciplinar e sendo investigado por crime em inquérito policial. Sabe-se que o estatuto dos servidores públicos civis do Estado Beta dispõe que os prazos de prescrição previstos na lei penal se aplicam às infrações disciplinares capituladas também como crime. Sobre o caso em tela, de acordo com a jurisprudência do Superior Tribunal de Justiça,", "comando": "assinale a afirmativa correta.", "alternativas": {"A": "Não deve ser aplicado, na esfera disciplinar, o prazo\\nprescricional previsto na legislação penal, porque ainda não\\nhouve oferecimento de denúncia criminal", "B": "Deve ser aplicado, na esfera disciplinar, o prazo prescricional\\nprevisto na legislação penal, apenas porque já houve\\ninstauração de inquérito policial.", "C": "Não deve ser aplicado, na esfera disciplinar, o prazo\\nprescricional previsto na legislação penal, porque ainda não\\nfoi proferida sentença criminal em primeiro grau de\\njurisdição.", "D": "Não deve ser aplicado, na esfera disciplinar, o prazo\\nprescricional previsto na legislação penal, porque ainda não\\nfoi proferida sentença criminal transitada em julgado.", "E": "Deve ser aplicado, na esfera disciplinar, o prazo prescricional\\nprevisto na legislação penal, independentemente de qualquer\\noutra exigência."}, "classificacao": {"id": "Q0113", "decisao": "fora", "tema_central_id": "", "extras_ids": "", "confianca": "0.0", "motivo": "Lacuna na taxonomia: Prazo prescricional disciplinar sem nó administrativo"}}, {"id": "Q0114", "texto": "Um Delegado de Polícia, em 10/04/2012, ou seja, após o julgamento pelo STF da ADI 4424 (09/02/2012), que entendeu ser a ação penal por lesão corporal leve, no âmbito da violência doméstica contra a mulher, pública incondicionada, se depara com notícia de um crime de lesão corporal leve, no âmbito da violência doméstica contra a mulher, ocorrido em 04/01/2012, ou seja, antes do julgamento da referida ADI 4424, sem que a vítima tenha representado. Tendo em conta o controle de constitucionalidade na via abstrata pelo STF, em matéria penal, doutrinariamente é possível dizer que:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Nesse caso, por força do art. 5, LX, da CRF (princípio da retroatividade benéfica e irretroatividade in malan partem ), os efeitos do controle abstrato devem ser adstritos à técnica de declaração de inconstitucionalidade sem pronúncia de nulidade, ou seja, efeito ex tunc , devendo o Delegado instaurar o inquérito.", "B": "O STF, no controle de constitucionalidade pela via abstrata, exerce função típica, jurisdicional, e, mesmo em tema de normas processuais mistas, sua decisão é erga omnes , com efeito vinculante inter partes . O Delegado deverá instaurar o inquérito.", "C": "Quando a lei processual mista for declarada inconstitucional ou tiver interpretação fixada cujo efeito seja prejudicial ao réu, por força do princípio da irretroatividade da lei penal prejudicial (art. 5°, LX, CRF/88), seus efeitos deverão ser prospectivos, ou seja, ocorrerá declaração de inconstitucionalidade sem pronúncia de nulidade. O Delegado não poderia instaurar o inquérito.", "D": "Nesse caso, indiscutivelmente, o Delegado de Polícia deverá instaurar o inquérito independentemente de representação da vítima, pois a decisão do STF é vinculante e , não encontrando qualquer outro limite, vez que a Corte atua como legislador positivo.", "E": "Por se tratar de lei material, o caso reclama a técnica de controle de constitucionalidade com pronúncia de nulidade, atribuindo-se efeito ex nunc . Assim, não poderia o Delegado instaurar inquérito."}, "classificacao": {"id": "Q0114", "decisao": "publicar", "tema_central_id": "5181", "extras_ids": "5507;4704", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0115", "texto": "Paulo, executivo do mercado financeiro, após um dia estressante de trabalho, foi demitido. O mundo desabara sobre sua cabeça. Pegou seu carro e o que mais queria era chegar em casa. Mas o horário era de rush e o trânsito estava caótico, ainda chovia. No interior de seu carro sentiu o trauma da demissão e só pensava nas dívidas que já estavam para vencer, quando fora acometido de uma sensação terrível: uma mistura de fracasso, com frustração, impotência, medo e etc. Neste instante, sem quê nem porque, apenas querendo chegar em casa, jogou seu carro para o acostamento, onde atropelou um ciclista que por ali trafegava, subiu no passeio onde atropelou um casal que ali se encontrava, andou por mais de 200 metros até bater num poste, desceu do carro meio tonto e não hesitou, agrediu um motoqueiro e subtraiu a motocicleta, evadindo-se em desabalada carreira, rumo à sua casa. Naquele dia, Paulo, um pacato cidadão, pagador de impostos, bom pai de família, representante da classe média-alta daquela metrópole, transformou-se num criminoso perigoso, uma fera que ocupara as notícias dos principais telejornais. Diante do caso narrado, identifique dentre as Teorias abaixo, a que melhor analisa (estuda/explica) o caso.", "comando": "Diante do caso narrado, identifique dentre as Teorias abaixo, a que melhor analisa (estuda/explica) o caso.", "alternativas": {"A": "Escola de Chicago.", "B": "Teoria da associação diferencial.", "C": "Teoria da anomia.", "D": "Teoria do labeling approach .", "E": "Teoria crítica."}, "classificacao": {"id": "Q0115", "decisao": "publicar", "tema_central_id": "4387", "extras_ids": "", "confianca": "0.964286", "motivo": "Teoria da anomia no caso de frustração de metas; aplicar critério sociológico aprendido na calibração."}}, {"id": "Q0116", "texto": "Em relação à Lei Federal no 11.343/06, que estabelece o Sistema Nacional de Políticas Públicas sobre Drogas, é correto afirmar que", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "o comando legal que vedava a conversão da pena privativa de liberdade em restritiva de direitos no crime de tráfico teve sua execução suspensa por resolução do Senado Federal.", "B": "a conduta de guardar, para consumo próprio, drogas em desacordo com determinação legal e regulamentar, configura mera infração administrativa.", "C": "o informante que colabora com grupo que, sem autorização ou em desacordo com a legislação regulamentar, se dedica à venda de drogas, responde pelo mesmo tipo pena em que incorrerá o grupo vendedor, visto que sistema penal pátrio adota a teoria monista.", "D": "por se tratar de norma penal em branco, a legislação delegou a órgão do Poder Executivo Federal a definição de critério quantitativo rígido para fins de distinção da conduta do usuário e do traficante.", "E": "a lei em questão prevê pena privativa de liberdade para aquele que conduz veículo automotor, embarcação ou aeronave após o consumo de drogas, expondo a dano potencial a incolumidade de outrem."}, "classificacao": {"id": "Q0116", "decisao": "publicar", "tema_central_id": "4708", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0117", "texto": "O estudo das teorias relaciona-se intimamente com as finalidades da pena. Nesse sentido, a teoria que sustenta que a única função efetivamente desempenhada pela pena seria a neutralização do condenado, especialmente quando a prisão acarreta seu afastamento da sociedade, é a teoria", "comando": "Complete a frase com o nome da teoria correspondente.", "alternativas": {"A": "das janelas quebradas.", "B": "relativa.", "C": "unificadora.", "D": "absoluta.", "E": "agnóstica."}, "classificacao": {"id": "Q0117", "decisao": "publicar", "tema_central_id": "4384", "extras_ids": "5200", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0118", "texto": "Acerca de aspectos diversos do processo penal brasileiro, o próximo item apresenta uma situação hipotética, seguida de uma assertiva a ser julgada. Alberto e Adriano foram presos em flagrante delito. O juiz que analisou a prisão em flagrante concedeu a Alberto a liberdade provisória mediante o recolhimento de fiança arbitrada em um salário mínimo. Quanto a Adriano, foi-lhe decretada a prisão preventiva. Antes que o autuado Alberto recolhesse o valor da fiança e que a DP impetrasse habeas corpus em favor de Adriano, entrou em vigor lei processual penal nova mais gravosa, que tratou tanto da fiança quanto da prisão preventiva. Nessa situação, a lei processual penal nova que tratou da fiança aplicar-se-á desde logo, sem prejuízo da validade dos atos realizados sob a vigência da lei anterior. Entretanto, à prisão preventiva aplicar-se-ão os dispositivos que forem mais favoráveis ao interessado.", "comando": "Julgue a assertiva apresentada na situação hipotética.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0118", "decisao": "publicar", "tema_central_id": "5507", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0119", "texto": "Considere que um indivíduo está sendo processado por um determinado crime. Lei posterior ao fato criminoso deixa de considerá-lo crime. Para que a nova lei beneficie o acusado,", "comando": "", "alternativas": {"A": "é necessário que ela entre em vigor antes do\\noferecimento da denúncia.", "B": "basta que ela entre em vigor a qualquer tempo,\\nmesmo após o trânsito em julgado da decisão\\ncondenatória.", "C": "é necessário que ela entre em vigor antes do\\nrecebimento da denúncia.", "D": "é necessário que ela entre em vigor antes de\\nproferida a sentença de primeiro grau.", "E": "é necessário que ela entre em vigor antes do\\ntrânsito em julgado."}, "classificacao": {"id": "Q0119", "decisao": "publicar", "tema_central_id": "5194", "extras_ids": "5181", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0120", "texto": "Acerca das provas, das sentenças e dos princípios do direito processual penal, julgue o item a seguir. No processo penal, o momento adequado para a especificação de provas pelo réu é a apresentação da resposta à acusação. Entretanto, isso não impede que, por ocasião de seu interrogatório, o réu indique outros meios de prova que deseje produzir.", "comando": "Julgue o item a seguir.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0120", "decisao": "publicar", "tema_central_id": "5591", "extras_ids": "5533;5547", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0121", "texto": "Mário, maior e capaz, foi vítima do crime de dano simples e teve seu carro destruído por dois vizinhos em razão de uma discussão futebolística. Após o encerramento do inquérito policial, Mário ajuizou ação penal privada, mas resolveu poupar um dos autores do fato por serem amigos de longa data. Sendo assim, a ação foi direcionada apenas ao outro autor do fato, embora o inquérito tenha demonstrado que o crime foi praticado pelos dois indivíduos em comunhão de desígnios. Ambos os autores do fato são reincidentes. Diante de tal situação hipotética, é correto afirmar que", "comando": "", "alternativas": {"A": "a atitude do querelante está amparada no princípio da conveniência, que permite ao titular da ação penal privada escolher contra quais autores deseja litigar.", "B": "o Ministério Público deverá obrigatoriamente aditar a queixa-crime para incluir o segundo autor, em observância ao princípio da indisponibilidade da ação penal.", "C": "o ajuizamento da ação penal privada contra apenas um dos autores do fato viola o princípio da indivisibilidade, o que pode acarretar a renúncia tácita ao direito de queixa e a extinção da punibilidade de todos os autores.", "D": "na ação penal privada, o princípio da obrigatoriedade impõe que, havendo prova de autoria e materialidade, o querelante é obrigado a oferecer queixa contra todos os envolvidos, sob pena de preclusão.", "E": "caso o querelante desista da ação apenas em relação ao autor processado no curso da instrução, tal ato não produzirá qualquer efeito jurídico em relação ao autor que foi inicialmente omitido da queixa-crime."}, "classificacao": {"id": "Q0121", "decisao": "publicar", "tema_central_id": "5469", "extras_ids": "5472;5196", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0122", "texto": "A remição", "comando": "Explique o conceito de remição no Direito Penal.", "alternativas": {"A": "pelo trabalho é contada à razão de um dia de pena a cada doze horas trabalhadas e a remição pelo estudo à razão de um\\ndia de pena a cada três dias estudados.", "B": "pelo trabalho não pode ser acumulada com a remição pelo estudo.", "C": "pelo estudo é acrescida de um terço se o sentenciado concluir o ensino fundamental, médio ou superior durante o\\ncumprimento de pena.", "D": "pelo estudo é vedada no regime aberto, pois é uma obrigação do sentenciado.", "E": "poderá ser perdida em sua totalidade em caso de condenação por falta disciplinar de natureza grave que seja equiparável\\na crime hediondo."}, "classificacao": {"id": "Q0122", "decisao": "publicar", "tema_central_id": "4703", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0123", "texto": "Dadas as assertivas abaixo, assinale a alternativa CORRETA . I – A partir da teoria do etiquetamento (labeling approach ), pode-se afirmar que parcela significativa do conteúdo da norma penal incriminadora seja determinada pelos órgãos encarregados de sua aplicação (polícias, Ministério Público e Poder Judiciário) com base em suas particulares concepções jurídicas acerca da fronteira entre o que seja a conduta delitiva e a não delitiva. II – Cuidando-se de situação de crime permanente, a prisão em flagrante decorrente de atividade estatal fundada em discriminação direta não invalida a prisão e, tampouco, a prova colhida. III – Estatísticas criminais brasileiras, como aquelas decorrentes do Anuário do Fórum Brasileiro de Segurança Pública, indicam, no que tange à seletividade racial, um padrão de distribuição da letalidade policial que aponta para a expressiva sobrerrepresentação de negros dentre as vítimas. IV – Em decorrência de o Estado se encontrar submetido ao princípio da legalidade e sujeito a deveres constitucionais, o racismo, no sistema de justiça criminal brasileiro, ocorre somente por meio de atos individuais perpetrados por seus agentes.", "comando": "Dadas as assertivas abaixo, assinale a alternativa CORRETA.", "alternativas": {"A": "Está correta apenas a assertiva I.", "B": "Está correta apenas a assertiva II.", "C": "Está correta apenas a assertiva III.", "D": "Estão corretas apenas as assertivas I e IV.", "E": "Estão corretas apenas as assertivas II e III."}, "classificacao": {"id": "Q0123", "decisao": "publicar", "tema_central_id": "4378", "extras_ids": "4388;4390", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0124", "texto": "À luz das teorias das penas, julgue os seguintes itens. I Kant, que era adepto da teoria absoluta da pena, asseverava que, ainda que a sociedade civil acordasse em se dissolver, o último assassino que estivesse no cárcere deveria ser executado, a fim de que cada um sofresse o que efetivamente merecia por seus feitos. II Para Hegel, a justiça da pena concreta decorre de um processo dialético, pelo qual se levam em conta as características da lesão concreta assim como as circunstâncias da sociedade civil. III Segundo Roxin, a idéia de retribuição compensadora somente é plausível mediante um ato de fé, pois não há como se compreender, de forma racional, como apagar um mal cometido pelo sujeito ativo do crime com um outro mal, isto é, o sofrimento da pena. IV Para Binding, a finalidade da pena é mostrar ao delinqüente sua impotência diante da lei, submetendo-lhe, assim, à força vitoriosa do direito. V De acordo com as teorias relativas da pena, esta se justifica para a prevenção geral e especial do delito, partindo-se de uma concepção utilitarista da pena.", "comando": "A quantidade de itens certos é igual a", "alternativas": {"A": "1.", "B": "2.", "C": "3.", "D": "4.", "E": "5."}, "classificacao": {"id": "Q0124", "decisao": "publicar", "tema_central_id": "4384", "extras_ids": "5200", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0125", "texto": "A Lei Antitóxicos (Lei no 11.343/06) estabelece diminuição de pena no caso de agente primário, de bons antecedentes e que não se dedique às atividades criminosas ou integre organização criminosa. Em um processo de execução, cuja condenação de tráfico o sentenciado preenche os requisitos acima enumerados e que fora preso anteriormente à edição da lei, o defensor público deverá requerer a aplicação de novatio legis in mellius", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "para o Tribunal ou o juízo da Vara das Execuções Criminais, indistintamente, por força da imediatidade desta decisão.", "B": "perante o juízo da Vara das Execuções Criminais independentemente do trânsito em julgado da decisão do processo de conhecimento.", "C": "perante o juízo da Vara de Execuções Criminais no caso de trânsito em julgado da decisão do processo de conhecimento.", "D": "perante o Tribunal, único competente para a decisão de diminuição de pena no processo de execução em andamento.", "E": "perante o juízo da condenação para não haver risco de supressão de instância."}, "classificacao": {"id": "Q0125", "decisao": "publicar", "tema_central_id": "5181", "extras_ids": "4703;4708", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0126", "texto": "Sobre o Direito Penal brasileiro, assinale a alternativa correta.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "A superveniência de causa relativamente independente não exclui a imputação ainda que, por si só, tenha produzido o resultado.", "B": "Não se comunicam as circunstâncias e as condições de caráter pessoal, mesmo quando elementares do crime.", "C": "Havendo disposição expressa, as regras gerais do Código Penal Brasileiro aplicam-se aos fatos incriminados por lei especial.", "D": "É inimputável o agente que, por embriaguez, proveniente de caso fortuito ou força maior, era, ao tempo da ação ou da omissão, inteira ou parcialmente incapaz de entender o caráter ilícito do fato ou de determinar-se de acordo com esse entendimento.", "E": "Ficam sujeitos à lei brasileira, embora cometidos no estrangeiro, os crimes contra a fé pública da União, do Distrito Federal, de Estado, de Território, de Município, de empresa pública, sociedade de economia mista, autarquia ou fundação instituída pelo Poder Público."}, "classificacao": {"id": "Q0126", "decisao": "revisar", "tema_central_id": "5062", "extras_ids": "5226;5076;5213;5182", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0127", "texto": "Luiz foi denunciado pelo Ministério Público do Estado do Rio de Janeiro pelos crimes dos Arts. 33, caput , e 35, ambos da Lei nº 11.343/2006, na forma do Art. 69 do Código Penal (concurso material). Toda a instrução processual ocorreu de forma regular, com a oitiva das testemunhas e o interrogatório do acusado. Em alegações finais orais, o Ministério Público requereu a absolvição de Luiz sob o fundamento de que não havia provas suficientes para a condenação. A Defensoria Pública acompanhou as alegações do Parquet . O juiz, contudo, prolatou sentença condenatória e fixou a pena do acusado em oito anos de reclusão, em regime inicial fechado. De acordo com o Código de Processo Penal, a Lei nº 11.343/2006 e a jurisprudência do Superior Tribunal de Justiça, é correto afirmar que:", "comando": "", "alternativas": {"A": "no caso proposto, o interrogatório de Luiz foi o primeiro ato da instrução conforme a previsão expressa na Lei nº 11.343/2006, sob pena de nulidade;", "B": "agiu corretamente o magistrado. A independência funcional da magistratura garante ao juiz que decida com base no livre convencimento motivado, de modo que o juiz não está vinculado aos requerimentos do Ministério Público, ainda que o Parquet se manifeste pela absolvição;", "C": "o juiz não poderia ter condenado Luiz ao regime inicial fechado, pois, mesmo considerando a quantidade da pena aplicada, o crime de tráfico de drogas não é hediondo e não autoriza a fixação do regime mais gravoso, ainda que haja concurso com outros crimes;", "D": "não haveria óbice no caso concreto de reconhecimento do crime de tráfico de drogas na modalidade privilegiada (Art. 33, §4º, da Lei nº 11.343/2006), pois o simples fato de o magistrado ter condenado Luiz pelo crime do Art. 35 da mesma lei, por si só, não afasta a possibilidade de se aplicar o privilégio;", "E": "o juiz violou o sistema acusatório consagrado na Constituição Federal e no Art. 3º-A do Código de Processo Penal, pois o Ministério Público, na qualidade de titular da ação penal pública incondicionada, é quem tem o interesse na condenação. Portanto, se o próprio titular da ação penal manifesta o desinteresse no decreto condenatório, não cabe ao juiz condenar."}, "classificacao": {"id": "Q0127", "decisao": "publicar", "tema_central_id": "5581", "extras_ids": "5575;4708", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0128", "texto": "A ação de prevenção penal é aquela ajuizada com a finalidade de se aplicar medida de segurança a acusado que, em virtude de doença mental ou de desenvolvimento mental incompleto ou retardado, era, ao tempo da ação ou omissão, absolutamente incapaz de entender o caráter ilícito do fato ou de determinar-se de acordo com esse entendimento.", "comando": "Explique o conceito de ação de prevenção penal.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0128", "decisao": "publicar", "tema_central_id": "5468", "extras_ids": "5184", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0129", "texto": "Em virtude de desavença familiar no interior de uma residência, um marido agrediu, mediante socos e chutes, sua esposa, na presença de familiares (pais, irmãos, filhos e primos) que lá se encontravam para a comemoração de um aniversário. Ao elaborar a denúncia, o promotor de justiça arrolou, além da vítima, as demais pessoas presentes como testemunhas. O magistrado, ao deliberar sobre a designação de audiência de instrução e julgamento, deverá:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "indeferir a oitiva, pois a oitiva de depoimento testemunhal de\\nparente do envolvido não é admitida em nosso ordenamento\\njurídico;", "B": "deferir a oitiva, pois o depoimento testemunhal de parente\\ndo envolvido é admitido em nosso ordenamento e\\nnotadamente relevante em casos nos quais a conduta foi\\npraticada no âmbito doméstico dos familiares;", "C": "indeferir a oitiva, pois a oitiva de depoimento testemunhal de\\nparente do envolvido é expressamente vedada em nosso\\nordenamento;", "D": "deferir a oitiva, pois a legislação brasileira é expressa em\\nadmitir toda pessoa como testemunha, não fazendo vedação\\nà qualidade ou proximidade com os envolvidos no fato;", "E": "indeferir a oitiva, pois a comprovação da conduta delituosa,\\nnesse caso específico, pode ser feita por outros elementos,\\ndependendo o depoimento testemunhal de expressa\\nanuência da testemunha."}, "classificacao": {"id": "Q0129", "decisao": "publicar", "tema_central_id": "5550", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0130", "texto": "Frederico, ao identificar que o pedestre Gumercindo traz, no bolso traseiro de sua bermuda, um aparelho de telefonia celular, passa a segui-lo e, ao chegar bem perto dele, levanta sua camisa e lhe exibe, junto à cintura, o que parece ser um revólver, dizendo-lhe para entregar o celular. Intimidado, Gumercindo entrega o aparelho a Frederico, que deixa o local correndo. Alguns minutos depois, Gumercindo avista um policial em patrulhamento e lhe comunica o acontecido, passando-lhe a descrição do ladrão, que acaba preso pelo policial logo depois, nas proximidades, ainda na posse do celular da vítima, arrecadando-se com ele também a arma utilizada no crime, em verdade um simulacro.", "comando": "Diante do caso narrado, Frederico cometeu o crime de roubo:", "alternativas": {"A": "não cabendo, em caso de condenação, a substituição da pena\\nprivativa de liberdade por penas restritivas de direitos;", "B": "na modalidade tentada, não cabendo, em caso de\\ncondenação, a substituição da pena privativa de liberdade\\npor penas restritivas de direitos;", "C": "com a incidência de causa de aumento de pena, não cabendo,\\nem caso de condenação, a substituição da pena privativa de\\nliberdade por penas restritivas de direitos;", "D": "sendo possível, em caso de condenação, a substituição da\\npena privativa de liberdade por penas restritivas de direitos,\\ndesde que a pena aplicada não exceda quatro anos;", "E": "com a incidência de causa de aumento de pena, sendo\\npossível, em caso de condenação, a substituição da pena\\nprivativa de liberdade por penas restritivas de direitos, desde\\nque a pena aplicada não exceda quatro anos."}, "classificacao": {"id": "Q0130", "decisao": "publicar", "tema_central_id": "5160", "extras_ids": "5205", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0131", "texto": "A respeito do direito penal, julgue o item a seguir. Idealizada por Welzel e Roxin e considerada objetivo-subjetiva, a teoria do domínio do fato diferencia autoria de participação em função da prática dos atos executórios do delito.", "comando": "", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0131", "decisao": "publicar", "tema_central_id": "5072", "extras_ids": "5074", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0132", "texto": "Os tribunais deverão implementar, como medida para proteção de vítimas e testemunhas que se encontrem ameaçadas ou em grave risco, a possibilidade de proteção de seus dados qualificativos e endereços nos processos criminais, físicos e eletrônicos, nos termos da Resolução nº 427/2021 do Conselho Nacional de Justiça. De acordo com a narrativa e considerando as disposições dessa Resolução, avalie as afirmativas a seguir. I. Tratando-se de vítimas ou de testemunhas que estejam ameaçadas ou em grave risco, os dados qualificativos e os endereços poderão ser registrados em apartado, mediante decisão do Juiz competente, remanescendo sigilosos e não constando dos autos físicos ou eletrônicos. II. O Juiz competente poderá determinar a preservação dos dados qualificativos e dos endereços de vítimas e testemunhas a pedido destas, por meio de representação da autoridade policial, de requerimento do Ministério Público, da Defensoria Pública ou do advogado, vedada a atuação oficiosa. III. O acesso aos dados das vítimas ou de testemunhas fica garantido à autoridade policial, ao Ministério Público e ao defensor do réu, mediante requerimento ao Juiz competente e controle da vista.", "comando": "Está correto o que se afirma em", "alternativas": {"A": "I, apenas.", "B": "II, apenas.", "C": "III, apenas.", "D": "I e II, apenas.", "E": "I e III, apenas."}, "classificacao": {"id": "Q0132", "decisao": "publicar", "tema_central_id": "5550", "extras_ids": "5549;5583", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0133", "texto": "A respeito dos procedimentos, julgue o seguinte item. No procedimento do júri, o desaforamento é cabível a qualquer momento, a partir do recebimento da denúncia.", "comando": "Julgue o item apresentado sobre o procedimento do júri.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0133", "decisao": "publicar", "tema_central_id": "5528", "extras_ids": "5486", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0134", "texto": "Solicitar ou receber, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida, ou aceitar promessa de tal vantagem é conduta tipificada no Código Penal Brasileiro em vigor. Sobre referida conduta,", "comando": "assinale a alternativa correta", "alternativas": {"A": "É punida com pena de reclusão, de 2 (dois) a 12\\n(doze) anos, e multa.", "B": "Se o funcionário pratica, deixa de praticar ou retarda\\nato de ofício, com infração de dever funcional,\\ncedendo a pedido ou influência de outrem, a pena é\\nde detenção, de seis meses a dois anos, ou multa.", "C": "A pena é aumentada de dois terços, se, em\\nconsequência da vantagem ou promessa, o\\nfuncionário retarda ou deixa de praticar qualquer ato\\nde ofício ou o pratica infringindo dever funcional.", "D": "É conduta prevista como Concussão."}, "classificacao": {"id": "Q0134", "decisao": "publicar", "tema_central_id": "5092", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0135", "texto": "Com relação ao crime de receptação, é CORRETO afirmar que:", "comando": "", "alternativas": {"A": "sujeito ativo pode ser qualquer pessoa, inclusive o co-autor do crime antecedente.", "B": "não há previsão de punir por negligência, imprudência ou imperíc ia.", "C": "o exercício da atividade comercial para qualificar o crime exige formalidade.", "D": "é punível, ainda que desconhecido ou isento de pena, o autor do crime de que proveio a coisa."}, "classificacao": {"id": "Q0135", "decisao": "publicar", "tema_central_id": "5169", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0136", "texto": "Após conturbada e conflitiva separação, um casal com filhos de 15 e 10 anos de idade, realizou divórcio judicial, oportunidade em que, dentre outros temas, foi fixada a questão da pensão a ser paga para os filhos que ficariam sob os cuidados maternos. Sem que a relação marital fosse retomada em qualquer momento, quando o filho mais velho completou 21 anos, o genitor informou à ex-esposa que ingressaria com o pedido de exclusão do dever alimentar, o que gerou novo atrito. A genitora afirmou que o préstimo de alimentos deveria prosseguir, pois o filho estava tentando o ingresso no ensino superior. O genitor, então, respondeu de forma agressiva, que o filho não teria futuro, pois seguia o modelo materno de incapacidade laboral e cognitiva, sendo fadado, portanto, a ser um “zé ninguém”, tal qual a ex-esposa era. Acrescentou que ela ficava infantilizando os filhos, não permitindo que ganhassem independência e ela que se virasse para bancar aquela situação vergonhosa.", "comando": "Sobre a possibilidade de configuração de ilícito penal, assinale a afirmativa correta.", "alternativas": {"A": "Não há configuração de qualquer crime da Lei Maria da\\nPenha, em razão do tempo passado entre o divórcio e o fato.", "B": "Embora o relacionamento entre os dois tenha se encerrado,\\nas agressões verbais decorreram da relação havida.", "C": "Não há qualquer motivação de gênero no caso concreto, a\\nensejar a configuração de crime da Lei Maria da Penha.", "D": "Há configuração de crime da Lei Maria da Penha, pois a\\ndinâmica envolve agressões de homem contra mulher.", "E": "Embora referente à relação havida entre o casal, a\\ninexistência de lesão física impede a incidência da Lei Maria\\nda Penha."}, "classificacao": {"id": "Q0136", "decisao": "publicar", "tema_central_id": "4704", "extras_ids": "5124", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0137", "texto": "No que dispõe a legislação sobre a investigação criminal, conduzida pelo delegado de polícia é CORRETO afirmar que:", "comando": "", "alternativas": {"A": "O indiciamento, privativo do delegado de polícia, dar-se-á por ato fundamentado, mediante análise técnico-jurídica do fato, devendo indicar a autoria e a materialidade apenas.", "B": "O cargo de delegado é privativo de Bacharel em Direito, mas não deve lhe ser dispensado o mesmo tratamento protocolar que recebem os magistrados.", "C": "Cabe ao delegado de polícia e aos investigadores de polícia a condução da investigação criminal, por meio do inquérito policial.", "D": "A remoção do delegado de polícia dar-se-á somente por ato fundamentado.", "E": "Na qualidade de autoridade policial, o delegado não poderá permitir que o inquérito policial seja avocado por superior hierárquico, nos termos da legislação e da Constituição Federal."}, "classificacao": {"id": "Q0137", "decisao": "publicar", "tema_central_id": "5500", "extras_ids": "5499", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0138", "texto": "Sobre a substituição das penas privativas de liberdade por penas restritivas de direitos e suspensão condicional da pena.", "comando": "Marque a alternativa CORRETA.", "alternativas": {"A": "Àquele, reincidente em crime doloso, que já foi condenado à pena privativa de liberdade, é terminantemente vedada a substituição da sanção corporal por penas restritivas de direito.", "B": "Sobrevindo condenação a pena privativa de liberdade, por outro crime, o juiz da execução poderá deixar de converter a sanção restritiva de direitos anteriormente aplicada, desde que o seu cumprimento seja compatível com o da nova sanção penal.", "C": "Se a medida for socialmente recomendável e o condenado não for reincidente específico, caberá a suspensão condicional da pena, nos moldes das regras do art. 77 e seguintes do CP.", "D": "A prestação de serviços, como sanção restritiva de direitos, pode ser aplicada independentemente do quantum da pena privativa de liberdade aplicada."}, "classificacao": {"id": "Q0138", "decisao": "publicar", "tema_central_id": "5199", "extras_ids": "5205;5207", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0139", "texto": "A frase “há sujeitos que têm uma menor possibilidade de autodeterminação, condicionados dessa maneira por causas sociais”, está ligada à:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Ideia do conceito de causa supralegal exculpante;", "B": "Ideia do conceito de culpabilidade no funcionalismo teleológico;", "C": "Ideia do conceito normativo puro da culpabilidade;\\n", "D": "Ideia do conceito psicológico-normativo de culpabilidade;", "E": "Ideia do conceito de coculpabilidade."}, "classificacao": {"id": "Q0139", "decisao": "publicar", "tema_central_id": "5212", "extras_ids": "5217", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0140", "texto": "Assinale a opção correta acerca dos crimes de furto e roubo.", "comando": "", "alternativas": {"A": "Segundo pacífico entendimento do STJ, excetuadas as hipóteses de furto qualificado, o juiz pode substituir a pena de reclusão pela de detenção, diminuí-la de um a dois terços, ou aplicar somente a pena de multa ao réu primário que tenha furtado bem de pequeno valor.", "B": "A jurisprudência do STJ tem pontificado que o emprego de gazuas, mixas, ou qualquer outro instrumento sem a forma de chave, ainda que apto a abrir fechadura, não qualifica o delito de furto, na medida em que não se aplica interpretação extensiva para a definição de tipos penais.", "C": "Consoante a jurisprudência do STJ, é devida a exasperação da pena acima do patamar mínimo com esteio unicamente na alusão ao número de majorantes do delito de roubo.", "D": "Ao contrário do que ocorre no delito de latrocínio, aplicam-se ao delito de roubo qualificado as causas especiais de aumento de pena previstas no CP, tal como na hipótese de violência ou ameaça exercida com emprego de arma.", "E": "No delito de furto, é necessária a realização de perícia para a caracterização da qualificadora do rompimento de obstáculo, salvo em caso de ausência de vestígios, quando a prova testemunhal poderá suprir-lhe a falta."}, "classificacao": {"id": "Q0140", "decisao": "publicar", "tema_central_id": "5157", "extras_ids": "5159;5160", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0141", "texto": "O efeito criminógeno da grande cidade, valendo-se dos conceitos de desorganização e contágio inerentes aos modernos núcleos urbanos, é explicado pela", "comando": "Complete a frase explicando o efeito criminógeno da grande cidade.", "alternativas": {"A": "Teoria do Criminoso Nato.", "B": "Teoria da Associação Diferencial", "C": "Teoria da Anomia.", "D": "Teoria do Labelling Aproach.", "E": "Teoria Ecológica."}, "classificacao": {"id": "Q0141", "decisao": "publicar", "tema_central_id": "4387", "extras_ids": "", "confianca": "0.964286", "motivo": "Teoria ecológica da Escola de Chicago explica organização urbana; classificar no nível sociológico."}}, {"id": "Q0142", "texto": "Assinale a alternativa que corresponde a uma operação isenta do Imposto sobre a Transmissão \"Causa Mortis\" e Doação de quaisquer bens ou direitos (ITCD):", "comando": "Assinale a alternativa que corresponde a uma operação isenta do Imposto sobre a Transmissão \"Causa Mortis\" e Doação de quaisquer bens ou direitos (ITCD).", "alternativas": {"A": "Aquisição, por transmissão \"Causa Mortis\",\\nde imóvel destinado exclusivamente à\\nmorada do cônjuge supérstite, herdeiros ou\\nlegatários, desde que o \"de cujus\", o\\ncônjuge supérstite, o herdeiro e o legatário\\npossuam outro imóvel.", "B": "Aquisição, por transmissão \"Causa Mortis\",\\nde imóvel rural com área não superior a\\nvinte e cinco hectares, de cuja exploração\\ndo solo dependa o sustento da família dos\\nherdeiros ou do cônjuge supérstite e que\\ntenha cabido por partilha, desde que outro\\nnão possua.", "C": "Doação de imóvel rural, com área não\\nsuperior a vinte e cinco hectares, com\\nobjetivo de implantar o Programa de\\nReforma Agrária instituído pelo Governo.", "D": "Doação ou transmissão \"Causa Mortis\" de\\naparelhos, móveis e utensílios de uso\\ndoméstico, joias e itens de vestuário.", "E": "Doação de imóvel a associações caritativas\\nou entidades religiosas domiciliadas no\\nEstado do Pará que apliquem o produto de\\nseus trabalhos no Estado e atendam às\\ncondições dispostas em regulamento."}, "classificacao": {"id": "Q0142", "decisao": "fora", "tema_central_id": "", "extras_ids": "", "confianca": "0.0", "motivo": "Lacuna na taxonomia: Isenção de ITCD sem tema tributário não penal"}}, {"id": "Q0143", "texto": "No que diz respeito à norma processual penal, aos sistemas processuais penais e à investigação criminal, julgue o item subsequente. No ordenamento jurídico brasileiro, em regra, a lei processual penal será aplicada com fulcro no princípio do tempus delicti .", "comando": "Julgue o item subsequente.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0143", "decisao": "publicar", "tema_central_id": "5507", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0144", "texto": "Segundo o Código de Processo Penal, quando a sentença do juiz-presidente no Tribunal do Júri for contrária à Lei expressa ou à decisão dos jurados, caberá:", "comando": "", "alternativas": {"A": "Apelação.", "B": "Habeas corpus.", "C": "Revisão criminal.", "D": "Recurso em sentido estrito."}, "classificacao": {"id": "Q0144", "decisao": "publicar", "tema_central_id": "5562", "extras_ids": "5529", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0145", "texto": "Considerando as alterações provocadas pela Lei nº 12.683, de 09 de julho de 2012, no tocante aos crimes de lavagem de capitais e, ainda, aos crimes contra a ordem tributária, analise as assertivas e identifique com V as verdadeiras e com F as falsas. ( ) A ocultação ou dissimulação de bens de posse ilícita, tais como drogas ou armas, ainda que produtos de determinada infração, não constitui crime de lavagem de capitais, porque os autores podem ser punidos pelos crimes de forma distinta e autônoma. ( ) O crime de lavagem de capitais é tipificado quando há demonstração de que os bens, direitos ou valores objeto de ocultação ou dissimulação são produtos, diretos ou indiretos, de infração penal. ( ) Se a infração penal antecedente for um crime contra a ordem tributária, o objeto material da lavagem de capitais será o total do valor que gere a obrigação tributária. ( ) Não se pode confundir o crime de favorecimento real com o crime de lavagem de capitais, uma vez que o primeiro (favorecimento real) não pode ser praticado pelo autor ou partícipe da infração antecedente, vez que o próprio tipo penal se caracteriza pelo auxílio destinado a tornar seguro o proveito do crime, fora dos casos de coautoria ou de receptação. ( ) Toda e qualquer infração penal poderá caracterizar-se como antecedente da lavagem de capitais, a exemplo dos chamados crimes de responsabilidade (infrações político-administrativas) e, ainda, bens, direitos ou valores oriundos de improbidade administrativa. A alternativa que contém a sequência correta, de cima para baixo, é", "comando": "Identifique a sequência correta de V e F para as assertivas apresentadas, de cima para baixo.", "alternativas": {"A": "V F V F V", "B": "V F V V F", "C": "V V F V F", "D": "F V F V F", "E": "F F V F V"}, "classificacao": {"id": "Q0145", "decisao": "publicar", "tema_central_id": "4702", "extras_ids": "4695;5084", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0146", "texto": "A Constituição Federal de 1988, no artigo 5°, inciso LVI, prevê expressamente a inadmissibilidade da utilização no processo de provas obtidas por meios ilícitos. De acordo com as teorias adotadas pelo legislador brasileiro e recente entendimento jurisprudencial, descarta-se a ilicitude da prova na seguinte situação.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Juca está sendo acusado de crime, porém\\nalega que é inocente e tudo não passa de um\\nplano vingativo elaborado por seu desafeto\\npolítico. No intuito de provar sua inocência, Juca contrata investigador particular, o qual\\ninstala sistema de captação de imagem e\\nsom clandestinamente no escritório do\\nseu desafeto. Por meio das imagens e som\\ngravados, Juca consegue extrair conversa que\\nprova indubitavelmente não ser ele autor do\\ncrime denunciado e faz a juntada nos autos do\\nprocesso judicial.", "B": "Um grupo de policiais civis estava executando\\noperação contra o tráfico na cidade de Campo\\nGrande-MS, quando suspeitou que Arnolgildo\\nestaria filmando toda ação policial. Por esse\\nmotivo, Arnolgildo foi então abordado pelos\\npoliciais civis, os quais, sem a existência de\\nmandado judicial, efetuaram uma busca na sua\\nresidência e localizaram 9 gramas de crack e\\n0,4 gramas de cocaína. Arnolgildo foi preso em\\nflagrante pela acusação de tráfico de drogas.", "C": "Autorizada interceptação telefônica em face\\nde Diná Sabino de acordo com os ditames legais, ao término, é extraída prova da prática\\nde delito por esta. No entanto, as conversas de\\ncunho probatório são aquelas que haviam sido\\nrealizadas entre Diná Sabino e seu advogado,\\nquando a primeira confessa a prática de crimes\\ne requer orientação de como proceder para\\nser inocentada.", "D": "Ao cumprir mandado de busca e apreensão\\nem investigação de crime de homicídio,\\nos policiais acessam os computadores da\\nresidência do investigado e levantam diversos\\ndados que demonstram a coautoria do vizinho. Dessa forma, os policiais estendem informalmente o mandado judicial e cumprem\\na diligência, também, na residência do vizinho,\\nem observância ao princípio da celeridade\\nprocessual.", "E": "Chegou ao conhecimento da autoridade\\npolicial que determinado caminhão estava\\ntransportando alta quantidade de drogas.\\nEm cumprimento de mandado judicial, foram\\nrealizadas busca e apreensão do veículo,\\nconfirmando-se o fato. No decorrer do processo\\njudicial, constatou-se que o crime havia sido\\ndescoberto no 16° dia do início de interceptação\\ntelefônica, deferida judicialmente pelo prazo\\ninicial de 30 dias. Verificou-se, ainda, que houve\\npedido de prorrogação após um dia do término\\ndo prazo inicial."}, "classificacao": {"id": "Q0146", "decisao": "publicar", "tema_central_id": "5594", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0147", "texto": "Sobre a investigação preliminar e os meios de obtenção de provas e/ou elementos de convicção cabíveis em sede processual penal, assinale a alternativa correta, de acordo com a lei.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "A denúncia anônima, por si só, não pode autorizar a\\nabertura de inquérito policial ou a tomada de medidas cautelares invasivas.", "B": "A captação ambiental feita por um dos interlocutores,\\nsem o prévio conhecimento da autoridade policial ou\\ndo Ministério Público, poderá ser utilizada em matéria de defesa e de acusação, independentemente da\\nintegridade da gravação.", "C": "Tratando-se da investigação de infrações de menor\\npotencial ofensivo, o cabimento da proposta de transação penal não impede que a acusação opte pelo\\nacordo de não persecução penal.", "D": "O inquérito policial é instrumento indispensável para\\na dedução da ação penal, sendo a investigação prerrogativa exclusiva da polícia judiciária.", "E": "As declarações do delator, ainda que desprovidas\\nde comprovação ou de outros elementos confirmatórios, poderão justificar a tomada de medidas reais ou\\npessoais, mas não a dedução de ação penal."}, "classificacao": {"id": "Q0147", "decisao": "publicar", "tema_central_id": "5498", "extras_ids": "5556;5502;5557", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0148", "texto": "Ao proferir uma sentença condenatória em uma ação penal, o juiz vislumbra que o réu confessou em juízo a autoria do delito e que constam em sua folha de antecedentes criminais duas anotações, assinalando condenações anteriores definitivas à prática do crime objeto do processo, cujas penas foram cumpridas um e quatro anos antes, respectivamente, do cometimento do crime em julgamento. Diante da situação narrada, deverá o magistrado.", "comando": "Indique a conduta correta que o magistrado deve adotar diante da situação apresentada.", "alternativas": {"A": "atenuar a pena-base, na segunda fase da dosimetria da pena, fazendo prevalecer a atenuante da confissão espontânea sobre a agravante da reincidência;", "B": "manter a pena-base, na segunda fase da dosimetria da pena, compensando integralmente a agravante da reincidência com a atenuante da confissão espontânea;", "C": "agravar a pena-base, na segunda fase da dosimetria da pena. fazendo prevalecer a agravante da reincidência sobre a atenuante da confissão espontânea;", "D": "agravar a pena-base, na segunda fase da dosimetria da pena. fazendo prevalecer a agravante da reincidência e compensando a atenuante da confissão espontânea com uma das anotações criminais geradora de reincidência;", "E": "fixar a pena-base acima do mínimo legal cominado ao crime, reconhecendo os maus antecedentes, e, na fase seguinte da dosimetria, manter a pena, compensando integralmente a agravante da reincidência com a atenuante da confissão espontânea."}, "classificacao": {"id": "Q0148", "decisao": "publicar", "tema_central_id": "5203", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0149", "texto": "Relativamente ao inquérito policial e às diligências neste levadas a efeito, é correto afirmar que:", "comando": "", "alternativas": {"A": "na busca domiciliar fundada em ordem judicial, quando\\nencontrada a arma objeto do crime de roubo, a não\\nespecificação no mandado judicial para a busca pessoal\\nimpedirá a realização desta;", "B": "o delegado de polícia, apurando crime de extorsão mediante\\nsequestro, necessita de prévia autorização judicial para\\nrequisitar, de quaisquer órgãos do poder público, dados e\\ninformações cadastrais dos suspeitos;", "C": "após representação do delegado de polícia, nos crimes\\nrelacionados ao tráfico de pessoas, sobre a disponibilização\\ndos meios técnicos que permitam a localização da vítima, se\\nnão houver manifestação judicial no prazo de doze horas,\\npoderá aquele proceder às requisições, comunicando-se\\nimediatamente ao juiz;", "D": "nos crimes relacionados ao tráfico de pessoas, o delegado de\\npolícia poderá requisitar, independentemente de autorização\\njudicial, às empresas prestadoras de serviço de\\ntelecomunicações que disponibilizem imediatamente os\\nmeios técnicos adequados que permitam a localização dos\\nsuspeitos;", "E": "dar-se-á prioridade à realização de exame de corpo de delito,\\nna fase do inquérito policial, quando se tratar de crime que\\nenvolva criança ou adolescente, idoso, pessoa com\\ndeficiência, indígena ou gestante."}, "classificacao": {"id": "Q0149", "decisao": "publicar", "tema_central_id": "5500", "extras_ids": "5554;5545", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0150", "texto": "Considerando o entendimento sumulado dos Tribunais Superiores, analise as assertivas abaixo e assinale a alternativa: I - A majorante do tráfico transnacional de drogas (art. 40, inciso I, da Lei n. 11.343/2006) configura-se com a prova da destinação internacional das drogas, ainda que não consumada a transposição de fronteiras. II - Para a incidência da majorante prevista no art. 40, inciso V, da Lei n. 11.343/2006, é desnecessária a efetiva transposição de fronteiras entre estados da Federação, sendo suficiente a demonstração inequívoca da intenção de realizar o tráfico interestadual. III - É cabível a aplicação retroativa da Lei n. 11.343/2006, desde que o resultado da incidência das suas disposições, na íntegra, seja mais favorável ao réu do que o advindo da aplicação da Lei n. 6.368/1976, sendo vedada a combinação de leis. IV - A causa de aumento de pena prevista no art. 40, inciso III, da Lei n. 11.343/2006 tem natureza objetiva, devendo haver portanto comprovação de mercancia a menos de duzentos metros da respectiva entidade de ensino.", "comando": "Analise as assertivas e assinale a alternativa correta.", "alternativas": {"A": "Todas as alternativas estão corretas.", "B": "Apenas a alternativa I está correta.", "C": "Apenas a alternativa II está incorreta.", "D": "Apenas a alternativa III está correta.", "E": "Apenas a alternativa IV está incorreta."}, "classificacao": {"id": "Q0150", "decisao": "publicar", "tema_central_id": "4708", "extras_ids": "5181", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0151", "texto": "No que diz respeito às prisões e medidas cautelares no processo penal, assinale a alternativa CORRETA:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "O juiz poderá substituir a prisão preventiva pela domiciliar quando o suposto autor do fato delituoso for maior de 70 (setenta) anos de idade ou estiver extremamente debilitado por motivo de doença grave.", "B": "Em respeito ao princípio da proporcionalidade das medidas cautelares, a fiança, segundo as regras do Código de Processo Penal, quando estabelecida em seu valor máximo, não poderá ser cumulada com outras medidas cautelares diversas da prisão preventiva.", "C": "Se assim recomendar a situação econômica do preso, a fiança poderá ser aumentada em até 1.000 (mil) vezes.", "D": "De acordo com o novo regramento destinado à prisão cautelar, o Código de Processo Penal passou a estabelecer a prisão temporária como uma das hipóteses das denominadas prisões cautelares estritamente processuais.", "E": "É pacífico o entendimento da doutrina quanto à natureza jurídica precautelar da prisão em flagrante, o que tem sido confirmado pela jurisprudência do Superior Tribunal de Justiça."}, "classificacao": {"id": "Q0151", "decisao": "publicar", "tema_central_id": "5517", "extras_ids": "5521;5522;5523;5518", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0152", "texto": "Nos crimes de ação privada, se comparecer mais de uma pessoa com direito de queixa, terá preferência, numa ordem legal estabelecida pelo artigo 31 do Código de Processo Penal,", "comando": "Complete a frase ou explique a ordem de preferência estabelecida pelo artigo 31 do Código de Processo Penal.", "alternativas": {"A": "o parente mais próximo na ordem de vocação sucessória.", "B": "o cônjuge, que poderá prosseguir na ação penal.", "C": "a figura do ascendente, em face dos vínculos fraternos.", "D": "a figura do descendente, com o direito de apenas prosseguir.", "E": "o representante legalmente constituído para o fim."}, "classificacao": {"id": "Q0152", "decisao": "publicar", "tema_central_id": "5472", "extras_ids": "5474", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0153", "texto": "O agente que imagina já ter obtido o resultado pensado por ele, sem tê-lo alcançado, e, por isso, pratica outra conduta que efetivamente alcança o objetivo primário realiza a conduta em dolo", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "geral.", "B": "de segundo grau.", "C": "eventual.", "D": "alternativo.", "E": "cumulativo."}, "classificacao": {"id": "Q0153", "decisao": "publicar", "tema_central_id": "5222", "extras_ids": "5224", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0154", "texto": "A Lei no 9.029/95, que define práticas discriminatórias relativas à gravidez no trabalho, expressamente considera crime:", "comando": "Complete a frase ou responda o que a lei considera crime em relação à gravidez no trabalho.", "alternativas": {"A": "discriminação salarial de grávida.", "B": "exigência de teste relativo à esterilização ou a estado\\nde gravidez.", "C": "estabelecimento de jornada de trabalho superior a\\n8h para grávida a partir da 20a \\n semana de gestação.", "D": "exposição da grávida a trabalhos braçais excessivos.", "E": "vedação ao gozo da licença maternidade."}, "classificacao": {"id": "Q0154", "decisao": "revisar", "tema_central_id": "5135", "extras_ids": "", "confianca": "0.916667", "motivo": "Revisar: lei_especial_sem_no; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0155", "texto": "Sobre o Regime Disciplinar Diferenciado, segundo a legislação aplicável, assinale a alternativa correta:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Tem duração de 2 anos, prorrogáveis uma única vez, por igual\\nperíodo.", "B": "É cabível para membro de associação criminosa,\\nindependentemente de cometimento de falta grave.", "C": "Todas as entrevistas são monitoradas.", "D": "É cumprido sempre em estabelecimento penitenciário federal.", "E": "Não é cabível em caso de prisão cautelar."}, "classificacao": {"id": "Q0155", "decisao": "publicar", "tema_central_id": "4703", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0156", "texto": "De acordo com a Lei n° 9.605/98, que dispõe sobre sanções penais e administrativas derivadas de condutas e atividades lesivas ao meio ambiente,", "comando": "Complete a questão conforme o enunciado.", "alternativas": {"A": "a suspensão condicional da pena pode ser aplicada nos casos de condenação a pena privativa de liberdade não superior a 2 (dois) anos.", "B": "aplicável à pessoa jurídica a pena restritiva de direitos de suspensão parcial de atividades, vedada a suspensão total.", "C": "o baixo grau de instrução ou escolaridade do agente é causa de isenção da pena.", "D": "constitui pena de interdição temporária de direito a proibição de o condenado contratar com o Poder Público pelo prazo de 3 (três) anos, no caso de crimes culposos.", "E": "não é crime o abate de animal em razão de seu caráter nocivo, a critério do Magistrado."}, "classificacao": {"id": "Q0156", "decisao": "publicar", "tema_central_id": "4688", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0157", "texto": "A prisão temporária decretada no curso de inquérito policial instaurado para investigar crime de epidemia com resultado morte, artigo 267, § 1º, do Código Penal, tem prazo limite de", "comando": "Complete a frase com o prazo limite correto da prisão temporária.", "alternativas": {"A": "cinco dias prorrogáveis por mais cinco.", "B": "dez dias prorrogáveis por mais dez.", "C": "quinze dias prorrogáveis por mais quinze.", "D": "vinte dias prorrogáveis por mais vinte.", "E": "trinta dias prorrogáveis por mais trinta."}, "classificacao": {"id": "Q0157", "decisao": "publicar", "tema_central_id": "5520", "extras_ids": "4693", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0158", "texto": "Considere a seguinte situação hipotética: João, agente público, foi processado e, ao final, condenado à pena de reclusão, por dezenove anos, iniciada em regime fechado, pela prática do crime de tortura, com resultado morte, contra Raimundo. Nos termos da Lei no 9.455, de 7 de abril de 1997, essa condenação acarretará a perda do cargo, função ou emprego público", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "e a interdição para seu exercício pelo dobro do prazo\\nda pena aplicada.", "B": "e a interdição para seu exercício pelo triplo do prazo\\nda pena aplicada.", "C": "e a interdição para seu exercício pelo tempo da pena\\naplicada.", "D": "desde que o juiz proceda à fundamentação específica.", "E": "como efeito necessário, mas não automático."}, "classificacao": {"id": "Q0158", "decisao": "publicar", "tema_central_id": "4707", "extras_ids": "5209", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0159", "texto": "Caio, desejando matar Túlio, dispara projéteis de arma de fogo contra seu desafeto. Túlio, alvejado, cai e permanece inerte no chão enquanto Caio retira-se do local. Observando a cena, Lívio aproxima-se com intenção de despojar a vítima de seus bens e, ao retirar o relógio, nota que Túlio esboça reação quando, então, Lívio utiliza uma pedra para acertar-lhe a cabeça. Túlio vem a óbito e no exame cadavérico o legista atesta que a morte ocorreu por concussão cerebral.", "comando": "No caso, responderão Caio e Lívio, respectivamente, por:", "alternativas": {"A": "homicídio consumado e roubo próprio.", "B": "homicídio tentado e latrocínio.", "C": "homicídio tentado e roubo impróprio.", "D": "homicídio consumado e latrocínio."}, "classificacao": {"id": "Q0159", "decisao": "publicar", "tema_central_id": "5226", "extras_ids": "5150;5160", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0160", "texto": "Julgue o item subsequente, acerca do instituto da pena. É inadmissível a substituição de pena privativa de liberdade por restritiva de direitos ao réu reincidente, ainda que a substituição seja socialmente recomendável e se trate de reincidência genérica.", "comando": "Julgue o item subsequente, acerca do instituto da pena.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0160", "decisao": "publicar", "tema_central_id": "5205", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0161", "texto": "Analise o caso hipotético a seguir. Durante patrulhamento ostensivo em uma regiã
