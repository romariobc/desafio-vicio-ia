 Penal", "caminho": "Processo Penal > Ação Penal > Características e Condições da Ação Penal", "descricao": "Subtema de 'Ação Penal' (Processo Penal). 212 questões no source. Path: Processo Penal > Ação Penal > 'Características e Condições da Ação Penal'.", "status": "active", "caminho_derivado": "Processo Penal > Ação Penal > Características e Condições da Ação Penal"}, {"tema_id": "5468", "parent_id": "5466", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Classificação da Ação Penal", "caminho": "Processo Penal > Ação Penal > Classificação da Ação Penal", "descricao": "Subtema de 'Ação Penal' (Processo Penal). 23 questões no source. Path: Processo Penal > Ação Penal > 'Classificação da Ação Penal'.", "status": "active", "caminho_derivado": "Processo Penal > Ação Penal > Classificação da Ação Penal"}, {"tema_id": "5473", "parent_id": "5466", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Denúncia", "caminho": "Processo Penal > Ação Penal > Denúncia", "descricao": "Subtema de 'Ação Penal' (Processo Penal). 51 questões no source. Path: Processo Penal > Ação Penal > 'Denúncia'.", "status": "active", "caminho_derivado": "Processo Penal > Ação Penal > Denúncia"}, {"tema_id": "5469", "parent_id": "5466", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Princípios da Ação Penal", "caminho": "Processo Penal > Ação Penal > Princípios da Ação Penal", "descricao": "Subtema de 'Ação Penal' (Processo Penal). 29 questões no source. Path: Processo Penal > Ação Penal > 'Princípios da Ação Penal'.", "status": "active", "caminho_derivado": "Processo Penal > Ação Penal > Princípios da Ação Penal"}, {"tema_id": "5474", "parent_id": "5466", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Queixa Crime", "caminho": "Processo Penal > Ação Penal > Queixa Crime", "descricao": "Subtema de 'Ação Penal' (Processo Penal). 29 questões no source. Path: Processo Penal > Ação Penal > 'Queixa Crime'.", "status": "active", "caminho_derivado": "Processo Penal > Ação Penal > Queixa Crime"}, {"tema_id": "5476", "parent_id": "5465", "disciplina": "Processo Penal", "nivel": "1", "titulo": "Ações Autônomas de Impugnação", "caminho": "Processo Penal > Ações Autônomas de Impugnação", "descricao": "Subtema de 'Processo Penal' (Processo Penal). 39 questões no source. Path: Processo Penal > 'Ações Autônomas de Impugnação'.", "status": "active", "caminho_derivado": "Processo Penal > Ações Autônomas de Impugnação"}, {"tema_id": "5477", "parent_id": "5476", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Habeas Corpus", "caminho": "Processo Penal > Ações Autônomas de Impugnação > Habeas Corpus", "descricao": "Habeas Corpus é a ação constitucional autônoma de impugnação destinada à tutela imediata da liberdade de locomoção, quando alguém sofre ou se encontra na iminência de sofrer violência ou coação ilegal por ilegalidade ou abuso de poder, nos termos do art. 5º, LXVIII, da Constituição Federal e dos arts. 647 a 667 do Código de Processo Penal. Seu estudo abrange o cabimento preventivo e repressivo, a liminar, a autoridade coatora, a concessão de ofício, a impetração por qualquer pessoa, a substituição da fiança, a nulidade de atos processuais, além das hipóteses de trancamento de inquérito ou ação penal por atipicidade, extinção da punibilidade ou falta de justa causa. Aplica-se sob a lógica da tutela de urgência penal e da proteção da liberdade ambulatorial, sem se confundir com revisão criminal ou mandado de segurança, que possuem objeto e pressupostos próprios.", "status": "active", "caminho_derivado": "Processo Penal > Ações Autônomas de Impugnação > Habeas Corpus"}, {"tema_id": "5479", "parent_id": "5476", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Mandado de Segurança", "caminho": "Processo Penal > Ações Autônomas de Impugnação > Mandado de Segurança", "descricao": "Mandado de segurança, no âmbito das ações autônomas de impugnação em processo penal, é remédio constitucional destinado à tutela de direito líquido e certo violado ou ameaçado por ato ilegal ou abusivo de autoridade, quando não houver outro meio processual adequado. Seu estudo envolve a Lei 12.016/2009, o art. 5º, LXIX, da Constituição Federal, a noção de prova pré-constituída, a distinção entre ato judicial e ato administrativo, a competência originária dos tribunais, o cabimento contra decisões teratológicas e a vedação de dilação probatória. Em matéria penal, discute-se seu uso excepcional para trancar procedimento, sustar constrangimentos ilegais ou corrigir flagrante ilegalidade processual, sem confundir-se com habeas corpus ou revisão criminal. Também são relevantes os requisitos da impetração, o prazo decadencial de 120 dias, a liminar, a autoridade coatora, o litisconsórcio passivo necessário e a jurisprudência do STF e do STJ sobre seu manejo restrito.", "status": "active", "caminho_derivado": "Processo Penal > Ações Autônomas de Impugnação > Mandado de Segurança"}, {"tema_id": "5478", "parent_id": "5476", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Revisão Criminal", "caminho": "Processo Penal > Ações Autônomas de Impugnação > Revisão Criminal", "descricao": "Subtema de 'Ações Autônomas de Impugnação' (Processo Penal). 23 questões no source. Path: Processo Penal > Ações Autônomas de Impugnação > 'Revisão Criminal'.", "status": "active", "caminho_derivado": "Processo Penal > Ações Autônomas de Impugnação > Revisão Criminal"}, {"tema_id": "5480", "parent_id": "5465", "disciplina": "Processo Penal", "nivel": "1", "titulo": "Competência", "caminho": "Processo Penal > Competência", "descricao": "Competência no Processo Penal é o conjunto de regras que define qual órgão jurisdicional deve processar e julgar a infração penal, delimitando a jurisdição criminal segundo critérios como matéria, lugar, função, prerrogativa de foro e conexão/continência. Examina-se a competência absoluta e relativa, a prevenção, a distribuição, a competência por conexão e continência, o desmembramento e a modificação da competência, além dos conflitos de competência e sua solução. No CPP, destacam-se os arts. 69 a 91, bem como as hipóteses constitucionais de competência originária e recursal dos tribunais. Também são relevantes os critérios do lugar da infração, da consumação e da tentativa, e, nos crimes dolosos contra a vida, a competência do Tribunal do Júri prevista no art. 5º, XXXVIII, da Constituição Federal. O tema articula-se com os princípios do juiz natural, da perpetuatio jurisdictionis e da imparcialidade, sem tratar de ação penal, recursos ou nulidades.", "status": "active", "caminho_derivado": "Processo Penal > Competência"}, {"tema_id": "6732", "parent_id": "5465", "disciplina": "Processo Penal", "nivel": "1", "titulo": "Competência (Parte 1)", "caminho": "Processo Penal > Competência (Parte 1)", "descricao": "", "status": "active", "caminho_derivado": "Processo Penal > Competência (Parte 1)"}, {"tema_id": "6733", "parent_id": "5465", "disciplina": "Processo Penal", "nivel": "1", "titulo": "Competência (Parte 2)", "caminho": "Processo Penal > Competência (Parte 2)", "descricao": "", "status": "active", "caminho_derivado": "Processo Penal > Competência (Parte 2)"}, {"tema_id": "5483", "parent_id": "5480", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Comeptência Territorial", "caminho": "Processo Penal > Competência > Comeptência Territorial", "descricao": "Subtema de 'Competência' (Processo Penal). 82 questões no source. Path: Processo Penal > Competência > 'Comeptência Territorial'.", "status": "active", "caminho_derivado": "Processo Penal > Competência > Comeptência Territorial"}, {"tema_id": "5485", "parent_id": "5480", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Competência de Juízo", "caminho": "Processo Penal > Competência > Competência de Juízo", "descricao": "Subtema de 'Competência' (Processo Penal). 9 questões no source. Path: Processo Penal > Competência > 'Competência de Juízo'.", "status": "active", "caminho_derivado": "Proc > Procedimento Ordinário"}, {"tema_id": "5531", "parent_id": "5530", "disciplina": "Processo Penal", "nivel": "2", "titulo": "2 Oferecimento, Rejeição e Recebimento da Peça Acusatória", "caminho": "Processo Penal > Procedimento Ordinário > 2 Oferecimento, Rejeição e Recebimento da Peça Acusatória", "descricao": "Subtema de 'Procedimento Ordinário' (Processo Penal). 6 questões no source. Path: Processo Penal > Procedimento Ordinário > '2 Oferecimento, Rejeição e Recebimento da Peça Acusatória'.", "status": "active", "caminho_derivado": "Processo Penal > Procedimento Ordinário > 2 Oferecimento, Rejeição e Recebimento da Peça Acusatória"}, {"tema_id": "5534", "parent_id": "5530", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Absolvição Sumária", "caminho": "Processo Penal > Procedimento Ordinário > Absolvição Sumária", "descricao": "Subtema de 'Procedimento Ordinário' (Processo Penal). 8 questões no source. Path: Processo Penal > Procedimento Ordinário > 'Absolvição Sumária'.", "status": "active", "caminho_derivado": "Processo Penal > Procedimento Ordinário > Absolvição Sumária"}, {"tema_id": "5536", "parent_id": "5530", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Alegações Orais", "caminho": "Processo Penal > Procedimento Ordinário > Alegações Orais", "descricao": "Subtema de 'Procedimento Ordinário' (Processo Penal). 1 questões no source. Path: Processo Penal > Procedimento Ordinário > 'Alegações Orais'.", "status": "active", "caminho_derivado": "Processo Penal > Procedimento Ordinário > Alegações Orais"}, {"tema_id": "5535", "parent_id": "5530", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Audiência de Instrução e Julgamento", "caminho": "Processo Penal > Procedimento Ordinário > Audiência de Instrução e Julgamento", "descricao": "A Audiência de Instrução e Julgamento, no procedimento ordinário do processo penal, é o ato central de produção da prova oral, com disciplina nos arts. 400 a 411 do Código de Processo Penal, especialmente após a reforma da Lei 11.719/2008. Nela, observam-se a identidade física do juiz, a concentração dos atos, a oralidade e a publicidade, com oitiva da vítima, testemunhas de acusação e defesa, esclarecimentos de peritos, acareações e reconhecimentos, além do interrogatório do acusado como meio de defesa. O ato também abrange incidentes probatórios e requerimentos supervenientes relacionados à instrução, sempre sob o contraditório e a ampla defesa do art. 5º, LV, da Constituição Federal. Seu foco é a colheita e a organização da prova para o convencimento judicial, sem avançar sobre recebimento da denúncia, defesa preliminar, absolvição sumária, alegações finais ou sentença.", "status": "active", "caminho_derivado": "Processo Penal > Procedimento Ordinário > Audiência de Instrução e Julgamento"}, {"tema_id": "5532", "parent_id": "5530", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Classificação dos Procedimentos", "caminho": "Processo Penal > Procedimento Ordinário > Classificação dos Procedimentos", "descricao": "Subtema de 'Procedimento Ordinário' (Processo Penal). 27 questões no source. Path: Processo Penal > Procedimento Ordinário > 'Classificação dos Procedimentos'.", "status": "active", "caminho_derivado": "Processo Penal > Procedimento Ordinário > Classificação dos Procedimentos"}, {"tema_id": "5533", "parent_id": "5530", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Defesa Preliminar", "caminho": "Processo Penal > Procedimento Ordinário > Defesa Preliminar", "descricao": "Subtema de 'Procedimento Ordinário' (Processo Penal). 4 questões no source. Path: Processo Penal > Procedimento Ordinário > 'Defesa Preliminar'.", "status": "active", "caminho_derivado": "Processo Penal > Procedimento Ordinário > Defesa Preliminar"}, {"tema_id": "5537", "parent_id": "5530", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Sentença", "caminho": "Processo Penal > Procedimento Ordinário > Sentença", "descricao": "No procedimento ordinário do Processo Penal, a sentença é o ato jurisdicional que encerra a fase cognitiva em primeiro grau, após a instrução probatória e as alegações finais, com fundamento nos arts. 381 a 393 do Código de Processo Penal. Aborda-se a estrutura da decisão, especialmente o relatório, a fundamentação e o dispositivo, em observância ao art. 93, IX, da Constituição Federal e ao princípio do livre convencimento motivado, hoje compreendido à luz do dever de motivação. Também se examinam a absolvição e a condenação, a fixação da pena segundo os arts. 59 e 68 do Código Penal, a definição do regime inicial, a substituição por penas restritivas de direitos, a suspensão condicional da pena, a decretação ou manutenção de medidas cautelares e a expedição de mandado de prisão quando cabível. Envolve ainda nulidades, emendatio libelli, mutatio libelli, correção de erros materiais e efeitos processuais da sentença.", "status": "active", "caminho_derivado": "Processo Penal > Procedimento Ordinário > Sentença"}, {"tema_id": "5539", "parent_id": "5465", "disciplina": "Processo Penal", "nivel": "1", "titulo": "Procedimento Sumaríssimo", "caminho": "Processo Penal > Procedimento Sumaríssimo", "descricao": "Subtema de 'Processo Penal' (Processo Penal). 94 questões no source. Path: Processo Penal > 'Procedimento Sumaríssimo'.", "status": "active", "caminho_derivado": "Processo Penal > Procedimento Sumaríssimo"}, {"tema_id": "5540", "parent_id": "5539", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Competência dos Juizados Especiais Criminais", "caminho": "Processo Penal > Procedimento Sumaríssimo > Competência dos Juizados Especiais Criminais", "descricao": "Subtema de 'Procedimento Sumaríssimo' (Processo Penal). 74 questões no source. Path: Processo Penal > Procedimento Sumaríssimo > 'Competência dos Juizados Especiais Criminais'.", "status": "active", "caminho_derivado": "Processo Penal > Procedimento Sumaríssimo > Competência dos Juizados Especiais Criminais"}, {"tema_id": "5542", "parent_id nt_id": "5543", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Confissão", "caminho": "Processo Penal > Provas em Espécies > Confissão", "descricao": "No Processo Penal, a confissão é o meio de prova pelo qual o imputado admite a autoria ou participação no fato típico, podendo ser judicial ou extrajudicial, simples, qualificada, retratada ou parcial, e deve ser valorada em conjunto com os demais elementos probatórios, não bastando isoladamente para condenação. À luz do CPP, especialmente dos arts. 197 a 200, e do art. 5º, LXIII, da CF, exige-se voluntariedade, observância ao direito ao silêncio e ausência de coação, tortura ou constrangimento ilegal, em consonância com o nemo tenetur se detegere. A confissão não se confunde com interrogatório judicial, nem com declaração do ofendido, prova testemunhal ou reconhecimento, pois seu núcleo é a admissão do fato pelo próprio acusado. Também se examinam a confissão espontânea como atenuante genérica do art. 65, III, “d”, do CP e a necessidade de corroboração judicial sob o sistema do livre convencimento motivado.", "status": "active", "caminho_derivado": "Processo Penal > Provas em Espécies > Confissão"}, {"tema_id": "5549", "parent_id": "5543", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Declaração do Ofendido", "caminho": "Processo Penal > Provas em Espécies > Declaração do Ofendido", "descricao": "Subtema de 'Provas em Espécies' (Processo Penal). 0 questões no source. Path: Processo Penal > Provas em Espécies > 'Declaração do Ofendido'.", "status": "active", "caminho_derivado": "Processo Penal > Provas em Espécies > Declaração do Ofendido"}, {"tema_id": "5545", "parent_id": "5543", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Exame de Corpo de Delito", "caminho": "Processo Penal > Provas em Espécies > Exame de Corpo de Delito", "descricao": "Subtema de 'Provas em Espécies' (Processo Penal). 23 questões no source. Path: Processo Penal > Provas em Espécies > 'Exame de Corpo de Delito'.", "status": "active", "caminho_derivado": "Processo Penal > Provas em Espécies > Exame de Corpo de Delito"}, {"tema_id": "5559", "parent_id": "5543", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Infiltração de Agentes", "caminho": "Processo Penal > Provas em Espécies > Infiltração de Agentes", "descricao": "Subtema de 'Provas em Espécies' (Processo Penal). 2 questões no source. Path: Processo Penal > Provas em Espécies > 'Infiltração de Agentes'.", "status": "active", "caminho_derivado": "Processo Penal > Provas em Espécies > Infiltração de Agentes"}, {"tema_id": "5555", "parent_id": "5543", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Interceptação Telefônica e Quebra do Sigilo de Dados Telefônicos", "caminho": "Processo Penal > Provas em Espécies > Interceptação Telefônica e Quebra do Sigilo de Dados Telefônicos", "descricao": "Subtema de 'Provas em Espécies' (Processo Penal). 63 questões no source. Path: Processo Penal > Provas em Espécies > 'Interceptação Telefônica e Quebra do Sigilo de Dados Telefônicos'.", "status": "active", "caminho_derivado": "Processo Penal > Provas em Espécies > Interceptação Telefônica e Quebra do Sigilo de Dados Telefônicos"}, {"tema_id": "5547", "parent_id": "5543", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Interrogatório Judicial", "caminho": "Processo Penal > Provas em Espécies > Interrogatório Judicial", "descricao": "Subtema de 'Provas em Espécies' (Processo Penal). 4 questões no source. Path: Processo Penal > Provas em Espécies > 'Interrogatório Judicial'.", "status": "active", "caminho_derivado": "Processo Penal > Provas em Espécies > Interrogatório Judicial"}, {"tema_id": "5546", "parent_id": "5543", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Perícia", "caminho": "Processo Penal > Provas em Espécies > Perícia", "descricao": "Subtema de 'Provas em Espécies' (Processo Penal). 20 questões no source. Path: Processo Penal > Provas em Espécies > 'Perícia'.", "status": "active", "caminho_derivado": "Processo Penal > Provas em Espécies > Perícia"}, {"tema_id": "5553", "parent_id": "5543", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Prova Documental", "caminho": "Processo Penal > Provas em Espécies > Prova Documental", "descricao": "Prova documental, no processo penal, abrange a produção, juntada, admissibilidade, autenticidade, integridade e valoração de documentos públicos e particulares, inclusive escritos, reproduções fotográficas, eletrônicas, mensagens, certidões e outros suportes informativos, nos termos dos arts. 231 a 238 do CPP, em diálogo com a Lei 11.419/2006, a Lei 12.965/2014 e a Lei 13.964/2019. Seu estudo envolve juntada posterior, juntada em audiência, contraditório diferido, força probatória, impugnação por falsidade, reconhecimento de firma, perícia grafotécnica quando necessária, e distinção entre documento original, cópia autenticada e reprodução mecânica. Também alcança prova emprestada e documentos obtidos licitamente, sob o crivo do devido processo legal, da ampla defesa e da licitude da prova, sem confundir-se com perícia, cadeia de custódia, testemunho ou confissão. A doutrina de Aury Lopes Jr. e Mirabete é frequentemente utilizada para tratar da fiabilidade documental e do controle judicial do valor probatório.", "status": "active", "caminho_derivado": "Processo Penal > Provas em Espécies > Prova Documental"}, {"tema_id": "5550", "parent_id": "5543", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Prova Testemunhal", "caminho": "Processo Penal > Provas em Espécies > Prova Testemunhal", "descricao": "A prova testemunhal, no Processo Penal, é o meio de prova consistente na inquirição de pessoas que percebem fatos relevantes para a apuração da materialidade e autoria, regulada pelos arts. 202 a 225 do Código de Processo Penal. Abrange temas como capacidade para depor, compromisso legal, contradita, contraditório, cross-examination, número de testemunhas, substituição, suspeição, contraditas e valor probatório do depoimento, sempre sob a livre apreciação motivada do juiz, conforme o art. 155 do CPP. A testemunha deve relatar fatos e circunstâncias que presenciou, sem confundir-se com confissão, interrogatório do acusado, declaração do ofendido, reconhecimento, acareação ou prova pericial. A doutrina processual destaca a busca da verdade possível, a oralidade, a imediação e a publicidade, com limites impostos pelo sigilo profissional, pela vedação ao depoimento indireto quando insuficiente e pela proteção de certas pessoas, como menores e parentes, nos termos legais.", "status": "active", "caminho_derivado": "Processo Penal > Provas em Espécies > Prova Testemunhal"}, {"tema_id": "5551", "parent_id": "5543", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Reconhecimento de Pessoas e Coisas", "caminho": "Processo Penal > Provas em Espécies > Reconhecimento de Pessoas e Coisas", "descricao": "Subtema de 'Provas em Espécies' (Processo Penal). 6 questões no source. Path: Processo Penal > Provas em Espécies > 'Reconhecimento de Pessoas e Coisas'.", "status": "active", "caminho_derivado": "Processo Penal > Provas em Espécies > Reconhecimento de Pessoas e Coisas"}, {"tema_id": "6736", "parent_id": "5465", "disciplina": "Processo Penal", "nivel": "1", "titulo": "Recursos (Parte 03) - Espécies", "caminho": "Processo Penal > Recursos (Parte 03) - Espécies", "descricao": "", "status": "active", "caminho_derivado": "Processo Penal > Recursos (Parte 03) - Espécies"}, {"tema_id": "5560", "parent_id": "5465", "disciplina": "Processo Penal", "nivel": "1", "titulo": "Recursos em Espécies", "caminho": "Processo Penal > Recursos em Espécies", "descricao": "No estudo de Recursos em Espécies no Processo Penal, examinam-se os meios impugnativos típicos previstos no Código de Processo Penal para provocar o reexame de decisões judiciais, como apelação, recurso em sentido estrito, embargos infringentes e de nulidade, carta testemunhável, correição parcial e agravos previstos em lei especial. O tema envolve cabimento, legitimidade, prazos, efeitos devolutivo e suspensivo, juízo de admissibilidade, fungibilidade recursal, preclusão e reformatio in pejus, bem como a técnica de interposição, processamento e julgamento pelos tribunais. A abordagem privilegia a disciplina legal do CPP e leis extravagantes, em diálogo com princípios como ampla defesa, duplo grau de jurisdição e taxatividade recursal, sem adentrar na teoria geral dos recursos, nas ações autônomas de impugnação ou em nulidades, prisões e demais incidentes processuais.", "status": "active", "caminho_derivado": "Processo Penal > Recursos em Espécies"}, {"tema_id": "5566", "parent_id": "5560", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Agravo em Execução", "caminho": "Processo Penal > Recursos em Espécies > Agravo em Execução", "descricao": "Subtema de 'Recursos em Espécies' (Processo Penal). 10 questões no source. Path: Processo Penal > Recursos em Espécies > 'Agravo em Execução'.", "status": "active", "caminho_derivado": "Processo Penal > Recursos em Espécies > Agravo em Execução"}, {"tema_id": "5562", "parent_id": "5560", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Apelação", "caminho": "Processo Penal > Recursos em Espécies > Apelação", "descricao": "Apelação, no Processo Penal, é o recurso cabível contra sentenças definitivas ou com força de definitivas proferidas pelo juiz singular, disciplinado nos arts. 593 a 603 do CPP, com a finalidade de provocar o reexame da matéria de fato e de direito pelo tribunal ad quem. Abrange temas como legitimidade recursal, cabimento nas hipóteses de absolvição, condenação, nulidades, decisões do Tribunal do Júri nas limitações legais, prazo, interposição, razões e contrarrazões, juízo de admissibilidade, efeito devolutivo e, quando previsto, efeito suspensivo. No âmbito penal, relaciona-se aos princípios do duplo grau de jurisdição, ampla defesa e contraditório, sem se confundir com RESE, embargos, agravos ou recursos extraordinários. Também é central a análise de preliminares, reforma, anulação, absolvição, redimensionamento da pena e correção de error in judicando ou error in procedendo, conforme a técnica recursal do CPP e a jurisprudência dos tribunais.", "status": "active", "caminho_derivado": "Processo Penal > Recursos em Espécies > Apelação"}, {"tema_id": "5567", "parent_id": "5560", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Carta Testemunhavel", "caminho": "Processo Penal > Recursos em Espécies > Carta Testemunhavel", "descricao": "Subtema de 'Recursos em Espécies' (Processo Penal). 1 questões no source. Path: Processo Penal > Recursos em Espécies > 'Carta Testemunhavel'.", "status": "active", "caminho_derivado": "Processo Penal > Recursos em Espécies > Carta Testemunhavel"}, {"tema_id": "5568", "parent_id": "5560", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Correição Parcial", "caminho": "Processo Penal > Recursos em Espécies > Correição Parcial", "descricao": "Subtema de 'Recursos em Espécies' (Processo Penal). 6 questões no source. Path: Processo Penal > Recursos em Espécies > 'Correição Parcial'.", "status": "active", "caminho_derivado": "Processo Penal > Recursos em Espécies > Correição Parcial"}, {"tema_id": "5564", "parent_id": "5560", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Embargos Infringentes", "caminho": "Processo Penal > Recursos em Espécies > Embargos Infringentes", "descricao": "Subtema de 'Recursos em Espécies' (Processo Penal). 9 questões no source. Path: Processo Penal > Recursos em Espécies > 'Embargos Infringentes'.", "status": "active", "caminho_derivado": "Processo Penal > Recursos em Espécies > Embargos Infringentes"}, {"tema_id": "5565", "parent_id": "5560", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Embargos de Declaração", "caminho": "Processo Penal > Recursos em Espécies > Embargos de Declaração", "descricao": "Embargos de declaração, no processo penal, são o recurso cabível para sanar obscuridade, ambiguidade, contradição ou omissão da decisão judicial, inclusive acórdão, sentença e decisão interlocutória com conteúdo decisório, nos termos do art. 619 do CPP. Têm função integrativa e aclaratória, não se prestando, em regra, à rediscussão do mérito, embora possam excepcionalmente produzir efeitos modificativos quando o saneamento do vício alterar o resultado do julgado. São relevantes para fins de prequestionamento, especialmente na via dos recursos excepcionais, e sua disciplina dialoga com os princípios da fundamentação das decisões, do devido processo legal e da segurança jurídica. No processo penal, a oposição tempestiva dos embargos interrompe o prazo recursal, e sua análise exige atenção à omissão sobre teses defensivas, contradições internas da fundamentação e erro material, sem confundir-se com apelação, RESE ou outros meios impugnativos próprios.", "status": "active", "caminho_derivado": "Processo Penal > Recursos em Espécies > Embargos de Declaração"}, {"tema_id": "5563", "parent_id": "5560", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Protesto por novo Júri", "caminho": "Processo Penal > Recursos em Espécies > Protesto por novo Júri", "descricao": "Subtema de 'Recursos em Espécies' (Processo Penal). 2 questões no source. Path: Processo Penal > Recursos em Espécies > 'Protesto por novo Júri'.", "status": "active", "caminho_derivado": "Processo Penal > Recursos em Espécies > Protesto por novo Júri"}, {"tema_id": "5571", "parent_id": "5560", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Recurso Especial", "caminho": "Processo Penal > Recursos em Espécies > Recurso Especial", "descricao": "O Recurso Especial, no âmbito do Processo Penal, é o meio impugnativo dirigido ao Superior Tribunal de Justiça para uniformização da interpretação da lei federal, nos termos do art. 105, III, da Constituição Federal, quando o acórdão recorrido contrariar tratado ou lei federal, negar-lhes vigência ou der à lei federal interpretação divergente da de outro tribunal. Seu exame é estrito, sem reexame de fatos e provas, em consonância com a Súmula 7 do STJ, exigindo prequestionamento e demonstração de violação direta de norma infraconstitucional. Em matéria penal e processual penal, é frequente a discussão sobre nulidades, tipificação, dosimetria da pena e aplicação do Código de Processo Penal, sempre com atenção à divergência jurisprudencial e ao cotejo analítico. Diferencia-se do Recurso Extraordinário por não versar sobre matéria constitucional, e não se confunde com os recursos ordinários ou próprios dos demais órgãos judiciais.", "status": "active", "caminho_derivado": "Processo Penal > Recursos em Espécies > Recurso Especial"}, {"tema_id": "5570", "parent_id": "5560", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Recurso Extraordinário", "caminho": "Processo Penal > Recursos em Espécies > Recurso Extraordinário", "descricao": "No Processo Penal, o Recurso Extraordinário é o meio de impugnação dirigido ao Supremo Tribunal Federal para discutir, em sede excepcional, matéria constitucional decidida em última ou única instância, nos termos do art. 102, III, da Constituição Federal e dos arts. 1.029 a 1.041 do CPC, aplicados subsidiariamente. Exige demonstração de repercussão geral, prequestionamento e violação direta à Constituição, não se prestando ao reexame de fatos e provas nem à mera rediscussão de direito infraconstitucional, o que o distingue do Recurso Especial e dos demais recursos ordinários do CPP. Em regra, enfrenta temas como devido processo legal, contraditório, ampla defesa, motivação das decisões judiciais, competência constitucional e nulidades absolutas, com destaque para a técnica de admissibilidade, juízo de retratação e filtros recursais próprios da jurisprudência do STF.", "status": "active", "caminho_derivado": "Processo Penal > Recursos em Espécies > Recurso Extraordinário"}, {"tema_id": "5561", "parent_id": "5560", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Recurso em sentido estrito (RESE)", "caminho": "Processo Penal > Recursos em Espécies > Recurso em sentido estrito (RESE)", "descricao": "Subtema de 'Recursos em Espécies' (Processo Penal). 55 questões no source. Path: Processo Penal > Recursos em Espécies > 'Recurso em sentido estrito (RESE)'.", "status": "active", "caminho_derivado": "Processo Penal > Recursos em Espécies > Recurso em sentido estrito (RESE)"}, {"tema_id": "5569", "parent_id": "5560", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Recursos no Âmbito dos Juizados Especiais", "caminho": "Processo Penal > Recursos em Espécies > Recursos no Âmbito dos Juizados Especiais", "descricao": "Subtema de 'Recursos em Espécies' (Processo Penal). 11 questões no source. Path: Processo Penal > Recursos em Espécies > 'Recursos no Âmbito dos Juizados Especiais'.", "status": "active", "caminho_derivado": "Processo Penal > Recursos em Espécies > Recursos no Âmbito dos Juizados Especiais"}, {"tema_id": "5572", "parent_id": "5465", "disciplina": "Processo Penal", "nivel": "1", "titulo": "Sentença Penal", "caminho": "Processo Penal > Sentença Penal", "descricao": "Subtema de 'Processo Penal' (Processo Penal). 156 questões no source. Path: Processo Penal > 'Sentença Penal'.", "status": "active", "caminho_derivado": "Processo Penal > Sentença Penal"}, {"tema_id": "6737", "parent_id": "5465", "disciplina": "Processo Penal", "nivel": "1", "titulo": "Sentença Penal (Parte 1)", "caminho": "Processo Penal > Sentença Penal (Parte 1)", "descricao": "", "status": "active", "caminho_derivado": "Processo Penal > Sentença Penal (Parte 1)"}, {"tema_id": "6738", "parent_id": "5465", "disciplina": "Processo Penal", "nivel": "1", "titulo": "Sentença Penal (Parte 2)", "caminho": "Processo Penal > Sentença Penal (Parte 2)", "descricao": "", "status": "active", "caminho_derivado": "Processo Penal > Sentença Penal (Parte 2)"}, {"tema_id": "5573", "parent_id": "5572", "disciplina": "Processo Penal", "nivel": "2", "titulo": Penal", "nivel": "2", "titulo": "Relaxamento da Prisão", "caminho": "Processo Penal > Teoria Geral das Prisões > Relaxamento da Prisão", "descricao": "Subtema de 'Teoria Geral das Prisões' (Processo Penal). 13 questões no source. Path: Processo Penal > Teoria Geral das Prisões > 'Relaxamento da Prisão'.", "status": "active", "caminho_derivado": "Processo Penal > Teoria Geral das Prisões > Relaxamento da Prisão"}, {"tema_id": "5590", "parent_id": "5465", "disciplina": "Processo Penal", "nivel": "1", "titulo": "Teoria Geral das Provas", "caminho": "Processo Penal > Teoria Geral das Provas", "descricao": "Subtema de 'Processo Penal' (Processo Penal). 237 questões no source. Path: Processo Penal > 'Teoria Geral das Provas'.", "status": "active", "caminho_derivado": "Processo Penal > Teoria Geral das Provas"}, {"tema_id": "5591", "parent_id": "5590", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Finalidade, Sujeitos e Ônus da Prova", "caminho": "Processo Penal > Teoria Geral das Provas > Finalidade, Sujeitos e Ônus da Prova", "descricao": "Subtema de 'Teoria Geral das Provas' (Processo Penal). 97 questões no source. Path: Processo Penal > Teoria Geral das Provas > 'Finalidade, Sujeitos e Ônus da Prova'.", "status": "active", "caminho_derivado": "Processo Penal > Teoria Geral das Provas > Finalidade, Sujeitos e Ônus da Prova"}, {"tema_id": "5595", "parent_id": "5590", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Princípios Relativos à Prova Penal", "caminho": "Processo Penal > Teoria Geral das Provas > Princípios Relativos à Prova Penal", "descricao": "Subtema de 'Teoria Geral das Provas' (Processo Penal). 79 questões no source. Path: Processo Penal > Teoria Geral das Provas > 'Princípios Relativos à Prova Penal'.", "status": "active", "caminho_derivado": "Processo Penal > Teoria Geral das Provas > Princípios Relativos à Prova Penal"}, {"tema_id": "5593", "parent_id": "5590", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Prova Emprestada", "caminho": "Processo Penal > Teoria Geral das Provas > Prova Emprestada", "descricao": "Subtema de 'Teoria Geral das Provas' (Processo Penal). 10 questões no source. Path: Processo Penal > Teoria Geral das Provas > 'Prova Emprestada'.", "status": "active", "caminho_derivado": "Processo Penal > Teoria Geral das Provas > Prova Emprestada"}, {"tema_id": "5594", "parent_id": "5590", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Prova Ilegal e Prova Ilícita", "caminho": "Processo Penal > Teoria Geral das Provas > Prova Ilegal e Prova Ilícita", "descricao": "Subtema de 'Teoria Geral das Provas' (Processo Penal). 36 questões no source. Path: Processo Penal > Teoria Geral das Provas > 'Prova Ilegal e Prova Ilícita'.", "status": "active", "caminho_derivado": "Processo Penal > Teoria Geral das Provas > Prova Ilegal e Prova Ilícita"}, {"tema_id": "5592", "parent_id": "5590", "disciplina": "Processo Penal", "nivel": "2", "titulo": "Sistemas de Avaliação da Prova", "caminho": "Processo Penal > Teoria Geral das Provas > Sistemas de Avaliação da Prova", "descricao": "Subtema de 'Teoria Geral das Provas' (Processo Penal). 15 questões no source. Path: Processo Penal > Teoria Geral das Provas > 'Sistemas de Avaliação da Prova'.", "status": "active", "caminho_derivado": "Processo Penal > Teoria Geral das Provas > Sistemas de Avaliação da Prova"}], "questoes": [{"id": "Q0001", "texto": "No que se refere ao Tribunal do Júri, analise as assertivas abaixo. I - O desaforamento é admitido por interesse da ordem pública, em razão de dúvida sobre a imparcialidade do júri, em razão de dúvida sobre a segurança pessoal do réu e não realização de julgamento, no período de um ano a contar da preclusão da pronúncia, em virtude de comprovado excesso de serviço. II - A natureza jurídica da impronúncia é de uma decisão terminativa e está sujeita a Recurso em Sentido Estrito. III - A absolvição sumária produz coisa julgada material. IV - A decisão de desclassificação tem natureza não terminativa.", "comando": "Estão corretas as assertivas", "alternativas": {"A": "I, II e IV, apenas.", "B": "II e IV, apenas.", "C": "III e IV, apenas.", "D": "I e III, apenas.", "E": "I, II, III e IV."}, "classificacao": {"id": "Q0001", "decisao": "publicar", "tema_central_id": "5524", "extras_ids": "5527;5528", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0002", "texto": "Segundo Vera Regina Pereira de Andrade, a clientela do sistema penal é constituída de pobres, porque", "comando": "Complete a frase de acordo com o autor.", "alternativas": {"A": "têm uma maior tendência a delinqüir.", "B": "possuem uma cultura de nível inferior.", "C": "não tiveram a devida educação.", "D": "são naturalmente propensos à violência.", "E": "têm maiores chances de serem criminalizados."}, "classificacao": {"id": "Q0002", "decisao": "publicar", "tema_central_id": "4378", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0003", "texto": "Francisco foi processado pelo Ministério Público pelo delito de furto. Contudo, após a resposta preliminar, foi absolvido sumariamente, tendo o juízo decidido que o fato narrado na denúncia evidentemente não constitui crime. Nesse contexto, é correto afirmar que, em face da referida decisão, caberá:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "recurso em sentido estrito a ser interposto pelo Ministério\\nPúblico e, se transitada em julgado, vinculará o juízo cível;", "B": "recurso de apelação a ser interposto pelo Ministério Público\\ne, se transitada em julgado, não vinculará o juízo cível;", "C": "correição parcial a ser manejada pelo Ministério Público e, se\\ntransitada em julgado, não vinculará o juízo cível;", "D": "recurso de apelação a ser interposto pelo Ministério Público\\ne, se transitada em julgado, vinculará o juízo cível;", "E": "correição parcial a ser manejada pelo Ministério Público e, se\\ntransitada em julgado, vinculará o juízo cível."}, "classificacao": {"id": "Q0003", "decisao": "publicar", "tema_central_id": "5562", "extras_ids": "5534;5475", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0004", "texto": "Sobre jurisdição e competência no processo penal, analise as assertivas e assinale a alternativa correta: I – Caso um prefeito municipal cometa crimes contra bens da União, ele somente poderá ser processado criminalmente mediante ação penal instaurada no tribunal de justiça do respectivo estado. II – Compete ao Tribunal Regional Federal processar e julgar prefeito municipal acusado de crime federal vale dizer, crime praticado pelo prefeito em detrimento de bens, serviços ou interesses da União Federal, empresas públicas e autarquias federais. III - Não sendo conhecido o lugar da infração penal, a competência regular-se-á pelo domicílio ou residência do réu. IV - O foro competente para processar e julgar os prefeitos municipais é o tribunal de justiça estadual. V - Prevalece o foro por prerrogativa de função, ainda que a ação judicial seja iniciada após a cessação do mandato eletivo do prefeito municipal.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "Apenas as assertivas II, III e IV são verdadeiras.", "B": "Apenas as assertivas I, II e III são verdadeiras.", "C": "Apenas as assertivas I, II e IV são verdadeiras.", "D": "Apenas as assertivas II, IV e V são verdadeiras.", "E": "Apenas as alternativas II, III e V são verdadeiras."}, "classificacao": {"id": "Q0004", "decisao": "publicar", "tema_central_id": "5480", "extras_ids": "5484;5483", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0005", "texto": "Carlos foi denunciado pelo crime de furto qualificado, praticado em 15/5/2022. Após a tramitação regular do processo, o juiz fixou a pena base no mínimo legal, tendo em seguida agravado em 1/6 a pena em face da reincidência, sob o fundamento de que o réu possuía uma condenação anterior transitada em julgado, e impôs o regime fechado para início de cumprimento de pena. Na condenação anterior, Carlos havia recebido o livramento condicional em 27/4/2015, cumprindo-o sem revogações até 27/4/2019, e a decisão que declarou extinta a pena foi proferida em 29/6/2020. Considerando-se a situação hipotética apresentada, bem como a pena e o regime fixados pelo juiz, é correto afirmar que, em relação ao crime de furto qualificado praticado em 15/5/2022, Carlos é", "comando": "complete a frase com a alternativa correta.", "alternativas": {"A": "reincidente, e o regime inicial cabível é o fechado, visto que o\\nperíodo depurador referente à condenação anterior começou a\\ncorrer em 27/4/2019.", "B": "reincidente, e o regime inicial cabível é o fechado, visto que o\\nperíodo depurador referente à condenação anterior começou a\\ncorrer em 29/6/2020.", "C": "primário, e o regime inicial cabível é o semiaberto, visto que\\no período depurador se iniciou em 27/4/2015 e a pena é\\nsuperior a quatro anos.", "D": "primário, e o regime cabível é o aberto, visto que o período\\ndepurador foi cumprido sem revogação e a pena é inferior a\\nquatro anos.", "E": "reincidente, e o regime cabível é o semiaberto, visto que,\\ndada a pena aplicada, incide no caso a súmula n.º 269 do STJ."}, "classificacao": {"id": "Q0005", "decisao": "publicar", "tema_central_id": "5203", "extras_ids": "5201;5208", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0006", "texto": "Sobre os crimes de furto e roubo , analise as afirmativas a seguir. I. De acordo com a teoria da contrectatio , a consumação do crime de furto ocorre quando há o contato físico com a coisa alheia móvel, desde que haja a inversão da posse. II. Há delito de furto e não de roubo quando o sujeito ativo se vale de narcóticos para reduzir a vítima à impossibilidade de resistência para se apoderar dos pertences dela. III. Não é cabível tentativa de roubo impróprio.", "comando": "Está correto o que se afirma em", "alternativas": {"A": "III, apenas.", "B": "I e II, apenas.", "C": "I e III, apenas.", "D": "II e III, apenas.", "E": "I, II e III."}, "classificacao": {"id": "Q0006", "decisao": "publicar", "tema_central_id": "5157", "extras_ids": "5159;5160", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0007", "texto": "Gilson foi denunciado por tráfico de drogas e, no curso da audiência de instrução de julgamento, sua irmã Regina, que aceitou prestar depoimento, narrou, além dos fatos descritos na denúncia, que Gilson é um irmão ciumento e a ameaçou de morte e a xingou de “puta”, quando ela arrumou um namorado. Regina contou também que Gilson, reiteradamente, a perseguia na faculdade e no trabalho e que, em certas ocasiões, sequer pode sair de casa. Terminada a audiência, o Promotor de Justiça requereu ao Juiz cópia da mídia com o depoimento de Regina, o que foi deferido. Em seguida, ofereceu denúncia em face de Gilson, imputando a ele os crimes de ameaça (Art. 147 do Código Penal), injúria (Art. 140 do Código Penal) e perseguição (Art. 147-A do Código Penal).", "comando": "O Defensor Público encarregado de elaborar a resposta à acusação, deverá observar que", "alternativas": {"A": "todos os crimes são de ação penal pública condicionada à\\nrepresentação.", "B": "todos os crimes são de ação penal pública incondicionada.", "C": "há crimes de ação penal pública incondicionada, ação penal\\npública condicionada e ação penal privada.", "D": "há dois crimes de ação penal pública condicionada à\\nrepresentação.", "E": "não há crimes de ação penal privada."}, "classificacao": {"id": "Q0007", "decisao": "publicar", "tema_central_id": "5468", "extras_ids": "5471;5472", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0008", "texto": "A progressão de regime do cumprimento da pena de condenado por crime contra a administração pública condiciona-se à reparação do dano que ele causou, ou à devolução do produto do ilícito praticado, com os acréscimos legais.", "comando": "Explique as condições para a progressão de regime do cumprimento da pena em crimes contra a administração pública.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0008", "decisao": "publicar", "tema_central_id": "5201", "extras_ids": "4703", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0009", "texto": "“Ariel”, com 21 anos de idade, arromba a joalheria de seu pai, “Benoir”, com 60 anos de idade, de madrugada, levando bens avaliados em R$ 5.000,00 (cinco mil reais). Preso, após o fato, “Ariel” responderá por:", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "crime de furto de coisa comum.", "B": "crime de furto qualificado pelo rompimento de obstáculo à subtração da coisa.", "C": "crime de apropriação indébita.", "D": "nenhum crime, pois é isento de pena (imunidade penal absoluta)."}, "classificacao": {"id": "Q0009", "decisao": "publicar", "tema_central_id": "5158", "extras_ids": "5159", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0010", "texto": "Com relação aos crimes contra o meio ambiente, assinale a opção correta, conforme entendimento do STJ e do STF.", "comando": "Assinale a opção correta, conforme entendimento do STJ e do STF.", "alternativas": {"A": "Considere que Gil, a fim de comemorar, durante a madrugada, em zona urbana, a vitória de determinado time de futebol, tenha ajustado o aparelho de som do veículo em volume muito acima do limite permitido na legislação local, perturbando o sono e o sossego da vizinhança, e que esta tenha acionado o órgão municipal responsável. Considere, ainda, que o referido aparelho de som tenha sido apreendido, e Gil, conduzido à delegacia de polícia. Nessa situação, a conduta de Gil é atípica, visto que a poluição sonora não está expressamente prevista na lei de crimes ambientais.", "B": "O crime ambiental que consiste em impedir o nascimento de nova vegetação ou dificultar a regeneração natural de florestas e demais formas de vegetação é crime permanente, visto que a consumação do delito se protrai no tempo, violando o bem jurídico tutelado de forma contínua e duradoura, renovando-se, a cada momento a consumação, consoante entendimento do STF.", "C": "Em se tratando dos crimes contra o meio ambiente, admite-se responsabilização penal unicamente da pessoa jurídica, salvo se a imputação for pela prática de delitos culposos.", "D": "Os tribunais superiores, no que concerne aos crimes ambientais, rejeitam a incidência do sistema da dupla imputação ou sistema da imputação paralela dada a ocorrência de bis in idem na responsabilização, pelo mesmo crime, de mais de uma pessoa.", "E": "O crime de deixar de cumprir obrigação de relevante interesse ambiental, previsto no rol dos crimes contra a administração pública ambiental, é crime omissivo próprio, punido apenas na forma dolosa, e se caracteriza quando o agente público deixa de praticar o ato, contrariando o dever legal de fazê-lo para evitar o resultado lesivo ao meio ambiente, consoante entendimento do STJ."}, "classificacao": {"id": "Q0010", "decisao": "publicar", "tema_central_id": "4688", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0011", "texto": "Com referência à interceptação de comunicação telefônica, ao crime de tráfico ilícito de entorpecentes, ao crime de lavagem de capitais e a crimes cibernéticos, julgue o seguinte item. Situação hipotética: Álvaro, servidor público federal, foi, por cinco anos, presidente da comissão de licitações de determinado órgão público federal. Em diversas ocasiões, Álvaro recebeu valores e bens para favorecer empresas nos certames licitatórios, e os transferiu para o patrimônio de Flávio, seu irmão, que os utilizava nos negócios da empresa da família, com vistas a ocultar o ingresso desses recursos e a sua origem ilícita. Assertiva : Nessa situação, Álvaro e Flávio responderão pelo crime de lavagem de capitais, e será da justiça federal a competência para processar e julgar a ação penal.", "comando": "Julgue o item apresentado.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0011", "decisao": "publicar", "tema_central_id": "4702", "extras_ids": "5482", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0012", "texto": "Da decisão que rejeitar a denúncia oferecida nos termos do artigo 77 da Lei 9.099/1995, caberá:", "comando": "Indique o recurso cabível contra a decisão que rejeitar a denúncia oferecida nos termos do artigo 77 da Lei 9.099/1995.", "alternativas": {"A": "Apelação, no prazo de 10 dias.", "B": "Apelação no prazo de 5 dias.", "C": "Recurso em sentido estrito, no prazo de 15 dias.", "D": "Recurso em sentido estrito, no prazo de 5 dias.", "E": "Correição parcial."}, "classificacao": {"id": "Q0012", "decisao": "publicar", "tema_central_id": "5569", "extras_ids": "4701", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0013", "texto": "A Lei nº 13.964/2019, denominada “pacote anti-crime”, inovou o sistema processual penal brasileiro. A Defensoria Pública do Paraná, em seu portal da internet (21/06/2023), registrou “apoio à implementação do juiz das garantias”, então sob discussão no STF, por considerar a sua criação “uma iniciativa fundamental para aprimorar o funcionamento da Justiça penal no país.” A nota da Defensoria afirma que “A medida busca [...] assegurar o respeito às garantias individuais”, contribuindo para “uma maior imparcialidade da justiça [...] para uma justiça mais eficaz e para um processo penal mais justo, beneficiando toda a sociedade”. Nesse contexto, incluem-se na competência legal do Juiz de Garantias as seguintes hipóteses, EXCETO:", "comando": "", "alternativas": {"A": "Julgar o habeas corpus impetrado durante a investigação, bem como determinar, de ofício, o trancamento do inquérito policial.", "B": "Decidir sobre a homologação de acordo de não persecução penal celebrado durante a investigação ou decorrente de decisão desclassificatória.", "C": "Ser informado sobre a instauração de inquérito policial ou de qualquer outro procedimento de investigação criminal, ainda que não presidida por autoridade policial.", "D": "Decidir sobre o requerimento de produção antecipada de provas consideradas urgentes e não repetíveis, assegurados o contraditório e a ampla defesa em audiência pública e oral."}, "classificacao": {"id": "Q0013", "decisao": "publicar", "tema_central_id": "5503", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0014", "texto": "Caso a decisão do magistrado em relação à internação de Pedro seja questionada em juízo, ela não pode ser sanada pela via do habeas corpus , pois tal instrumento processual não se aplica às situações que envolvam decisões tomadas por vara da infância e da juventude em detrimento da liberdade de criança ou adolescente.", "comando": "Assinale a alternativa correta.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0014", "decisao": "publicar", "tema_central_id": "5477", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0015", "texto": "Com relação ao inquérito policial, segundo o Código de Processo Penal.", "comando": "Assinale a alternativa correta.", "alternativas": {"A": "A polícia judiciária será exercida pelas autoridades policiais em todo o território nacional, independente de circunscrição, com o fim de apurar as infrações penais e sua autoria.", "B": "Na legislação processual penal, é inaplicável a interpretação extensiva e analógica, bem como o suplemento dos princípios gerais do direito.", "C": "O inquérito deverá terminar no prazo de trinta dias, se o indiciado tiver sido preso em flagrante, ou estiver preso preventivamente, contado o prazo a partir do dia da prisão.", "D": "O Ministério Público não poderá requerer a devolução do inquérito à autoridade policial, senão para novas diligências, imprescindíveis ao oferecimento da denúncia.", "E": "O ofendido, ou seu representante legal, poderá requerer qualquer diligência, a qual será realizada obrigatoriamente, considerados os princípios do contraditório e da ampla defesa."}, "classificacao": {"id": "Q0015", "decisao": "publicar", "tema_central_id": "5500", "extras_ids": "5501;5508", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0016", "texto": "À luz da atual jurisprudência dos Tribunais Superiores sobre o tema prisão , avalie as assertivas a seguir. I. Consoante a jurisprudência do Superior Tribunal de Justiça, em razão da Lei nº 13.964/2019, não é mais possível ao Juiz, de ofício, decretar ou converter a prisão em flagrante em prisão preventiva. II. De acordo com o entendimento do Supremo Tribunal Federal, é incompatível com a Constituição Federal – por ofensa ao princípio da isonomia (Art. 3º, inciso IV; e Art. 5º, caput, da CRFB/88) – a previsão contida no inciso VII do Art. 295 do CPP que concede o direito à prisão especial, até decisão penal definitiva, a pessoas com diploma de ensino superior. III. O Supremo Tribunal Federal atribuiu interpretação conforme a Constituição Federal, ao § 1º do Art. 3º-B do CPP, incluído pela Lei nº 13.964/2019, para estabelecer que o preso em flagrante ou por força de mandado de prisão provisória será sempre encaminhado à presença do Juiz das Garantias, no prazo de 72 horas. Está correto o que se afirma em", "comando": "", "alternativas": {"A": "I, apenas.", "B": "II, apenas.", "C": "I e II, apenas.", "D": "II e III, apenas.", "E": "I e III, apenas."}, "classificacao": {"id": "Q0016", "decisao": "publicar", "tema_central_id": "5584", "extras_ids": "5519;5586;5589", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0017", "texto": "No processo e julgamento dos crimes de responsabilidade dos funcionários públicos,", "comando": "Complete a frase ou responda conforme o contexto do processo penal.", "alternativas": {"A": "nos crimes afiançáveis e inafiançáveis, após a denúncia, o juiz ordenará a notificação do acusado para responder por escrito, dentro do prazo de 15 (quinze) dias.", "B": "nos crimes inafiançáveis, após a denúncia, o juiz ordenará a notificação do acusado para responder por escrito, dentro do prazo de 15 (quinze) dias.", "C": "nos crimes afiançáveis e inafiançáveis, o eventual recebimento da denúncia é feito depois da notificação do acusado e, caso existente, de sua resposta.", "D": "nos crimes afiançáveis, o eventual recebimento da denúncia é feito depois da notificação do acusado e, caso existente, de sua resposta.", "E": "a falta de notificação do acusado para, se quiser, responder à acusação causa nulidade absoluta, conforme súmulas do Superior Tribunal de Justiça e do Supremo Tribunal Federal."}, "classificacao": {"id": "Q0017", "decisao": "fora", "tema_central_id": "", "extras_ids": "", "confianca": "0.0", "motivo": "Lacuna na taxonomia: Procedimento especial de crimes funcionais sem nó próprio"}}, {"id": "Q0018", "texto": "Marque “C” para certo e “E” para errado na assertiva abaixo. São considerados casos de exclusão de competência dos Juizados Especiais Criminais a conexão, não localização do acusado e a complexidade da ocorrência ou circunstância diversa que não permita o imediato oferecimento da denúncia, como perícias complexas e amplas diligências para a identificação do autor.", "comando": "Marque “C” para certo e “E” para errado na assertiva abaixo.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0018", "decisao": "publicar", "tema_central_id": "5540", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0019", "texto": "Considerando as relações entre as esferas criminal e cível e a ação civil ex delicto, assinale a alternativa INCORRETA :", "comando": "", "alternativas": {"A": "Aplicando a “teoria da norma ainda constitucional”\\nou da “inconstitucionalidade progressiva” na\\ninterpretação do art. 68, CPP, o Supremo Tribunal\\nFederal admite, onde não haja Defensoria\\nPública instalada nos moldes previstos na\\nConstituição de 1988, que o Ministério Público\\npromova, a requerimento do titular à reparação\\ndo dano que for pobre, a ação civil ex delicto. \\n", "B": "Proposta ação civil ex delicto, se o conhecimento\\ndo mérito depender de verificação da existência\\nde fato delituoso, o juiz cível poderá determinar\\na suspensão do processo até que se pronuncie a\\njustiça criminal, mesmo que ainda não proposta\\na ação penal.", "C": "Independente do fundamento, a promoção de\\narquivamento de inquérito policial não impede a\\npropositura de ação civil ex delicto. \\n", "D": "Faz coisa julgada no cível, determinando a\\nimprocedência de eventual ação civil ex delicto, \\na sentença penal definitiva que reconhece que o\\nautor incorreu em erro inevitável sobre existência\\nou limites de legítima defesa (descriminante\\nputativa)."}, "classificacao": {"id": "Q0019", "decisao": "publicar", "tema_central_id": "5475", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0020", "texto": "Assinale com V (verdadeiro) ou com F (falso) as seguintes afirmações sobre posições jurisprudenciais do Superior Tribunal de Justiça. ( ) Segundo jurisprudência dominante do Superior Tribunal de Justiça, é possível o reconhecimento do concurso material entre as condutas previstas nos artigos 241-A (artigo 241-A Oferecer, trocar, disponibilizar, transmitir, distribuir, publicar ou divulgar por qualquer meio, inclusive por meio de sistema de informática ou telemático, fotografia, vídeo ou outro registro que contenha cena de sexo explícito ou pornografia envolvendo criança ou adolescente ) e artigo 241-B (Adquirir, possuir ou armazenar, por qualquer meio, fotografia, vídeo ou outra forma de registro que contenha cena de sexo explícito ou pornográfica envolvendo criança ou adolescente ) do Estatuto da Criança e do Adolescente, uma vez os tipos penais são autônomos, com verbos e condutas distintas, sendo que o crime previsto no artigo 241-B do ECA não configura fase normal, tampouco meio de execução, para o crime previsto no artigo 241-A do ECA. ( ) Segundo jurisprudência dominante do Superior Tribunal de Justiça, é possível, na segunda fase da dosimetria da pena, a compensação integral da atenuante da confissão espontânea com a agravante da reincidência, mesmo que esta seja específica. ( ) Segundo jurisprudência dominante do Superior Tribunal de Justiça, atribuir-se falsa identidade perante a Autoridade Policial com a finalidade de ocultar maus antecedentes constitui o crime previsto no artigo 307, caput, do Código Penal (atribuir-se ou atribuir a terceiro falsa identidade para obter vantagem, em proveito próprio ou alheio, ou para causar dano a outrem ). Esse tipo de conduta não é protegido pelo princípio constitucional da autodefesa (artigo 5o , inciso LXIII, CF). ( ) Segundo jurisprudência dominante do Superior Tribunal de Justiça, a causa de aumento de pena relativa ao crime de furto pelo repouso noturno não se aplica em nenhuma das hipóteses do furto qualificado. ( ) Segundo jurisprudência dominante do Superior Tribunal de Justiça, é cabível a suspensão condicional do processo e a transação penal aos delitos que preveem a pena de multa alternativamente à pena privativa de liberdade, ainda que o preceito secundário da norma legal ultrapasse os parâmetros mínimos e máximos exigidos em lei para a incidência dos institutos em comento. A sequência correta do preenchimento dos parênteses, de cima para baixo, é", "comando": "Assinale com V (verdadeiro) ou com F (falso) as seguintes afirmações sobre posições jurisprudenciais do Superior Tribunal de Justiça.", "alternativas": {"A": "V – F – V – V – F.", "B": "F – V – F – V – F.", "C": "F – F – V – F – V.", "D": "V – V – F – F – V.", "E": "Nenhuma das alternativas anteriores está correta."}, "classificacao": {"id": "Q0020", "decisao": "revisar", "tema_central_id": "5062", "extras_ids": "4709;5203;5119;5159;5539", "confianca": "0.5", "motivo": "Revisar: generico, mosaico; Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0021", "texto": "Sobre o Juiz das Garantias e o entendimento do STF no julgamento de ações diretas de inconstitucionalidade, julgue o item a seguir. O STF fixou o prazo, improrrogável, de doze meses, a contar da publicação da ata do julgamento, para que sejam adotadas as medidas legislativas e administrativas necessárias à adequação das diferentes leis de organização judiciária, à efetiva implantação e ao efetivo funcionamento do juiz das garantias em todo o país, tudo conforme as diretrizes do Conselho Nacional de Justiça e sob a supervisão dele.", "comando": "Julgue o item a seguir.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0021", "decisao": "publicar", "tema_central_id": "5503", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0022", "texto": "Admite a modalidade culposa", "comando": "", "alternativas": {"A": "a concussão.", "B": "a prevaricação.", "C": "a corrupção passiva.", "D": "o peculato.", "E": "o falso testemunho."}, "classificacao": {"id": "Q0022", "decisao": "publicar", "tema_central_id": "5087", "extras_ids": "5089;5091;5092;5095", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0023", "texto": "Sobre o Tribunal do Júri, é INCORRETO afirmar:", "comando": "", "alternativas": {"A": "Seu procedimento desdobra-se em juízo da acusação, que analisa a admissibilidade da pretensão punitiva, e juízo da causa, que diz respeito ao mérito da acusação.", "B": "Se o acusado houver permanecido preso durante a instrução criminal, a pronúncia do juiz importará em automática manutenção da cautela extrema, sendo, por outro lado, necessária a motivação do decreto de prisão na hipótese de o pronunciado encontrar-se solto.", "C": "A decisão de impronúncia não faz coisa julgada formal e material.", "D": "Se o advogado do acusado, regularmente intimado, não comparecer à sessão de julgamento, e não houver escusa legítima, o julgamento será adiado uma única vez, cabendo ao juiz-presidente intimar a Defensoria Pública para o novo julgamento.", "E": "Nos termos da lei, o sistema de colheita de depoimentos em plenário é, para as partes, o do exame direto e cruzado, ao passo que, para os jurados, o sistema é o indireto, ou presidencialista."}, "classificacao": {"id": "Q0023", "decisao": "publicar", "tema_central_id": "5524", "extras_ids": "5526;5527;5528", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0024", "texto": "A Criminologia é o ramo da Ciência Penal que abrange os conhecimentos relativos ao delito como fenômeno social, inclusive os processos de elaborar as leis, infringir as leis e reagir à infração das leis. Acerca das teorias criminológicas, analise as afirmativas a seguir. I. A teoria ecológica do delito foi criada no contexto da Escola de Chicago e consiste na sustentação, baseada em pesquisas empíricas, da correlação entre o ambiente comunitário e a formação de determinados padrões infracionais. II. A teoria da associação diferencial, também chamada de teoria da aprendizagem social, preconiza que as racionalidades motivacionais e metodológicas que envolvem o cometimento de ilicitudes podem ter origem genética, mas são principalmente transmitidas em circunstâncias específicas no curso da convivência grupal. III. Os chamados crimes do colarinho branco são infrações praticadas por indivíduos dotados de elevado status socioeconômico no curso de atividades filantrópicas, sendo a razão pela qual as cifras negras não incidem sobre tais comportamentos ilícitos.", "comando": "Está correto o que se afirma em.", "alternativas": {"A": "I, apenas.", "B": "I e II, apenas.", "C": "I e III, apenas.", "D": "II e III, apenas.", "E": "I, II e III."}, "classificacao": {"id": "Q0024", "decisao": "publicar", "tema_central_id": "4387", "extras_ids": "", "confianca": "0.964286", "motivo": "Escola de Chicago e associação diferencial são teorias de nível sociológico; calibração expôs confusão com o nó irmão genérico em espécie."}}, {"id": "Q0025", "texto": "A conduta do particular de solicitar vantagem de contribuinte autuado pela fiscalização, a pretexto ilusório de influir em ato praticado por auditor fiscal, configura corrupção ativa.", "comando": "Assinale a alternativa correta.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0025", "decisao": "publicar", "tema_central_id": "5101", "extras_ids": "5093", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0026", "texto": "Está fora do âmbito de proteção da Lei n.º 11.340/2006, que trata da violência doméstica contra a mulher,", "comando": "Assinale o que está fora do âmbito de proteção da Lei n.º 11.340/2006.", "alternativas": {"A": "a filha transexual que é ameaçada pelo pai dentro da própria\\nresidência.", "B": "a mãe vulnerável que é ameaçada e agredida pela própria\\nfilha com a qual convive.", "C": "a mulher agredida dentro do ambiente laboral por colega de\\ntrabalho do sexo masculino com quem nunca teve relação\\níntima ou de afeto.", "D": "a empregada doméstica agredida pelo neto da empregadora\\ndentro da casa desta.", "E": "a mulher vítima de contravenção penal em razão do gênero."}, "classificacao": {"id": "Q0026", "decisao": "publicar", "tema_central_id": "4704", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0027", "texto": "O processo penal seguirá sem a presença do acusado que citado ou intimado:", "comando": "", "alternativas": {"A": "pessoalmente para qualquer ato, deixar de comparecer com motivo justificado;", "B": "por publicação para qualquer ato, deixar de comparecer sem motivo justificado;", "C": "pessoalmente para qualquer ato, deixar de comparecer sem motivo justificado;", "D": "por publicação para qualquer ato, deixar de dar andamento ao processo;", "E": "pessoalmente para o ato inicial, deixar de comparecer sem motivo justificado."}, "classificacao": {"id": "Q0027", "decisao": "publicar", "tema_central_id": "5488", "extras_ids": "5489", "confianca": "0.916667", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0028", "texto": "O Código de Processo Penal, em seu art. 406, estabelece que o juiz, ao receber a denúncia ou a queixa, ordenará a citação do acusado para responder a acusação, por escrito, no prazo de dez dias. O art. 409, do mesmo diploma legal, determina que, apresentada a defesa, o juiz ouvirá o Ministério Público ou o querelante sobre preliminares e documentos, em cinco dias. Por sua vez, segundo o parágrafo primeiro, do art. 421, do referido Estatuto Processual, ainda que preclusa a decisão de pronúncia, havendo circunstância superveniente que altere a classificação do crime, o juiz ordenará a remessa dos autos ao Ministério Público.", "comando": "Analise as disposições mencionadas e explique o procedimento adotado pelo juiz em cada etapa processual descrita.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0028", "decisao": "revisar", "tema_central_id": "5524", "extras_ids": "5526;5527", "confianca": "0.916667", "motivo": "Revisar: referencia_inconclusiva; O comando envolve resposta à acusação e alteração após pronúncia; pai já era a proposta da R1. A rejeição antiga de 5526 não prova que 5524 esteja validado; manter revisão."}}, {"id": "Q0029", "texto": "Nos termos da Lei nº 13.869/2019, configura crime de abuso de autoridade", "comando": "Complete a frase ou explique o que configura crime de abuso de autoridade segundo a Lei nº 13.869/2019.", "alternativas": {"A": "deixar de entregar ao preso, imediatamente, a nota\\nde culpa, assinada pela autoridade, com o motivo da\\nprisão e os nomes do condutor e das testemunhas.", "B": "prosseguir com o interrogatório de pessoa que tenha\\noptado por ser assistida por advogado, sem a presença de seu patrono.", "C": "submeter a pessoa, presa em flagrante, a interrogatório policial, durante o período de repouso noturno.", "D": "impedir a entrevista pessoal e reservada do preso\\ncom seu advogado, ainda que de modo justificado.", "E": "adentrar, mediante consentimento do ocupante, imóvel alheio ou suas dependências, ou nele permanecer\\nnas mesmas condições, sem determinação judicial."}, "classificacao": {"id": "Q0029", "decisao": "publicar", "tema_central_id": "4684", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0030", "texto": "Aquele que, mediante violência ou grave ameaça constrange alguém a trabalhar ou não trabalhar durante certo periodo:", "comando": "Complete a definição ou responda conforme o enunciado.", "alternativas": {"A": "Não comete crime, por falta de capitulação legal;", "B": "Comete crime de constrangimento ilegal;", "C": "Comete crime de atentado contra a liberdade de trabalho;", "D": "Comete crime por frustração de direito as­ segurado por lei trabalhista;", "E": "Comete crime de atentado contra a liberdade do contrato de trabalho."}, "classificacao": {"id": "Q0030", "decisao": "publicar", "tema_central_id": "5135", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0031", "texto": "Julgue o item a seguir, relativos a modelos teóricos da criminologia. De acordo com a teoria da anomia, o crime se origina da impossibilidade social do indivíduo de atingir suas metas pessoais, o que o faz negar a norma imposta e criar suas próprias regras, conforme o seu próprio interesse.", "comando": "Julgue o item a seguir.", "alternativas": {"C": "Certo", "E": "Errado"}, "classificacao": {"id": "Q0031", "decisao": "publicar", "tema_central_id": "4387", "extras_ids": "", "confianca": "0.964286", "motivo": "Anomia explica estrutura social e metas; substituir o nó irmão em espécie pelo nível sociológico validado na calibração."}}, {"id": "Q0032", "texto": "Quando, no curso da investigação, houver motivo para duvidar da integridade mental do investigado, a autoridade policial devera", "comando": "Indique o procedimento correto que a autoridade policial deve adotar nessas circunstâncias.", "alternativas": {"A": "concluir a investigação e, no relatório, informar tal circunstância, que será apreciada pelo Ministério Publico e pelo Magistrado.", "B": "Requisitar de ofício, exame de sanidade mental junto ao Instituto Médico Legal.", "C": "representar á autoridade judiciária para que o investigado seja submetido a exame médico-legal.", "D": "oficiar ao Ministério Público, noticiando o fato e representando pela realização de exame para verificar a sanidade do investigado.", "E": "poderá nomear mais de um perito para a realização do exame mental, em virtude de sua complexidade."}, "classificacao": {"id": "Q0032", "decisao": "publicar", "tema_central_id": "5497", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0033", "texto": "A prisão preventiva", "comando": "Explique o que é a prisão preventiva.", "alternativas": {"A": "pode ser decretada como garantia da ordem pública, mas não da econômica.", "B": "é obrigatória no caso de réu citado por edital e que não constituiu defensor, nos termos do art. 366 do Código de Processo Penal.", "C": "não admite revogação por excesso de prazo para o término da instrução, medida cabível apenas para o relaxamento de flagrante.", "D": "não é cabível se houver apresentação espontânea do acusado à autoridade.", "E": "pode recair sobre acusado primário e de bons antecedentes."}, "classificacao": {"id": "Q0033", "decisao": "publicar", "tema_central_id": "5519", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0034", "texto": "A situação em que o habeas corpus é medida de impugnação cabível é", "comando": "Complete a frase sobre a situação em que o habeas corpus é medida de impugnação cabível.", "alternativas": {"A": "para trancar processo em curso por infração penal em que a pena pecuniária seja a única cominada.", "B": "para que o advogado consiga ter acesso aos autos de inquérito policial.", "C": "contra a decisão que inadmite assistente de acusação.", "D": "para se pedir o desentranhamento de prova ilícita dos autos de inquérito policial ou de ação penal.", "E": "para se obter restituição de coisas apreendidas."}, "classificacao": {"id": "Q0034", "decisao": "publicar", "tema_central_id": "5477", "extras_ids": "5594", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0035", "texto": "Nos termos da Lei no 13.260/2016 (Lei Antiterrorismo), assinale a alternativa correta.", "comando": "", "alternativas": {"A": "Os crimes previstos na referida Lei são praticados contra o interesse da União, cabendo à Polícia Federal a investigação criminal, em sede de inquérito policial.", "B": "Aquele que for flagrado constituindo uma organização terrorista, não cometerá um crime, estando sujeito a responsabilização por realizar atos preparatórios do terrorismo.", "C": "O terrorismo consistirá sempre na prática por mais de um indivíduo de atos criminosos por razões de xenofobia, discriminação ou preconceito de raça, cor, etnia e religião, quando cometidos com a finalidade de provocar terror social ou generalizado.", "D": "São atos de terrorismo incendiar, depredar, saquear, destruir ou explodir meios de transporte ou qualquer bem público ou privado.", "E": "São atos de terrorismo incendiar, interferir, sabotar ou danificar sistemas de informática ou bancos de dados, quando cometidos com a finalidade de provocar terror social ou generalizado."}, "classificacao": {"id": "Q0035", "decisao": "publicar", "tema_central_id": "4706", "extras_ids": "", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0036", "texto": "Em uma Vara de Violência Doméstica e Familiar contra a Mulher, o Juiz de Direito recebeu os autos de inquérito policial concluído, no qual se apurou a prática de crime de lesão corporal leve (Art. 129, §9º, do Código Penal) supostamente cometido por Tício contra sua companheira, Ana. Ela comparecera à Delegacia, ocasião em que narrou os fatos, solicitou medidas protetivas de urgência e manifestou expressamente o desejo de representar criminalmente contra Tício. O Ministério Público ofereceu denúncia contra Tício pela prática do referido crime. Não há, em nenhuma peça dos autos, qualquer manifestação posterior de Ana indicando desejo de retratar-se da representação oferecida na fase policial. O Magistrado, antes de decidir sobre o recebimento da denúncia, resolve analisar a necessidade de designar a audiência prevista no Art. 16 da Lei nº 11.340/2006 (Lei Maria da Penha). Considerando a situação hipotética e o entendimento consolidado pelo Superior Tribunal de Justiça, assinale a opção que apresenta a decisão correta do Magistrado.", "comando": "", "alternativas": {"A": "Designar, de ofício, a audiência prevista no Art. 16 da Lei Maria da Penha, por ser ato processual obrigatório em crimes de lesão corporal leve no âmbito doméstico, visando confirmar a representação da vítima antes do recebimento da denúncia.", "B": "Intimar o Ministério Público para que requeira a designação da audiência do Art. 16, pois, embora necessária para confirmar a representação, sua designação não pode ocorrer de ofício pelo Juiz, dependendo de provocação ministerial.", "C": "Intimar pessoalmente a vítima Ana para que compareça em cartório e ratifique sua representação ou manifeste eventual desejo de retratação, condicionando o recebimento da denúncia a essa nova manifestação.", "D": "Prosseguir com a análise dos requisitos para o recebimento da denúncia oferecida, sem designar a audiência do Art. 16, uma vez que esta só é necessária caso a vítima manifeste previamente o desejo de se retratar, o que não ocorreu nos autos.", "E": "Determinar o arquivamento do inquérito policial, pois a ausência de manifestação expressa da vítima sobre o desejo de retratação impede a designação da audiência do art. 16, tornando inviável o prosseguimento da ação penal por falta de condição de procedibilidade."}, "classificacao": {"id": "Q0036", "decisao": "publicar", "tema_central_id": "4704", "extras_ids": "5471", "confianca": "0.964286", "motivo": "Mantidos tema e score da R1 após revisão dos critérios; nenhum ajuste automático por mera presença de extras."}}, {"id": "Q0037", "texto": "Assinale a alternativa INCORRETA:", "comando": "", "alternativas": {"A": "O artigo 149 do Código Penal tipifica, na seção dos crimes contra a liberdade pessoal,\\na conduta de reduzir alguém à condição análoga à de escravo, incluindo o exercício do\\ntrabalho forçado, em condições degradantes, em jornada exaustiva ou com restrição, por\\nqualquer meio, da locomoção, em razão de dívida contraída com o empregador ou\\npreposto.", "B": "A pena relativa ao crime de redução a condição análoga à de escravo é aumentada se\\no crime é cometido contra criança ou adolescente.", "C": "O crime de falso testemunho ou falsa perícia é crime próprio cometido por\\ntestemunha, intérprete, contador ou perito em processo judicial, administrativo, inquérito\\npolicial ou juízo arbitral.", "D": "Comete falsificação de documento particular, previsto no artigo 298 do Código Penal,\\naquele que insere ou faz inserir declaração falsa ou diversa da que deveria ter sido escrita\\nna CTPS do empregado ou e
